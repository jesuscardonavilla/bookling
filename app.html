["l","Spread evenly","The second law says the chance that someone is stupid is independent of any other trait. Cipolla jokes that he tested this among blue-collar workers, white-collar workers, students, professors and Nobel laureates, and found the same share every time."],
["t","According to the second law, highly educated groups have fewer stupid people.",false,"The share is the same in every group."],
["m","Which group does Cipolla say has the same share of stupid people as any other?","Nobel laureates",["Nobody; it varies widely","Only politicians","Only children"],"Stupidity is everywhere at a fixed rate."]],
D:[["m","Why is the second law unsettling?","You cannot avoid stupid people by choosing elite or educated company",["It means everyone is stupid","It proves schools are useless","It applies only to Italy"],"No group is safe."]]},
{i:"x",t:"Laws three, four and five",c:"Laws 3 to 5",d:"The definition, the danger, and why society declines.",
n:["Stupid people cause losses with no gain, the rest of us underestimate them, and they are the most dangerous type of all.",
"Third law, the golden law: a stupid person causes losses to others while deriving no gain and possibly losing too. Fourth law: non-stupid people always underestimate the damaging power of the stupid and forget that dealing with them is always costly. Fifth law: a stupid person is the most dangerous type, more dangerous than a bandit. Cipolla adds that a rising society has enough intelligent people to offset the stupid, while a declining one has more bandits with stupid tendencies and many helpless people, letting the stupid do damage unchecked.",
["Third law: harm to others with no gain to self","Fourth law: we underestimate the damage stupid people do","Associating with stupid people is always a mistake","Fifth law: stupid people are more dangerous than bandits","A bandit only transfers wealth; a stupid person destroys it","Declining societies let the stupid run unchecked"],
"Cipolla's fifth law: a stupid person is more dangerous than a bandit, because a bandit just moves wealth from you to them, while a stupid person destroys it."],
s:[["l","The golden law","Law three is the definition: stupid people cause losses to others without any gain for themselves. Law four warns that intelligent, helpless and bandit types keep forgetting how costly it is to deal with stupid people, and keep trusting or collaborating with them."],
["m","What does the fourth law warn about?","Non-stupid people underestimate the damage stupid people can do",["Stupid people are easy to spot","Bandits are harmless","Intelligent people are rare"],"Their harm is unpredictable."],
["l","More dangerous than a bandit","When a bandit takes 100 from you, society as a whole loses nothing; wealth just moves. A stupid person destroys value outright. That is why Cipolla calls the stupid the most dangerous type. A society declines when the intelligent no longer hold the stupid in check."],
["t","Cipolla says bandits are more dangerous than stupid people.",false,"The fifth law says the opposite."],
["x","Match each law to its claim",[["First","We underestimate their number"],["Second","Independent of other traits"],["Third","Harm others, no gain"],["Fifth","The most dangerous type"]],"The fourth says we underestimate their damage."]],
D:[["m","What distinguishes a rising society from a declining one, in Cipolla's view?","Whether enough intelligent people offset the harm done by the stupid",["How many stupid people exist","How rich the bandits are","How many laws it has"],"The share of stupid people is constant; the counterweight is not."]]},
{i:"chat",t:"Why it works as satire",c:"Reading it",d:"Taking a joke seriously.",
n:["It is a joke with a real point: judge actions by their effects, and protect institutions from people who destroy value.",
"Cipolla wrote the essay in a mock-scientific style, with graphs and solemn laws, partly as a gift to friends. Its humor hides practical lessons: judge actions by outcomes, not intentions; avoid collaborating with people whose behavior destroys value; and design institutions that limit the harm unpredictable people can do.",
["Written in mock-academic style","Humor makes the ideas memorable","Practical lesson: judge by results","Avoid partnering with value destroyers","Institutions should limit unpredictable harm"],
"It reads like a joke, but the lesson is serious: judge people by what their actions do, and protect your team from people who destroy value for nothing."],
s:[["l","A serious joke","The essay uses graphs, numbered laws and academic tone to make fun of academic writing and of human folly. Readers remember it because it is funny, but it also gives a simple tool for thinking about behavior in groups, companies and nations."],
["m","How is the essay written?","In a mock-scientific style, with laws and graphs",["As a novel","As a legal code","As a memoir"],"Humor through solemnity."],
["t","The essay's lesson is to judge people mainly by their intentions.",false,"It judges by results."],
["m","Which practical lesson follows from Cipolla's laws?","Avoid relying on people whose actions destroy value for everyone",["Trust everyone equally","Always partner with bandits","Ignore results"],"Protect yourself and institutions."]],
D:[["m","Why might managers find Cipolla's graph useful?","It separates harmful behavior that is self-serving from harm that helps no one",["It measures IQ","It sets salaries","It predicts stock prices"],"Different problems need different responses."]]}]]
]}));
MORE.push(MK({id:"foucault",t:"Discipline and Punish",a:"Michel Foucault",y:1975,
q:"why did punishment shift from public torture to the prison, and what does that reveal about modern power?",
ans:"Foucault argues the prison did not arrive simply because society became more humane. Punishment moved from the body to the soul, from spectacle to surveillance. Modern disciplinary power trains bodies through observation, norms and examination in schools, armies, factories and hospitals, and the prison, which keeps failing, is useful because it produces a manageable class of delinquents.",
cov:"Lessons follow the four parts of the book: torture, punishment, discipline and prison.",
u:[
["Torture","Part One",[
{i:"x",t:"From the scaffold to the timetable",c:"Part One",d:"Two scenes eighty years apart.",
n:["In under a century, punishment moved from torturing bodies in public to regulating prisoners' every hour.",
"The book opens with the 1757 public execution of Damiens, a would-be regicide, torn apart in front of a crowd. It then shows a prison timetable from about eighty years later, scheduling prisoners' every moment. Foucault asks what changed. The target of punishment shifted from the body to the soul: from inflicting pain to correcting behavior, habits and character.",
["1757: Damiens is publicly tortured and executed","About eighty years later: a prison timetable regulates every hour","Punishment becomes less visible and less about pain","The target shifts from the body to the soul","Foucault rejects the simple story that we just became kinder"],
"Foucault opens with two scenes: a man torn apart in public in 1757, and a prison schedule decades later. Punishment went from hurting the body to controlling the soul."],
s:[["l","Two scenes","Foucault begins with a graphic account of Damiens's execution in Paris for attempting to kill the king. Then he quotes a rule book for young prisoners: rise at a set hour, pray, work, eat and sleep on schedule. In barely eighty years, the spectacle disappeared and the timetable took its place."],
["m","What contrast opens the book?","A public torture-execution and a prison timetable",["Two prison buildings","Two court trials","A king and a judge"],"Spectacle versus routine."],
["l","Body to soul","Foucault says the change was not just more humane. Punishment's target moved from the body to the soul: the prisoner's thoughts, will and habits. Experts like psychiatrists and criminologists now judge not just the crime but the criminal. He famously says the soul is the prison of the body."],
["t","Foucault argues the shift happened simply because society became kinder.",false,"He sees a new, more efficient form of power."],
["m","What becomes the main target of modern punishment?","The soul: habits, will and character",["The family of the criminal","The criminal's property","The crowd watching"],"Correction replaces pain."]],
D:[["m","What does Foucault mean by the soul is the prison of the body?","Modern power shapes inner identity, which then governs how the body behaves",["Religion controls prisons","Prisons have chapels","Bodies are irrelevant"],"Control works from the inside."]]},
{i:"user",t:"The spectacle of the scaffold",c:"Part One",d:"Why public torture made sense to old monarchies.",
n:["Public torture was a political ritual showing the king's power, but crowds could turn against it.",
"Under the monarchy, a crime was an attack on the sovereign himself, because law was his will. Public torture restored his power with a display of overwhelming force on the criminal's body. The confession and the visible suffering mattered. But the crowd was unpredictable: they sometimes sided with the condemned and rioted, which made the spectacle dangerous to power.",
["A crime was an offense against the king's body and will","Torture was a ritual reasserting sovereign power","Truth was produced through confession and visible pain","Crowds were essential witnesses","Crowds could riot or make the condemned a hero"],
"In the old regime, public torture was theater: a crime insulted the king, so punishment had to show his overwhelming power in public."],
s:[["l","Revenge of the sovereign","In the age of kings, law expressed the sovereign's will, so every crime was a personal attack on him. Punishment answered with excess: public, painful and spectacular, it showed the king's power and the criminal's nothingness."],
["m","Why was crime seen as an attack on the king?","Law was the expression of the sovereign's will",["The king owned all property","Criminals always targeted the palace","The church said so"],"Breaking law was defying the king."],
["l","The unruly crowd","The crowd was needed to witness the king's power, but crowds sometimes pitied the condemned, cheered his defiance or attacked the executioners. Executions could become moments of popular revolt. That instability helped push reform."],
["t","Foucault says crowds at executions always supported the authorities.",false,"They sometimes sided with the condemned."],
["m","What was the political function of public torture?","To display and restore the sovereign's power",["To rehabilitate the criminal","To entertain the poor","To raise taxes"],"Punishment as ritual."]],
D:[["m","Why did the spectacle become a liability for power?","Crowds could turn it into protest and solidarity with the condemned",["It was too cheap","Kings stopped caring","It was banned by the church"],"Visibility cut both ways."]]}]],
["Punishment","Part Two",[
{i:"scale",t:"The reformers",c:"Part Two",d:"Punish less, but better.",
n:["Eighteenth-century reformers wanted punishment that was certain, proportionate and everywhere, not cruel and spectacular.",
"Enlightenment reformers objected to torture as excessive and irregular. Foucault says their real aim was not to punish less but to punish better: more evenly, more certainly, and throughout society. They imagined punishments as signs, lessons matched to each crime and displayed to deter others, a gentle way of punishment. But it was the prison, not their sign system, that won.",
["Reformers criticized torture as arbitrary and excessive","Goal: punish less, but more efficiently and universally","Punishment as a sign that deters by representation","Each penalty matched to its crime, like a lesson","Surprisingly, imprisonment became the universal answer instead"],
"Foucault's twist on the reformers: they did not want to punish less, they wanted to punish better, everywhere and with certainty."],
s:[["l","Punish better","Reformers like Beccaria attacked torture as irrational. Foucault reads them more coldly: they wanted a system of punishment spread evenly through society, certain rather than spectacular, so that power would be economical and continuous."],
["m","What was the reformers' real aim, according to Foucault?","To punish more efficiently and universally",["To abolish punishment","To restore torture","To give judges more freedom"],"Efficiency, not mercy."],
["l","Punishment as signs","Reformers pictured a penal city full of public lessons: each crime paired with a fitting penalty, displayed so that people would associate the crime with its cost. Yet within decades, almost every crime was punished the same way, by locking people up."],
["t","The reformers' ideal penal system was based mainly on prisons.",false,"They imagined varied public penalties; the prison came after."],
["m","Which form of punishment ended up dominating?","Imprisonment",["Public signs","Exile","Fines"],"The prison was a surprise winner."]],
D:[["m","Why does it matter that the prison was not the reformers' plan?","It shows the prison came from another source: disciplinary techniques spreading through society",["It proves reform failed completely","It means prisons are illegal","It shows kings designed prisons"],"Foucault looks to discipline for the answer."]]}]],
["Discipline","Part Three",[
{i:"blocks",t:"Docile bodies",c:"Part Three",d:"How institutions train bodies.",
n:["Discipline produces docile bodies: useful, obedient and trained through space, time and movement.",
"Foucault describes discipline, a set of techniques developed in armies, schools, monasteries, hospitals and factories. Bodies are placed in ranked spaces, scheduled by timetables, broken into precise movements, and trained through exercises. The result is a docile body, more useful and more obedient at once. Discipline does not just repress; it produces skills and individuals.",
["Discipline: techniques for training bodies","Partitioning space: each person in a place, ranked","The timetable controls activity minute by minute","Movements broken into precise steps, like a soldier's drill","Docile bodies: more capable and more obedient","Power produces, not just forbids"],
"Foucault's docile bodies: schools, armies and factories train people to be more capable and more obedient at the same time."],
s:[["l","Making soldiers","In the seventeenth century a soldier was recognized by natural bearing. By the eighteenth, soldiers were made: posture corrected, movements drilled, time measured. The same techniques spread to schools, workshops and hospitals."],
["m","What does Foucault mean by a docile body?","A body trained to be both useful and obedient",["A lazy body","A sick body","A body without rights"],"Capacity and submission grow together."],
["l","Space, time, exercise","Discipline assigns everyone a place, such as a desk or bed, and ranks them. Timetables divide the day. Actions are broken into steps, like the movements of handwriting or rifle drill. Repetition makes behavior automatic. For Foucault, this power is productive: it creates skilled, measurable individuals."],
["x","Match each technique to an example",[["Partitioning","A fixed desk in a classroom"],["Timetable","Bells marking each period"],["Drill","Rifle movements in steps"],["Ranking","Students ordered by grades"]],"Discipline works on space, time and action."],
["t","For Foucault, disciplinary power only forbids and represses.",false,"It also produces abilities and identities."]],
D:[["m","Why does Foucault say discipline makes individuals?","It isolates, measures and records each person, creating a distinct, knowable case",["It celebrates personal freedom","It forbids groups","It gives everyone the same role"],"Individuality is partly a product of discipline."]]},
{i:"eye",t:"Observation, norms, examination",c:"Part Three",d:"The three tools of correct training.",
n:["Discipline works through being watched, being measured against a norm, and being examined.",
"Foucault names three instruments of correct training. Hierarchical observation: architecture and supervisors allow constant watching. Normalizing judgment: small rewards and punishments push everyone toward an average, the norm. The examination combines both, turning each person into a documented case. Power and knowledge reinforce each other: to observe is to know, and knowing allows control.",
["Hierarchical observation: watched by layers of supervisors","Normalizing judgment: rewards and penalties around a norm","Small deviations, like lateness, are punished","Examination: tests, inspections and records","Each person becomes a case in a file","Power and knowledge produce each other"],
"Foucault's three tools of modern control: watch people, measure them against a norm, and test them so each becomes a file."],
s:[["l","Watching and norms","Buildings were designed so that supervisors could see workers or students. Discipline punishes tiny failures, like lateness, carelessness or bad posture, and rewards good behavior, ranking everyone. The goal is not to expel but to correct toward a norm."],
["m","What is normalizing judgment?","Rewarding and correcting people to push them toward an average standard",["Judging by the king's will","Ignoring small mistakes","Applying the same fine to everyone"],"The norm replaces the law."],
["l","The examination","The exam, whether a school test, a medical inspection or a military review, combines watching with judging. It produces documents, and documents turn each person into a case that can be compared, tracked and corrected. Foucault calls this the meeting point of power and knowledge."],
["x","Match each tool to its function",[["Hierarchical observation","Constant watching"],["Normalizing judgment","Correction toward a norm"],["Examination","Turns people into documented cases"],["Power-knowledge","Each reinforces the other"]],"The three tools and their link."],
["t","Foucault sees knowledge as neutral and separate from power.",false,"He sees them as intertwined."]],
D:[["m","Why does Foucault see the medical exam and the school test as similar?","Both observe, judge and record individuals as cases",["Both are run by the church","Both are voluntary","Both are new inventions of the 1900s"],"Same disciplinary form."]]},
{i:"target",t:"Panopticism",c:"Part Three",d:"Bentham's prison and the watched society.",
n:["In the Panopticon you might always be watched, so you watch yourself. Society has become panoptic.",
"Jeremy Bentham designed the Panopticon: a ring of cells around a central tower. Prisoners can be seen at all times but cannot see whether anyone is watching. So they behave as if always observed, and power runs automatically. Foucault contrasts the plague town, with its strict quarantine, and argues this panoptic model spread into schools, factories and hospitals, making a disciplinary society.",
["The plague town: quarantine, inspection, registration","Bentham's Panopticon: cells around a central tower","Inmates are always visible but cannot see the watcher","Visibility is a trap: people police themselves","Power becomes automatic and anonymous","Disciplinary society: the model spreads everywhere"],
"The Panopticon is Foucault's symbol: if you might be watched at any moment, you start watching yourself, and power no longer needs force."],
s:[["l","Bentham's design","Imagine a circular building with cells around the edge, each lit from behind, and a tower in the middle with blinds. The inmate is always visible but never knows if someone is in the tower. Bentham saw it as an efficient design for prisons, schools, hospitals and factories."],
["m","Why does the Panopticon work even without a guard?","Inmates cannot tell if they are watched, so they behave as if they always are",["The doors are always locked","Guards shout instructions","Inmates are asleep"],"Self-surveillance does the work."],
["l","A disciplinary society","Foucault contrasts the old exclusion of lepers with the plague town's precise surveillance, every house inspected, every person registered. The Panopticon perfects this. He argues modern society spread these mechanisms everywhere: power is less about a king's force and more about being seen, measured and normalized."],
["t","Foucault thinks panoptic power stays limited to prisons.",false,"It spreads through the whole society."],
["m","Who designed the Panopticon?","Jeremy Bentham",["Michel Foucault","Cesare Beccaria","Napoleon"],"An English utilitarian philosopher."]],
D:[["m","What does Foucault mean by visibility is a trap?","Being constantly seeable makes people internalize control",["Lights hurt prisoners' eyes","Windows let prisoners escape","Visitors can see inside"],"The watcher's gaze becomes inner discipline."]]}]],
["Prison","Part Four",[
{i:"lock",t:"Why the prison keeps failing, and why it lasts",c:"Part Four",d:"Delinquency, recidivism and the carceral network.",
n:["Prisons have always failed to reduce crime, yet they persist because they produce and manage delinquency.",
"From the start, critics said prisons do not reduce crime, they cause repeat offending, and they turn inmates into a criminal milieu. Foucault says these failures are part of the system's function. The prison produces delinquents, a known, watched and separated group, which divides illegal activity into manageable parts. Disciplinary institutions form a carceral network, symbolized by the Mettray reform colony.",
["Prison criticism is as old as the prison","Prisons create recidivism and criminal networks","Failure is functional: it produces delinquency","Delinquents are a known group that can be watched and used","Mettray colony: a model of discipline for youth","The carceral network links prison, school, army, workshop"],
"Foucault's provocative claim: prisons have always failed to stop crime, but they survive because they succeed at something else, producing a controllable class of delinquents."],
s:[["l","The failure that never ends","Within decades of the prison's rise, reformers were already saying it does not lower crime, it breeds repeat offenders, and it pushes families into poverty. The proposed fixes were always more of the same: better prisons. Foucault asks why the institution survives despite failing."],
["m","What does Foucault say critics noticed early about prisons?","They do not reduce crime and create repeat offenders",["They are too comfortable","They reduce crime too well","They are too cheap"],"Criticism is as old as prison."],
["l","Useful delinquency","The prison turns lawbreakers into delinquents: a separate, recorded, watched population. That splits off a manageable kind of illegality from wider popular unrest and makes it useful to police. Foucault ends with the Mettray colony for young offenders, where discipline was perfected, and a carceral network spreading through society."],
["t","Foucault claims the prison's failures are accidental and easily fixed.",false,"He argues they are functional."],
["m","What institution does Foucault use to symbolize the carceral network?","The Mettray colony for young offenders",["The Bastille","Versailles","The Sorbonne"],"He calls its opening a key date."]],
D:[["m","How does producing delinquents serve power, in Foucault's account?","It isolates a controllable group and separates it from broader popular resistance",["It lowers taxes","It ends crime entirely","It gives prisoners political power"],"Managing illegality instead of abolishing it."]]}]]
]}));
MORE.push(MK({id:"frankl",t:"Man's Search for Meaning",a:"Viktor E. Frankl",y:1946,
q:"how can a person find meaning, even in extreme suffering?",
ans:"Frankl, a psychiatrist who survived Auschwitz and other camps, answers that the deepest human drive is the will to meaning. Everything can be taken from a person except the freedom to choose an attitude. Meaning comes from work, from love, and from how we bear suffering we cannot avoid.",
cov:"Part One covers the camps, Part Two covers logotherapy, and the last lesson covers the 1984 postscript on tragic optimism.",
u:[
["The camps","Part One",[
{i:"x",t:"Arrival: shock",c:"Part One",d:"The first phase of a prisoner's psychology.",
n:["The first phase is shock: illusion, then the loss of everything.",
"Frankl describes three phases of camp psychology. The first, on arrival at Auschwitz, is shock. Prisoners clung to a delusion of reprieve, the hope they would be spared. Then they were stripped of clothes, hair and possessions, including Frankl's manuscript. What was left was naked existence. Grim humor and curiosity appeared, and many thought of suicide.",
["Frankl writes as a psychiatrist, not to list horrors but to ask how people endured","Three phases: arrival, camp routine, liberation","Delusion of reprieve: the hope of being spared","Everything is stripped away, including his life's work","Surprising curiosity and dark humor in the first days"],
"Frankl says arrival brought a strange hope that you would be spared, then the loss of everything you had, until only your bare existence was left."],
s:[["l","A psychiatrist in the camps","Viktor Frankl was a Viennese psychiatrist deported in 1942. His parents, brother and wife died in the camps. He wrote this book in nine days after the war. Part One does not catalogue atrocities. It asks a question: how did ordinary prisoners endure, and what did suffering reveal about human beings?"],
["m","What is Frankl's main aim in Part One?","To understand how prisoners endured psychologically",["To list every crime he witnessed","To write a history of the war","To blame individual guards"],"He writes as a psychiatrist observing the mind."],
["l","Delusion of reprieve","On arrival, many believed they would somehow be saved. Frankl compares it to a condemned man imagining a pardon at the last moment. Then came selection, stripping and shaving. Frankl lost the manuscript he had hidden in his coat. With nothing left, he says, prisoners faced their naked existence."],
["t","Frankl says prisoners arrived expecting the worst, with no hope at all.",false,"Many clung to a delusion of reprieve."],
["m","What did Frankl lose that mattered deeply to him?","The manuscript of his book",["His glasses","His medical license","His diary of the war"],"He later rebuilt it from scraps in the camp."]],
D:[["m","Why does Frankl call the first phase shock?","Prisoners moved from false hope to losing everything they owned and were",["They were treated well at first","They expected freedom soon","They had no feelings at all"],"Identity was stripped away overnight."]]},
{i:"heart",t:"Camp life: apathy and love",c:"Part One",d:"The second phase, and what kept people alive inside.",
n:["In the second phase emotions died, yet love and inner life could still sustain a person.",
"In the second phase prisoners became apathetic, a kind of emotional death that protected them. Hunger and fatigue dominated thought. Yet Frankl describes moments of intense inner life: marching in the cold, he talked in his mind with his wife and understood that love is the highest goal a person can reach, whether or not the loved one is alive. Beauty and humor also helped.",
["Apathy blunted feelings and protected the mind","Hunger dominated thoughts and dreams","An inner life let some retreat from the horror","Love can be experienced fully through imagining the beloved","Sunsets, music and humor gave brief relief"],
"Marching in the cold, Frankl talked with his wife in his mind and realized that love is the highest thing a person can reach, even if the beloved is not there."],
s:[["l","Emotional death","After weeks, prisoners stopped reacting to beatings or death around them. Frankl calls this apathy a protective shell. Thoughts narrowed to food and survival. Culture, sex and politics faded, though religion and inner reflection often grew stronger."],
["m","What purpose did apathy serve, according to Frankl?","It shielded prisoners from overwhelming pain",["It made them rebel","It helped them escape","It was a sign of laziness"],"Numbness protected the mind."],
["l","Love and beauty","On a freezing march before dawn, Frankl pictured his wife's face and spoke with her. He realized salvation is through love and in love. He did not know if she was alive, and it did not matter for that moment. Prisoners also stopped to admire a sunset over the camp, and some used jokes to rise above the situation."],
["t","Frankl says love could sustain him even without knowing whether his wife was alive.",true,"Love reached beyond her physical presence."],
["m","Which helped some prisoners survive inwardly?","A rich inner life of love, beauty and humor",["Becoming guards","Forgetting their families","Avoiding all thought"],"Inner life offered a refuge."]],
D:[["t","Frankl reports that those with a richer inner life sometimes endured better than physically stronger prisoners.",true,"Spiritual resources mattered as much as physical ones."]]},
{i:"target",t:"The last human freedom",c:"Part One",d:"Choosing one's attitude, and having a why.",
n:["Everything can be taken but the freedom to choose your attitude, and those with a why could bear almost any how.",
"Frankl's central claim is that a person's inner freedom survives even total control. Some prisoners gave away their last bread and comforted others. Those who lost faith in the future, who saw nothing waiting for them, declined and died. He cites Nietzsche: he who has a why to live can bear almost any how. Meaning was something to look forward to: a child, a task, a book to finish.",
["The last of the human freedoms: choosing one's attitude","Some prisoners gave away their last bread","Inner decisions, not just conditions, shaped who a person became","Prisoners who lost hope in the future often died soon after","A why to live: a person waiting or a work to complete"],
"His key line: everything can be taken from a person but one thing, the freedom to choose your attitude in any circumstances."],
s:[["l","The last freedom","Frankl insists conditions do not fully determine a person. He saw men walk through huts comforting others and giving away their last piece of bread. They proved that one freedom remains: to choose one's attitude. How a person bears suffering is an inner achievement."],
["m","What does Frankl call the last of the human freedoms?","The freedom to choose one's attitude in any circumstances",["The freedom to escape","The freedom to speak","The freedom to own property"],"It cannot be taken away."],
["l","A why to live","A prisoner who stopped believing in the future gave up, often refusing to get up, smoking his saved cigarettes, and dying soon after. Frankl notes a spike in deaths after Christmas 1944, when hopes of release by then were dashed. He helped others by pointing them to what awaited them: a child abroad, a scientific series to finish."],
["t","Frankl says conditions alone fully decide how a prisoner behaves.",false,"Inner choice still mattered."],
["m","Which quote does Frankl borrow from Nietzsche?","He who has a why to live can bear almost any how",["God is dead","What does not kill me makes me stronger","Become who you are"],"Purpose made suffering bearable."]],
D:[["m","What does the death spike after Christmas 1944 suggest to Frankl?","Losing hope weakened the will to live, with real physical effects",["The food ran out","Guards were harsher at holidays","Disease came from outside"],"Hope and health were linked."]]},
{i:"route",t:"After liberation",c:"Part One",d:"The third phase: unreality, bitterness, and gratitude.",
n:["Freedom brought unreality, then bitterness and disillusionment for some, before healing.",
"When the camps were freed, prisoners could not feel joy at first. Frankl calls it depersonalization: freedom seemed unreal. Some, released from pressure, became bitter or even cruel, believing their suffering entitled them to harm others. Many returned home to find no one waiting. Yet the crowning experience, he says, was feeling one need fear nothing anymore, except God.",
["Freedom at first felt unreal","Some lost moral balance and wanted revenge","Bitterness at a world that did not understand","Disillusionment when no one was waiting at home","Those who survived carried a deep sense of having nothing more to fear"],
"Liberation was not instantly joyful: freedom felt unreal, and some prisoners had to relearn how to feel and how to act morally."],
s:[["l","Learning to feel again","When the gates opened, men walked out and saw meadows and flowers but felt nothing. They had to relearn joy, Frankl says. Some, released from pressure, felt entitled to do wrong, like a man who said he would trample a field of crops because so much had been taken from him."],
["m","How did freedom first feel to many prisoners?","Unreal, as if they could not feel joy",["Immediately joyful","Boring","Frightening and dangerous"],"Frankl calls it depersonalization."],
["t","Frankl says some freed prisoners believed their suffering gave them the right to harm others.",true,"Recovery included moral recovery."],
["m","What caused deep disillusionment for some survivors?","Coming home to find no one left",["Losing their jobs","Being ignored by doctors","Moving to new countries"],"Many had lost everyone."]],
D:[["t","Frankl treats bitterness after liberation as something survivors had to be helped through, not simply excused.",true,"He saw it as a psychological danger."]]}]],
["Logotherapy","Part Two",[
{i:"star",t:"The will to meaning",c:"Part Two",d:"Frankl's school of therapy and its core idea.",
n:["Logotherapy says the primary human drive is the will to meaning, not pleasure or power.",
"Frankl founded logotherapy, sometimes called the third Viennese school of psychotherapy after Freud and Adler. Freud stressed the will to pleasure, Adler the will to power, Frankl the will to meaning. When meaning is blocked, people feel existential frustration. Many modern people live in an existential vacuum, filled with boredom, conformity or addiction.",
["Logos means meaning; logotherapy is therapy through meaning","Freud: pleasure; Adler: power; Frankl: meaning","Existential frustration: the will to meaning is blocked","Existential vacuum: a sense of emptiness, often showing as boredom","Some neuroses are noogenic, rooted in a crisis of meaning"],
"Freud said people want pleasure and Adler said power. Frankl says what we want most is meaning, and boredom is often a sign it is missing."],
s:[["l","A third Viennese school","Logotherapy focuses on the future and on meanings a person can fulfill. Frankl contrasts it with psychoanalysis, which digs into the past. For him, the search for meaning is not a sign of illness but the most human thing about us."],
["x","Match each thinker to the drive he stressed",[["Freud","Will to pleasure"],["Adler","Will to power"],["Frankl","Will to meaning"],["Logos","Greek for meaning"]],"Frankl places himself after Freud and Adler."],
["l","The existential vacuum","Frankl sees a mass problem: people lack meaning. Instinct no longer tells us what to do, and tradition no longer tells us what we should do, so we do what others do or what others tell us. The vacuum shows up as boredom, especially on Sundays, and can feed depression, aggression and addiction."],
["m","What symptom does Frankl link to the existential vacuum?","Boredom",["Too much ambition","Physical pain","Fear of crowds"],"Emptiness shows up as boredom."],
["t","Frankl sees the search for meaning itself as a sign of mental illness.",false,"He sees it as essentially human."]],
D:[["m","What does Frankl mean by a noogenic neurosis?","A disorder rooted in a crisis of meaning rather than in drives or trauma",["A disorder caused by brain damage","A fear of new places","A purely genetic illness"],"Noos refers to the spiritual dimension."]]},
{i:"check",t:"Three ways to find meaning",c:"Part Two",d:"Work, love and suffering.",
n:["Meaning comes from creating something, from loving someone, and from the attitude we take to unavoidable suffering.",
"Frankl says meaning is not invented but discovered, and it is specific to each person and moment. Life asks us questions, and we answer by acting responsibly. He names three paths: doing a deed or creating a work; experiencing something or encountering someone, above all through love; and, when suffering cannot be avoided, the attitude we take toward it.",
["Meaning is discovered, not invented","It is unique to each person and moment","We do not ask what life means; life asks us","Path one: a work or a deed","Path two: love and experience","Path three: the attitude toward unavoidable suffering"],
"Frankl names three sources of meaning: a work you do, someone you love, and the courage with which you face suffering you cannot avoid."],
s:[["l","Life asks the question","Frankl reverses the usual question. We should stop asking what we expect from life and realize life expects something from us. Each situation asks a question, and we answer through our actions. That is why he says the meaning of life cannot be given in general, only in concrete tasks."],
["m","How does Frankl reverse the question of life's meaning?","Life asks us questions, and we answer through responsible action",["We should invent any meaning we like","Meaning is the same for everyone","Meaning comes only from religion"],"Responsibility is the essence of existence."],
["l","Work, love, suffering","Meaning can come from creating or doing something. It can come from experiencing goodness, nature, or a person in their uniqueness through love. And when suffering is unavoidable, we can still find meaning in how we face it. He tells of a widower whose pain eased when Frankl noted his suffering spared his wife from grieving him."],
["x","Match each path to an example",[["A work or deed","Finishing a book"],["Love","Seeing a person in their uniqueness"],["Attitude to suffering","Bearing an incurable illness with dignity"],["Avoidable suffering","Should be removed, not embraced"]],"Suffering has meaning only when unavoidable."],
["t","Frankl says one should seek suffering in order to find meaning.",false,"Only unavoidable suffering can be a path to meaning."]],
D:[["m","Why did the grieving widower's pain ease?","He saw his suffering as sparing his wife the grief he now felt",["He forgot about her","He found a new partner","He took medication"],"Meaning changed the weight of the pain."]]},
{i:"bolt",t:"Techniques and tragic optimism",c:"Part Two and Postscript",d:"Paradoxical intention, dereflection, and saying yes to life.",
n:["Logotherapy uses humor and focus outward, and its stance is tragic optimism: saying yes to life despite pain, guilt and death.",
"Frankl's practical techniques include paradoxical intention, where a patient wishes for what they fear, breaking the cycle of anxiety, and dereflection, turning attention away from oneself toward others. He argues happiness cannot be pursued directly; it must ensue from meaning. The 1984 postscript defines tragic optimism: making the best of pain, guilt and death, the tragic triad.",
["Paradoxical intention: intend the feared thing, often with humor","Dereflection: stop watching yourself and focus outward","Happiness ensues; it cannot be pursued","Self-transcendence: being human means pointing beyond oneself","Tragic triad: pain, guilt and death","Statue of Responsibility on the West Coast to balance the Statue of Liberty"],
"Frankl says happiness cannot be chased; it follows from meaning. He suggested America should balance the Statue of Liberty with a Statue of Responsibility."],
s:[["l","Paradoxical intention","A young doctor who sweated heavily from fear of sweating was told to try to sweat as much as possible. The fear dissolved. Paradoxical intention uses humor to break the loop where fear brings on what it fears. Dereflection works on hyper-attention: stop observing yourself and turn toward something else."],
["m","What does paradoxical intention ask a patient to do?","Deliberately wish for what they fear",["Avoid every trigger","Repeat calming words","Analyze childhood memories"],"Humor breaks the anxiety loop."],
["l","Tragic optimism","In the postscript Frankl faces the tragic triad: pain, guilt and death. Tragic optimism means turning suffering into achievement, guilt into a chance to change, and life's transience into motivation to act responsibly. Happiness, he says, must ensue; it cannot be the target."],
["x","Match the triad to its transformation",[["Pain","Turned into a human achievement"],["Guilt","Turned into change for the better"],["Death","Motivation to act now"],["Happiness","Ensues from meaning"]],"Tragic optimism says yes to life anyway."],
["t","Frankl believed freedom without responsibility risks becoming arbitrariness.",true,"Hence his Statue of Responsibility idea."]],
D:[["m","What does self-transcendence mean for Frankl?","Being human means reaching beyond yourself to a cause or a person",["Achieving perfect self-awareness","Leaving the body","Rising above others in status"],"We find ourselves by forgetting ourselves."]]}]]
]}));
MORE.push(MK({id:"housel",t:"The Psychology of Money",a:"Morgan Housel",y:2020,
q:"why does doing well with money depend more on behavior than on knowledge?",
ans:"Housel argues that financial success is a soft skill: how you behave matters more than how smart you are. In 20 short chapters he covers luck and risk, knowing when you have enough, the power of compounding and survival, freedom as the real dividend of wealth, saving without a reason, room for error, and being reasonable rather than perfectly rational.",
cov:"Six lessons group the book's 20 short chapters by theme, in order.",
u:[
["How we think","Chapters 1 to 3",[
{i:"user",t:"No one's crazy; luck and risk",c:"Chapters 1 and 2",d:"Experience shapes money views, and outcomes are not all skill.",
n:["Everyone's money decisions make sense given their own experience, and luck and risk are two sides of the same coin.",
"Housel opens by saying people do crazy-seeming things with money, but no one is crazy: we each learned about money from the narrow slice of history we lived through. Someone who grew up during high inflation sees the world differently from someone who grew up in a long bull market. He then argues that luck and risk both mean that outcomes are driven by forces beyond our control, so we should be careful about judging success or failure.",
["Your money views come from your personal experience","Generations that lived through different markets invest differently","Few people have experienced more than a small sample of history","Luck and risk: forces outside your control shape results","Bill Gates went to one of the few high schools with a computer; his friend Kent Evans died young","Judge decisions, not just outcomes"],
"Housel's opener: no one is crazy with money. We all generalize from the small slice of history we personally lived through."],
s:[["l","No one's crazy","Your view of stocks, debt or saving depends heavily on what happened while you were growing up. People raised during booms tend to take more risk; people raised in crashes or high inflation tend to be cautious. Each makes sense from inside their own experience."],
["m","Why does Housel say no one is crazy with money?","People's choices make sense given their own experience",["Everyone is equally rational","Money decisions are random","Only experts make sense"],"Experience shapes belief."],
["l","Luck and risk","Bill Gates attended one of very few high schools in the world with a computer, an enormous piece of luck. His close friend Kent Evans, just as talented, died in a mountaineering accident before he could do anything. Housel uses the pair to show that luck and risk are siblings: outcomes depend on forces no one controls."],
["t","Housel says successful outcomes prove good decisions.",false,"Luck and risk mean outcomes can mislead."],
["m","What do Bill Gates and Kent Evans illustrate?","Luck and risk shaping outcomes beyond individual control",["That hard work always wins","That schools do not matter","That computers are risky"],"Same talent, different fortunes."]],
D:[["m","What practical lesson follows from the luck and risk chapter?","Focus on broad patterns rather than copying individual success stories",["Copy billionaires exactly","Ignore failures","Avoid all risk"],"Extreme cases are the least repeatable."]]},
{i:"check",t:"Never enough",c:"Chapter 3",d:"Knowing when to stop.",
n:["The hardest financial skill is getting the goalpost to stop moving.",
"Housel tells of Rajat Gupta, a hugely successful executive worth around a hundred million dollars, who wanted to be a billionaire and went to prison for insider trading, and of Bernie Madoff, who had a legitimate business before his fraud. Both risked what they had and needed for what they did not need. Enough means accepting that more is not always better. Some things are never worth risking: reputation, freedom, family.",
["Rajat Gupta risked everything for more and went to prison","Madoff had a real business before the fraud","The goalpost keeps moving as income rises","Social comparison makes enough impossible","Some things are never worth risking: reputation, freedom, family, happiness"],
"Housel says the hardest money skill is knowing when you have enough. Never risk what you have and need for what you don't have and don't need."],
s:[["l","Moving goalposts","Rajat Gupta rose from poverty to running a top consulting firm and was very rich. He wanted to be in the billionaire class, passed inside information, and went to prison. Housel's point: once you have what you need, risking it for more is foolish."],
["m","What lesson does Rajat Gupta's story teach?","Never risk what you have and need for what you do not need",["Insider trading is safe","Ambition always pays","Billionaires are happier"],"Enough is a skill."],
["t","Housel says social comparison makes it easy to feel you have enough.",false,"Comparison keeps raising the bar."],
["m","Which things does Housel say are never worth risking?","Reputation, freedom, family and happiness",["Small amounts of money","Stock picks","Job titles"],"Some losses cannot be recovered."]],
D:[["m","Why does comparison make enough so hard?","There is always someone with more, so the target keeps moving",["Comparison is illegal","Everyone has the same amount","It only affects the poor"],"The ceiling is too high to reach."]]}]],
["Time and survival","Chapters 4 to 7",[
{i:"bolt",t:"Compounding and staying wealthy",c:"Chapters 4 and 5",d:"Time is the secret, and survival matters most.",
n:["Most of Buffett's wealth came from time, and staying wealthy requires frugality and fear more than brilliance.",
"Housel explains that Warren Buffett's fortune is mainly due to investing for an extremely long time, with most of it accumulated after his sixties. Compounding is counterintuitive, so we underestimate it. Getting wealthy takes risk and optimism; staying wealthy takes humility, frugality and fear of losing it. Above all, survive: avoid ruin so compounding can keep working.",
["Buffett's skill is investing, but his secret is time","Most of his wealth came late in life","Compounding is unintuitive, so we undervalue it","Getting wealthy and staying wealthy are different skills","Survival is the key: avoid being wiped out","Plan on the plan not going to plan"],
"Warren Buffett's secret is time: most of his fortune came after his sixties because he started early and never stopped. Compounding only works if you survive."],
s:[["l","Time in the market","Buffett began investing as a child and kept going for decades. A huge share of his wealth arrived late in life. Others have earned higher yearly returns, but none for as long. Compounding grows slowly, then suddenly, which is why it is easy to underestimate."],
["m","What does Housel call the main driver of Buffett's wealth?","The long time he has been investing",["Rare annual returns","Luck at birth","Real estate"],"Time does the heavy lifting."],
["l","Survive","Getting money takes taking risks and being optimistic. Keeping it takes paranoia and frugality. Housel tells of Jesse Livermore, who made a fortune shorting the 1929 crash and later lost it all. The most important thing is to stay in the game long enough for compounding to work."],
["t","Housel says the skills to get rich and to stay rich are the same.",false,"They are almost opposite."],
["m","Why does survival matter so much in investing?","Being wiped out stops compounding, which needs time",["It lowers taxes","It guarantees high returns","It avoids paperwork"],"Avoid ruin above all."]],
D:[["m","What does Housel mean by a barbell personality?","Optimistic about the future, but paranoid about what could stop you getting there",["Only buying risky assets","Lifting weights for health","Saving half and spending half"],"Hope plus caution."]]},
{i:"star",t:"Tails and freedom",c:"Chapters 6 and 7",d:"A few events drive most results, and time is the real dividend.",
n:["A small number of events drive most outcomes, and the highest return money buys is control over your time.",
"Housel shows that a few outliers, or tails, account for most results: a small fraction of companies generate most market returns, and Walt Disney's early hits made up for many flops. You can be wrong half the time and still do well. Then he argues that the greatest dividend money pays is freedom: the ability to do what you want, when you want, with whom you want.",
["Tails drive everything: a few events produce most results","Most public companies fail; a few huge winners carry the index","Disney's success rested on a few hits like Snow White","You can be wrong often and still win","Controlling your time is the highest dividend money pays","Many richer people today are not happier because they lack control over time"],
"Housel says the biggest thing money can buy is control over your time: doing what you want, when you want, with the people you want."],
s:[["l","Tails","A small minority of events produce most of the outcomes in business and investing. Most public companies eventually fail, but a handful of giant winners make the whole market go up. Walt Disney's studio produced many flops before Snow White changed everything."],
["m","What does Housel mean by tails?","A few rare events drive most results",["Coin flips","Losing trades only","Average years"],"Outliers dominate."],
["l","Freedom","Research on happiness points to one strong factor: control over your own life. Money's greatest value is giving you that control, the ability to wake up and do what you want. Housel notes that many people today are richer than their grandparents yet feel less in control because of work demands."],
["t","Housel says the highest dividend of money is a bigger house.",false,"It is control over your time."],
["m","Why can richer generations feel less happy, according to Housel?","Higher incomes did not bring more control over time",["They have no savings","They never work","They live in smaller homes"],"Autonomy matters more."]],
D:[["m","Why can an investor be wrong half the time and still do well?","A few big winners can outweigh many losers",["Losses are tax free","Markets always rise","Half of trades never count"],"Tails again."]]}]],
["Behavior","Chapters 8 to 20",[
{i:"eye",t:"Wealth you don't see; save",c:"Chapters 8 to 10",d:"The man in the car paradox, hidden wealth and saving.",
n:["Wealth is the money you did not spend; save without needing a reason.",
"When you see someone in a fancy car, you think about the car, not about them. People buy luxury to win respect, but admiration goes to the car, not the driver. Real wealth is invisible: it is the assets not converted into things. Spending is visible and wealth is hidden, so we learn from the wrong examples. The book's advice: increase your savings rate, which you control more than income or returns, and save even without a specific goal.",
["Man in the car paradox: no one admires you, they imagine themselves in the car","Rich is income; wealthy is what you don't spend","Wealth is hidden, so we copy visible spending","Savings rate matters more than income or returns","Save for no reason: flexibility and options","Building wealth depends more on frugality than income"],
"Housel's line: wealth is what you don't see. It's the car not bought, the money not spent."],
s:[["l","The man in the car","When you see someone driving a beautiful car, you rarely think they are cool. You imagine yourself driving it. People spend to be admired, but the admiration goes to the object. Wealth itself is invisible: a balance in an account you never see."],
["m","What is the man in the car paradox?","People buy luxuries for admiration, but onlookers imagine themselves in the car instead",["Rich people never drive","Cars always lose value","Car owners are happiest"],"Admiration does not land where we hope."],
["l","Save without a reason","Your savings rate is the part of finances you control most. Saving does not need a specific goal: it buys options, flexibility and time to wait. It protects you against surprises and lets you take opportunities. Higher savings often comes from wanting less, not earning more."],
["t","Housel argues saving only makes sense when you have a specific purchase in mind.",false,"He says save even without a reason."],
["m","What is the difference between rich and wealthy, in Housel's terms?","Rich is current income; wealthy is assets not spent",["They are the same","Wealthy means famous","Rich means inherited money"],"Wealth is hidden."]],
D:[["m","Why do we learn wealth from the wrong examples?","Spending is visible while saving and investing are hidden",["Rich people lie","Banks hide records","Schools teach spending"],"Visibility misleads."]]},
{i:"scale",t:"Reasonable, room for error",c:"Chapters 11 to 15",d:"Being reasonable, expecting surprises, and the price of returns.",
n:["Aim to be reasonable, leave room for error, accept that you will change, and see volatility as a fee, not a fine.",
"Being reasonable beats being coldly rational, because a strategy you can stick with is the one that works. History is a poor map of the future, since the biggest events are surprises. So leave room for error: a margin of safety in savings and expectations. Expect your own goals to change, so avoid extreme plans. And every return has a price: volatility and uncertainty are the fee you pay for market returns, not a penalty for doing something wrong.",
["Reasonable beats rational: pick a strategy you can live with","History is a poor guide: surprises drive change","Room for error: margin of safety","Avoid single points of failure","You will change; avoid extremes","Volatility is a fee, not a fine"],
"Housel says market drops are a fee, not a fine: the price of admission for long-term returns, not a punishment for doing something wrong."],
s:[["l","Room for error","The most important part of every plan is planning for the plan not going as expected. Keep savings for surprises, avoid debt that could force you to sell, and expect lower returns than history. Margin of safety lets you survive the things you cannot predict."],
["m","What does room for error protect against?","The surprises you cannot predict",["High taxes","Boring investments","Good luck"],"Plan for the plan failing."],
["l","Fee, not fine","Market returns come with a price: stomach-churning drops. Treat that volatility like an admission ticket to a theme park, not like a parking ticket. People who see it as a fine try to dodge it and often sell at the worst time."],
["x","Match each idea to its meaning",[["Reasonable over rational","A plan you can stick with"],["Room for error","Margin of safety"],["You'll change","Avoid extreme long-term plans"],["Fee, not fine","Volatility is the price of returns"]],"Behavioral rules of thumb."],
["t","Housel recommends perfectly optimized strategies even if they are hard to stick with.",false,"He prefers reasonable ones you can keep."]],
D:[["m","Why does Housel say history is a poor map?","The biggest economic events are surprises that have no precedent",["History books are wrong","Markets never repeat anything","Data is too expensive"],"Tail events define eras."]]},
{i:"chat",t:"You and me, pessimism, stories",c:"Chapters 16 to 20",d:"Different games, the lure of gloom, and what Housel does himself.",
n:["Do not take cues from people playing a different game; optimism is the reasonable default; stories shape beliefs.",
"Bubbles form when long-term investors take cues from short-term traders playing a different game. Pessimism sounds smarter than optimism and gets more attention, but progress is usually slow and quiet while setbacks are sudden. People believe stories that fit what they want to be true. Housel ends with his own practice: high savings, a paid-off house, and simple index funds held for a long time, chosen for independence and sleep, not maximum return.",
["Different investors play different games with different time horizons","Bubbles: copying people with other goals","Pessimism sounds smart; optimism is usually right over time","Progress is slow; setbacks are fast","We believe stories we want to be true","Housel's own approach: save a lot, little debt, index funds, independence"],
"Housel's last advice: know what game you are playing. Don't take money cues from someone with a different goal and time horizon."],
s:[["l","Different games","A day trader and a retiree may buy the same stock for completely different reasons. Bubbles form when long-term people copy short-term players. Housel says the most important thing is to know what game you are playing."],
["m","How do bubbles form, according to Housel?","Long-term investors take cues from short-term traders playing a different game",["Banks create them on purpose","Only governments cause them","They happen when everyone saves"],"Mismatched time horizons."],
["l","Gloom and stories","Pessimism sounds more intelligent and grabs attention, but over time optimism has been right more often. Growth is driven by compounding, which is slow, while destruction is quick. Housel closes with how he invests: saving a high share of income, owning his house outright, using index funds, and valuing independence over maximum returns."],
["t","Housel says pessimism is usually right over long periods.",false,"Optimism has been right more often."],
["m","What does Housel prioritize in his own finances?","Independence and peace of mind over maximum returns",["Picking individual stocks","Maximum leverage","Frequent trading"],"Sleep well at night."]],
D:[["m","Why does pessimism get more attention than optimism?","It sounds smarter and threats grab our attention more than slow progress",["It is always correct","Optimism is illegal to publish","Pessimists are paid more"],"Losses loom larger."]]}]]
]}));
MORE.push(MK({id:"kafka",t:"The Trial",a:"Franz Kafka",y:1925,
q:"what happens to a person accused by a system that never explains itself?",
ans:"Josef K., a bank officer, is arrested one morning without being told his crime. Over a year he tries to fight a vast, hidden court that is everywhere and nowhere. Lawyers, painters and priests offer no way out, and he is executed. The novel is a nightmare about guilt, bureaucracy and the search for meaning in a system that cannot be understood.",
cov:"Kafka left the novel unfinished and his friend Max Brod arranged and published it. Six lessons follow the story in order.",
u:[
["The arrest","Opening chapters",[
{i:"lock",t:"Arrested on his birthday",c:"Chapter 1",d:"Josef K. is arrested but left free.",
n:["Josef K. is arrested one morning without having done anything wrong, and is never told the charge.",
"On the morning of his thirtieth birthday, Josef K., a senior official at a bank, is visited by two warders who tell him he is under arrest. They eat his breakfast and cannot say what he is charged with. Strangely, he is free to go to work. He meets the inspector in the room of his neighbor, Fräulein Bürstner, and later clumsily confides in her. From the first line, the reader is told someone must have slandered him.",
["Opening: someone must have told lies about Josef K.","He is a senior bank official, proud and orderly","Arrested on his thirtieth birthday","No charge is ever named","He remains free to work and live","Fräulein Bürstner, the neighbor, enters the story"],
"The Trial opens with Josef K. arrested one morning without having done anything wrong, and he never learns the charge."],
s:[["l","A strange arrest","Josef K. wakes up expecting breakfast and finds two strangers in his room. They tell him he is under arrest. They will not say why, and they seem to know little themselves. The inspector tells him he can continue his life and his job at the bank as normal, which makes the arrest even more absurd."],
["m","What is Josef K. told about the charge against him?","Nothing; the charge is never named",["That he stole from the bank","That he insulted the mayor","That he forged documents"],"The missing charge drives the whole novel."],
["l","Free but accused","K. is a successful, self-confident man. He treats the arrest as a misunderstanding, yet it slowly takes over his thoughts. That night he visits his neighbor, Fräulein Bürstner, recounts the scene dramatically, and kisses her, an early sign of how the case unsettles him."],
["t","After his arrest, Josef K. is taken to prison.",false,"He stays free and keeps working."],
["m","How old does Josef K. turn on the day of his arrest?","Thirty",["Forty","Twenty-one","Fifty"],"The story spans one year, ending on the eve of his 31st birthday."]],
D:[["m","What does the first sentence suggest about K.'s guilt?","That someone slandered him, since he did nothing wrong",["That he confessed","That he is a murderer","That the court is fair"],"The novel opens on presumed innocence."]]},
{i:"user",t:"The court in the attic",c:"Chapters 2 and 3",d:"The first hearing and the hidden court.",
n:["The court sits in shabby attics of tenements, and its law books turn out to be dirty pictures.",
"K. is summoned to a hearing on Sunday but given no time or room. He finds the court in a crowded attic of a poor tenement. He gives a defiant speech attacking the system, which the audience seems to ignore. On a return visit, he finds the court empty and its law books full of indecent drawings. The court's offices sprawl through attics all over the city, stuffy and airless.",
["The hearing is held in a tenement attic","K. arrives late; no time had been given","He makes a speech denouncing the court","The audience seems to be part of the court","The law books contain obscene drawings","The court's offices are everywhere, in attics"],
"Kafka's court is not a grand building but cramped attics in poor tenements, all over the city, and its law books are filled with dirty drawings."],
s:[["l","An attic court","K. searches a poor district for the court, inventing an excuse to knock on doors. He finds it in a packed attic room. He lectures the examining magistrate about the absurdity of his arrest and the corruption of the system. The crowd reacts oddly, and he realizes they all wear badges of the court."],
["m","Where does K. find the court?","In the attic of a poor tenement",["In a grand palace of justice","In the bank","At the police station"],"The court is shabby and everywhere."],
["l","Empty court","Returning the next Sunday, K. finds no session. He opens the magistrate's books and finds crude erotic drawings and a cheap novel. He is shown the court offices: long, stuffy corridors full of waiting accused, where the air is so bad that K. nearly faints."],
["t","K.'s defiant speech brings his case to a quick end.",false,"It changes nothing."],
["m","What does K. find in the magistrate's law books?","Indecent drawings and a cheap novel",["The text of his charge","Blank pages","His bank records"],"The law's authority looks absurd up close."]],
D:[["m","Why does it matter that the court is in attics everywhere?","It suggests the system is hidden in ordinary life and inescapable",["It shows the court is poor and harmless","It proves the court is fake","It makes the court easy to find"],"The court pervades the world."]]}]],
["The struggle","Middle chapters",[
{i:"x",t:"The flogger and the lawyer",c:"Chapters 5 to 7",d:"Punished warders, a sick advocate and Leni.",
n:["K.'s complaints get the warders flogged, his uncle hires a sickly lawyer, and the case grows heavier.",
"In a junk room at his own bank, K. finds the two warders being whipped because he complained about them. He cannot stop it. His uncle, alarmed, takes him to the lawyer Huld, who is bedridden and talks endlessly about connections and petitions without doing anything visible. K. is distracted by Huld's nurse Leni. The trial begins to consume his work and his mind.",
["The warders are flogged in a lumber room at the bank because of K.'s complaint","Uncle Karl arrives and pushes K. to hire a lawyer","Huld is ill, vague and slow","Leni, the nurse, seduces K.","The lawyer's first petition is never filed","K.'s work at the bank suffers"],
"K.'s complaint about the warders gets them flogged in a closet at his own bank. His attempts to fight the court only seem to make things worse."],
s:[["l","The flogging","Opening a storeroom door at the bank, K. finds the two warders being whipped by a man in leather. His complaint at the hearing caused it. He offers a bribe to stop it, fails, and shuts the door. The next day the scene is exactly the same."],
["m","Why are the warders being flogged?","Because K. complained about them at his hearing",["For stealing from the bank","For missing work","For helping K. escape"],"K.'s actions have unexpected victims."],
["l","The lawyer Huld","K.'s uncle insists he hire Huld, a well-connected lawyer who receives him in bed. Huld speaks of influence with officials and the importance of petitions but never gets anywhere. Meanwhile his nurse Leni draws K. away. K. grows exhausted and distracted at the bank."],
["t","Huld, the lawyer, makes rapid progress on K.'s case.",false,"He seems to achieve nothing."],
["m","Who pushes K. to hire a lawyer?","His uncle",["Fräulein Bürstner","The priest","The bank director"],"Family worry pulls him deeper in."]],
D:[["m","What does the repeated flogging scene suggest?","The system's cruelty is unchanging and K. cannot fix it by protest",["The bank is secretly the court","The warders deserved it","K. enjoys their suffering"],"Time does not move the machine."]]},
{i:"eye",t:"Titorelli and three kinds of acquittal",c:"Chapters 7 and 8",d:"The court painter explains there is no real escape.",
n:["The court painter explains that real acquittal never happens; only apparent acquittal or endless postponement.",
"A client sends K. to Titorelli, a painter who paints portraits of judges and knows the court's ways. In his tiny, stuffy room, he lays out three options: actual acquittal, which he has never seen; apparent acquittal, which can be overturned and the arrest renewed at any time; and protraction, keeping the case at its lowest stage forever. K. also meets Block, a merchant who has been crushed by his own years-long case, and decides to dismiss Huld.",
["Titorelli paints judges and knows how the court works","Actual acquittal: never seen it","Apparent acquittal: temporary, can be reversed","Protraction: endlessly delaying the case","Block the merchant, utterly submissive after five years","K. decides to fire his lawyer"],
"The painter Titorelli tells K. there are three outcomes: real acquittal, which never happens; apparent acquittal, which can be reversed; and endless postponement."],
s:[["l","Three outcomes","Titorelli explains that the court cannot be persuaded of innocence. Actual acquittal exists in legends but he has never seen one. Apparent acquittal means the charge is lifted for now but can return at any moment. Protraction means keeping the case going at its lowest stage indefinitely, with constant attention."],
["x","Match each outcome to Titorelli's description",[["Actual acquittal","Never actually happens"],["Apparent acquittal","Can be reversed at any time"],["Protraction","Case is delayed forever"],["Titorelli","Painter of judges' portraits"]],"No real exit is offered."],
["l","Block","At Huld's house K. meets Block, a merchant whose case has dragged on for years. He has hired secret lawyers, spent his fortune, and now groveling before Huld. Seeing him, K. dismisses his own lawyer, determined to take charge of his defense."],
["t","Titorelli says actual acquittals are common if you have the right connections.",false,"He has never seen one."],
["m","What does Block show K.?","How the case can grind a person into total submission",["How to win a case","That lawyers are useful","That the court is kind"],"Block is K.'s possible future."]],
D:[["m","Why is apparent acquittal no real freedom?","The arrest can be renewed at any time, so the threat never ends",["It costs too much","It requires leaving the country","It needs the king's signature"],"Guilt is never removed, only suspended."]]}]],
["The end","Final chapters",[
{i:"building",t:"Before the Law",c:"Chapter 9",d:"The parable in the cathedral.",
n:["A man waits all his life at the door of the Law, which was meant only for him, and is never let in.",
"Sent to show a visitor the cathedral, K. is called by name by a priest, the prison chaplain, who tells him a parable. A man from the country asks a doorkeeper to enter the Law. He is told not now. He waits for years, bribes the doorkeeper, grows old. Dying, he asks why no one else came. The doorkeeper says this door was meant only for you, and now I am going to shut it. K. and the priest argue about what it means.",
["K. is summoned by name in an empty cathedral","The priest is the prison chaplain, part of the court","Parable: a man waits all his life at the door of the Law","The doorkeeper says not now, never no","At death: this entrance was meant only for you","K. and the priest debate interpretations endlessly"],
"In the cathedral a priest tells K. the parable Before the Law: a man waits his whole life at a door, and is told at the end that it was meant only for him."],
s:[["l","A door meant for you","A man comes to the door of the Law and asks to enter. The doorkeeper says he cannot let him in now. The man waits, year after year, giving the doorkeeper everything he has. The doorkeeper accepts, saying it is only so the man will not think he failed to try. Dying, the man asks why no one else came. The answer: this door was made only for you, and now I will close it."],
["m","What does the doorkeeper say at the end of the parable?","The door was meant only for the man, and now it will be shut",["The Law was closed long ago","The man had the wrong door","Anyone can enter tomorrow"],"A private door, never used."],
["l","Endless interpretation","K. thinks the doorkeeper deceived the man. The priest offers counter-readings: maybe the doorkeeper is the deceived one, or bound by duty. He says one does not have to accept everything as true, only as necessary. K. calls that a dismal idea, turning lies into world order."],
["t","The priest gives K. a single, clear meaning of the parable.",false,"He offers many conflicting interpretations."],
["m","Who is the priest who tells the parable?","The prison chaplain, part of the court",["K.'s uncle","Titorelli","The bank director"],"Even the church belongs to the court."]],
D:[["m","Why is Before the Law often read as the key to the novel?","Like K., the man seeks access to a law that is personal yet unreachable and waits until death",["It reveals K.'s crime","It shows the court is kind","It explains the bank's role"],"It mirrors K.'s whole situation."]]},
{i:"x",t:"The quarry",c:"Chapter 10",d:"The execution, and what the novel means.",
n:["On the eve of his thirty-first birthday, two men lead K. to a quarry and kill him; he dies feeling shame.",
"Exactly a year after his arrest, two pale men in frock coats collect K. He goes along almost willingly. In a quarry outside town they lay him down and pass a knife between them, as if expecting him to do it himself. He will not. One stabs him in the heart. He dies saying it is like a dog, as if the shame would outlive him. Readers see the novel as about bureaucracy, guilt, totalitarian power, or the human condition itself.",
["The night before his 31st birthday","Two men in frock coats take him away","He does not resist","At a quarry they hand the knife back and forth","He is stabbed in the heart","His last thought is of shame","Read as about bureaucracy, guilt, faith, or totalitarianism"],
"K. dies a year after his arrest, killed in a quarry, never knowing his crime. Like a dog, he says, and the shame outlives him."],
s:[["l","Like a dog","Two men arrive the evening before K.'s thirty-first birthday. K. had half expected them. He walks with them through the city and does not cry for help. In a quarry, they lay him on a stone. A window opens nearby and a figure leans out, but no help comes. One man drives a knife into his heart."],
["m","When is K. executed?","The night before his thirty-first birthday",["The day after his arrest","Ten years later","On his fortieth birthday"],"Exactly one year passes."],
["l","What it means","Kafka asked his friend Max Brod to burn his manuscripts. Brod published them instead. The Trial has been read as a prophecy of totalitarian states, a satire of bureaucracy, a religious parable about guilt and grace, and a portrait of anxiety. The word Kafkaesque comes largely from it."],
["t","Kafka wanted The Trial published after his death.",false,"He asked Max Brod to destroy it."],
["m","What word did this novel help add to the language?","Kafkaesque",["Orwellian","Byzantine","Quixotic"],"It names absurd, oppressive bureaucracy."]],
D:[["m","Why do the executioners pass the knife back and forth over K.?","They seem to expect him to kill himself, completing his submission",["They are confused about orders","They want him to escape","They are afraid of him"],"Even death is half asked of him."]]}]]
]}));
MORE.push(MK({id:"kahneman",t:"Thinking, Fast and Slow",a:"Daniel Kahneman",y:2011,
q:"how do our two modes of thinking lead us to predictable errors?",
ans:"Kahneman describes two systems: System 1, fast, automatic and intuitive, and System 2, slow, effortful and lazy. Most errors come from System 1's shortcuts going unchecked. He covers heuristics and biases, overconfidence, prospect theory and loss aversion, and the gap between our experiencing self and our remembering self.",
cov:"Seven lessons follow the five parts of the book.",
u:[
["Two systems","Part 1",[
{i:"bolt",t:"System 1 and System 2",c:"Part 1",d:"The fast mind and the lazy mind.",
n:["System 1 is fast and automatic; System 2 is slow, effortful and lazy, so System 1 usually runs the show.",
"Kahneman introduces two characters. System 1 works quickly and automatically: recognizing a face, reading anger, answering 2 plus 2. System 2 does effortful work: complex math, careful comparison, self-control. System 2 thinks it is in charge, but it is lazy and often just endorses System 1's suggestions. The bat and ball puzzle shows this: the intuitive answer is wrong, and most people do not check.",
["System 1: fast, automatic, effortless, always on","System 2: slow, deliberate, effortful","System 2 is lazy and often accepts System 1's answers","Bat and ball puzzle: the intuitive answer of 10 cents is wrong; it is 5 cents","Attention is limited; effort is costly","Self-control and careful thought draw on the same effort"],
"Kahneman's big idea: we have a fast, intuitive System 1 and a slow, lazy System 2. Most mistakes happen when System 2 doesn't bother to check System 1."],
s:[["l","Two characters","Look at an angry face and you instantly know the person is angry: that is System 1. Multiply 17 by 24 and you must slow down and concentrate: that is System 2. System 1 runs constantly and generates impressions and feelings. System 2 is called in for hard problems."],
["x","Match each task to its system",[["Recognizing an angry face","System 1"],["Multiplying 17 by 24","System 2"],["Answering 2 plus 2","System 1"],["Checking a logical argument","System 2"]],"Fast versus slow."],
["l","The lazy controller","A bat and a ball cost 1.10 dollars in total. The bat costs one dollar more than the ball. How much is the ball? Most people say 10 cents. The correct answer is 5 cents. System 1 offers an answer, and System 2, which could catch the error, does not bother to check."],
["m","What does the bat and ball puzzle reveal?","System 2 often fails to check System 1's quick answer",["People cannot do arithmetic","System 1 is always right","Puzzles are unfair"],"Lazy checking."],
["t","Kahneman portrays System 2 as eager and always in control.",false,"He calls it lazy."]],
D:[["m","Why does Kahneman call the two systems characters?","They are useful fictions to describe kinds of thinking, not brain regions",["They are separate organs","They are two personalities","They are computer programs"],"A metaphor for explanation."]]},
{i:"eye",t:"What you see is all there is",c:"Part 1",d:"Cognitive ease, priming, jumping to conclusions and the halo effect.",
n:["System 1 builds a coherent story from whatever is in front of it, ignoring what is missing.",
"System 1 loves coherence. It jumps to conclusions from limited evidence and does not notice what is absent, which Kahneman calls WYSIATI: what you see is all there is. Familiar, easy-to-read statements feel truer (cognitive ease). Exposure to one idea primes related ones. The halo effect makes us like everything about a person whose first impression is good.",
["WYSIATI: we judge from available information and ignore what is missing","Cognitive ease: familiar or clear statements feel true","Priming: one idea activates related ideas and behavior","Halo effect: one good trait colors everything","Confirmation bias: we look for supporting evidence","Coherence feels like truth"],
"WYSIATI, what you see is all there is: our mind builds a confident story from whatever information is in front of it, and never asks what's missing."],
s:[["l","Coherent stories","Give people a one-sided argument and they will feel confident, even though they know they heard only one side. System 1 builds the best story it can from what it has. Kahneman calls this WYSIATI. Confidence reflects the coherence of the story, not the quality of the evidence."],
["m","What does WYSIATI stand for?","What you see is all there is",["Why you should always investigate thoroughly","What you said is all true","When you stop, information arrives"],"We ignore missing evidence."],
["l","Ease, primes and halos","Statements in clear fonts or repeated often feel more true. Exposure to words about old age has been reported to make people walk more slowly, although some priming studies have since failed to replicate. And if we like someone's appearance or first remark, we tend to rate their other qualities higher: the halo effect."],
["t","Kahneman says confidence reliably reflects the quality of evidence.",false,"It reflects the coherence of the story."],
["m","What is the halo effect?","One positive impression colors judgments of everything else",["A glow around saints","Fear of strangers","Remembering faces well"],"First impressions spread."]],
D:[["m","Why should readers treat some priming findings cautiously?","Several famous priming studies failed to replicate later",["Priming does not exist at all","Kahneman retracted the book","They were never published"],"Kahneman himself acknowledged the concern."]]}]],
["Heuristics","Part 2",[
