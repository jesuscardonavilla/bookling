<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0a0c12">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookling</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bookling">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/sg-400.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/sg-500.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/sg-600.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/sg-700.woff2) format('woff2')}

/* Layout idea: one phone-width column on a dark ground. Serif titles carry the book feel, mono labels carry the app feel, one electric-blue accent does all the pointing. */
:root{
  --display:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#0a0c12; --surface:#131722; --surface-2:#1a1f2e; --line:#252b3d; --line-2:#333b54;
  --text:#eef0f7; --muted:#8c94ab;
  --accent:#6f98ff; --accent-2:#a5bcff; --accent-soft:rgba(111,152,255,.14); --on-accent:#07102a;
  --good:#38d9a0; --good-bg:#0e2a24; --good-text:#7ff0c6;
  --bad:#ff6b7d; --bad-bg:#2d151b; --bad-text:#ff9aa7;
  --gold:#ffd166; --flame:#ff9f43;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ic{display:block;flex:none}
h1,h2,h3{text-wrap:balance;font-weight:600;letter-spacing:-.02em}

#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(120% 50% at 50% -8%,rgba(111,152,255,.13),transparent 62%),var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 20px 10px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.brand .step{width:20px;height:20px;display:block}
.stats{display:flex;gap:8px}
.stat{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.stat.fl{color:var(--flame)} .stat.xp{color:var(--gold)}
#main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 20px 32px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;border-top:1px solid var(--line);background:rgba(10,12,18,.92);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);font-size:12px;font-weight:600}
.tab .ti{width:48px;height:30px;border-radius:999px;display:grid;place-items:center}
.tab[aria-selected="true"]{color:var(--accent-2)}
.tab[aria-selected="true"] .ti{background:var(--accent-soft)}

/* hero */
.hero{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;gap:14px;align-items:center}
.mono{width:54px;height:54px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:20px;flex:none}
.hero h1{font-family:var(--display);font-size:24px;line-height:1.05}
.hero p{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.3}
.hero .bar{margin-top:11px}
.hero small{display:block;margin-top:7px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}

/* path */
.unit{margin-top:36px}
.sign{padding-top:16px;border-top:1px solid var(--line)}
.sign small{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2)}
.sign h2{font-family:var(--display);font-size:28px;line-height:1.05;margin:6px 0 4px}
.sign p{font-size:14px;color:var(--muted)}
.trail{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px;padding:48px 0 4px}
.trail::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;transform:translateX(-50%);background:repeating-linear-gradient(to bottom,var(--line-2) 0 6px,transparent 6px 14px)}
.nw{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;transform:translateX(var(--x));z-index:1}
.node{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);transition:transform .12s}
.node:active{transform:scale(.94)}
.node.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}
.node.current{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 0 0 7px var(--accent-soft),0 12px 34px rgba(111,152,255,.35)}
.node.locked{background:var(--surface);color:var(--line-2)}
.nl{font-size:13px;font-weight:600;text-align:center;max-width:160px;line-height:1.25;background:var(--bg);padding:2px 6px;border-radius:6px}
.start{position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line-2);border-radius:999px;padding:4px 12px;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-4px)}}

.next{margin-top:40px;display:flex;flex-direction:column;gap:10px}
.next h3{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.soon{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px dashed var(--line-2);border-radius:16px;color:var(--muted)}
.soon b{display:block;color:var(--text);font-size:15px;font-weight:600}
.soon span{font-size:13px}
.soon em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}

/* library */
.bk{display:flex;gap:12px;align-items:center;width:100%;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2)}
.bk.on{border-color:var(--accent);background:var(--accent-soft)}
.bk b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.bk span{font-size:13px;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(3,5,10,.7);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:60;animation:fade .2s}
.sheet{width:100%;max-width:480px;max-height:88vh;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease-out;display:flex;flex-direction:column;gap:12px}
.sheet>*{flex-shrink:0}
.sheet h2{font-family:var(--display);font-size:27px;line-height:1.1}
.sheet p{color:var(--muted)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.chip{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent-2);padding:5px 11px;border-radius:999px}

.btn{display:block;width:100%;padding:16px 18px;border-radius:16px;font-weight:700;font-size:16px;text-align:center;background:var(--accent);color:var(--on-accent);transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.98);opacity:.9}
.btn[disabled]{background:var(--surface-2);color:var(--muted);pointer-events:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-2)}
.btn.good{background:var(--good);color:#04201a}
.btn.bad{background:var(--bad);color:#2a0710}

/* lesson overlay */
#lesson{position:fixed;inset:0;z-index:40;background:var(--bg);display:none}
#lesson.on{display:block}
.lw{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(120% 40% at 50% -6%,rgba(111,152,255,.1),transparent 60%),var(--bg)}
.lt{display:flex;align-items:center;gap:14px;padding:calc(14px + env(safe-area-inset-top)) 20px 8px}
.lt .bar{flex:1;height:8px}
.icb{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:50%;border:1px solid var(--line)}
.hearts{display:flex;align-items:center;gap:6px;color:var(--bad);font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.lb{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 24px}
.lf{padding:14px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.lf.right{background:var(--good-bg);border-color:transparent}
.lf.wrong{background:var(--bad-bg);border-color:transparent}
.lf .hint{text-align:center;color:var(--muted);font-weight:500;font-size:14px;padding:14px 0}
.fb{display:flex;flex-direction:column;gap:8px;animation:up .22s ease-out}
.fb .fh{display:flex;align-items:center;gap:8px}
.fb.right .fh{color:var(--good-text)} .fb.wrong .fh{color:var(--bad-text)}
.fb h3{font-family:var(--display);font-size:24px;line-height:1.1}
.fb p{font-size:15px}
.fb.right p{color:var(--good-text)} .fb.wrong p{color:var(--bad-text)}
.fb .fa b{font-weight:700}
.fb .btn{margin-top:6px}

.learn{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:24px 22px;display:flex;flex-direction:column;gap:14px}
.learn .badge{width:60px;height:60px;border-radius:18px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center}
.learn h2{font-family:var(--display);font-size:31px;line-height:1.1}
.learn p{font-size:19px;line-height:1.55;color:#d6dae8}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2)}
.q{font-family:var(--display);font-weight:600;font-size:27px;line-height:1.2;letter-spacing:-.02em;margin:6px 0 22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;font-weight:500;font-size:17px;line-height:1.35;transition:transform .1s,border-color .1s}
.opt:active{transform:scale(.99)}
.opt .k{width:28px;height:28px;border:1px solid var(--line-2);border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{border-color:var(--accent);color:var(--accent-2)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{border-color:var(--good);color:var(--good-text)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{border-color:var(--bad);color:var(--bad-text)}
.opt.lock{pointer-events:none}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt .col{display:flex;flex-direction:column;gap:10px}
.mt .opt{justify-content:center;text-align:center;min-height:72px;font-size:15px;padding:10px}
.opt.gone{opacity:.45;border-color:var(--good);background:var(--good-bg);pointer-events:none}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:24px 22px}
.center h1{font-family:var(--display);font-size:36px;line-height:1.05}
.center p{color:var(--muted);max-width:32ch}
.bigb{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent);box-shadow:0 0 0 10px rgba(111,152,255,.07);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.bigb.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad);box-shadow:0 0 0 10px rgba(255,107,125,.07)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.res{display:flex;gap:10px;width:100%;margin-top:8px}
.res div{flex:1;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:12px 0}
.res span{display:block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.res b{display:block;font-family:var(--mono);font-weight:500;font-size:26px;padding-top:6px;font-variant-numeric:tabular-nums}
.res div:nth-child(1) b{color:var(--gold)} .res div:nth-child(2) b{color:var(--good)} .res div:nth-child(3) b{color:var(--flame)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:70}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* book tab */
.bh{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:10px}
.bh h1{font-family:var(--display);font-size:32px;line-height:1.08}
.bh .qq{font-weight:600;color:var(--accent-2)}
.bh p{font-size:15px;color:#c9cee0}
.badgecard{margin-top:14px;display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;background:var(--accent-soft);border:1px solid var(--accent)}
.badgecard .bd{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);flex:none}
.badgecard.off .bd{background:var(--surface-2);color:var(--muted)}
.badgecard.off{background:var(--surface);border-color:var(--line)}
.badgecard b{display:block;font-family:var(--display);font-weight:600;font-size:18px;line-height:1.15}
.badgecard .bar{margin-top:9px}
.badgecard small{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.seg{margin-top:26px;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;text-align:center;padding:9px 0;border-radius:11px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.notes{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.note h3{font-family:var(--display);font-size:21px;line-height:1.15}
.note p{font-size:15px;color:#d0d4e4}
.note ul{padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.note ul li::marker{color:var(--accent)}
.note.locked{background:transparent;border-style:dashed;border-color:var(--line-2);flex-direction:row;align-items:center;gap:12px;color:var(--muted)}
.note.locked h3{font-size:17px;color:var(--muted)}
.note.locked small{display:block;font-size:13px}
.sec{margin:32px 0 10px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.part{margin-top:14px;font-weight:600;font-size:14px;color:var(--text)}
.chs{list-style:none;margin-top:8px;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.chs li{display:flex;gap:12px;align-items:center;padding:12px 14px;font-size:14px;border-top:1px solid var(--line)}
.chs li:first-child{border-top:0}
.chs .n{width:26px;font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chs .t{flex:1}
.chs li.off .t{color:var(--muted)}
.chs .s{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chs li.k .n,.chs li.k .s{color:var(--good)}

/* me tab */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--mono);font-weight:500;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile .ic{margin-bottom:8px}
.achs{display:flex;flex-direction:column;gap:10px}
.ach{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.ach .bd{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);flex:none}
.ach.off{opacity:.55}.ach.off .bd{background:var(--surface-2);color:var(--muted)}
.ach b{display:block;font-size:15px;font-weight:600}.ach span{font-size:13px;color:var(--muted)}
.foot-note{margin-top:24px;font-size:13px;color:var(--muted)}
.reset{margin-top:16px}

/* reading + review */
.hero + .seg{margin-top:18px}
.capr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:10px}
.cap{font-size:13px;color:var(--muted);line-height:1.4}
.linkbtn{flex:none;font-size:13px;font-weight:600;color:var(--accent-2);text-decoration:underline;text-underline-offset:3px;padding:0}
.rcard{margin-top:18px;background:var(--surface);border:1px solid var(--accent);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px}
.rcard h2{font-size:26px;line-height:1.1}
.rcard p{font-size:14px;color:var(--muted)}
.rcard small{font-size:12px;color:var(--muted)}
.lcard{display:flex;gap:14px;align-items:center;width:100%;padding:14px;margin-top:10px;border:1px solid var(--line);background:var(--surface);border-radius:20px}
.lcard .li{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;flex:none}
.lcard b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.lcard span{display:block;font-size:12px;color:var(--muted);margin:2px 0 8px}
.lcard em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:6px}
.say{width:100%;text-align:left;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.say p{font-size:15px;color:var(--text);max-width:none}
a.btn{text-decoration:none}
.sheet .fine{font-size:13px}
.chs li[data-act]{cursor:pointer}
.chs li.r .n,.chs li.r .s{color:var(--accent-2)}
.center{overflow-y:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.srow{display:flex;gap:12px;align-items:center;width:100%;padding:11px 12px;margin-top:8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.srow b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.srow span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.sm{flex:none;width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);display:grid;place-items:center;font-weight:700;color:var(--accent-2)}
.tag{flex:none;font-style:normal;font-size:11px;font-weight:700;color:var(--on-accent);background:var(--accent);padding:3px 8px;border-radius:99px}

 note:{line:'Jacobs, a journalist from Hudson Street, takes on top-down city planning.',

  detail:['Author: an editor at Architectural Forum, not a trained planner','Target: zoning that separates homes, work and shops, and large clearance projects','Foil: builders like Robert Moses','Method: observe real neighborhoods closely']},
 steps:[
 {t:'learn',tag:'Introduction',h:'A journalist among the planners',p:'Jane Jacobs was not a trained planner. She was an editor at Architectural Forum who lived on Hudson Street in Greenwich Village. In 1961 she published The Death and Life of Great American Cities, after watching postwar renewal reshape neighborhoods like hers.'},
 {t:'mcq',q:'What was Jacobs\' background when she wrote the book?',c:'A magazine editor who lived in a city neighborhood',w:['A licensed planner at a city agency','A professor of architecture','A real estate developer'],why:'She wrote for Architectural Forum and drew on daily life on Hudson Street, not on formal planning training.'},
 {t:'learn',tag:'Introduction',h:'What she was pushing back on',p:'Mid-century planners favored tidy cities: separate zones for living, working and shopping, towers set in parks, and wide roads for cars. Jacobs argued this made dull, unsafe places because it ignored how people actually use streets. Her best known opponent in New York was the master builder Robert Moses.'},
 {t:'mcq',q:'Which planning habit did Jacobs attack?',c:'Separating homes, work and shops into different zones',w:['Letting neighborhoods change slowly','Mixing shops into residential streets','Keeping old buildings in use'],why:'Strict zoning kept people apart and left streets empty at different times of day.'},
 {t:'tf',q:'Jacobs believed a city works best when it is designed from the top down, like a machine.',a:false,why:'She saw cities as living systems that grow out of many small local decisions.'},

 ]},
{id:'l2',icon:'eye',title:'Eyes on the street',ch:'Chapter 2',chs:[2],

 note:{line:'A street is safe when ordinary people use it all day and watch it.',

  detail:['Clear line between public and private space','Natural watchers: shopkeepers and residents whose doors and windows face the street','Continuous sidewalk use, which adds watchers and prompts residents to look out','Shops, cafes and bars help because they bring people at different hours']},

 {t:'learn',tag:'Ch. 2',h:'Safe streets watch themselves',p:'Jacobs said a street stays safe mostly through the steady presence of ordinary people, not through police alone. Shopkeepers, residents at windows and passersby all keep a casual watch. She called this having eyes on the street.'},
 {t:'mcq',q:'According to Jacobs, what mainly keeps a street safe?',c:'Many ordinary people using and watching it',w:['More police patrols','Wide, bright roads','Fences between homes and sidewalks'],why:'Informal, everyday watching does most of the work.'},
 {t:'learn',tag:'Ch. 2',h:'Three ingredients',p:'A safe street needs a clear line between public and private space, natural watchers whose doors and windows face the street, and sidewalks that are in nearly constant use. Shops, cafes and bars help because they bring people out at different hours.'},
 {t:'mcq',q:'Which change would add the most eyes on the street?',c:'A corner shop that keeps people coming and going all day',w:['A blank wall along the whole block','A setback parking lot','A plaza that closes at night'],why:'Reasons to be outside, at many hours, put watchers on the sidewalk.'},
 {t:'tf',q:'Jacobs said the eyes that keep streets safe should mostly belong to police officers.',a:false,why:'She meant shopkeepers, residents and regular users, whom she called natural watchers.'},
 {t:'mcq',q:'Which is NOT one of her three conditions for a safe street?',c:'Wide roads built for fast traffic',w:['A clear line between public and private space','Natural watchers facing the street','Sidewalks in continuous use'],why:'Her three conditions are about who is on the street and how buildings face it.'}
 ]},

 desc:'How small daily contacts build trust, and why kids need busy streets.',
 note:{line:'Small everyday contacts weave trust, and the street teaches children.',
  para:'She describes the sidewalk ballet of Hudson Street: countless small, unplanned interactions that together create order. Casual contact builds public trust, public characters like shopkeepers anchor the street, and busy sidewalks let children learn from the adults around them.',
  detail:['Sidewalk ballet: order emerges from many small interactions, with no choreographer','Casual contact builds trust without requiring friendship','Public characters, such as a shopkeeper who knows everyone, carry the street\'s news and keep watch','Children are informally looked after and learn from a busy sidewalk (Ch. 4)']},
 steps:[
 {t:'learn',tag:'Ch. 3',h:'The sidewalk ballet',p:'Jacobs described a day on Hudson Street as a sidewalk ballet: shopkeepers sweeping, kids heading to school, neighbors chatting. Nobody directs it. Order comes from many people doing ordinary things in the same place.'},
 {t:'mcq',q:'What does the sidewalk ballet describe?',c:'Order that emerges from countless small everyday interactions',w:['A planned festival on city streets','A dance school on Hudson Street','A traffic system run by signals'],why:'No central choreographer is needed. The street organizes itself through use.'},
 {t:'learn',tag:'Ch. 3',h:'Small contacts build trust',p:'A chat at the corner store, or leaving a spare key with a shopkeeper, is not friendship. It is public trust, and Jacobs thought cities run on it. Public characters, like a shopkeeper who knows everyone, hold the street\'s news together.'},
 {t:'mcq',q:'What is a public character?',c:'A well known local, like a shopkeeper, who connects many neighbors',w:['A celebrity who lives in the area','A city official who patrols the block','A fictional person in a city novel'],why:'They are hubs of everyday street life, trusted by many.'},
 {t:'tf',q:'Jacobs argued casual contacts on the street can build trust without close friendship.',a:true,why:'Light, public contact is what lets strangers live together comfortably.'},
 {t:'mcq',q:'Why did she value busy sidewalks for children (Ch. 4)?',c:'Kids learn from, and are watched over by, a street full of adults',w:['They keep kids away from adults','Playgrounds are always better than streets','They make school unnecessary'],why:'She argued streets teach children about city life and are looked after by the people on them.'}
 ]},
{id:'l4',icon:'blocks',title:'Mixed uses and short blocks',ch:'Chapters 7 to 9',chs:[8,9],

 note:{line:'Mix uses and keep blocks short so streets stay busy and connected.',
  para:'Two of her four conditions for diversity: a district needs more than two primary uses so people arrive at different times, and its blocks must be short so there are many corners, routes and chances for varied businesses to thrive.',

 steps:[
 {t:'learn',tag:'Ch. 7',h:'Four conditions for life',p:'Jacobs listed four conditions that generate diversity in a district. All four are needed together. They are mixed primary uses, short blocks, buildings of varied age, and a dense concentration of people.'},
 {t:'mcq',q:'How many conditions for diversity does Jacobs list?',c:'Four',w:['Two','Three','Seven'],why:'Mixed uses, short blocks, aged buildings and density, working together.'},
 {t:'learn',tag:'Ch. 8',h:'Mixed primary uses',p:'A primary use is something that draws people to a place in its own right, like homes, offices, schools or theaters. A district needs more than two, so people arrive at different times and the street is never empty for long.'},
 {t:'mcq',q:'Why do mixed primary uses help a street?',c:'People arrive at different hours, so the street stays in use',w:['They make zoning simpler','They keep traffic away','They lower building costs'],why:'A single use fills a street at one time of day and leaves it empty the rest.'},
 {t:'learn',tag:'Ch. 9',h:'Short blocks',p:'Her second condition: blocks should be short. Short blocks give people many routes and many corners, where shops can open and different streams of people cross paths. Very long blocks lock movement into a few routes.'},
 {t:'tf',q:'Jacobs preferred long blocks so traffic can move without interruption.',a:false,why:'She wanted many corners and route choices so different people mix.'},
 {t:'mcq',q:'What is a primary use?',c:'An activity that draws people to a place in its own right',w:['The first building put up in a district','The most profitable shop on a block','The use that planners rank highest'],why:'Housing, offices, schools and theaters are examples.'}
 ]},

  para:'The other two conditions: buildings of different ages, including old ones, give small ventures space they can afford, and a dense concentration of people supplies enough customers and street life. She separates density from overcrowding.',

 steps:[
 {t:'learn',tag:'Ch. 10',h:'Old buildings',p:'Her third condition: a district needs buildings of different ages and conditions, including some old ones. Old buildings rent cheaply, so small shops, studios and new ventures can afford them. New construction needs high rents, which only established businesses can pay.'},
 {t:'mcq',q:'Why does Jacobs want old buildings mixed in with new ones?',c:'Cheap old space lets small, unproven ventures take root',w:['Old buildings are always more beautiful','They are cheaper to demolish','They keep property taxes low for developers'],why:'Variety in age creates variety in rents, and that creates variety in businesses.'},
 {t:'tf',q:'In her view, a district made only of new buildings is ideal for diversity.',a:false,why:'New construction tends to push out the low-profit uses that give a district its variety.'},

 {t:'mcq',q:'How did Jacobs distinguish density from overcrowding?',c:'Density is people per acre. Overcrowding is too many people per dwelling',w:['They are the same thing','Density is bad and overcrowding is good','Overcrowding only happens in suburbs'],why:'A district can be dense without any home being overcrowded.'},
 {t:'match',q:'Match each condition to what it provides',pairs:[['Mixed primary uses','People out at different hours'],['Short blocks','Many corners and routes'],['Aged buildings','Cheap space for new ventures'],['Dense concentration','Enough people to support variety']],why:'Together they keep a district busy, varied and able to renew itself.'}
 ]},
{id:'l6',icon:'road',title:'Border vacuums and money',ch:'Chapters 14 and 16',chs:[14,16],
 desc:'What drains a neighborhood, and which money helps it.',
 note:{line:'Dead zones and the wrong kind of money drain neighborhoods.',
  para:'Border vacuums, large single-use areas such as rail yards, big campuses or highways, empty out the streets beside them. Jacobs also contrasts gradual money, many small investments, with cataclysmic money, huge sums for sweeping projects, and favors the first.',
  detail:['Border vacuums are large single-use edges that few people cross or linger beside','Streets along them lose users and become less safe and less viable','Gradual money lets districts evolve through many small decisions','Cataclysmic money funds big clearance and rebuilding that can erase local life']},
 steps:[
 {t:'learn',tag:'Ch. 14',h:'Border vacuums',p:'A border vacuum is a large single-use area, such as a rail yard, a big campus or a highway, that few people cross or linger beside. The streets along its edge lose their users, so they empty out and feel less safe.'},
 {t:'mcq',q:'Which is the best example of a border vacuum?',c:'A rail yard or expressway that few people cross',w:['A corner cafe with a patio','A block with homes above shops','A short street with many corners'],why:'Large single-use edges break up the mix of uses that keeps nearby streets alive.'},
 {t:'mcq',q:'What tends to happen to a street along a border vacuum?',c:'It empties out because few people use it',w:['It becomes the busiest street in the district','It gains more shops','It turns into a park'],why:'No mix of uses and no steady flow of users means no eyes on the street.'},
 {t:'learn',tag:'Ch. 16',h:'Two kinds of money',p:'Jacobs contrasted gradual money with cataclysmic money. Gradual money arrives in many small amounts, through local loans and steady improvements. Cataclysmic money arrives in huge sums for sweeping projects, and it can wipe out what is already there.'},
 {t:'tf',q:'Jacobs thought neighborhoods improve best through many small, gradual investments.',a:true,why:'Gradual money lets a district evolve without erasing what already works.'},
 {t:'mcq',q:'What does cataclysmic money tend to fund?',c:'Large-scale clearance and rebuilding all at once',w:['Small repairs by local owners','Neighborhood loans for shopkeepers','Gradual streetscape changes'],why:'It is big money for big projects, which is why she distrusted it.'}
 ]},
{id:'l7',icon:'net',title:'A city is organized complexity',ch:'Chapter 22',chs:[22],
 desc:'The big idea that ties the whole book together.',
 note:{line:'A city is a problem of organized complexity, so study real cases.',
  para:'Borrowing Warren Weaver\'s categories, Jacobs says cities are neither simple nor something you can average away. Many interrelated parts change together, so we understand them through close observation of particular places rather than a single master formula.',
  detail:['Simple problems have few variables','Disorganized complexity has millions of variables that can be handled statistically','Organized complexity has many variables that are all interrelated, and a city is this kind','So: watch particular places closely and test ideas against real streets']},
 steps:[
 {t:'learn',tag:'Ch. 22',h:'Organized complexity',p:'In the final chapter Jacobs borrows from the scientist Warren Weaver. Some problems are simple, with few variables. Some are disorganized, with millions of variables you can average. And some are organized complexity: many variables that are all interrelated. She said a city is that third kind.'},
 {t:'mcq',q:'What kind of problem did Jacobs say a city is?',c:'A problem of organized complexity',w:['A simple problem with one cause','A problem solved by averages','A purely engineering problem'],why:'Many interrelated parts change together, so cities resist one-formula answers.'},
 {t:'learn',tag:'Ch. 22',h:'How to study a city',p:'If a city is organized complexity, you learn by watching particular places closely, noticing how the parts interact, and testing ideas against real streets. That is why Jacobs walked and observed instead of drawing a master plan.'},
 {t:'tf',q:'Jacobs thought one big master plan could solve every city\'s problems.',a:false,why:'She argued for attention to particular places and how their parts interact.'},
 {t:'mcq',q:'Which method fits her view of cities?',c:'Close observation of real places and how their parts interact',w:['Applying one formula to every city','Redrawing the map from scratch','Relying only on statistics'],why:'Complexity of this kind shows up in particular cases, not in averages.'},
 {t:'mcq',q:'Which sentence best sums up the book\'s argument?',c:'Cities thrive on diversity and everyday street life, and top-down planning that erases these hurts them',w:['Cities should be rebuilt as towers in parks','Cars should be the center of city design','Residents should leave planning to experts'],why:'Everything from sidewalks to money flows back to that one idea.'}
 ]}

{id:'a1',icon:'target',title:'Trauma does not decide you',ch:'Night One',chs:[1],
 desc:'Why the philosopher looks at goals instead of causes.',
 note:{line:'Your past does not decide you. Your present goals do.',
  para:'The philosopher argues that Adlerian psychology explains behavior by goals, not by past causes. Experiences matter through the meaning we give them, so trauma is not a fixed verdict. Even anger and anxiety can serve a present goal.',
  detail:['Etiology looks for causes in the past. Teleology looks for goals in the present','Adler denies that trauma determines us. The meaning we assign is what shapes us','Example: anxiety can serve the goal of staying away from people','Example: anger can be a tool created to get a result']},
 steps:[
 {t:'learn',tag:'Night 1',h:'Causes or goals?',p:'The book is a conversation between a philosopher who follows the psychologist Alfred Adler and a skeptical young man. The philosopher opens with a bold claim: your past does not determine who you are. Etiology asks what caused you to be this way. Teleology asks what you are trying to achieve.'},
 {t:'mcq',q:'How does the philosopher look at emotions and behavior?',c:'As tools that serve a present goal',w:['As unavoidable results of past events','As signs of a weak character','As random reactions'],why:'Adlerian psychology asks what a person is trying to achieve, not only what happened to them.'},
 {t:'learn',tag:'Night 1',h:'Trauma, reframed',p:'Adler did not say experiences are irrelevant. He said it is the meaning we give them that shapes us. Someone says, I cannot go out because I am anxious. The Adlerian reading reverses it: they want to avoid people, and anxiety is the means they produce. Anger works the same way. Shouting at a waiter who spilled coffee is a tool to make him submit, not an uncontrollable reaction.'},
 {t:'mcq',q:'Which is the goal-based explanation of a person who stays home?',c:'They want to avoid people, and anxiety supports that goal',w:['Something happened to them years ago','They were born shy','Their upbringing alone made them this way'],why:'The goal comes first, and the feeling is produced to serve it.'},
 {t:'tf',q:'Adler said past experiences have no effect on a person at all.',a:false,why:'He said experiences do not determine us. The meaning we give them does.'},
 {t:'match',q:'Match each term to its meaning',pairs:[['Etiology','Looks for causes in the past'],['Teleology','Looks for goals in the present'],['Anger (example)','A tool created to get a result'],['Experience','Shapes you through the meaning you give it']],why:'The shift from causes to goals is the foundation of the whole book.'}
 ]},
{id:'a2',icon:'user',title:'Your lifestyle is a choice',ch:'Night One',chs:[1],
 desc:'Personality as something you keep choosing, and why change takes courage.',
 note:{line:'Your personality is a lifestyle you chose, so you can choose again.',
  para:'Adler\'s word for personality is lifestyle: your view of yourself and the world. The philosopher says people keep choosing it because change is frightening, so what blocks change is a lack of courage, not ability.',
  detail:['Lifestyle means your outlook on yourself and the world','It was chosen, so it can be chosen again','Staying the same is safe and predictable, even when unhappy','The missing ingredient is the courage to be happy']},
 steps:[
 {t:'learn',tag:'Night 1',h:'Lifestyle',p:'Adler used the word lifestyle for what we usually call personality: how you see yourself and the world. The philosopher says you chose it, probably in childhood, and you can choose differently now.'},
 {t:'mcq',q:'What does Adler mean by lifestyle?',c:'Your outlook on yourself and the world, which you chose',w:['Your income and daily habits','Your inherited temperament','Your social class'],why:'It is a way of seeing, which is why it can be changed.'},
 {t:'learn',tag:'Night 1',h:'Why we do not change',p:'Change is frightening. Staying as you are, even unhappy, is predictable, while a new way of living is unknown. The philosopher says people are not stopped by lack of ability. They lack the courage to be happy, so they keep deciding not to change.'},
 {t:'mcq',q:'According to the philosopher, what usually stops people from changing?',c:'A lack of courage to face the unknown',w:['A lack of talent','Bad luck in the past','Their environment alone'],why:'Staying the same feels safe, even when it makes you unhappy.'},
 {t:'tf',q:'In this view, saying I cannot change is often a decision to stay the same.',a:true,why:'Not changing is something you keep choosing, because the familiar feels safer.'},
 {t:'mcq',q:'Which idea fits this lesson?',c:'Your personality is something you keep choosing',w:['Your personality is fixed at birth','Your personality is set by your childhood','Your personality cannot be studied'],why:'If it was chosen, it can be chosen again.'}
 ]},
{id:'a3',icon:'net',title:'People, inferiority and the ideal self',ch:'Night Two',chs:[2],
 desc:'Why every problem is about people, and how to use inferiority well.',
 note:{line:'Problems are about people, and inferiority is a signal, not a sentence.',
  para:'Adler held that all problems are interpersonal relationship problems. A sense of inferiority is subjective and can drive growth, but it becomes a complex when used as an excuse. The healthy comparison is with who you were yesterday, not with others.',
  detail:['Many worries only exist in relation to other people','Inferiority feelings are subjective interpretations','Inferiority complex: using the feeling as an excuse not to act','Superiority complex: boasting or borrowed authority to seem superior','Compare yourself with who you were yesterday, not with others']},
 steps:[
 {t:'learn',tag:'Night 2',h:'All problems are about people',p:'The philosopher gives Adler\'s most striking claim: all problems are interpersonal relationship problems. Imagine being alone in the universe, with no one to compare yourself to or disappoint. Embarrassment, envy and many other worries only exist in relation to other people.'},
 {t:'mcq',q:'What did Adler claim about human problems?',c:'All of them are, at root, interpersonal relationship problems',w:['They all come from childhood trauma','They all come from lack of money','They are all caused by bad luck'],why:'Remove other people and most of what troubles us would not exist.'},
 {t:'learn',tag:'Night 2',h:'Inferiority feelings',p:'A feeling of inferiority is subjective: you compare yourself with someone, or with an ideal, and find a gap. Adler saw this as healthy when it pushes you to improve. It becomes an inferiority complex when you use it as an excuse, like I am not educated, so I cannot succeed.'},
 {t:'mcq',q:'What is an inferiority complex, in this sense?',c:'Using your sense of inferiority as an excuse not to act',w:['Any feeling of being less than others','A medical disorder','Being proud of what you have'],why:'The feeling is normal. The complex is hiding behind it.'},
 {t:'learn',tag:'Night 2',h:'The right comparison',p:'A healthy aim is not to be better than other people but to be better than you were yesterday. Life is not a competition. Someone who boasts or borrows authority to seem superior has a superiority complex, which usually covers a sense of inferiority.'},
 {t:'mcq',q:'What comparison does Adler recommend?',c:'Yourself today against who you were yesterday',w:['Yourself against your rivals','Yourself against the average person','Yourself against what your parents achieved'],why:'Measuring against others turns life into a race. Measuring against yourself keeps it about growth.'},
 {t:'tf',q:'A superiority complex can be a way of covering up an inferiority complex.',a:true,why:'Boasting often signals the opposite feeling underneath.'}
 ]},
{id:'a4',icon:'blocks',title:'Whose task is it?',ch:'Night Three',chs:[3],
 desc:'The separation of tasks, the tool at the heart of the book.',
 note:{line:'Ask whose task it is, and stay out of tasks that are not yours.',
  para:'Seeking approval means living by others\' expectations. The remedy is separation of tasks: work out who ultimately faces the consequences of a choice, and do not intrude on other people\'s tasks or let them intrude on yours.',
  detail:['Approval-seeking leads you to live by other people\'s expectations','Test: who ultimately receives the consequences?','A parent can support a child\'s studying but cannot do it for them','What others think of you is their task, not yours']},
 steps:[
 {t:'learn',tag:'Night 3',h:'The trap of approval',p:'Many of us live to be praised and to avoid disapproval. The philosopher says this means living by other people\'s expectations, so you end up living someone else\'s life.'},
 {t:'mcq',q:'What problem does seeking others\' approval cause?',c:'You end up living by other people\'s expectations',w:['You lose the ability to speak','You become too independent','You stop caring about quality'],why:'Your choices start to answer to an audience instead of your own judgment.'},
 {t:'learn',tag:'Night 3',h:'Separation of tasks',p:'Ask, whose task is this? Look at who ultimately faces the consequences of the choice. A child\'s studying is the child\'s task. A parent can offer support but should not take it over. Do not step into other people\'s tasks, and do not let others step into yours.'},
 {t:'mcq',q:'How do you tell whose task it is?',c:'Ask who ultimately receives the consequences of the choice',w:['Ask who is older','Ask who cares more about the result','Ask who has more experience'],why:'The person who bears the result owns the decision.'},
 {t:'tf',q:'Under separation of tasks, a parent should take over a child\'s task whenever the child struggles.',a:false,why:'Support is fine. Taking over intrudes on the child\'s task. You can lead a horse to water, but you cannot make it drink.'},
 {t:'match',q:'Match each situation to whose task it is',pairs:[['Whether a child studies','The child\'s task'],['What others think of you','Their task, not yours'],['Acting on your own values','Your task'],['Offering help when asked','Support without intruding']],why:'Sorting tasks this way removes a lot of needless conflict.'}
 ]},
{id:'a5',icon:'chat',title:'The courage to be disliked',ch:'Night Three',chs:[3],
 desc:'The idea in the title, and what freedom costs.',
 note:{line:'Being disliked by some is the price of living by your own principles.',
  para:'The title idea: if others\' opinions are their task, trying to be liked by everyone means bending your life around them. The philosopher says being disliked is a sign you are exercising freedom, though you should not seek dislike on purpose.',
  detail:['Others\' opinion of you is their task','Freedom here means not editing yourself to win approval','It does not mean seeking conflict','Explain yourself honestly, then let go of the result']},
 steps:[
 {t:'learn',tag:'Night 3',h:'The title idea',p:'If what others think of you is their task, you cannot control it. Trying to be liked by everyone means bending your whole life around them. The philosopher says that being disliked by someone can be a sign you are living by your own principles.'},
 {t:'mcq',q:'What does the courage to be disliked mean?',c:'Accepting that some people will dislike you if you live by your own principles',w:['Enjoying making other people angry','Ignoring everyone\'s feedback','Never caring about relationships'],why:'It is about not letting fear of disapproval run your choices.'},
 {t:'learn',tag:'Night 3',h:'Freedom has a price',p:'Freedom in this view means you stop editing yourself to win approval. It does not mean being rude or seeking conflict. You can explain yourself honestly, but whether others accept it is their task.'},
 {t:'mcq',q:'Which is closest to the book\'s view?',c:'Live by your own principles, even if some people dislike you',w:['Do whatever you want without considering anyone','Seek out conflict to prove independence','Please everyone to stay safe'],why:'The point is freedom with other people, not against them.'},
 {t:'tf',q:'The philosopher says you should try to be disliked on purpose.',a:false,why:'The point is not to seek dislike, but to stop letting the fear of it decide your choices.'},
 {t:'mcq',q:'If someone dislikes you despite your honest effort, what then?',c:'That is their task, so let it go and carry on',w:['Change your values to win them over','Argue until they agree','Assume you are a failure'],why:'You can do your part. Their opinion is theirs.'}
 ]},
{id:'a6',icon:'scale',title:'Equals, not rankings',ch:'Night Four',chs:[4],
 desc:'Community feeling, horizontal relationships and encouragement.',
 note:{line:'Treat people as equals, and encourage instead of praising.',
  para:'Adler\'s aim for relationships is community feeling: a sense of belonging and connection. The philosopher favors horizontal relationships over vertical ones, and encouragement, such as saying thanks, over praise, which judges from above.',
  detail:['Community feeling is a sense of belonging and connection','You are one member of a community, not the center of the world','Vertical relationships rank people. Horizontal ones treat people as equal','Encouragement helps someone feel able to face their tasks']},
 steps:[
 {t:'learn',tag:'Night 4',h:'Community feeling',p:'Adler\'s goal for relationships is community feeling: a sense that you belong and are connected to others. The philosopher says you are not the center of the world. You are one member of a larger community.'},
 {t:'mcq',q:'What is community feeling?',c:'A sense that you belong and are connected to others',w:['Feeling superior to your group','Living in a big city','Following the majority'],why:'It is the book\'s measure of a healthy relationship to others.'},
 {t:'learn',tag:'Night 4',h:'Vertical and horizontal',p:'Vertical relationships rank people above and below. Praise and scolding are both vertical, because the person judging stands above. Adlerians choose horizontal relationships, where people are different but equal. Instead of good job, they say thank you or that helps me. This is encouragement.'},
 {t:'mcq',q:'Which is an example of horizontal encouragement?',c:'Thank you, that really helped me',w:['Good boy, well done','You should have done better','Only I can judge your work'],why:'It expresses gratitude between equals instead of a grade from above.'},
 {t:'tf',q:'Adlerians prefer praise because it motivates people.',a:false,why:'Praise ranks people from above, which they see as damaging to equal relationships.'},
 {t:'match',q:'Match each idea to its meaning',pairs:[['Vertical relationship','Ranking people above and below'],['Horizontal relationship','Different but equal'],['Praise','Judgment from above'],['Encouragement','Helping someone feel able to face their tasks']],why:'Equality is the foundation of everything in this part of the book.'}
 ]},
{id:'a7',icon:'heart',title:'Acceptance, trust, contribution',ch:'Night Five',chs:[5],
 desc:'Three ideas that fit together into a sense of worth.',
 note:{line:'Accept yourself, have confidence in others, and contribute.',
  para:'Three ideas connect: self-acceptance of who you are now, confidence in others without conditions, and contribution to others. The feeling of being useful, in the book\'s view, is where a sense of worth comes from.',
  detail:['Self-acceptance: accept the present self and work on what you can change','Confidence in others: believe in people without demanding proof','Contribution: feel useful through what you give','These three support each other']},
 steps:[
 {t:'learn',tag:'Night 5',h:'Three ideas that fit together',p:'Self-acceptance means accepting who you are now and working on what you can change, instead of wishing to be someone else. Confidence in others means believing in people without demanding proof first. Contribution to others means feeling useful through what you give.'},
 {t:'mcq',q:'Which three ideas does the book connect?',c:'Self-acceptance, confidence in others, contribution to others',w:['Ambition, rivalry, reward','Obedience, order, loyalty','Success, status, wealth'],why:'Each one supports the other two.'},
 {t:'learn',tag:'Night 5',h:'Feeling useful',p:'The sense of I am useful to someone is where the book places a feeling of worth. It does not depend on visible results or thanks. It comes from your own sense that you are contributing in your own way.'},
 {t:'mcq',q:'What does the book say gives a sense of worth?',c:'Feeling that you contribute to others',w:['Winning recognition from others','Being better than your rivals','Avoiding all conflict'],why:'Worth comes from contribution, not from approval.'},
 {t:'tf',q:'Self-acceptance means giving up on anything you could change.',a:false,why:'It means accepting your present self while working on what is changeable.'},
 {t:'mcq',q:'Which is a self-acceptance statement?',c:'I am not perfect, and I can work on what I can change',w:['I will never change','I should be someone else','Others should accept me first'],why:'Accept what is, change what can be changed.'}
 ]},
{id:'a8',icon:'sun',title:'Live in the dance of now',ch:'Night Five',chs:[5],
 desc:'Why life is a series of moments, and a guiding star for choosing.',
 note:{line:'Live fully in the present. Let contribution be your guiding star.',
  para:'The philosopher describes life as a series of moments, like a dance, not a climb toward a distant summit. Life has no built-in meaning, so you give it one, and contribution to others can serve as a guiding star for your choices.',
  detail:['Life is a series of moments, each complete in itself','The here and now is the real life, not preparation for later','Life has no preset meaning. You assign it','Contribution to others is the guiding star']},
 steps:[
 {t:'learn',tag:'Night 5',h:'A series of moments',p:'The philosopher tells the young man to treat life as a series of moments, like a dance, not as a climb toward a distant summit. You do not have to reach a goal before life starts. Each moment is already complete.'},
 {t:'mcq',q:'How does the philosopher describe a good life?',c:'A series of moments to be lived fully in the present',w:['A climb toward a distant summit','A race against others','A plan that must be finished first'],why:'The dance does not wait for an ending to be real.'},
 {t:'learn',tag:'Night 5',h:'A guiding star',p:'He says life has no general meaning given in advance. You give it meaning. Even so, he offers a guiding star: contribution to others. With that star in view, you can choose without fear of being disliked.'},
 {t:'mcq',q:'What does he name as the guiding star for choosing?',c:'Contribution to others',w:['Public approval','Personal wealth','Winning every dispute'],why:'It gives direction without needing anyone\'s applause.'},
 {t:'tf',q:'He says life has a single meaning decided in advance for everyone.',a:false,why:'Meaning is something you assign, not something handed to you.'},
 {t:'mcq',q:'Why live earnestly in the here and now?',c:'Because each moment is the real life, not preparation for later',w:['Because the past decides the future','Because planning is useless','Because others will judge you later'],why:'Putting life off for a future goal means missing the moments you have.'}
 ]}
];

J_BY.l8={id:"l8",icon:"sun",title:"Parks and neighborhoods",ch:"Chapters 5 and 6",chs:[5,6],
 desc:"Why parks are not automatic goods, and how neighborhoods work in layers.",
 note:{line:"Parks need people and mixed surroundings, and neighborhoods work in layers.",
  para:"Jacobs says a park is only as good as the people it draws, which depends on the variety of uses around it. She names four qualities that help a park work. She also argues a neighborhood is not a sealed unit but a set of overlapping layers, from the street to the district to the whole city.",
  detail:["Parks are not automatically good. Their success depends on who uses them and when","Four qualities help a park: intricacy, centering, sun and enclosure","A park surrounded by single-use blocks can sit empty","Neighborhoods work in layers: street, district and the city as a whole","A healthy district is large enough to have political weight"]},
 steps:[
 {t:"learn",tag:"Ch. 5",h:"Parks are not automatic goods",p:"Planners often assumed that more green space automatically made a neighborhood better. Jacobs disagreed. A park is only as good as the people it draws. A park surrounded by empty, single-use blocks can sit unused, while one with a varied mix of nearby uses fills at different times of day."},
 {t:"mcq",q:"What did Jacobs say decides whether a park succeeds?",c:"The mix of people and uses drawn to it and around it",w:["Its size alone","How much grass it has","Whether planners designed it"],why:"A park works through the life around it, not through green space alone."},
 {t:"learn",tag:"Ch. 5",h:"Four ingredients",p:"She named four qualities that help a park work. Intricacy gives people variety to see and do. Centering gives it a recognizable focal place. Sun makes people want to be there. Enclosure gives a sense of being defined by the buildings around it."},
 {t:"mcq",q:"Which is NOT one of her four park qualities?",c:"Isolation from nearby buildings",w:["Intricacy","Centering","Enclosure"],why:"A park works because it is woven into its surroundings, not cut off from them."},
 {t:"learn",tag:"Ch. 6",h:"Neighborhoods in layers",p:"Jacobs argues a city neighborhood is not a sealed unit. She describes three useful levels: the street neighborhood, the larger district, and the city as a whole. Each does different work, and a healthy district is large enough to carry political weight."},
 {t:"mcq",q:"How did Jacobs describe neighborhoods?",c:"As overlapping layers: street, district and the whole city",w:["As self-contained units that should be walled off","As units of exactly equal size","As something planners should design from scratch"],why:"Cities work through their connections, not through isolated pockets."},
 {t:"tf",q:"Jacobs thought each neighborhood should be isolated from the rest of the city.",a:false,why:"Neighborhoods are parts of larger networks, and cities work through those links."}
 ]};
J_BY.l9={id:"l9",icon:"bolt",title:"When success destroys diversity",ch:"Chapters 13 and 15",chs:[13,15],
 desc:"How popular places lose their variety, and what lets a struggling place improve.",
 note:{line:"Success can crowd out the variety that created it, and places improve when residents can stay.",
  para:"Jacobs describes the self-destruction of diversity: a thriving district attracts demand, and a few profitable uses outbid the rest. She also contrasts slumming, where people leave as soon as they can, with unslumming, where residents have reasons and means to stay and invest.",
  detail:["A successful district can lose its variety as profitable uses outbid others","Unslumming needs residents who can and want to stay","Incomes can diversify inside the same neighborhood over time","Clearing a place destroys the networks that could have improved it"]},
 steps:[
 {t:"learn",tag:"Ch. 13",h:"Success can destroy diversity",p:"A district that thrives attracts demand. If one very profitable use keeps outbidding the rest, the variety that made the place attractive gets squeezed out. Jacobs called this the self-destruction of diversity: success can undermine the conditions that created it."},
 {t:"mcq",q:"What is the self-destruction of diversity?",c:"A successful area crowding out the variety that made it attractive",w:["A district losing people because it is too diverse","Planners deliberately removing variety","Diversity causing crime"],why:"The very popularity of a place can price out the small, varied uses that gave it life."},
 {t:"learn",tag:"Ch. 15",h:"Slumming and unslumming",p:"Jacobs used slum for a place residents leave as soon as they can, so it never improves. Unslumming happens when people have reasons and means to stay, so incomes diversify and they invest in their own homes and streets. Places improve when residents can stay, not when planners clear them away."},
 {t:"mcq",q:"What makes unslumming possible, in her view?",c:"Residents who have reasons and means to stay and improve things",w:["Clearing the area and rebuilding it","Moving residents to new projects","Raising rents quickly"],why:"Improvement comes from the people who stay and invest."},
 {t:"tf",q:"Jacobs thought clearing a poor area and replacing it is the best way to fix it.",a:false,why:"She argued clearance destroys the networks and the people who could improve a place."},
 {t:"mcq",q:"A trendy street's rents rise until only one kind of business can afford it. What process is this?",c:"The self-destruction of diversity",w:["Unslumming","Gradual money","A border vacuum"],why:"One profitable use outbids the rest and the variety disappears."}
 ]};
J_BY.l10={id:"l10",icon:"route",title:"Housing projects and cars",ch:"Chapters 17 and 18",chs:[17,18],
 desc:"Why she criticized isolated housing projects and car-centered design.",
 note:{line:"Isolated projects and car-centered design both ignore the mix of uses that keeps a city working.",
  para:"Jacobs criticized subsidized housing projects built as self-contained islands, cut off from street life, and argued for housing support inside ordinary mixed neighborhoods. She also argued that accommodating ever more cars erodes a city, and proposed gradually reducing the space and priority given to cars.",
  detail:["Projects built as islands lacked mixed uses, shops and eyes on the street","She favored subsidizing housing within active, varied neighborhoods","Widening roads to meet traffic can draw more cars and take space from streets","Attrition of automobiles means gradually giving cars less room"]},
 steps:[
 {t:"learn",tag:"Ch. 17",h:"Why projects fail",p:"Jacobs criticized subsidized housing projects built as self-contained islands: large, single-use, and cut off from the street life around them. Without a mix of uses, shops and passersby, they lacked eyes on the street and often felt unsafe. She argued for supporting housing inside ordinary mixed neighborhoods instead."},
 {t:"mcq",q:"What was her main criticism of many housing projects?",c:"They were isolated islands lacking mixed uses and street life",w:["They were too small","They were built too slowly","They had too many shops"],why:"Her four conditions for life were missing, so the streets around them stayed dead."},
 {t:"mcq",q:"Which approach fits her view of housing for lower-income people?",c:"Mix subsidized housing into varied, active neighborhoods",w:["Build large separate complexes","Move them to the city edge","Reserve whole districts for them"],why:"She wanted support delivered inside the fabric of a living city."},
 {t:"learn",tag:"Ch. 18",h:"The attrition of automobiles",p:"Her fix for the damage cars do was gradual. Instead of widening roads to meet traffic, which can draw more cars and eats up streets, reduce the space and priority given to cars over time, for example by narrowing roads and widening sidewalks. She called this the attrition of automobiles."},
 {t:"mcq",q:"What is the attrition of automobiles?",c:"Gradually reducing the space and priority cars get",w:["Banning all cars at once","Building more highways","Replacing sidewalks with parking"],why:"It is a slow shift, not a sudden ban."},
 {t:"tf",q:"Jacobs thought wider roads solve congestion in the long run.",a:false,why:"She argued that more road space invites more cars and takes space from streets."}
 ]};

var EXTRA={
 l1:{say:"Jacobs was a journalist, not a planner, and she argued that cities work because of messy everyday life, not neat top-down plans.",deep:[
  dq("Why does it matter that Jacobs was a writer and not a trained planner?","She built her case on close observation of real streets instead of planning theory",["It means her ideas were never tested","It made her an ally of the planners she criticized","It means she avoided talking about cities"],"Her authority came from watching how places actually work."),
  dq("What is her deepest objection to tidy zoning?","It treats a city like a machine and ignores how people really use places",["It costs too much","It makes buildings too tall","It favors old buildings"],"Order in cities emerges from use, not from diagrams.")]},

 l3:{say:"Order on a street comes from thousands of small interactions. The shopkeeper who knows everyone is part of how a neighborhood stays safe and connected.",deep:[

 l9:{say:"Success can price out the variety that made a place popular, and places improve when the people who live there can afford to stay and invest.",deep:[

  dq("Which description fits unslumming?","A place where growing incomes and long-term residents keep investing locally",["A place where residents leave once they earn more","A place rebuilt by clearance","A place owned by a single developer"],"Staying is what makes improvement possible.")]},
 l6:{say:"Big single-use zones like rail yards or highways deaden the streets beside them, and slow local money builds cities better than huge sums for sweeping projects.",deep:[
  dq("A new highway cuts through a lively district. Which concept applies?","A border vacuum that empties nearby streets",["Gradual money","Sidewalk ballet","Public characters"],"Big single-use edges starve the streets next to them."),
  dq("Why was she wary of cataclysmic money?","It tends to clear what exists instead of letting it evolve",["It is always stolen","It is too slow","It only funds parks"],"Sweeping projects erase the web already there.")]},
 l10:{say:"Isolated housing projects and car-centered design both ignore the mix of uses and street life that keep a city working.",deep:[
  dq("A city widens a main street to relieve traffic. What would Jacobs predict?","More cars arrive, and the street loses sidewalk life",["Traffic disappears for good","Shops flourish","Pedestrians increase"],"Accommodating cars invites more of them."),
  dq("Which idea links her critique of projects and of car-oriented design?","Both ignore the mix of uses and street life that keep cities working",["Both cost too much","Both were too small","Both were built by amateurs"],"The same four conditions are missing in both cases.")]},
 l7:{say:"A city is a problem of organized complexity: many interrelated parts. You understand it by watching real places, not by applying one master plan.",deep:[
  dq("Which approach would Jacobs trust more for fixing a street?","Study how that street's parts interact and change one thing at a time",["Apply a standard formula from another city","Rely only on city-wide averages","Rebuild it entirely"],"Interrelated parts call for close observation."),
  dq("What is the link between the third category of problem and her method?","Interrelated variables cannot be averaged, so you must observe particulars",["Statistics solve it","Theory is enough","Planning is impossible"],"Organized complexity resists formulas.")]},
 a1:{say:"Adler's psychology says we are driven by goals, not trauma. What happened to us matters less than the meaning we give it.",deep:[
  dq("Someone says, I am angry because my coworker insulted me. How would the philosopher respond?","The anger may be a tool used to reach a goal, such as winning the argument",["The insult caused the anger automatically","Anger is never chosen","Insults are always justified"],"Emotions serve present goals."),
  dq("Why is this idea hopeful?","If goals shape emotions, a person can choose different goals",["It removes all responsibility","It proves the past is irrelevant to everyone","It says feelings do not exist"],"What is chosen can be rechosen.")]},
 a2:{say:"Your personality is a lifestyle you chose, so you can choose again. Staying the same feels safer, so change takes courage.",deep:[
  dq("Someone says, I am just shy. What would the philosopher suggest?","Shyness may be a lifestyle chosen to avoid being hurt, which can be chosen again",["Shyness is genetic and fixed","Shyness proves they are inferior","They should hide it"],"He treats traits as choices, not verdicts."),
  dq("What is his main claim about happiness here?","It takes courage, because change means leaving what is familiar",["It depends on luck","It depends on money","It cannot be chosen"],"The missing piece is courage, not ability.")]},
 a3:{say:"All problems are about relationships, inferiority feelings are subjective, and the only fair comparison is with who you were yesterday.",deep:[
  dq("A person constantly brags about famous friends. What would Adler suspect?","A superiority complex covering a sense of inferiority",["Real superiority","Healthy pride","A lack of friends only"],"Borrowed authority hides a felt gap."),
  dq("Which is a healthy use of an inferiority feeling?","Using the gap to your ideal self as a reason to improve",["Using it as a reason not to try","Hiding it behind boasting","Comparing yourself to rivals"],"The feeling is a stimulus, not a sentence.")]},
 a4:{say:"Ask whose task it is by seeing who faces the consequences. Do not take over other people's tasks or let them take over yours.",deep:[
  dq("A friend keeps making a choice you disagree with. What does separation of tasks suggest?","Offer your view if asked, but accept the choice is theirs",["Make the choice for them","Cut off the friendship","Pressure them until they agree"],"You can support without intruding."),
  dq("Why does this separation reduce conflict?","Much conflict comes from entering other people's tasks",["It makes everyone agree","It avoids all relationships","It removes consequences"],"Most friction is boundary friction.")]},
 a5:{say:"The courage to be disliked means you stop bending your life to win approval. Some people will dislike you, and you do not seek it.",deep:[
  dq("Which behavior is NOT what the philosopher recommends?","Provoking people to prove you do not need approval",["Explaining yourself honestly","Acting on your own principles","Letting go of others' reactions"],"The aim is freedom, not provocation."),
  dq("Why can approval-seeking undermine freedom?","Your choices become answers to an audience",["It makes you too independent","It removes responsibility","It prevents learning"],"You end up living for someone else's expectations.")]},
 a6:{say:"Treat people as equals. Swap praise for encouragement, like saying thank you, and remember you are one member of a community, not the center of the world.",deep:[
  dq("A manager says, Good job, you are so reliable. How would an Adlerian reframe it?","Thank you, that really helped the team",["Keep going, I am watching","You should do more","Well done, you pass"],"Gratitude is horizontal. Grading is vertical."),
  dq("Why do Adlerians avoid scolding as well as praise?","Both rank people from above, which damages equal relationships",["Both are too expensive","Both are forbidden","Both are too emotional"],"Both are judgments from a higher position.")]},
 a7:{say:"Worth comes from feeling useful to others, supported by accepting yourself and having confidence in other people.",deep:[
  dq("What is the difference between self-acceptance and resignation?","Self-acceptance accepts the present and works on what is changeable",["They are the same","Resignation takes action","Self-acceptance means giving up"],"Acceptance still includes change."),
  dq("Why does the book tie confidence in others to contribution?","You can only contribute freely if you believe in people instead of treating them as enemies",["It guarantees repayment","It prevents conflict","It proves you are right"],"Suspicion blocks giving.")]},
 a8:{say:"Life is a series of moments to live fully now, and contribution to others is the guiding star for hard choices.",deep:[
  dq("Someone postpones living until a big goal is reached. How would the philosopher respond?","Each moment is already life, so live earnestly now",["Postponing is wise","Goals are bad","The past decides the future"],"Life is not rehearsal for a later date."),
  dq("What does a guiding star offer when a choice is hard?","A direction that does not depend on others' approval",["A guarantee of success","A way to avoid decisions","A rule against disagreement"],"Contribution gives a compass that is yours.")]}
};

function MK(o){
  var L=[],units=[],items=[],n=0;
  function st(x,tag){
    if(x[0]==='l')return {t:'learn',tag:tag,h:x[1],p:x[2]};
    if(x[0]==='m')return {t:'mcq',q:x[1],c:x[2],w:x[3],why:x[4]};
    if(x[0]==='t')return {t:'tf',q:x[1],a:x[2],why:x[3]};
    return {t:'match',q:x[1],pairs:x[2],why:x[3]};
  }
  o.u.forEach(function(u,ui){
    var ids=[];
    u[2].forEach(function(x){
      n++;var id=o.id+'_'+n;ids.push(id);
      L.push({id:id,icon:x.i||'book',title:x.t,ch:x.c,chs:[n],desc:x.d,
        note:{line:x.n[0],para:x.n[1],detail:x.n[2],say:x.n[3]},
        steps:x.s.map(function(s){return st(s,x.c);}),
        deep:(x.D||[]).map(function(s){return st(s,x.c);})});
      items.push([n,x.c+': '+x.t]);
    });
    units.push({no:ui+1,title:u[0],sub:u[1],lessons:ids});
  });
  var yr=o.y<0?'c. '+(-o.y)+' BC':o.y;
  var w=o.a.replace(/[^A-Za-z' ]/g,'').split(' ').filter(Boolean);
  return {id:o.id,author:o.a,initials:(w[0][0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase(),title:o.t,year:yr,chip:o.a+', '+yr,
    question:o.q,answer:o.ans,lessons:L,
    boss:{id:'boss',icon:'star',title:'Book check',ch:'Whole book',desc:'Eight mixed questions from every lesson. Pass it and you can say you know the book.'},
    units:units,chapters:[{part:null,items:items}],next:[],
    coverage:o.cov||'Lessons follow the order of the book. The real book has the full argument, the examples and the author\'s voice.',
    bossMsg:'You can hold your own in a conversation about '+o.t+'.'};
}

MORE.push(MK({id:"cipolla",t:"The Basic Laws of Human Stupidity",a:"Carlo M. Cipolla",y:1976,
q:"who are the stupid, and why are they the most dangerous people in society?",
ans:"Cipolla, an economic historian, defines stupidity by results: a stupid person causes losses to others while gaining nothing, or even losing, themselves. He sets out five laws, sorts people into four types on a simple graph, and argues that societies decline when the stupid are left unchecked.",
cov:"A short, tongue-in-cheek essay. Four lessons cover the five laws and the four types.",
u:[
["Four types","The graph",[
{i:"blocks",t:"Helpless, intelligent, bandit, stupid",c:"The four types",d:"Cipolla's graph of gains and losses.",
n:["People can be sorted by whether their actions help or hurt themselves and others.",

s:[["l","A simple graph","Carlo Cipolla, an Italian economic historian, wrote this essay half as a joke and half seriously. He sorts every action by two questions: does it benefit or harm the person doing it, and does it benefit or harm others? That gives four quadrants."],
["x","Match each type to its result",[["Intelligent","Gains for self and others"],["Helpless","Loses so others gain"],["Bandit","Gains at others' expense"],["Stupid","Others lose, no gain for self"]],"The four quadrants."],
["l","Defining by results","Cipolla's definition does not depend on IQ, education or manners. Someone is stupid if they cause harm to others without benefiting themselves. A bandit at least follows a logic you can predict; a stupid person does not."],

["Five laws","The essay's laws",[

["First law: everyone underestimates the number of stupid people","People we thought rational turn out stupid","Second law: stupidity is independent of other traits","Same share among workers, academics and elites","Education does not change the proportion"],

s:[["l","More than you think","The first law says we always underestimate how many stupid people are around. People who seemed sensible suddenly act stupidly, and stupid people turn up in unexpected places at unexpected times."],
["m","What does the first law say?","Everyone underestimates the number of stupid people",["Stupid people are rare","Stupidity disappears with education","Only the poor are stupid"],"The number is always higher than expected."],
["l","Spread evenly","The second law says the chance that someone is stupid is independent of any other trait. Cipolla jokes that he tested this among blue-collar workers, white-collar workers, students, professors and Nobel laureates, and found the same share every time."],
["t","According to the second law, highly educated groups have fewer stupid people.",false,"The share is the same in every group."],
["m","Which group does Cipolla say has the same share of stupid people as any other?","Nobel laureates",["Nobody; it varies widely","Only politicians","Only children"],"Stupidity is everywhere at a fixed rate."]],
D:[["m","Why is the second law unsettling?","You cannot avoid stupid people by choosing elite or educated company",["It means everyone is stupid","It proves schools are useless","It applies only to Italy"],"No group is safe."]]},
{i:"x",t:"Laws three, four and five",c:"Laws 3 to 5",d:"The definition, the danger, and why society declines.",
n:["Stupid people cause losses with no gain, the rest of us underestimate them, and they are the most dangerous type of all.",
"Third law, the golden law: a stupid person causes losses to others while deriving no gain and possibly losing too. Fourth law: non-stupid people always underestimate the damaging power of the stupid and forget that dealing with them is always costly. Fifth law: a stupid person is the most dangerous type, more dangerous than a bandit. Cipolla adds that a rising society has enough intelligent people to offset the stupid, while a declining one has more bandits with stupid tendencies and many helpless people, letting the stupid do damage unchecked.",
["Third law: harm to others with no gain to self","Fourth law: we underestimate the damage stupid people do","Associating with stupid people is always a mistake","Fifth law: stupid people are more dangerous than bandits","A bandit only transfers wealth; a stupid person destroys it","Declining societies let the stupid run unchecked"],
"Cipolla's fifth law: a stupid person is more dangerous than a bandit, because a bandit just moves wealth from you to them, while a stupid person destroys it."],
s:[["l","The golden law","Law three is the definition: stupid people cause losses to others without any gain for themselves. Law four warns that intelligent, helpless and bandit types keep forgetting how costly it is to deal with stupid people, and keep trusting or collaborating with them."],
["m","What does the fourth law warn about?","Non-stupid people underestimate the damage stupid people can do",["Stupid people are easy to spot","Bandits are harmless","Intelligent people are rare"],"Their harm is unpredictable."],
["l","More dangerous than a bandit","When a bandit takes 100 from you, society as a whole loses nothing; wealth just moves. A stupid person destroys value outright. That is why Cipolla calls the stupid the most dangerous type. A society declines when the intelligent no longer hold the stupid in check."],
["t","Cipolla says bandits are more dangerous than stupid people.",false,"The fifth law says the opposite."],
["x","Match each law to its claim",[["First","We underestimate their number"],["Second","Independent of other traits"],["Third","Harm others, no gain"],["Fifth","The most dangerous type"]],"The fourth says we underestimate their damage."]],

{i:"chat",t:"Why it works as satire",c:"Reading it",d:"Taking a joke seriously.",
n:["It is a joke with a real point: judge actions by their effects, and protect institutions from people who destroy value.",

["m","How is the essay written?","In a mock-scientific style, with laws and graphs",["As a novel","As a legal code","As a memoir"],"Humor through solemnity."],
["t","The essay's lesson is to judge people mainly by their intentions.",false,"It judges by results."],
