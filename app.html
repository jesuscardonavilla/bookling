"People feel comfortable walking when streets feel like outdoor rooms with walls, a floor and a ceiling. Speck argues that typical American cities lack this: checkerboard development and surface parking lots leave gaps, and few streets have buildings on both sides. He sees a conflict between the public realm and modernist architecture's focus on standalone objects, citing Jan Gehl. Public spaces succeed or fail based on their edges; too much open green space or parking discourages walking. He argues tall buildings are not necessary for enclosure or density and can even hurt downtown development.",
["Walkers need a sense of enclosure","Checkerboard development and surface lots break enclosure","Modernist buildings as objects can erode the public realm","Public spaces succeed or fail by their edges","Too much open space or parking discourages walking","Tall buildings are not needed for density or enclosure","Jan Gehl is cited on life between buildings"],
"Step 7: a street feels comfortable when it feels like a room, with buildings forming its walls.",
[["Outdoor rooms","Streets with continuous building fronts feel secure, while gaps and parking lots feel exposed. Speck says enclosure is more important than height."],
["Edges decide","A plaza or park works when its edges are active and defined. Open space that is too large or surrounded by parking is rarely used. Density and walkability do not require skyscrapers."]],
[M("What do pedestrians need to feel comfortable?","A sense of enclosure",["Wide open space","Tall towers","Fast traffic"],"Streets as rooms."),
M("What do public spaces depend on, according to this step?","Their edges",["Their size","Their fountains","Their statues"],"Edges decide success.")],
T("Speck says walkability requires tall buildings.",false,"It does not.")),
LS("sun","Plant trees","Step 8","Street trees and why traffic engineers resist them.",
"Street trees create enclosure, buffer walkers, cool and clean cities, and cost far less than they return.",
"Street trees create a sense of enclosure, buffer pedestrians from traffic and provide environmental, health, safety and economic benefits. They are correlated with fewer car accidents, yet transportation departments and county engineers often classify trees as fixed hazards to protect drivers. Trees cool streets, capture carbon, reduce air-conditioning demand and absorb rain, helping with combined sewer overflows. Cities say they value trees but rarely commit funds to maintain them. Speck notes how little it takes to earn Tree City USA status and describes the high return on investment. He recommends varying species block by block to guard against disease.",
["Trees create enclosure and buffer pedestrians","They correlate with fewer car accidents","Engineers often treat trees as fixed hazards","Trees cool, capture carbon and absorb rain","They help with combined sewer overflows","Cities rarely fund tree maintenance properly","Tree City USA status takes little","Vary species block by block against disease"],
"Step 8: trees make streets safer, cooler and more comfortable, but engineers often fight them.",
[["Why trees","Trees give shade, enclosure and a buffer between sidewalk and road. They are linked with fewer crashes, even though engineers worry about collisions."],
["Practical benefits","Trees manage stormwater, cool the air and store carbon. Speck urges cities to invest in maintenance and to plant mixed species so one disease does not wipe out a street."]],
[M("Why do many engineers oppose street trees?","They classify them as fixed hazards for drivers",["They are too tall","They cost too much to import","They block signs only"],"Safety for drivers versus pedestrians."),
M("Why vary tree species from block to block?","To guard against disease",["For color","For shade timing","For cost"],"Diversity protects.")],
T("Street trees tend to correlate with more car accidents.",false,"They correlate with fewer.")),
]],
["The interesting walk","Steps 9 and 10",[
LS("eye","Make friendly and unique faces","Step 9","Building edges that entertain walkers.",
"Pedestrians need constant stimulation, so building edges should be active, transparent and varied rather than blank.",
"Pedestrians need both safety and entertainment. Parking lots, windowless storefronts and blank facades do not provide it. Speck recommends hiding surface lots behind one-story buildings and screening parking structures with liner buildings or active ground floors. Building edges should be active, open and transparent, with awnings, deep sills and columns. Facades should be vertical and narrow to suggest shorter walks and variety. He draws on Steve Mouzon's idea of walk appeal: how far people walk depends on what they encounter. He criticizes architects like Frank Gehry for indifference to pedestrians, but says what matters is whether details exist, not whether they are handmade or machine-made. Zoning codes focus on use, bulk and parking and need to require active facades. He also warns that unconventional greening alone will not make people walk for transportation.",
["Pedestrians need stimulation as well as safety","Blank walls, parking lots and windowless storefronts fail","Hide surface lots behind buildings; liner buildings for garages","Active, open and transparent building edges","Awnings, deep sills and columns add interest","Vertical, narrow facades suggest variety","Steve Mouzon's walk appeal","Zoning must require active facades","Open space alone will not make people walk"],
"Step 9: the edge of a building should give walkers something to look at, or they will stop walking.",
[["Entertainment on foot","People walk farther when the route offers things to see. Windows, doors, awnings and narrow shopfronts keep the walk interesting."],
["Codes and parking","Zoning regulates use, bulk and parking but often not the quality of the street edge. Speck suggests liner buildings to hide garages and rules requiring active ground floors."]],
[M("What is walk appeal?","How far people will walk depends on what they find along the way",["A legal term","A fitness rating","A parking measure"],"Interest extends walks."),
M("How should garages be treated?","Screened with liner buildings or active ground floors",["Left blank","Painted green","Moved to sidewalks"],"Hide the blank wall.")],
T("Speck says open green space alone makes people walk for transportation.",false,"It does not.")),
LS("star","Pick your winners","Step 10","Urban triage: where to invest first.",
"No city can be walkable everywhere, so invest in a few walkable cores and corridors first.",
"Because resources are finite, Speck says investment should go where it will have the most impact: places with a comfortable, interesting private realm that can support an improved public realm. Even great walking cities cannot be walkable everywhere, so cities must make a conscious choice about the size and location of their walkable cores to avoid squandering resources in areas that will never invite pedestrians. He proposes an urban triage plan that directs funding to this network and focuses on downtowns and short corridors that link walkable neighborhoods. He admits this may seem inequitable but argues that downtowns come first because they are shared places that shape the city's image and attract investment. Venice is treated as the one nearly universally walkable city, while Boston, Chicago, San Francisco and Portland are cited as places that improved livability.",
["Resources are limited; focus where impact is highest","Choose the size and location of walkable cores deliberately","Urban triage: fund the walkable network first","Prioritize downtowns and short connecting corridors","Admits the approach may seem inequitable","Downtowns are shared places that shape a city's image","Venice as a nearly universally walkable city","Boston, Chicago, San Francisco and Portland as livability improvers"],
"Step 10: you can't fix everything at once, so pick the downtown and the few corridors where walkability will pay off most.",
[["Triage","Speck argues that cities should choose the places where a modest investment would have the biggest effect, usually downtown and nearby corridors, and build outward."],
["Why downtown first","Downtowns belong to everyone and shape how a city is seen. If they succeed, they attract investment and can fund improvements elsewhere, though Speck acknowledges the equity concerns."]],
[M("What is urban triage?","Directing limited funding to the places where walkability will have the most impact",["Closing downtowns","Spreading money evenly","Banning cars"],"Be selective."),
M("Where does Speck say to start?","Downtowns and short corridors linking walkable neighborhoods",["The suburbs","Highways","Rural roads"],"Shared places first.")],
T("Speck says a city can be made equally walkable everywhere at once.",false,"He says to pick your winners.")),
]],
]}));
MORE.push(MK({id:"suntzu",t:"The Art of War",a:"Sun Tzu",y:-500,
q:"how do you win a conflict at the lowest possible cost?",
ans:"Sun Tzu answers that the best victory is won without fighting. Win by preparation, knowledge and position before battle: assess the five factors, know the enemy and yourself, make yourself unbeatable, use deception, avoid the enemy's strength and strike where they are weak, keep your army disciplined and well treated, adapt to the terrain and circumstances, and use spies to gain foreknowledge.",
cov:"Thirteen lessons follow the thirteen chapters in order, each with its main ideas, lists and named categories. Cross-checked against chapter summaries; wording is paraphrased, and translations differ on details.",
u:[
["Planning","Chapters 1 to 3",[
LS("target","Laying plans","Chapter 1","The five factors, the seven comparisons and deception.",
"War is vital to the state, so calculate before fighting: weigh five factors, compare seven conditions, and remember that warfare is based on deception.",
"Sun Tzu opens by saying war is a matter of life and death for the state and must be studied seriously. Victory is estimated by five constant factors: the moral law or Way, meaning shared purpose between ruler and people; Heaven, meaning seasons and conditions; Earth, meaning terrain; the Commander, meaning his wisdom, trustworthiness, humanity, courage and strictness; and Method and discipline, meaning organization and supply. He then lists comparisons between the two sides, such as which ruler has the moral law, which general is abler and which army is better trained. Those who calculate more win more; those who calculate little lose. Finally he states that war is based on deception: appear weak when strong, near when far, and strike when the enemy is unprepared.",
["War is a vital matter of the state: life, death, survival or ruin","Five factors: moral law (the Way), Heaven, Earth, Commander, Method and discipline","Commander's virtues: wisdom, trustworthiness, benevolence, courage, strictness","Compare the two sides on who has the moral law, abler general, better terrain, stricter discipline, stronger and better-trained army, clearer rewards and punishments","More careful calculation wins; little calculation loses","Warfare is based on deception","Feign weakness and disorder; hide your real position and strength","Temples (planning) before battle decide the result"],
"Chapter 1 in one line: calculate the five factors before fighting, and remember that war runs on deception.",
[["The five factors","Sun Tzu weighs five things: the moral law (do people share the ruler's purpose), Heaven (timing and weather), Earth (distance and ground), the Commander (wisdom, trust, humanity, courage, discipline) and Method (organization and supply). Anyone who knows these thoroughly will win; those who do not will lose."],
["Calculate and deceive","He suggests comparing the two sides on those factors to estimate who will win before any battle. Then he adds that all warfare is based on deception: when able, seem unable; when active, seem inactive; when near, seem far; and attack where the enemy is not prepared."]],
[X([["Moral law","Shared purpose of ruler and people"],["Heaven","Seasons, weather, timing"],["Earth","Terrain and distance"],["Method","Organization and discipline"]],"Four of the five factors."),
M("What does Sun Tzu say about the foundation of warfare?","It is based on deception",["It is based on numbers","It is based on honor","It is based on luck"],"Hide and mislead.")],
M("What is the main purpose of the comparisons in Chapter 1?","To estimate who will win before fighting",["To boast","To choose a flag","To train troops"],"Calculation before battle.")),
LS("coin","Waging war","Chapter 2","The cost of war and the value of speed.",
"War is expensive and drains a state, so win quickly, live off the enemy's land and treat captives well.",
"Sun Tzu emphasizes the enormous costs of keeping a large army in the field: thousands of chariots, tens of thousands of soldiers and a heavy burden on supplies. A long campaign dulls weapons, saps morale, exhausts the state and invites rival rulers to attack. Hence he prefers a swift victory over a clever but prolonged war. He recommends feeding the army from the enemy's resources, since one cartload taken from the enemy equals many of your own. Captured soldiers should be treated kindly and used, and captured chariots recruited. Victory, not lengthy operations, is the goal.",
["War is costly in money, materiel and lives","A long war dulls weapons and dampens morale","Prolonged campaigns drain the state and invite rivals","Prefer speed to cleverness that drags on","Forage on the enemy to save supply costs","Reward soldiers who capture enemy goods","Treat captives well and use them","The aim is victory, not a long campaign"],
"Chapter 2 in one line: a long war ruins even the winner, so strike fast, live off the enemy and keep the cost down.",
[["The price of an army","Raising and moving a large army costs a fortune. When campaigns drag on, weapons dull, spirits sag and neighboring rulers see an opportunity. No state, Sun Tzu says, has ever benefited from prolonged warfare."],
["Forage and treat captives","Supplies are the heavy burden, so take them from the enemy: a cartload captured is worth many you carried. Treat captured soldiers well and let them join you, so conquest strengthens the army."]],
[M("Why does Sun Tzu prefer swift victory?","Long wars drain the state and invite rivals",["Speed is glorious","Armies tire of peace","Weapons rust quickly only"],"Cost control."),
M("What should you do with captured enemy soldiers?","Treat them well and use them",["Execute them","Ignore them","Ransom all"],"Convert enemy strength.")],
T("Sun Tzu believes a long, clever campaign is better than a quick victory.",false,"He wants speed.")),
LS("shield","Attack by stratagem","Chapter 3","Winning without fighting and knowing yourself and the enemy.",
"The supreme excellence is to subdue the enemy without fighting; if you know yourself and the enemy, you need not fear a hundred battles.",
"The ideal is to take the enemy intact: capture a state or army whole rather than destroy it. The highest skill is to attack the enemy's plans, next to attack alliances, next to attack the army, and worst to besiege walled cities. Sieges are the last resort because they cost so much. Sun Tzu names five ways to know who will win: whether you know when to fight and when not to, whether you can use both large and small forces, whether ranks share a purpose, whether you are prepared against an unprepared enemy, and whether your general is capable and not interfered with by the ruler. He lists three ways a ruler can hurt an army, such as commanding a retreat or advance in ignorance. The chapter ends with the famous maxim about knowing yourself and the enemy.",
["Supreme art: subdue the enemy without fighting","Best: attack the enemy's strategy, then alliances, then army, last cities","Take states and armies intact if possible","Sieges are the worst option and cost the most","Five keys to victory: know when to fight, handle numbers, unity of purpose, preparation, an unhampered general","A ruler can hurt his army by interfering ignorantly","Know yourself and the enemy and you will not be endangered in a hundred battles","Know only yourself and you win and lose in turn; know neither and you lose every time"],
"Chapter 3 in one line: the best victory beats the enemy's plan, not his army, and knowing yourself and your enemy makes you safe.",
[["The ladder of attack","At the top is attacking the enemy's strategy, then his alliances, then his army. At the bottom, the worst policy, is attacking walled cities, which wastes lives and months. A skilled leader wins without a battle."],
["Know both sides","Victory depends on knowing when to fight, using forces well, shared purpose, being prepared and having a general free from a meddling ruler. Sun Tzu concludes that those who know themselves and the enemy win every battle, those who know only themselves win some and lose some, and those who know neither lose every time."]],
[M("What is the supreme excellence according to Sun Tzu?","Subduing the enemy without fighting",["Winning the biggest battle","Capturing cities","Ravaging land"],"The famous line."),
M("What is the worst policy in this chapter?","Besieging walled cities",["Attacking strategy","Making alliances","Using spies"],"Sieges are costly.")],
T("A leader who knows only himself will win every battle.",false,"He will win some and lose some.")),
]],
["Positioning and momentum","Chapters 4 to 6",[
LS("lock","Tactical dispositions","Chapter 4","Making yourself invincible and waiting for the enemy's opening.",
"Make yourself unbeatable first and then wait for the enemy to become beatable; good fighters win before the battle begins.",
"Sun Tzu says that skilled generals first put themselves beyond defeat, then wait for an opportunity to defeat the enemy. Invincibility depends on you, but victory depends on the enemy. So one may know how to win without being able to do it. Defense implies insufficient strength; attack implies abundance. A skilled defender hides like one under the deepest earth and an attacker moves like lightning from the height of heaven. Real excellence is not winning famous battles that everyone praises but winning easily where victory was obvious in advance. The victorious army wins first and then fights; the defeated fights first and hopes to win. He mentions measurement, estimation, calculation, balancing and victory as a chain of reasoning.",
["First make yourself unconquerable, then wait for the enemy's opening","Invincibility is in your own hands; victory depends on the enemy","Defend when strength is lacking; attack when it is abundant","Hide in defense like under the earth; strike like lightning from above","True excellence is winning easily, with little fame","Win first, then fight","Chain: measurement, estimation, calculation, balance, victory","Preserve the means to control victory through the Way and discipline"],
"Chapter 4 in one line: the winning army wins before it fights, by being unbeatable and waiting for the enemy to slip.",
[["Unbeatable first","The first task is to put yourself beyond defeat. You cannot force the enemy to be beatable, but you can control your own defense. Then you wait for the moment the enemy makes a mistake."],
["Quiet victory","The best generals win in ways nobody notices because the battle was already decided. The loser, by contrast, fights first and looks for victory afterward. Calculation and preparation are what win."]],
[M("Which depends on you according to this chapter?","Making yourself unconquerable",["Making the enemy beatable","The enemy's weather","Foreign alliances"],"Control your own side."),
M("How does a victorious army operate?","It wins first and then fights",["It fights first and looks for victory","It always charges","It never plans"],"Victory is prepared.")],
T("Sun Tzu says famous battles show the greatest skill.",false,"Easy, unnoticed victories do.")),
LS("bolt","Energy","Chapter 5","Momentum and the direct and indirect.",
"Use the direct to engage and the indirect to win, build momentum like a boulder rolling downhill and strike at the right moment.",
"Managing a large force is like managing a small one if you have good organization. To meet the enemy without being defeated, combine the direct and indirect: the normal force that engages and the extraordinary force that surprises. Their combinations are endless, like musical notes, colors and flavors, a cycle without end. Sun Tzu compares momentum to a rushing torrent that rolls stones, and a hawk's strike timed precisely. Good fighters are terrible in their momentum and precise in timing, like the release of a crossbow trigger. Chaos in the ranks can be simulated, while real order remains. The skilled commander seeks the victory in the situation and does not rely only on individuals; he picks the right people and lets momentum do the work.",
["Organization lets you command large forces like small ones","Direct force engages; indirect force wins","The two combine in endless variations like notes, colors and flavors","Momentum like a torrent that rolls boulders","Timing like a hawk's strike or a crossbow release","Appear disordered while remaining in order","Seek victory from the situation, not only from individuals","Choose the right people and let momentum work"],
"Chapter 5 in one line: pin the enemy with the direct, win with the indirect, and let well-timed momentum do the work.",
[["Direct and indirect","Sun Tzu says that in battle the direct and the indirect lead to each other in an endless cycle. The direct engages the enemy; the indirect is the unexpected move that decides the result."],
["Momentum and timing","A boulder rolling down a mountain has overwhelming power because of its position, not effort. Likewise a well-organized army with the right timing is like a drawn crossbow released at the proper instant."]],
[M("What is the role of the indirect force?","To deliver the unexpected, winning blow",["To guard supplies","To retreat","To feed the army"],"Surprise decides."),
M("What does the boulder image illustrate?","Momentum from position and timing",["Heavy armor","Slow marching","Defensive walls"],"Use the situation.")],
T("Sun Tzu says order must be real and disorder can be feigned.",true,"Order is real, chaos is simulated.")),
LS("search","Weak points and strong","Chapter 6","Seizing the initiative and being formless like water.",
"Be first on the field, make the enemy come to you, strike where he is weak, and be as formless as water.",
"Whoever occupies the field first and waits is fresh; whoever arrives later and rushes is weary. A skilled commander imposes his will on the enemy and does not let the enemy impose his on him. Attack where the enemy does not expect it, defend where he does not attack, and appear where he must rush. Make the enemy's position known and yours invisible, so you can concentrate while he is divided. If you know the time and place of battle, you can fight from afar. Sun Tzu likens military formation to water: water avoids high ground and flows to low places, and an army avoids strength and strikes weakness. Water shapes its course to the terrain, and a commander shapes victory to the enemy. Thus there are no constant conditions in war.",
["Arrive first and wait: you are fresh, the enemy is tired","Impose your will; do not let the enemy impose his","Strike where he is unprepared; defend where he is not attacking","Be subtle and formless so he cannot know your plans","Concentrate your forces while the enemy is divided","Know the time and place of battle","Army is like water: avoid the high and rush to the low","No constant conditions in war; adapt to the enemy"],
"Chapter 6 in one line: avoid strength, strike weakness, keep the initiative and flow like water.",
[["Initiative","Being first means you rest while the enemy rushes. Force him to move and keep yourself unreadable, so you can gather while he is split."],
["Like water","Water flows from high places to low. An army should avoid the enemy's strength and attack his weakness, changing its form to fit what the enemy is like. Because conditions keep changing, no strategy is fixed."]],
[M("Why choose the field first and wait?","You are rested while the enemy arrives tired",["It is cheaper","It is more honorable","It is traditional"],"Initiative."),
M("What does water teach about strategy?","Avoid strength, flow into weakness and adapt",["Be fixed","Stay high","Never change"],"Formlessness.")],
T("Sun Tzu advises attacking where the enemy is strongest.",false,"He advises striking weakness.")),
]],
["Movement and judgment","Chapters 7 to 9",[
LS("route","Maneuvering","Chapter 7","The difficulty of gaining an advantage and the rules of movement.",
"Turn the indirect into the direct, move with unity, and avoid enemy strengths like fresh troops at dawn.",
"Maneuvering to gain a position is the hardest part: turning a roundabout route into a direct one and turning misfortune into advantage. Do not move without knowing the neighbors' plans, the terrain and using local guides. Sun Tzu gives the memorable image of an army that is swift as the wind, steady as a forest, aggressive like fire and immovable like a mountain. Use gongs, drums, banners and flags so the army moves as one. Morning spirit is keen, midday it flags and evening it turns homeward, so strike when the enemy's spirit is low. Do not pursue a feigned retreat, do not attack soldiers in high spirits, do not obstruct an army returning home and leave an outlet for the surrounded enemy so he does not fight desperately.",
["Hardest part: turn the roundabout into the direct","Know the terrain and use local guides","Swift as wind, steady as a forest, fierce as fire, immovable as a mountain","Signals: gongs, drums, flags to unite the army","Enemy morale peaks in the morning and fades by evening","Do not attack an enemy in high spirits","Do not chase feigned retreats","Leave a surrounded enemy a way out"],
"Chapter 7 in one line: move as one body, choose your moment when the enemy's spirit is down, and never press a desperate enemy.",
[["The hard part","Positioning is difficult because the shortest path is not always the best. The skillful make the enemy's path long while making their own short. They also know the land by using guides."],
["Moral and discipline","A unified army moves as one using banners and drums, swift or steady as the situation needs. Attack when the enemy's energy is low and avoid pursuing apparent retreats or cornering an enemy so he fights to the death."]],
[M("When is enemy morale lowest, according to the chapter?","In the evening",["At dawn","At noon","During a storm"],"Spirit declines through the day."),
M("What should you leave a surrounded enemy?","An outlet",["Nothing","A gift","A hostage"],"Desperate troops fight hard.")],
T("Sun Tzu advises always chasing a retreating enemy.",false,"Do not pursue a feigned retreat.")),
LS("shuffle","Variation in tactics","Chapter 8","Adaptability and the general's five faults.",
"Adapt to circumstances, weigh gain against loss, and avoid the five dangerous faults of a general.",
"There are roads not to take, armies not to attack, cities not to besiege and orders from the ruler not to obey when conditions demand otherwise. A general who understands these variations knows how to use his troops. The wise weigh advantages with disadvantages: in advantage consider the danger, in danger consider the advantage. Rely not on the enemy not coming, but on being ready to receive him. Five dangerous faults can ruin a general: recklessness, which leads to destruction; cowardice, which leads to capture; a hasty temper, which can be provoked by insult; a delicacy of honor sensitive to shame; and over-solicitude for his men, which exposes him to worry. These are the ruin of armies.",
["Some roads, armies, cities and orders should be skipped","Adapt your plan to the situation","Weigh advantage together with danger and danger with advantage","Rely on your readiness, not on the enemy's absence","Fault 1: recklessness leads to destruction","Fault 2: cowardice leads to capture","Fault 3: hasty temper can be provoked","Fault 4: sensitive honor can be shamed into error","Fault 5: over-solicitude makes him anxious"],
"Chapter 8 in one line: stay flexible, think of gain and danger together, and avoid the five faults that ruin a general.",
[["Be flexible","A general who knows the variations does not follow a rule blindly. He sees both the gain and the risk in each situation and keeps his own readiness."],
["The five faults","Recklessness, cowardice, a hasty temper, over-sensitive honor and too much worry about his men can all be exploited by the enemy. Knowing them is part of the general's self-knowledge."]],
[M("Which is one of the general's five faults?","A hasty temper",["Patience","Planning","Frugality"],"It can be provoked."),
M("What should a general weigh together?","Advantage and danger",["Honor and glory","Cost and fame","Speed and silence"],"Both sides of every choice.")],
T("A general should always obey every order, regardless of the situation.",false,"Some orders may be disregarded.")),
LS("eye","The army on the march","Chapter 9","Camping, reading signs and handling troops.",
"Choose ground carefully, read signs of enemy intentions, and combine care for the troops with firm discipline.",
"The chapter gives rules for positioning in four types of ground: mountains, rivers, salt marshes and plains. Stay on high ground, camp facing the sun and never fight uphill. After crossing a river, move away from it. Sun Tzu lists signs to read the enemy: birds rising suggest an ambush, dust rising shows approach, humble words and increased preparations mean attack, and violent language and advances mean retreat. Soldiers who are quiet can be trusted, while whispering and complaints show trouble. A commander should unite his troops through civility and control them with discipline. Treat soldiers as dear children and they follow into deep valleys, but do not coddle them, since indulged troops are useless.",
["Four types of ground: mountains, rivers, marshes, plains","Occupy high ground; do not fight uphill","Move away from a river after crossing","Birds rising from cover can indicate an ambush","Rising dust shows the enemy's approach","Humble words and growing preparations signal attack; bold words and advance may mean retreat","Unite troops by humane treatment and control them by discipline","Treat soldiers like children and they follow; do not spoil them"],
"Chapter 9 in one line: read the ground and the signs, and win your soldiers with care backed by firm discipline.",
[["Ground and signs","Choose high, sunny, well-supplied ground and avoid fighting uphill. Birds suddenly rising, dust and changes in the enemy's tone all tell you what he plans."],
["Leading soldiers","Care for soldiers as your own children and they will follow into danger. But combine kindness with rules, since spoiled troops are like spoiled children and are useless."]],
[M("What does a sudden flight of birds indicate?","An ambush",["Rain","Peace talks","The enemy has left"],"Small signs reveal movements."),
M("How should soldiers be led?","With humane care and firm discipline",["Only with fear","Only with kindness","With rewards only"],"Balance.")],
T("Sun Tzu recommends fighting uphill to gain surprise.",false,"Avoid fighting uphill.")),
]],
["The ground and the knowing","Chapters 10 to 13",[
LS("blocks","Terrain","Chapter 10","Six kinds of ground and six calamities.",
"Know six types of terrain and six calamities that come from the army's own flaws, not from nature.",
"Sun Tzu lists six kinds of ground: accessible, entangling, temporizing, narrow passes, precipitous heights and positions at great distance, with specific advice for each, such as occupying high sunny positions first. He then lists six calamities that arise not from earth or sky but from the general's fault: flight, from sending one force against ten times its size; insubordination, when soldiers are strong and officers weak; collapse, when officers are strong and soldiers weak; ruin, when angry officers fight on their own; disorganization, when the general is weak and orders unclear; and rout, when an inferior force faces a superior one without picked troops. A general who advances without seeking fame and retreats without fearing disgrace, whose only thought is to protect his people, is a jewel of the state. Know the enemy, know yourself and know the ground, and victory will be complete.",
["Six terrains: accessible, entangling, temporizing, narrow, precipitous, distant","Occupy high sunny ground first on accessible and narrow terrain","Six calamities: flight, insubordination, collapse, ruin, disorganization, rout","These come from the army's flaws, not from nature","A general who seeks neither fame nor avoids disgrace is a treasure","Care for soldiers like infants and they follow","Know the enemy, yourself and the ground for complete victory"],
"Chapter 10 in one line: classify the ground, and remember most defeats are caused by your own army's flaws, not by nature.",
[["Six grounds","Accessible, entangling, temporizing, narrow, precipitous and distant ground each need a different approach. Taking high, sunny positions first matters on several."],
["Six calamities","Flight, insubordination, collapse, ruin, disorganization and rout are failures of leadership, training or judgment. A general who protects his people and does not chase glory is a treasure."]],
[M("What causes the six calamities?","The army's own faults",["Bad weather","Bad terrain","Fate"],"Leadership failures."),
M("Which is a terrain type listed in the chapter?","Narrow passes",["Deserts","Oceans","Cities"],"One of six.")],
T("Sun Tzu says the six calamities come from nature rather than the commander.",false,"They come from the army's flaws.")),
LS("compass","The nine situations","Chapter 11","Nine kinds of ground and the psychology of troops.",
"The nine situations show how soldiers' psychology changes with position; troops fight hardest when there is no way out.",
"Sun Tzu names nine grounds: dispersive, where a commander fights on his own territory; facile, shallow in enemy land; contentious, valuable to both sides; open; intersecting, where roads meet; serious, deep in enemy territory; difficult, with rough ground; hemmed-in, with narrow ways in and out; and desperate, where only fighting without delay will save the army. Soldiers on dispersive ground may scatter; on serious ground they are united. Troops with no escape will stand firm. Place them in a position from which they cannot flee and they will fight to the death, and he compares a well-handled army to the shuai-jan snake, which when struck on the head is attacked by its tail. Speed is the essence of war: take advantage of the enemy's unreadiness. Be calm and secret, change your plans so no one knows what you intend, and keep the army ignorant of the full plan.",
["Nine grounds: dispersive, facile, contentious, open, intersecting, serious, difficult, hemmed-in, desperate","Dispersive ground: troops near home may scatter","Serious ground: deep in enemy land, soldiers unite","Desperate ground: fight at once, there is no escape","Troops with no escape fight to the death","Shuai-jan snake: head, tail and middle support each other","Speed is the essence of war","Be secret and change plans so no one knows your intent"],
"Chapter 11 in one line: where soldiers can't retreat they fight with all they have, and in war speed and secrecy matter most.",
[["Nine grounds","Each situation, from home ground to desperate ground, has a different effect on soldiers and calls for different action. Deep in enemy land, soldiers stick together. When all is lost, the only option is to fight."],
["Cohesion and speed","A good army acts like the shuai-jan snake: strike the head and the tail comes, strike the tail and the head comes. Speed and secrecy keep the enemy off balance."]],
[M("What is desperate ground?","A place where the army will perish unless it fights at once",["A safe home base","An open plain","A high mountain"],"Only fight offers survival."),
M("What does the shuai-jan snake represent?","An army whose parts support each other",["A slow march","A spy network","A river crossing"],"Mutual support.")],
T("Sun Tzu says soldiers fight hardest when they have an easy escape.",false,"They fight hardest with none.")),
LS("flame","The attack by fire","Chapter 12","Five ways to use fire and the restraint of the ruler.",
"Fire attacks can burn troops, stores, baggage trains, arsenals and convoys, but never fight from anger.",
"Sun Tzu lists five targets for fire: soldiers in their camp, supplies, baggage trains, arsenals and the lines of transport. Fire needs proper means and the right season, such as dry weather and windy days when the moon is in certain constellations. When fire breaks out inside the enemy camp, respond with an attack from outside; if the enemy remains calm, wait. Combine fire with water but know that water only isolates, while fire destroys. The chapter ends with a warning about restraint: a ruler should not mobilize in anger and a general should not fight out of resentment, because an angry man may later be happy and a destroyed state cannot be restored. Move only if it benefits the state, use troops only if there is an advantage and fight only if the situation is critical.",
["Five targets: soldiers, stores, baggage trains, arsenals, convoys","Fire needs the right means and the right weather","Coordinate fire with attacks from outside","Water can isolate but fire destroys","A ruler should not go to war out of anger","A general should not fight from resentment","An angry man may become happy; a destroyed state cannot return","Act only when it benefits the state"],
"Chapter 12 in one line: fire is a powerful weapon, but never go to war out of anger, because anger fades and ruined states stay ruined.",
[["Five fires","Burn the enemy's soldiers, stores, baggage, arsenals and lines of supply. Fire works best with proper preparation and weather and should be combined with other action."],
["Restraint","An enlightened ruler is cautious and a good general disciplined. Anger passes; a destroyed state and dead soldiers cannot be brought back, so move only for real advantage."]],
[M("Which is NOT one of the five fire targets?","A treaty",["Stores","Arsenals","Soldiers"],"Fire is military."),
M("Why should a ruler not go to war in anger?","Anger passes but destruction is permanent",["Anger is rude","War is cheap","Soldiers dislike it"],"Restraint.")],
T("Sun Tzu encourages leaders to wage war out of resentment.",false,"He warns against it.")),
LS("eye","The use of spies","Chapter 13","Foreknowledge and five kinds of spies.",
"Foreknowledge cannot come from spirits or analogy but from people; use five types of spies and reward them generously.",
"Mobilizing a large army is expensive, and spending years to win a single day of victory while refusing to pay for intelligence is the height of inhumanity. Foreknowledge cannot be obtained from spirits, from experience or from calculations; it must come from men who know the enemy's situation. Sun Tzu lists five types of spies: local spies drawn from the district, inward spies who are officials of the enemy, converted spies who are enemy spies turned, doomed spies who are fed false information, and surviving spies who return with reports. They should be rewarded generously and the work kept secret; none is more intimate than the spy-master. The chapter ends by saying that wise rulers who use the cleverest people as spies achieve great results, because on intelligence the whole army depends.",
["Foreknowledge comes from people, not spirits or omens","Refusing to pay for intelligence is inhumane","Five spies: local, inward, converted, doomed, surviving","Local: people living in the district","Inward: enemy officials","Converted: enemy spies turned to your side","Doomed: spread false information","Surviving: return with reports","Reward spies generously and keep matters secret","The army depends on intelligence for every move"],
"Chapter 13 in one line: pay for good intelligence, because knowing the enemy's situation is what makes everything else possible.",
[["Why spy","A war can cost a fortune for years to win one day, so grudging spies' pay is foolish. Knowing the enemy cannot come from guesses or omens but from people who have been there."],
["Five kinds","Local spies live in the area, inward spies are enemy officials, converted spies are enemy agents you turn, doomed spies carry false information and surviving spies return with news. Converted spies are the most valuable because they inform about all the others."]],
[X([["Local spy","Lives in the enemy's district"],["Inward spy","An enemy official"],["Converted spy","Enemy agent turned"],["Doomed spy","Carries false information"]],"Four of the five."),
M("What source of foreknowledge does Sun Tzu reject?","Spirits and omens",["Spies","Scouts","Informers"],"It must come from men.")],
T("Sun Tzu considers paying for spies a waste of money.",false,"Refusing to pay is the worse folly.")),
]],
]}));
MORE.push(MK({id:"tanizaki",t:"In Praise of Shadows",a:"Jun'ichiro Tanizaki",y:1933,
q:"what is lost when a culture floods everything with bright light?",
ans:"Tanizaki argues that traditional Japanese beauty lives in shadow: dim rooms, lacquer glowing by candlelight, paper screens, patina and age. The West chases brightness and polish, and modern Japan imported it, losing a sensibility that found beauty in darkness and subtlety.",
cov:"This is a short essay with no chapters. Four lessons follow its order of topics.",
u:[
["Shadow","The whole essay",[
{i:"building",t:"A house against modern light",c:"Opening",d:"Building a traditional house with modern fixtures.",
n:["Modern conveniences clash with a traditional house, and Tanizaki resents the compromise.",
"Tanizaki opens with a practical problem: anyone building a traditional Japanese house struggles to fit in electric lights, heaters, wiring and plumbing without ruining it. He describes the traditional toilet, set apart and dim, as a place for quiet contemplation, and regrets gleaming white tiles. He wonders how Japan would look if it had developed its own technology to suit its own taste.",
["Wires, lamps, heaters and plumbing disturb a traditional house","He hides fixtures, but each choice is a compromise","The old toilet: dim, quiet, near nature, a place to think","Gleaming white tile ruins its calm","If the East had invented its own science, its tools would suit its taste"],
"Tanizaki starts with plumbing: he could not fit electric lights and a white tiled bathroom into a Japanese house without ruining its spirit."],
s:[["l","Fitting the fixtures","Tanizaki writes as a man trying to build a house in the Japanese style. Electric wires, lamps, gas heaters and a modern bath all jar with paper doors and wood. He hides wires and searches for lamps that do not glare, but every solution is a compromise between comfort and beauty."],
["m","What problem opens the essay?","Fitting modern fixtures into a traditional house",["Finding a wife","Writing a novel","Traveling to Europe"],"The essay grows from a practical frustration."],
["l","The quiet toilet","He praises the old Japanese toilet, set apart from the house, dim and clean, where you can listen to rain or insects. Sparkling white tile and bright light destroy that mood. He imagines that if Japan had developed its own science, its pens, radios and lights would have matched its own taste."],
["t","Tanizaki praises bright white tiles as perfect for a Japanese bathroom.",false,"He feels they destroy its calm."],
["m","What does Tanizaki imagine about technology?","That an Eastern-born technology would have suited Eastern taste",["That technology should be banned","That the West invented everything well","That Japan should not use electricity"],"Tools carry the culture that made them."]],
D:[["m","Why is the essay's opening about plumbing significant?","It shows how cultural values live in ordinary objects and spaces",["It is a joke with no point","It is a technical manual","It praises Western engineering"],"Taste lives in everyday things."]]},
{i:"eye",t:"Lacquer, paper and patina",c:"Middle",d:"Objects that need dimness and age.",
n:["Japanese objects were made to be seen in dim light, and their beauty grows with age and handling.",
"Tanizaki says Westerners love things that shine and are newly polished, while Japanese taste prefers a soft sheen and the patina of use. Lacquerware looks garish in electric light but glows in candlelight, its gold catching the flame. Paper absorbs light softly. Even food, like miso soup or yokan sweets in a dark lacquer bowl, is meant to be seen in shadow.",
["The West prefers shine and newness; Japan prefers soft sheen and patina","Lacquer was made for candlelight and darkness","In bright light lacquer looks cheap; in dim light it glows","Paper softly takes in light rather than reflecting it","Yokan and miso soup are beautiful in a dark bowl"],
"Tanizaki says Japanese lacquerware was made to be seen by candlelight: in an electric room it looks gaudy, in shadow it glows."],
s:[["l","The glow of use","Tanizaki notes that Westerners polish silver until it gleams, while Japanese people value the dull luster that comes with age and many hands. That dimmed, slightly grimy sheen is something to love, not clean away."],
["m","What surface quality does Tanizaki prefer?","A soft, aged sheen from long use",["Bright, polished shine","Perfectly matte plastic","Glossy new paint"],"Patina carries time and care."],
["l","Lacquer in candlelight","Lacquer looks crude under electric light. But in the flicker of a candle, the dark surfaces and gold designs come alive, as if the darkness itself were part of the object. Paper screens take light in gently, like soft snow. Even yokan, a bean jelly, seems to hold darkness inside it."],
["t","Tanizaki says lacquer was designed to be admired in bright electric light.",false,"It was meant for candlelight."],
["x","Match the object to Tanizaki's point",[["Lacquerware","Glows in candlelight"],["Shoji paper","Absorbs light softly"],["Old silver","Valued for its dull patina"],["Yokan","Seems to hold darkness inside"]],"Each object depends on shadow."]],
D:[["m","Why does Tanizaki value patina over polish?","It records time and use, giving objects depth and warmth",["It is cheaper","It hides bad craftsmanship","It is required by religion"],"Beauty includes history."]]},
{i:"sun",t:"The beauty of shadow in rooms",c:"Middle",d:"Deep eaves, the empty alcove and dim interiors.",
n:["A Japanese room's beauty is in the gradations of shadow, not in its objects.",
"Large roofs and deep eaves keep Japanese rooms dim. Tanizaki argues the beauty of a room depends on the variations in shadow. The tokonoma, the alcove for a scroll and flowers, is beautiful because of the darkness pooled in its corners. A gold screen in a dark room reflects the faint light from the garden. Beauty is not in a thing but in patterns of light and dark.",
["Large roofs and deep eaves create dim interiors","Beauty lies in degrees of shadow","The tokonoma alcove is a pool of quiet darkness","Gold leaf and gold thread were made to catch dim light","Beauty is in the play of light and dark, not the object itself"],
"For Tanizaki, a Japanese room is beautiful not because of what is in it but because of how shadow gathers in it."],
s:[["l","Roofs and eaves","Western buildings push up toward the sky; Japanese houses spread a great roof like a parasol and live in its shade. Light comes in indirectly, filtered through paper. Tanizaki says the beauty of a Japanese room depends entirely on the shading."],
["m","Where does Tanizaki locate the beauty of a Japanese room?","In the variations of shadow",["In its furniture","In bright decoration","In its size"],"Shadow is the material."],
["l","The alcove","The tokonoma holds a scroll and a flower arrangement, but what makes it moving is the quiet darkness in its corners. Gold screens and gold threads in robes were designed to catch the last faint light deep in a dim room. He concludes beauty is not in the thing but in the pattern of shadows."],
["t","Tanizaki says beauty is found mainly in objects themselves, not in light and shadow.",false,"He says it is in the play of shadows."],
["m","Why was gold used in dim interiors?","To catch and reflect faint light from outside",["To show wealth to guests","To keep rooms warm","Because it was cheap"],"Gold makes darkness glow."]],
D:[["m","How does the Japanese roof differ from Western building, in his telling?","It shelters like a parasol and creates shade rather than reaching for light",["It is always made of glass","It is taller and narrower","It has no eaves"],"Architecture shapes taste."]]},
{i:"x",t:"Lament for a lost darkness",c:"Ending",d:"Theater, bodies, and what modern Japan gave up.",
n:["Modern Japan flooded itself with light and lost a subtle world; Tanizaki wants to turn off a few lamps, at least in literature.",
"Tanizaki extends the theme to Noh and Bunraku theater, to costume and to the human body as presented in old Japan, including ideas of pale skin and makeup that modern readers find dated and race-tinged. He mocks the over-lit modern world: hotels, streets and homes blazing with electric light. He closes saying he would like to restore, at least in literature, the shadowy world we are losing.",

["m","Which art forms does Tanizaki say preserve the aesthetic of shadow?","Noh and Bunraku theater",["Western opera","Modern cinema","Kabuki only"],"Dim stages keep the old mood."],
["l","Too much light","He describes modern hotels and streets ablaze with electricity, complaining that the excess wastes energy and destroys mood. Knowing the past cannot return, he ends with a modest wish: to call back, in literature at least, the world of shadows Japan is losing."],
["t","Tanizaki believes Japan can easily return to its traditional way of life.",false,"He accepts the change and wants to keep the sensibility alive in writing."],
["m","How does the essay end?","With a wish to restore the world of shadows, at least in literature",["With a plan to ban electricity","With praise for modern hotels","With a call for war"],"A personal, modest protest."]],

MORE.push(MK({id:"thaler",t:"Nudge",a:"Richard H. Thaler",y:2008,
q:"how can we help people make better choices without taking away their freedom?",
ans:"Thaler and Sunstein argue that every choice is presented in some way, so someone is always a choice architect. Because people are Humans, not perfectly rational Econs, small design details like defaults, framing and feedback change decisions. They propose libertarian paternalism: steer people toward choices that make their lives better by their own standards while keeping every option open. They apply it to saving, borrowing, insurance, organ donation, the environment and more.",
cov:"Fifteen lessons follow the book's five parts: Humans and Econs, the tools of the choice architect, money, society and the objections. Cross-checked against chapter summaries of the book; the 2008 and 2021 editions differ in some chapters.",
u:[
["Humans and Econs","Part 1",[
LS("user","What a nudge is","Introduction","Choice architecture, Econs and Humans, libertarian paternalism.",
"A nudge is any feature of how choices are presented that predictably changes behavior without banning options or changing incentives; someone is always designing the choice.",
"The authors define a nudge as any aspect of choice architecture that alters people's behavior in a predictable way without forbidding any options or significantly changing economic incentives. Their opening image is a school cafeteria manager who must arrange the food in some order, and whatever she chooses will influence what children eat: there is no neutral design. Economists assume people are Econs, perfectly rational and self-controlled, but real people are Humans who are influenced by context. From this they develop libertarian paternalism: it is libertarian because people remain free to choose, and paternalist because designers may steer people toward choices that improve their own lives, as judged by the chooser's own standards.",
["Nudge: a feature of the choice environment that predictably alters behavior","It does not forbid options or significantly change economic incentives","Choice architect: whoever designs the way options are presented","There is no neutral design, so someone always nudges","Econs: the perfectly rational people of economic theory","Humans: real people who are influenced by context and bias","Libertarian paternalism: steer people while preserving freedom to opt out","Aim: help people by their own standards"],
"A nudge is how a choice is arranged: the cafeteria has to put the food somewhere, and where it goes changes what children pick.",
[["Cafeteria architecture","Imagine the manager of a school cafeteria. She has to put the food in some order and she can choose to put healthier items at eye level or sweets first. Either way she is nudging, because no arrangement is neutral. The authors use this to argue that choice architecture is unavoidable."],
["Econs and Humans","Standard economics describes Econs, who compute perfectly, never lack willpower and respond only to incentives. Real people are Humans: they are swayed by defaults, framing and what others are doing. Libertarian paternalism uses that fact to steer people toward better choices while leaving them free to refuse."]],
[M("What is a nudge?","A feature of how choices are presented that predictably changes behavior without banning options",["A legal ban","A tax","A financial penalty"],"Options stay open."),
X([["Econs","Perfectly rational agents"],["Humans","Real, bias-prone people"],["Choice architect","Designer of how choices are presented"],["Libertarian paternalism","Steer people while keeping freedom"]],"Core vocabulary.")],
M("Why does the cafeteria example matter?","Any arrangement influences choices, so there is no neutral design",["Cafeterias are special","Children choose randomly","Food has no effect"],"Someone must design.")),
LS("scale","Biases and blunders","Chapter 1","Anchoring, availability, optimism, loss aversion and framing.",
"Humans rely on rules of thumb that cause predictable errors, which is exactly why they can be nudged.",
"The book summarizes Kahneman and Tversky's work. Anchoring: people base estimates on a number they already have, so donations were higher when options ranged from 100 to 5,000 dollars than from 50 to 150. Availability: floodplain residents are less likely to buy flood insurance when no flood has happened lately, and earthquake insurance sales spike after a quake then decline. Overconfidence: only 5 percent of MBA students expected to land below the class median. Loss aversion and inertia lead to sticking with the status quo, as with automatic renewals. Framing: a surgery described as 90 percent survival feels different from 10 deaths per 100. A case study: painted stripes on Chicago's Lake Shore Drive bunch up near a dangerous curve to create a feeling of speeding up, so drivers slow down.",
["Anchoring: estimates start from a number already in mind","Donation study: options of 100 to 5,000 dollars led to larger gifts than 50 to 150","Availability: flood insurance falls when floods are not recent","Earthquake insurance spikes after a quake, then fades","Only 5 percent of MBA students expected below-median results","Loss aversion and inertia produce sticking with the status quo","Defaults are powerful nudges, as in automatic renewals","Framing: 90 percent survival versus 10 deaths per 100","Lake Shore Drive stripes slow drivers by creating an illusion of speed"],
"Because Humans use shortcuts, how options are presented changes what they choose, and the Lake Shore Drive stripes show a nudge in action.",
[["Rules of thumb","People start from numbers they are given (anchoring), judge risks by recent examples (availability) and are overconfident about themselves: in one study only 5 percent of MBA students expected to finish below the median. These rules of thumb are useful but produce systematic errors."],
["Status quo and framing","Loss aversion makes us stick with what we have and defaults powerful. Framing changes reactions: 90 percent survival sounds better than 10 deaths per 100. On Lake Shore Drive, stripes painted ever closer together on a dangerous curve make drivers feel they are speeding, so they ease off."]],
[M("What did painted stripes on Lake Shore Drive do?","Created a feeling of speeding up so drivers slowed down",["Blocked a lane","Raised fines","Added cameras"],"A visual nudge."),
M("What happens to flood insurance purchases when no flood has happened recently?","They fall",["They rise","They are unchanged","They become mandatory"],"Availability bias.")],
T("Only a small share of MBA students expected to finish below the class median.",true,"Overconfidence.")),
LS("lock","Resisting temptation","Chapter 2","Automatic and reflective systems, mindless choosing and mental accounting.",
"People often act on autopilot and treat money as sorted into mental accounts, so self-control needs design help.",
"The authors describe two systems: an automatic one that is instinctive and fast, and a reflective one that is deliberate and slow. Temptation wins in hot states, and Ulysses tying himself to the mast is the classic strategy of precommitment. Mindless choosing: in a popcorn study, people given a large bucket of stale popcorn ate about 53 percent more than those with a medium bucket, though they did not enjoy it. Mental accounting means households sort money into separate categories, so a gambler treats winnings as separate from the money he brought, and windfalls are spent more impulsively than saved money.",
["Automatic system: fast and instinctive; reflective system: slow and deliberate","Hot and cold states: temptation wins when aroused","Precommitment: tying yourself to the mast like Ulysses","Mindless choosing: large buckets of stale popcorn led to about 53 percent more eaten","Mental accounting: money divided into separate categories","Gamblers separate winnings from their own money","Windfalls are spent more impulsively than saved money","Design can help self-control"],
"The popcorn lesson: give people a bigger container and they eat more, even when the popcorn is stale and they do not like it.",
[["Hot and cold","We make plans in a calm state and then lose to temptation in a hot one. Ulysses ordered his crew to tie him to the mast so he could hear the sirens safely. Good design lets us precommit."],
["Mindless eating and mental accounts","People who received a large bucket of stale popcorn ate about 53 percent more than those who got a medium one. And people treat money as sorted into mental accounts: windfalls and gambling winnings feel like play money and get spent more freely."]],
[M("What happened in the stale popcorn study?","People with big buckets ate more",["They ate less","They refused","They shared"],"Mindless choosing."),
M("What is mental accounting?","Sorting money into separate categories",["Counting in your head","A type of budget software","Tax accounting"],"Money is not fungible in our minds.")],
T("The authors say windfalls are usually saved more carefully than earned money.",false,"They are spent more impulsively.")),
LS("users","Following the herd","Chapter 3","Information and peer pressure as nudges.",
"Social influence works through information and peer pressure, and telling people what others do can backfire or help.",
"There are two kinds of social influence: information, where others' behavior signals what is good, and peer pressure, where people conform to avoid disapproval. Examples: teenage pregnancy and obesity spread through social ties; people eat about 35 percent more with one other person, about 75 percent more in a group of four and about 96 percent more in groups of seven or more. In an energy-saving experiment, households shown their use against the neighborhood average cut back if above, but those below increased use, the boomerang effect; adding a frown or smile emoticon eliminated it. Related: asking people if they intend to vote raises turnout, and prompting students to plan when they would get a tetanus shot raised attendance.",
["Information effect: others' choices tell us what is wise","Peer pressure: conforming to avoid disapproval","Social ties spread behaviors like obesity and teenage pregnancy","People eat about 35 percent more with one companion, 75 percent with three, 96 percent with six or more","Energy study: above-average users cut back, below-average users increased","Boomerang effect eliminated by adding a smile or frown emoticon","Asking about voting intentions raises turnout","Planning when to get a tetanus shot increased attendance"],
"The boomerang effect: telling people the average can make below-average users use more, until a smile or frown shows what is good.",
[["Two channels","We learn from what others do and we conform to avoid their disapproval. Obesity and teen pregnancy spread through social networks, and dinner companions affect how much we eat: about 35 percent more with one other person and 96 percent more in big groups."],
["Boomerang","Households told how their use compared with neighbors' averages cut back if above but used more if below. A frowning or smiling emoticon fixed it: high users cut more and low users stayed put. A related prompt: asking someone whether they intend to vote makes them more likely to."]],
[M("What was the boomerang effect?","Below-average energy users increased consumption",["Everyone cut back","Prices fell","High users ignored the report"],"The average became a target."),
M("How did emoticons help?","They signaled approval or disapproval and prevented the boomerang",["They taught math","They gave discounts","They hid data"],"Social meaning.")],
T("Group size has no effect on how much people eat.",false,"People eat more in bigger groups.")),
]],
["The tools of the choice architect","Part 2",[
LS("target","When do we need a nudge?","Chapter 4","The golden rule and the conditions that call for nudging.",
"Nudge most where choices are hard, rare and without quick feedback, and follow the golden rule: little chance of harm, great chance of help.",
"The authors state a golden rule of libertarian paternalism: a nudge should be as unlikely as possible to cause harm and very likely to help. Nudges matter most when choices have costs now and benefits later, as with exercise, diets and saving; when decisions are difficult and infrequent, like picking a mortgage; when feedback is poor, so people never learn from mistakes; and when it is hard to translate options into experience, as with comparing complex products. In such situations people need help because they cannot learn by repeated trial.",
["Golden rule: the nudge should rarely harm and likely help","Benefits later, costs now: exercise, diet and saving","Difficult and rare decisions, like mortgages","Poor feedback prevents learning","Hard to map options to experience","Nudge where people lack practice and information","Do not nudge where people choose well already"],
"The golden rule: only nudge where it is very likely to help and as unlikely as possible to hurt.",
[["Golden rule","A good nudge carries almost no risk of harm and a high chance of help. The authors emphasize humility about the choice architect's own power and fallibility."],
["When people need help","Choices with delayed benefits, rare decisions, poor feedback and complex options are where Humans make the most mistakes. A mortgage is chosen rarely and its terms are hard to compare, so design matters."]],
[M("What does the golden rule say?","A nudge should be unlikely to cause harm and very likely to help",["Nudge as often as possible","Never nudge","Nudge only the poor"],"Low risk, high benefit."),
M("Which choice calls most for a nudge?","A rare, complex decision with delayed benefits",["Choosing lunch","Choosing a seat","Choosing a color"],"Little learning by practice.")],
T("The authors say nudges should be used where people already choose well with frequent feedback.",false,"They matter most where feedback is poor.")),
LS("blocks","Choice architecture","Chapter 5","The six tools, often remembered as NUDGES.",
"Good choice architecture uses incentives, mapping, defaults, feedback, expecting error and structuring complex choices.",
"The authors list tools of the choice architect, summarized by the acronym NUDGES. iNcentives: make sure incentives are salient and the choosers feel the costs. Understand mappings: translate options into the experience of living with them, like translating a megabyte into photos. Defaults: the option people get if they do nothing is powerful, because of inertia. Give feedback: tell people when they do well or badly. Expect error: design for mistakes, like a gas cap tethered to the car. Structure complex choices: simplify when there are many options, and use filters and categories. Thaler's classroom story about exam scores illustrates how a seemingly small design change can shape results.",
["iNcentives: make costs and benefits visible","Understand mappings: connect options to real experience","Defaults: what happens if you do nothing","Give feedback: show how people are doing","Expect error: design systems that tolerate mistakes","Structure complex choices: simplify, filter and categorize","Tethered gas caps are an example of expecting error","Defaults are rarely neutral"],
"NUDGES: incentives, understanding mappings, defaults, feedback, expect error, structure complex choices.",
[["The NUDGES toolkit","Incentives work best when salient; mappings help people compare; defaults harness inertia; feedback tells people how they are doing. The tools are meant to be combined."],
["Expect error and simplify","Humans make errors, so good design makes them less costly, like gas caps that cannot be left behind. With many options, structure them with categories, filters and recommendations so choosers are not overwhelmed."]],
[X([["Defaults","What happens if you do nothing"],["Feedback","Tells people how they are doing"],["Mapping","Translating options into experience"],["Expect error","Design that tolerates mistakes"]],"Four tools of the six."),
M("Why are defaults so powerful?","Inertia makes many people stick with them",["They are cheaper","They are mandatory","They are the best choice"],"Doing nothing is easy.")],
T("Choice architects should assume people never make mistakes.",false,"They should expect error.")),
]],
["Money","Part 3",[
LS("coin","Save More Tomorrow","Retirement saving","Using automatic enrollment and escalation to beat inertia.",
"Automatic enrollment and Save More Tomorrow, which raises savings from future raises, harness inertia and loss aversion for retirement saving.",
"Retirement saving is a modern problem, since people rarely lived long enough to need long retirements. Defined benefit pensions pay workers at retirement, while defined contribution plans like the 401(k) specify what goes in. Over two thirds in one study said they were saving too little. The authors identify three problems: enrolling, raising contributions and improving investments. Making enrollment the default reduces the number who never sign up. Save More Tomorrow, designed by Thaler and Benartzi, has people agree in advance to raise their contribution rate as they get raises, so take-home pay never falls and it is not felt as a loss. Target-date funds, which adjust to a retirement date, offer a default investment. About half of workers have no employer plan, which the authors see as a problem since payroll deduction works best.",
["Defined benefit pensions versus defined contribution plans","401(k) arrived in 1980","Over two thirds said they saved too little","Automatic enrollment reduces non-participation","Save More Tomorrow: commit now to saving more from future raises","Designed by Richard Thaler and Shlomo Benartzi","Takes advantage of inertia and avoids loss aversion","Target-date funds as default investments","About half of US workers have no employer plan"],
"Save More Tomorrow: promise to save part of your future raises, so you never feel a pay cut.",
[["Fixing enrollment","Many people intend to save but never sign up. Making the plan the default and enrolling employees automatically fixes this. Savings should be set so people can opt out but few do."],
["Save More Tomorrow","Participants agree in advance to increase their savings rate whenever they get a raise. Because take-home pay still rises, it does not feel like a loss, and inertia keeps them in. Target-date funds provide a sensible default for the investments."]],
[M("What is Save More Tomorrow?","A plan to raise savings gradually from future pay raises",["A savings tax","A government bond","A loan scheme"],"Precommitment."),
M("What does automatic enrollment do?","Reduces the number who never join the plan",["Forces investment","Bans opting out","Raises fees"],"Defaults.")],
T("Save More Tomorrow cuts take-home pay immediately.",false,"It uses future raises so pay does not fall.")),
LS("flag","Sweden","Do nudges last?","A case where choices overwhelmed defaults.",
"Sweden's privatized pensions show the pitfalls of too many choices and discouraged defaults, and that inertia keeps people where they land.",
"Sweden let people choose from a huge menu of funds with a default option, but actively discouraged use of the default and advertised heavily. About two thirds became active choosers, while the others delegators accepted the default. Funds that advertised more attracted choosers, who ended up with lower expected returns and higher risk than the default. Once advertising stopped and the novelty faded, people stayed where they were; few delegators became active choosers and few choosers went back. Even a major fund manager scandal produced little response. The authors conclude that the system discouraged the default too much and offered too many options, and that a nudged object keeps moving until nudged again.",
["Sweden offered a big fund menu plus a default it discouraged","About two thirds became active choosers","Advertising proved a stronger nudge than the default","Chosen funds had lower expected return and higher risk","Few people switched after the first choice: inertia","A fund manager scandal got little reaction","Too many choices and a weak default were the mistakes","Five default designs: only option, discouraged, encouraged, automatic, or required choice"],
"Sweden: when the default was discouraged and the menu huge, advertising steered many into worse funds, and most never revisited.",
[["What Sweden did","Citizens could pick among many funds or take a default, which the government urged them to avoid. About two thirds chose for themselves, often following funds' advertising."],
["What went wrong","Choosers tended to pick riskier funds with lower expected returns than the default. Later, people mostly stayed put. The authors say the lesson is to offer a good default and a manageable menu."]],
[M("What did Sweden's design get wrong?","Discouraged the default and offered too many options",["Banned choice","Set fees too low","Used no defaults"],"Choice overload and inertia."),
M("What did most Swedish participants do after their first choice?","Stayed put",["Switched yearly","Left the system","Sold everything"],"Inertia.")],
T("The Swedish active choosers got better returns than those who took the default.",false,"They did worse.")),
LS("wallet","Borrow more today","Mortgages and credit cards","How easy borrowing tests self-control.",
"Mortgages and credit cards are complicated and tempting, so smart disclosure, simplified options and automatic good habits help.",
"The authors see living within one's means as more basic than saving for retirement. Easy credit makes it harder: American credit card debt exceeds a trillion dollars and some homeowners are underwater. Mortgage buyers face adjustable rates, hidden fees and agents paid only if a deal closes. Economist Susan Woodward found that African American, Latino and less educated borrowers pay more on average. Proposed fixes include an EZ Mortgage with simplified options and smart disclosure, and a Mortgage File storing all loan details in a standardized, updatable database. The 2009 CARD Act improved disclosure. Advice: pay off the highest-interest card first and automate payments to avoid late fees.",
["Credit card debt of over 1 trillion dollars in the US","Underwater mortgages: owing more than the house is worth","Adjustable rates and hidden fees are traps","Agents often paid only when a sale closes","Susan Woodward: some groups pay more for loans","EZ Mortgage and smart disclosure proposals","Mortgage File: structured, updated loan data","2009 CARD Act improved disclosure","Pay off the highest-interest card first; automate payments"],
"Borrowing: complexity and temptation hurt Humans, so simpler, standardized disclosure and automatic good habits help.",
[["Complex and tempting","Mortgage terms are hard to compare, agents can have conflicts of interest and credit cards encourage spending. Studies find some borrowers pay more than others for the same loans."],
["Smart fixes","The authors propose standardized, machine-readable disclosure so shoppers can compare easily, a simple default mortgage and a record of loan terms. For individuals: target the highest interest first and automate payments."]],
[M("What is smart disclosure?","Standardized, comparable information about terms",["A lie detector","A hidden fee","A legal secret"],"Helps comparison."),
M("Which card should you pay off first?","The one with the highest interest rate",["The oldest","The smallest","The newest"],"Reduce the costliest debt.")],
T("The authors say living within your means is less basic than saving for retirement.",false,"They say it is more basic.")),
LS("shield","Insurance","Insurance choices","Insure rare big losses and prefer high deductibles.",
"Insure against rare catastrophic losses, not small everyday risks; choose big deductibles and avoid extended warranties.",
"The principle is to insure against losses that would be ruinous, not small ones, and the wealthier you are the less you need. The authors' rule of thumb is to choose the highest deductible available, and they note people resist this because of deductible aversion. Extended warranties for small items are usually bad deals; self-insure small risks. In studies of employee health plans, many people chose plans that were dominated, meaning another option was better on every measure, and the poor choices tended to have low deductibles. Across several firms, those choosing high deductible plans saved over 500 dollars a year on average. Behavioral hazards: some patients skip essential medicines to save money, which raises the risk of death.",
["Insure big, rare, ruinous losses","Wealthy people need less insurance","Choose the largest deductible available","Deductible aversion leads people astray","Skip extended warranties; self-insure small risks","Dominated health plans were often chosen","High deductible plans saved over 500 dollars per year on average","Patients skipping medicines to save money is a hazard","Mental accounting and HSA proposals"],
"Insurance: cover the catastrophes, self-insure the small stuff, and pick the highest deductible you can afford.",
[["What to insure","Insurance is for losses you could not absorb. Small risks, like a broken toaster, should be self-insured. Extended warranties are often poor value."],
["Deductible aversion","People dislike high deductibles and choose plans that cost more overall. In studies across employers, people choosing high-deductible plans saved over 500 dollars a year on average. The authors worry about patients cutting needed medicine to save money."]],
[M("What does the authors' rule of thumb for deductibles say?","Choose the largest available",["Choose the smallest","Avoid insurance","Choose the middle"],"Self-insure small risks."),
M("What kinds of losses should you insure?","Rare ruinous ones",["Small repairs","Everyday costs","Phone screens"],"Catastrophic risks.")],
T("The authors recommend extended warranties for small items.",false,"They advise against them.")),
]],
["Society","Part 4",[
