n:["Cities have always been built around ideas of the good life, and over time the idea drifted from shared civic life to private wealth and safety.",
"Montgomery traces the link between happiness and urban design through history. In ancient Athens, the agora was the place where citizens met, and the Greek idea of eudaimonia, flourishing, was tied to civic life. Rome had its public squares too. Over the centuries the goal shifted toward personal glory, security and material wealth. Yet research keeps finding that social trust and connection matter more to happiness than income.",
["Athens: the agora as the center of civic life","Eudaimonia: a flourishing life, tied to public participation","Rome and Enlightenment cities also expressed ideas of the good life","The goal drifted to personal glory, security and wealth","Social trust and connection matter more than income","Aristotle, Socrates and later Freud appear as thinkers on the good life"],
"The city has always been a happiness project: the agora and eudaimonia were about a good shared life, while our modern cities drifted toward private wealth and safety."],
s:[["l","The agora and eudaimonia","In ancient Athens, the agora was the public heart of the city, where people met, traded and argued. Greek thinkers like Socrates and Aristotle tied a good life, eudaimonia, to taking part in civic life. Rome and later European cities also built public spaces around ideas of how people should live."],
["m","What was the agora?","The public gathering place at the heart of Athens",["A Roman road","A military camp","A royal palace"],"It stood for shared civic life."],
["l","The drift","Over time, Montgomery says, the idea of a good life moved from civic participation toward personal glory, then security, then material wealth. Our modern city reflects those later priorities: private homes, private cars and walls against strangers. Yet happiness research keeps pointing back to trust and connection."],
["x","Match each term to its meaning",[["Agora","Public meeting place of Athens"],["Eudaimonia","Flourishing, a good life"],["Civic life","Taking part in shared city life"],["Drift","From shared life to private wealth and safety"]],"The old ideal versus the modern one."],
["t","Montgomery argues social trust and connection matter more to happiness than income does.",true,"This is the thread of the book."]],
D:[["m","What does the historical chapter suggest about modern cities?","They embody choices about what a good life is, and those choices can change",["They are natural and unchangeable","They were always about cars","They copy ancient Rome exactly"],"Design reflects values."]]},
{i:"user",t:"The (Broken) Social Scene",c:"Chapter 3",d:"The dispersed city and what it does to time, money and relationships.",
n:["The dispersed city spreads homes, work and shops apart, which means long commutes, high costs and thinner relationships.",
"Montgomery calls the sprawling city the dispersed city. In places like Stockton, California, hit hard by the foreclosure crisis, and in the exurbs where people like Randy Strausser make extreme commutes, he finds the costs: time, money and friendship. Studies he cites say a person with a one-hour commute needs about 40 percent more income to be as satisfied as someone who walks to work, and Swedish research linked commutes over 45 minutes to a 40 percent higher chance of divorce.",
["Dispersed city: homes, shops and work separated","Stockton, California, and the foreclosure crisis; Cesar Dias","Randy Strausser, an extreme long-distance exurban commuter","A one-hour commute needs about 40 percent more income to match a walker's life satisfaction (Stutzer and Frey)","Swedish study: commutes over 45 minutes linked to 40 percent higher divorce risk","Peak-hour commuters showed stress worse than fighter pilots or riot police","The poorest fifth of US families spend over 40 percent of income on cars","Social networks shrink and distrust among neighbors grows"],
"The commuting math: a one-hour commute needs about 40 percent more pay to be as satisfied as someone who walks to work."],
s:[["l","The dispersed city","Postwar development separated homes, shops, schools and jobs, forcing people to drive for everything. Montgomery visits Stockton, California, where foreclosures emptied neighborhoods, and meets Randy Strausser, who endures a punishing long-distance commute so his family can have the house they wanted."],
["m","What is the dispersed city?","A city where homes, shops and jobs are spread far apart",["A city built around one tower","A city with no cars","A city of villages"],"Separation forces driving."],
["l","The numbers","Economists Bruno Frey and Alois Stutzer found that a person with a one-hour commute needs about 40 percent more income to be as satisfied with life as someone who walks to work. A Swedish study linked commutes over 45 minutes to a 40 percent higher chance of divorce. Researchers who fitted commuters with electrode caps found rush-hour travelers more stressed than fighter pilots or riot police."],
["m","How much extra income does a one-hour commuter need to match a walker's satisfaction?","About 40 percent more",["About 5 percent more","About double","No extra"],"Stutzer and Frey's finding."],
["t","The poorest fifth of American families spend over 40 percent of income on cars.",true,"Car dependence is a heavy cost for the poor."],
["x","Match each study or place to its point",[["Stutzer and Frey","Long commutes need 40 percent more pay"],["Swedish study","Over 45 minutes: more divorce"],["Electrode study","Commuters stressed like fighter pilots"],["Stockton","Foreclosure crisis in a sprawling city"]],"Chapter 3's evidence."]],
D:[["m","Why does Montgomery call a long commute a social cost, not just a private inconvenience?","It cuts into relationships and community life, with effects like higher divorce risk",["It raises taxes","It only affects drivers' pay","It is always chosen freely"],"Distance takes more than time."]]}]],
["How we got here","Chapters 4 and 5",[
{i:"route",t:"How we got here",c:"Chapter 4",d:"Policy, zoning, speed and the car.",
n:["The dispersed city was built by reformers, zoning and policy aiming at separation and speed, not by accident.",
"Modern cities were shaped by policy, incentives and regulation, not natural growth. Reformers reacting to filthy, crowded slums, like those exposed in Andrew Mearns's report on London, proposed two cures: separation and speed. Garden cities and Le Corbusier's Radiant City imagined people living apart from work. Zoning laws made separation legal, and General Motors' Futurama exhibit at the 1939 World's Fair sold a future of highways. Once built around cars, cities forced more car use.",
["Cities were shaped by policy, incentives and regulation","Andrew Mearns exposed London's slums","Reform idea one: separation, through zoning and garden cities","Reform idea two: speed, through cars and highways","Le Corbusier's Radiant City: towers in parks","GM's Futurama at the 1939 World's Fair sold a car future","Car-centered planning reinforced itself"],
"Sprawl was designed: reformers fled slum conditions by separating functions and speeding up movement, and zoning plus highways locked it in."],
s:[["l","Reaction to the slum","Industrial slums, such as those exposed in a famous report on London by Andrew Mearns, were crowded, filthy and deadly. Reformers wanted to escape them. Garden cities offered small, green, separate towns. Le Corbusier imagined towers set in parks. The common idea was to pull homes away from workplaces."],
["m","What problem did early reformers react against?","Crowded, unhealthy industrial slums",["Too many parks","Low population","Too much green space"],"Their concerns were real."],
["l","Separation and speed","Two ideas took hold: separation, written into zoning laws, and speed, delivered by cars and highways. At the 1939 World's Fair, General Motors' Futurama showed visitors a future of vast highways. Once cities were rebuilt around cars, driving became necessary, which justified more road building."],
["t","The book presents sprawl as the natural result of free consumer choice.",false,"It shows policy, zoning and incentives shaped it."],
["m","What was GM's Futurama?","A 1939 World's Fair exhibit selling a future of highways",["A zoning law","A garden city","A slum report"],"It promoted car-based planning."],
["x","Match each idea to its source",[["Garden cities","Separation of homes and work"],["Radiant City","Le Corbusier's towers in parks"],["Zoning","Legal separation of uses"],["Futurama","Selling the highway future"]],"Chapter 4 in four items."]],
D:[["m","Why does Montgomery stress that sprawl was built by policy?","Because what was designed can be redesigned",["To blame individuals","To argue against all zoning","To praise highways"],"Change is possible."]]},
{i:"eye",t:"Getting it wrong",c:"Chapter 5",d:"We misjudge what will make us happy.",
n:["We are bad at predicting what will make us happy: we overvalue space and things and undervalue time and community.",
"People repeatedly choose badly. Expectations rise as we acquire more, so gains fade, and long commutes keep hurting. Montgomery cites Daniel Kahneman's work and the Harvard dormitory study, where students overestimated how much their housing would matter and underestimated community. Mark Twain, Gary Becker and the author's own purchase of a Vancouver fixer-upper illustrate the pull of bigger homes, while wide roads invite speeding and sedentary suburban life brings hidden risks.",
["People misjudge what will make them happy","Expectations rise with each acquisition","Long commutes keep eroding satisfaction","Harvard dormitory study: students overvalued the architecture and undervalued community","Daniel Kahneman and the idea that attention distorts judgments","California versus the Midwest: people assume the weather matters more than it does","Wide roads encourage speeding","Sedentary suburban life has hidden health costs"],
"Montgomery's repeated point: we trade away the things that make us happy, like time and friends, for things we wrongly expect to, like space and status."],
s:[["l","Bad forecasts","Behavioral research shows we are poor at predicting our own happiness. We expect a bigger house or a nicer car to lift us, but we adapt quickly and keep wanting more. Meanwhile we underestimate the pain of a long commute, which does not fade with time."],
["m","Why do gains from bigger houses and new things fade?","Expectations rise as we acquire more",["Houses lose value","Neighbors move away","Taxes increase"],"Adaptation."],
["l","The Harvard dormitories","In a study of Harvard students assigned to dormitories, students overestimated how much the quality of their housing would affect their happiness and underestimated how much community would. Montgomery admits he made the same kind of error when buying a fixer-upper in Vancouver."],
["t","In the Harvard dormitory study, students correctly predicted the importance of architecture.",false,"They overvalued architecture and undervalued community."],
["m","What does the book say about wide roads?","They encourage speeding",["They reduce crashes","They calm traffic","They make walking pleasant"],"Design sets speed."]],
D:[["m","Why does getting it wrong matter for city design?","Individual choices based on bad forecasts add up to places that make many people less happy",["People always choose correctly","Experts must decide everything","Preferences never change"],"Collective mistakes are built into the landscape."]]}]],
["Closeness","Chapters 6 and 7",[
{i:"heart",t:"How to be closer",c:"Chapter 6",d:"Density, privacy and nature.",
n:["Cities need density with privacy and nature, because we want both connection and retreat.",
"Montgomery explores how cities can bring people closer without crowding them. We need connection and also time alone. Greenery supports wellbeing, social cohesion and lower crime. People prefer open, savanna-like views, but richer, more complex natural environments offer greater benefits, an idea tied to biophilia. A New York City study tested how different landscapes affected mood and stress. Residential towers, he notes, can leave people less trusting than almost any other kind of neighborhood.",
["We want both connection and privacy","Greenery supports wellbeing, social cohesion and lower crime","Biophilia: a human affinity for nature","People prefer open, savanna-like landscapes","More complex ecosystems provide greater benefits","A New York City study measured how landscapes changed mood and stress","Residential towers can be among the least trusting places to live","Vancouver's mixed-use neighborhoods offered a middle path"],
"Density alone is not the goal. People report the least trust in residential towers, even less than in the far exurbs, so closeness needs design."],
s:[["l","Closer, but not crowded","Humans need both company and solitude. Montgomery shows that crowding stresses us while isolation harms us. Good design offers choice: private homes, shared spaces and ways to meet gradually, often with trees and greenery nearby."],
["m","What does greenery contribute, according to the chapter?","Wellbeing, social cohesion and lower crime",["Higher rents only","More traffic","Fewer neighbors"],"Nature has social effects too."],
["l","Towers and trust","Not all density works. Montgomery cites research showing the lowest levels of trust in residential towers, even lower than in the exurban edge. Vancouver's mid-rise, mixed-use neighborhoods show an alternative, where people live close together with shops, parks and street life at their feet."],
["t","The book says residential towers produce the highest levels of neighborly trust.",false,"They can produce among the lowest."],
["x","Match each idea to its meaning",[["Biophilia","Our affinity for nature"],["Savanna preference","Liking open, park-like views"],["Tower trust problem","Low trust in residential towers"],["Mixed-use","Homes, shops and parks together"]],"Chapter 6 in four terms."]],
D:[["m","What is the practical lesson of the towers finding?","How density is designed matters, not only how much of it there is",["Density is always bad","Towers should be taller","Suburbs are better"],"Closeness needs shared life."]]},
{i:"chat",t:"Convivialities",c:"Chapter 7",d:"Streets that make strangers into neighbors.",
n:["Lively, human-scale streets build trust; sterile ones isolate. Reclaiming streets for people is cheap and effective.",
"Drawing on Richard Sennett and the Danish architect Jan Gehl, Montgomery shows that sociable cities are designed for lingering. He studies Italian towns like Siena's Piazza del Campo, post-war Copenhagen, Melbourne and New York. In the East Houston Street experiment with psychologist Colin Ellard, walkers wearing skin-sensors reported being less happy outside the long glass frontage of a supermarket than on the livelier block next door. Bogota's Ciclovia and New York's Summer Streets show how cheaply streets can be given back to people.",
["Jan Gehl studies life between buildings","Richard Sennett on public life","Siena's Piazza del Campo as a model of sociable space","Copenhagen, Melbourne and New York adopt people-first streets","Ellard and Montgomery's East Houston Street experiment with skin conductance sensors","Participants were less happy outside a long, blank, glass supermarket front","Varied, active frontages slow people down and make them more social","Melbourne rules require shop fronts to be mostly doors or display windows","Ciclovia and Summer Streets: temporary car-free streets"],
"Montgomery's experiment: people felt markedly worse outside a blank glass supermarket front than a block away on a lively, varied street. Active edges make cities kinder."],
s:[["l","Streets for lingering","Jan Gehl found that places with small, varied frontages, doors and windows keep people there longer and make them more social. Uniform, blank facades make people hurry past. Montgomery visits Siena's Piazza del Campo and post-war Copenhagen to see public space that works."],
["m","Whose work on life between buildings does Montgomery draw on in this chapter?","Jan Gehl",["Robert Moses","Le Corbusier","Ebenezer Howard"],"The Danish architect studied how people use streets."],
["l","The East Houston Street experiment","With cognitive psychologist Colin Ellard, Montgomery led a walking tour on Manhattan's East Houston Street. Participants wore skin-conductance sensors and rated their happiness at each stop. They reported feeling markedly less happy outside a Whole Foods with a block-long smoked-glass front than on the livelier block to the east, and calmer when protected from traffic."],
["m","What did the East Houston Street experiment find?","People felt less happy outside the blank glass front than on the livelier block",["People preferred the blank facade","Nothing differed","People were happiest near traffic"],"Complexity and activity matter."],
["l","Giving streets back","Bogota's Ciclovia closes streets to cars on Sundays for walkers and cyclists, and New York's Summer Streets does something similar. These cost little, Montgomery notes, and show that cities can be changed quickly. Melbourne requires street-level frontages to be mostly doors or display windows."],
["x","Match each program or place to its idea",[["Ciclovia","Sunday car-free streets in Bogota"],["Summer Streets","New York's car-free streets"],["Piazza del Campo","Siena's famous public square"],["Melbourne rule","Shop fronts mostly doors or windows"]],"Chapter 7 examples."]],
D:[["m","Why do varied facades make streets more social?","They slow walkers down and give them things to look at and stop for",["They are cheaper to build","They block sound","They raise rents"],"Pace shapes social life."]]}]],
["Moving","Chapters 8 and 9",[
{i:"route",t:"Mobilicities I",c:"Chapter 8",d:"How we move shapes how we feel.",
n:["Driving brings stress and entrapment, while walking and cycling bring happiness and health.",
"Montgomery says how we move changes how we feel. Driving in sprawl is stressful and traps people in cars, while those who propel themselves report greater happiness and health. Atlanta shows how sprawl discourages walking and cycling, while cyclists like Robert Tudge, who rides even in frigid weather, show what people gain. Poor transit pushes people into cars.",
["Mobilities: the ways people move shape their feelings","Driving brings stress, entrapment and sedentary risk","Walking and cycling bring happiness and health","Self-propelled commuters report greater happiness","Atlanta as a sprawl example that discourages active travel","Robert Tudge, a year-round cyclist","Poor transit pushes people into cars"],
"The way you travel changes your mood: self-propelled commuters, those who walk or cycle, report more happiness than drivers."],
s:[["l","Trapped in the car","Montgomery argues commuting by car is one of the most stressful parts of the day, since you are trapped, can't control traffic and are physically inactive. Atlanta's sprawl makes the car almost required, and punishes anyone who tries to walk or bike."],
["m","Which city does the chapter use as an example of sprawl discouraging active travel?","Atlanta",["Copenhagen","Bogota","Paris"],"Sprawl makes cars necessary."],
["l","The self-propelled","Commuters who walk or cycle report greater happiness and health. Robert Tudge, who cycles to work even in frigid weather, is among Montgomery's examples. Cities that offer safe, pleasant ways to move under your own power give people this gain."],
["t","Self-propelled commuters report lower happiness than drivers.",false,"They report greater happiness."],
["m","Who is the winter cyclist Montgomery meets?","Robert Tudge",["Randy Strausser","Cesar Dias","Enrique Penalosa"],"He rides in cold weather."]],
D:[["m","Why does poor transit matter for happiness in this chapter?","It pushes people into stressful, sedentary car travel",["It makes cities greener","It reduces commutes","It raises trust"],"Choices matter."]]},
{i:"bolt",t:"Mobilicities II",c:"Chapter 9",d:"Freedom through varied, shared, flexible mobility.",
n:["Freedom is having many ways to move, not owning a car. Real-time information and frequent service make transit work.",
"Montgomery argues freedom comes from varied, shared and flexible mobility. Real-time arrival information reduces perceived waits, and frequent service, around every fifteen minutes, matters. Paris offers Velib' bikes and Autolib' cars with real-time signage, Houten in the Netherlands and Copenhagen build around bikes, London and Stockholm use congestion pricing, New York reassigns street space, and car sharing like car2go adds flexibility. Mid-century visions from Norman Bel Geddes and Buckminster Fuller, and economist Eric Britton, offer context.",
["Freedom comes from variety, sharing and flexibility","Real-time information reduces the felt length of waits","Service about every 15 minutes is a practical threshold","Paris: Velib' bikes, Autolib' cars, real-time signage","Houten (Netherlands) and Copenhagen: bicycle cities","London and Stockholm: congestion pricing","New York reallocates street space","Car sharing such as car2go","Infrastructure must be safe for children and seniors"],
"Real freedom of movement is having many good options, like bikes, trains, car sharing and walking, not owning one car."],
s:[["l","Real-time and frequent","Montgomery notes that knowing when the bus arrives makes the wait feel shorter, and that frequent service, around every 15 minutes, makes transit useful without schedules. Paris signs show real-time arrivals, and its Velib' bikes and Autolib' cars add flexibility."],
["m","What helps reduce the perceived length of waits for transit?","Real-time arrival information",["Longer routes","Fewer vehicles","Higher fares"],"Uncertainty makes waits feel longer."],
["l","Pricing and sharing","London and Stockholm charge drivers to enter central areas, congestion pricing. New York has reassigned street space to people. Houten in the Netherlands and Copenhagen show whole cities built around cycling. Montgomery says infrastructure must be safe enough for children and seniors, not only brave adults."],
["x","Match each city to its example",[["Paris","Velib' and Autolib'"],["Houten","Bicycle-first Dutch town"],["Stockholm","Congestion pricing"],["New York","Street space reallocated to people"]],"Chapter 9's examples."],
["t","The chapter says freedom of movement comes mainly from owning a car.",false,"It comes from having varied, shared, flexible options."]],
D:[["m","Why does Montgomery insist infrastructure serve children and seniors?","A city is only truly mobile if the least confident travelers can also move safely",["They pay more taxes","They own more cars","It saves money"],"A test of design."]]}]],
["Fairness and connection","Chapters 10 and 11",[
{i:"scale",t:"Who is the city for?",c:"Chapter 10",d:"The right to the city and equity.",
n:["A happy city has to be fair: the right to the city means sharing transit, safety and green space, and guarding against displacement.",
"Montgomery asks who the city is for. The right to the city requires redistributing power, not just reviving old designs. Equity means fair access to transit, safety and green space. Bogota, once marked by deep socioeconomic divides, shows an approach under mayors Antanas Mockus and Enrique Penalosa, whose TransMilenio bus rapid transit gave fast service to the poor majority. But improvements can trigger gentrification that pushes poorer residents out.",
["The right to the city: all residents should shape and share it","Equity: fair access to transit, safety and green space","Redistributing power, not only restoring old designs","Bogota's history of deep inequality","Mayors Antanas Mockus and Enrique Penalosa","TransMilenio bus rapid transit served the majority","Improvements can lead to gentrification and displacement"],
"A city that makes only some people happy is not a happy city. Good changes still need protection against pushing poorer residents out."],
s:[["l","The right to the city","Montgomery argues cities must serve everyone, not only those who own cars or can afford nice neighborhoods. In Bogota, mayors Antanas Mockus and Enrique Penalosa built a bus rapid transit system, TransMilenio, to give ordinary people fast, dignified travel."],
["m","What is TransMilenio?","Bogota's bus rapid transit system",["A subway in Paris","A bike-share program","A highway"],"Fast transit for the majority."],
["l","The gentrification risk","Making a place better can raise prices and displace those who lived there. Montgomery stresses that fairness means planning to keep housing and access affordable, so that happier streets do not become exclusive ones."],
["t","Montgomery warns that improvements can cause gentrification.",true,"Equity requires care."],
["m","What does equity mean in this chapter?","Fair access to transit, safety and green space",["Identical homes for everyone","Equal salaries","Banning cars"],"Fairness of access, not sameness."]],
D:[["m","Why is returning to older designs not enough, according to the chapter?","Equity requires changing who has power over the city, not only its appearance",["Old designs are too expensive","Old designs were perfect","Power is irrelevant"],"Design plus fairness."]]},
{i:"x",t:"Everything is connected to everything else",c:"Chapter 11",d:"Hedonistic sustainability and the cost of sprawl.",
n:["The happy city, the green city and the low-carbon city are the same place.",
"Montgomery argues sustainability does not have to mean sacrifice. Hedonistic sustainability, an idea from the architects Bjarke Ingels Group, says eco-friendly design can improve life, as in Copenhagen's waste-to-energy power plant topped with a ski slope. Cities hold about half of humanity but use roughly three quarters of energy and emit most greenhouse gases, and the dispersed city is the most wasteful form. Sprawl also strains municipal budgets, while dense, mixed-use development brings resilience. Portland's urban growth boundary and Asheville, North Carolina, show alternatives.",
["Hedonistic sustainability: green design that improves quality of life","Copenhagen waste-to-energy plant with a ski slope (Bjarke Ingels Group)","The happy city, green city and low-carbon city are the same place","Cities use a large share of energy and produce most emissions","The dispersed city is the most wasteful pattern","Sprawl strains municipal budgets","Dense, mixed-use development brings economic and environmental resilience","Portland urban growth boundary; Asheville"],
"Montgomery's linking idea: what makes a city happier, like walking, closeness and fewer cars, also makes it greener and cheaper to run."],
s:[["l","Ski slope on a power plant","In Copenhagen, the architects Bjarke Ingels Group designed a waste-to-energy plant with a ski slope on its roof. Montgomery uses it to illustrate hedonistic sustainability: environmental design that people enjoy, not something they endure."],
["m","What is hedonistic sustainability?","Eco-friendly design that also improves quality of life",["Spending as much as possible","Banning pleasure","Moving to the suburbs"],"Green and joyful together."],
["l","Sprawl costs everyone","Cities hold about half of humanity yet use around three quarters of energy and produce about 80 percent of greenhouse gas emissions, and dispersed cities are the most wasteful. Sprawl also strains municipal budgets, since long roads and pipes serve few people, while dense mixed-use areas are cheaper and more resilient."],
["t","Montgomery says the happy city and the low-carbon city are largely the same place.",true,"The book's central linkage."],
["m","Which city's urban growth boundary does Montgomery discuss?","Portland, Oregon",["Atlanta","Stockton","Vancouver"],"A tool to limit sprawl."]],
D:[["m","Why does Montgomery want sustainability to promise more happiness?","People are more likely to choose changes that improve their lives than ones that only demand sacrifice",["Happiness is cheaper","Governments forbid sacrifice","Nobody cares about the climate"],"The sustainable city has to be attractive."]]}]],
["Fixing it","Chapters 12 and 13",[
{i:"blocks",t:"Retrofitting sprawl",c:"Chapter 12",d:"Urban surgery on the suburbs.",
n:["Sprawl can be repaired by adding mixed uses and centers, but outdated zoning and financial incentives block it.",
"Montgomery argues suburbs need urban surgery: adding shops, homes, offices and public spaces to places that have only houses. Examples include Lakewood, where a failed mall became a walkable town center, Seaside in Florida, and Smyrna's Market Village, along with residents like Robin Meyer in Mableton pushing for a community center and advocates like Galina Tachieva. The Congress for the New Urbanism backs sprawl repair. Old zoning codes and financial incentives are the main obstacles, and form must not overshadow function.",
["Urban surgery: adding mixed uses to sprawl","A dead mall transformed into a walkable town center (Lakewood)","Seaside, Florida, and Smyrna's Market Village as examples","Robin Meyer in Mableton, Georgia, pushing for a community center","Galina Tachieva advocates sprawl repair","Congress for the New Urbanism","Zoning codes and financial incentives block retrofits","Form must not overshadow function"],
"To fix sprawl, add the missing pieces: shops, homes and public places in the right mix, and rewrite the zoning codes that forbid them."],
s:[["l","Adding what is missing","Suburbs built for cars lack centers. Retrofitting adds shops, apartments, offices, parks and connected streets so people can walk to things. Montgomery cites Lakewood, where a failed mall was reborn as a walkable town center, and Smyrna's Market Village."],
["m","What is a retrofit of sprawl?","Adding mixed uses and public places to car-built suburbs",["Demolishing the suburbs","Building more highways","Banning shops"],"Surgery, not demolition."],
["l","Obstacles","The main barriers are old zoning codes that outlaw mixed use and financial rules that favor conventional development. Montgomery also warns that fancy design alone cannot fix places if they do not work for daily life: form must not overshadow function."],
["t","Montgomery says zoning codes and financial incentives are obstacles to retrofitting.",true,"They need to change."],
["x","Match each person or group to its role",[["Robin Meyer","Mableton resident pushing for a center"],["Galina Tachieva","Advocate of sprawl repair"],["Congress for the New Urbanism","Group promoting walkable planning"],["Lakewood","Dead mall turned town center"]],"Chapter 12's cast."]],
D:[["m","Why does Montgomery caution that form must not overshadow function?","A beautiful place that does not support daily life will not make people happier",["Beauty is irrelevant","Function is illegal","Form costs more"],"Design must work."]]},
{i:"star",t:"Save your city, save yourself",c:"Chapter 13",d:"Citizens, anger and experiments.",
n:["Ordinary residents can reshape their cities, turning anger into action and reclaiming shared space.",
"The closing chapter calls on residents, whom Montgomery names citadins, to act. He tells of a boy and his mother who challenged a school ban on biking in 2009, Aaron Naparstek's traffic advocacy in Brooklyn, and Mark Lakeman's Sellwood neighborhood in Portland, where neighbors transformed an intersection into the Share-It-Square piazza with City Repair. Such projects raise wellbeing and build community. Montgomery's own urban experiments, from inviting strangers into homes during the Vancouver Olympics to the Happy Streets tests, show the same spirit.",
["Citadins: residents who shape their city","A school biking ban challenged in 2009 by a boy and his mother","Aaron Naparstek, traffic advocate in Brooklyn","Mark Lakeman and City Repair in Sellwood, Portland","The Share-It-Square piazza at an intersection","Channel anger into constructive advocacy","Reclaiming shared space builds community and wellbeing","Montgomery's own experiments: Home for the Games, Happy Streets"],
"Montgomery's last message: you do not have to wait for planners. Neighbors can reclaim a street, and doing it makes everyone happier."],
s:[["l","Citadins","Montgomery ends by saying cities belong to the people who live in them. He tells of Adam and his mother, who in 2009 fought a ban on biking to school, and of Aaron Naparstek in Brooklyn, who turned frustration with dangerous traffic into a campaign."],
["m","What does Montgomery call residents who shape their city?","Citadins",["Bureaucrats","Developers","Tourists"],"Citizens as city-makers."],
["l","Share-It-Square","In Sellwood, Portland, Mark Lakeman and neighbors working with City Repair painted and rebuilt an intersection into a shared piazza, the Share-It-Square. Montgomery says such projects raise wellbeing and build community. His own experiments, such as getting Vancouverites to host strangers during the Olympics, follow the same urban-experimentalist idea."],
["t","Montgomery says citizens must wait for planners before changing their streets.",false,"He urges residents to act."],
["x","Match each person or project to its place",[["Mark Lakeman","Sellwood, Portland"],["Aaron Naparstek","Brooklyn traffic advocacy"],["Share-It-Square","Neighbors' intersection piazza"],["Home for the Games","Opening homes to strangers in Vancouver"]],"Chapter 13 and Montgomery's own work."]],
D:[["m","What is the book's overall message about change?","Cities are built by people and can be rebuilt, with each person able to help",["Only governments can change cities","Change is impossible","Only architects matter"],"Agency, from the mayor to the neighbor."]]}]]
]}));
MORE.push(MK({id:"plato",t:"The Republic",a:"Plato",y:-375,
q:"what is justice, and is a just person happier than an unjust one?",
ans:"Through Socrates, Plato answers by building an ideal city in words. Justice is each part doing its own job: in the city, rulers, guardians and producers; in the soul, reason, spirit and appetite. Philosophers who have seen the Good should rule, and the just life, ruled by reason, is the happiest one.",
cov:"Ten lessons follow the ten books of the dialogue in order.",
u:[
["What is justice?","Books I and II",[
{i:"scale",t:"Thrasymachus: might makes right",c:"Book I",d:"Three failed definitions of justice.",
n:["Book I tests popular ideas of justice and ends with the claim that justice is just the advantage of the stronger.",
"At Cephalus's house, Socrates questions three definitions. Cephalus says justice is telling the truth and paying debts. Polemarchus says it is helping friends and harming enemies. Thrasymachus angrily claims justice is whatever benefits the stronger, and that the unjust person lives better. Socrates refutes them, but admits he still does not know what justice is.",
["Cephalus: justice is honesty and paying what you owe","Counterexample: you should not return a weapon to a friend who has gone mad","Polemarchus: help friends, harm enemies","Thrasymachus: justice is the advantage of the stronger","Socrates argues rulers, like doctors, should serve those in their care"],
"Book I is a warm-up: Socrates knocks down common definitions of justice, ending with Thrasymachus's cynical view that justice just serves the powerful."],
s:[["l","A conversation in Piraeus","The Republic is a dialogue narrated by Socrates. At the home of the old merchant Cephalus, talk turns to what makes a life good. Cephalus says justice is telling the truth and returning what you owe. Socrates asks: should you return a borrowed weapon to a friend who has gone mad? Clearly not, so the definition fails."],
["m","Why does Cephalus's definition fail?","Returning a weapon to a friend who has gone mad would not be just",["He forgot to define debt","Socrates says honesty is wrong","Cephalus changes his mind for no reason"],"A rule-based definition breaks on hard cases."],
["l","Thrasymachus","Polemarchus suggests justice is helping friends and harming enemies, and Socrates argues a just person harms no one. Then Thrasymachus bursts in: justice is the advantage of the stronger. Rulers make laws to suit themselves, and the unjust person who gets away with it lives best. Socrates replies that a true ruler, like a doctor, works for those in his care."],
["x","Match each speaker to his definition",[["Cephalus","Tell the truth and pay debts"],["Polemarchus","Help friends, harm enemies"],["Thrasymachus","The advantage of the stronger"],["Socrates","Still searching at the end of Book I"]],"Each definition is tested and found wanting."],
["t","At the end of Book I, Socrates says he now knows what justice is.",false,"He admits he has not found the answer yet."]],
D:[["m","What does Socrates's doctor analogy suggest?","A true ruler, like a doctor, serves the good of those in his care",["Rulers should study medicine","Health matters more than justice","Doctors should rule the city"],"Every craft aims at the good of its object."]]},
{i:"eye",t:"The Ring of Gyges",c:"Book II",d:"Glaucon's challenge and the city in words.",
n:["Glaucon asks whether anyone would stay just if they could act unseen.",
"Glaucon tells the story of Gyges, a shepherd who finds a ring that makes him invisible, then seduces the queen, kills the king and takes the throne. Would anyone stay just with such a ring? Glaucon and Adeimantus ask Socrates to prove justice is good in itself, not just for its reputation. Socrates proposes to look at justice in a city first, where it is larger and easier to see.",
["Glaucon: people value justice only out of fear of punishment","The Ring of Gyges: invisibility removes consequences","The challenge: show justice is good in itself and for its effects","Socrates studies justice in the city as a larger picture of the soul","The first healthy city grows into a luxurious, feverish one that needs guardians"],
"The big question of the book is the Ring of Gyges: if you could never be caught, would you still be just? Plato says yes, and the rest of the book is his argument why."],
s:[["l","Invisible and unpunished","Glaucon argues that people practice justice unwillingly, only because they fear being caught. To prove it he tells of Gyges, who finds a ring of invisibility and uses it to seize power. Anyone with such a ring, Glaucon says, would do the same."],
["m","What is the point of the Ring of Gyges story?","To ask whether people would stay just if they could never be caught",["To show rings are dangerous","To praise Gyges as a king","To explain Greek religion"],"It removes the consequences of injustice."],
["l","Reading the larger letters","Socrates says justice in one soul is hard to see, so they will look at justice in a city, like reading large letters before small ones. A simple city of farmers and builders grows into a luxurious city, which needs more land, which means war, which means a class of guardians."],
["t","Socrates studies justice in a city because a city is a larger version of the soul.",true,"The city-soul analogy runs through the whole book."],
["m","What do Glaucon and Adeimantus ask Socrates to prove?","That justice is good in itself, not just for its rewards",["That the gods exist","That democracy is best","That Gyges was right"],"They want justice valued even without reputation."]],
D:[["m","Why does the luxurious city need guardians?","Its appetites require more land, which leads to war",["Its people are lazy","The gods demand soldiers","Farmers refuse to work"],"Luxury creates conflict over resources."]]}]],
["Building the city","Books II to V",[
{i:"chat",t:"Educating the guardians",c:"Books II and III",d:"Censorship, music, gymnastics and the noble lie.",
n:["Guardians must be raised on true stories, balanced training and a founding myth.",
"Socrates says guardians must be gentle to friends and fierce to enemies, like good watchdogs. Their education begins with stories, so poets must be censored: no tales of gods lying, fighting or behaving badly. Music and gymnastics balance the soul. Rulers are chosen from the best guardians, and everyone is taught a noble lie, the myth of the metals.",
["Guardians need a philosophical, spirited nature, like a watchdog","Stories shape the young, so Homer and the poets are censored","Music softens, gymnastics hardens; both are needed","Rulers are the best of the guardians","The myth of the metals: gold rulers, silver auxiliaries, bronze and iron producers"],
"Plato wants the city to tell its citizens a founding myth, the noble lie, that people are born gold, silver or bronze, so everyone accepts their role."],
s:[["l","Stories shape souls","Children absorb stories before they can judge them. So Socrates proposes to censor poets like Homer when they show gods as deceitful or heroes as cowardly. Education should balance music, which shapes the mind and character, with gymnastics, which trains the body and spirit."],
["m","Why does Socrates want to censor poets?","Stories shape the character of the young",["Poems are too long","Poets are too poor","He dislikes rhyme"],"Education begins with the tales children hear."],
["l","The noble lie","To hold the city together, citizens are told that the earth made them, and that the god mixed gold into rulers, silver into soldiers, and bronze and iron into farmers and workers. Children can rise or fall by their real metal, not by birth."],
["x","Match each metal to its class",[["Gold","Rulers"],["Silver","Auxiliaries, the soldiers"],["Bronze and iron","Farmers and workers"],["The myth itself","The noble lie"]],"The myth justifies the three-class city."],
["t","In the myth of the metals, a child always stays in the class of its parents.",false,"A child can move according to its own metal."]],
D:[["m","Why does the noble lie trouble modern readers?","It uses a deliberate falsehood to make people accept their place",["It praises democracy","It rejects all education","It gives power to poets"],"It raises the question of when rulers may deceive."]]},
{i:"scale",t:"Justice in the city and the soul",c:"Book IV",d:"The four virtues and the three parts of the soul.",
n:["Justice is each part doing its own job, in the city and in the soul.",
"With the city built, Socrates finds four virtues. Wisdom lives in the rulers, courage in the auxiliaries, moderation in agreement about who rules, and justice in each class doing its own work without meddling. The soul has the same three parts: reason, spirit and appetite. A just person is one whose reason rules, with spirit as its ally and appetite kept in check.",
["Wisdom belongs to the rulers","Courage belongs to the auxiliaries","Moderation is agreement about who should rule","Justice is each part doing its own work","The soul has reason, spirit and appetite, matching the three classes"],
"Plato's answer to what justice is: harmony. In a city, each class does its own job; in a person, reason rules, spirit backs it up, and appetite follows."],
s:[["l","Four virtues","Socrates locates wisdom in the rulers who decide for the whole city, courage in the auxiliaries who hold right beliefs about what to fear, and moderation in the agreement of all classes about who should rule. What remains is justice: each class doing its own work and not interfering with the others."],
["m","Where does Socrates locate justice in the city?","In each class doing its own work",["In the rulers alone","In the laws written down","In the wealth of farmers"],"Justice is a principle of order across the whole."],
["l","Three parts of the soul","Socrates argues the soul has three parts. Reason calculates and seeks truth. Spirit feels anger, pride and honor. Appetite wants food, drink, sex and money. A person who is thirsty but refuses to drink shows reason overruling appetite. Justice in the soul is reason ruling with spirit as its ally."],
["x","Match each part of the soul",[["Reason","Seeks truth, should rule"],["Spirit","Anger, honor, courage"],["Appetite","Food, drink, money"],["Justice","Each part doing its job"]],"The soul mirrors the city's three classes."],
["t","For Plato, justice is mainly about following external rules.",false,"It is an inner harmony of the soul."]],
D:[["m","Which example shows reason overruling appetite?","A thirsty person refusing to drink",["A soldier feeling angry","A ruler giving orders","A farmer selling grain"],"Conflict inside one person shows the soul has parts."]]},
{i:"user",t:"Three waves: women, family, philosopher kings",c:"Book V",d:"Plato's most radical proposals.",
n:["Women can be guardians, guardians share families, and philosophers must rule.",
"Socrates faces three waves of objection. First, women with the right nature should be guardians and receive the same education as men. Second, guardians will have no private families: mates and children are held in common so loyalty goes to the city. Third, the biggest wave: cities will never be free of trouble until philosophers become kings or kings become philosophers.",
["First wave: women and men guardians share education and duties","Second wave: no private families or property among guardians","Mating is arranged by rulers, children raised in common","Third wave: philosophers must rule","Philosophers love the forms, not just appearances"],
"Plato's boldest claim is in Book V: until philosophers rule, or rulers become philosophers, cities will never be free of evils."],
s:[["l","Women and families","Socrates argues that the difference between men and women is no reason to exclude women from guarding the city. Guardians should also live without private homes, property or families. Children are raised in common so that everyone calls the whole city family."],
["m","What does Socrates say about women in the guardian class?","Women with the right nature should be guardians with the same education",["Women should only raise children","Women cannot study philosophy","Women should rule alone"],"The first wave is about equal roles."],
["l","Philosopher kings","The third wave is the paradox at the heart of the book: philosophers must rule. A philosopher loves wisdom and knows the forms, the unchanging realities behind appearances. Others only have opinions about shifting things."],
["t","Socrates admits the philosopher king idea will sound ridiculous to many.",true,"He calls it the biggest wave."],
["m","What separates the philosopher from others, in Book V?","Knowledge of the forms rather than opinion about appearances",["Wealth","Military skill","Noble birth"],"Knowledge versus opinion grounds the claim to rule."]],
D:[["m","Why abolish private families for guardians?","So loyalty goes to the whole city, not to private households",["To lower the birth rate","To punish the guardians","To make farming easier"],"Private interest is the seed of faction."]]}]],
["The Good","Books VI and VII",[
{i:"sun",t:"Ship, sun and line",c:"Book VI",d:"Why philosophers should steer, and what the Good is.",
n:["The Good is like the sun: it makes things knowable and gives them being.",
"Adeimantus says philosophers seem useless. Socrates answers with the ship of state: sailors fight over the helm and ignore the real navigator who studies the stars. Then he describes the Good, the highest form, through the sun analogy: as the sun gives light and growth, the Good gives truth and being. The divided line maps levels of cognition from images to pure understanding.",
["Ship of state: the true navigator is mocked by those who want power","The Good is the highest object of knowledge","Sun analogy: the sun lets us see; the Good lets us know","Divided line: imagination, belief, thought, understanding","Mathematics is a bridge toward the forms"],
"Plato compares the Good to the sun: just as sunlight lets you see things, the Good makes things understandable."],
s:[["l","The ship of state","Imagine a ship whose owner is strong but half deaf. The crew fights over who should steer, though none has studied navigation. The real navigator, who watches the stars and winds, is called a useless stargazer. That, Socrates says, is how democracies treat philosophers."],
["m","In the ship of state, who stands for the philosopher?","The navigator who studies the stars",["The deaf owner","The crew fighting for the wheel","The passengers"],"Expertise is mocked by those seeking power."],
["l","Sun and line","The sun makes things visible and helps them grow. The Good does the same for the mind, making the forms knowable and real. The divided line ranks ways of knowing: images, beliefs about physical things, mathematical thought, and finally understanding of the forms through reason alone."],
["x","Match the analogy to its point",[["Sun","The Good makes things knowable"],["Ship","Experts are ignored by power seekers"],["Divided line","Levels of knowing"],["Mathematics","A step toward the forms"]],"Book VI prepares the cave."],
["t","For Plato, the Good is one virtue among many, no higher than courage.",false,"It is the highest object of knowledge."]],
D:[["m","Which is the highest level on the divided line?","Understanding of forms through pure reason",["Images and shadows","Beliefs about objects","Mathematical diagrams"],"Each level grasps something more real."]]},
{i:"eye",t:"The allegory of the cave",c:"Book VII",d:"Prisoners, shadows and the education of rulers.",
n:["Most people mistake shadows for reality; education turns the soul toward the light.",
"Prisoners chained in a cave see only shadows cast on a wall and think they are real. One is freed, struggles up into sunlight, and finally sees the sun itself. Returning, he is blinded by the dark and mocked, and the prisoners might kill him. Education, Socrates says, is not putting knowledge in but turning the soul around. Philosophers must go back down to rule.",
["Prisoners see shadows and take them for reality","The freed prisoner climbs out, painfully, and sees the sun","The sun stands for the Good","Returning, he is mocked and threatened","Education is turning the soul, not filling it","Rulers study arithmetic, geometry, astronomy, harmony, then dialectic"],
"The cave is Plato's picture of education: we mistake shadows for reality until someone turns us toward the light, and people often attack the one who returns to tell them."],
s:[["l","Shadows on the wall","People are chained in a cave from birth, facing a wall. Behind them, objects are carried past a fire, casting shadows. The prisoners name the shadows and think they are the whole of reality. One is freed and forced up into daylight. At first he is dazzled, then sees reflections, objects, and finally the sun."],
["m","In the allegory, what does the sun represent?","The Good",["The king","Fire in the cave","The prisoners' leader"],"It links back to the sun analogy."],
["l","The return","The freed man pities the prisoners and goes back. His eyes, used to light, fail in the dark, and the prisoners laugh and say the climb ruined him. If they could, they might kill him, an echo of Socrates's own death. Socrates says education turns the soul toward what is real, and the philosophers must return to govern."],
["t","Socrates says education means putting knowledge into empty minds.",false,"It means turning the soul toward the light."],
["m","Why must the philosopher go back into the cave?","To rule, for the good of the whole city",["To find more shadows","To escape punishment","To become a prisoner again"],"Those who know the Good have a duty to govern."]],
D:[["m","What real event does the prisoners' hostility echo?","The trial and execution of Socrates",["The Persian wars","The founding of Athens","Plato's exile"],"Athens put the philosopher to death."]]}]],
["Decline and the just life","Books VIII to X",[
{i:"route",t:"How cities decay",c:"Books VIII and IX",d:"Four bad regimes and the tyrant's misery.",
n:["The ideal city decays through timocracy, oligarchy and democracy into tyranny, and the tyrant is the most miserable man.",
"Socrates describes a decline. Aristocracy becomes timocracy, ruled by honor. That becomes oligarchy, ruled by wealth. The poor revolt and create democracy, which prizes freedom so much it falls into anarchy. Out of that disorder a tyrant arises. Each regime matches a type of soul, and the tyrant, ruled by his worst appetites, is the least happy person of all.",
["Aristocracy: rule of the best","Timocracy: love of honor","Oligarchy: love of wealth","Democracy: love of freedom, every desire treated as equal","Tyranny: one person ruled by lawless appetite","The just person is many times happier than the tyrant"],
"Plato's arc of decline: honor, then money, then freedom, then a tyrant who rises from democratic chaos and is himself a slave to his desires."],
s:[["l","Down the ladder","The perfect city slips when rulers make mistakes. Honor-lovers take over, then money-lovers. When the rich grow few and the poor many, democracy follows. Everyone does as they like and all desires seem equal, until a popular champion turns into a tyrant."],
["m","Which regime does Plato say gives rise to tyranny?","Democracy",["Oligarchy","Timocracy","Aristocracy"],"Excess freedom invites a strongman."],
["x","Match each regime to what it loves",[["Timocracy","Honor"],["Oligarchy","Wealth"],["Democracy","Freedom"],["Tyranny","Lawless appetite"]],"Each regime matches a type of soul."],
["l","The miserable tyrant","Book IX answers Glaucon's challenge. The tyrant seems to have everything but is ruled by his own appetites, surrounded by enemies, and never free. The just person, ruled by reason, enjoys truer pleasures. So justice pays."],
["t","Plato argues the tyrant is the happiest of men because he can do anything.",false,"He argues the tyrant is the most miserable."]],
D:[["m","How does Book IX answer the Ring of Gyges challenge?","The unjust soul is disordered and miserable, so justice is better even unseen",["It proves invisibility is impossible","It says the gods punish tyrants","It drops the question"],"Happiness depends on inner order."]]},
{i:"star",t:"Poets and the myth of Er",c:"Book X",d:"Why imitation misleads, and what happens after death.",
n:["Art copies copies, and the soul's choices echo beyond death.",
"Socrates returns to the poets. A painting of a bed copies a physical bed, which copies the form of a bed, so art is twice removed from truth and stirs emotions over reason. Then he ends with the myth of Er, a soldier who returns from death to describe souls being judged and choosing their next lives. The lesson: choose wisely, guided by philosophy.",
["Art imitates appearances, three steps from the form","Poetry feeds emotions and weakens reason","Poets are banished unless someone can defend them","The soul is immortal","Myth of Er: souls choose their next lives, often badly"],
"Plato ends with a myth: souls choose their next lives, and those who chose well were the ones who had learned philosophy."],
s:[["l","Three beds","There is the form of a bed, the bed a carpenter makes, and a painting of that bed. The painter copies a copy, far from the truth. Poets do the same with human life, and their work stirs grief and laughter that weaken reason. So imitative poetry is banished from the city, unless it can be defended."],
["m","Why is art twice removed from truth for Plato?","It copies physical things, which already copy the forms",["It uses too many colors","Artists are not paid","It is always about gods"],"Form, object, image: the image is lowest."],
["l","The myth of Er","Er, a soldier killed in battle, wakes on his funeral pyre and reports what he saw: souls judged, rewarded or punished, then choosing new lives from a spread of lots. One man rushes to choose a tyrant's life and regrets it. Odysseus, cured of ambition, picks a quiet private life."],
["t","In the myth of Er, souls choose their next lives.",true,"Responsibility lies with the chooser."],
["m","What lesson does the myth of Er teach?","Learn to choose a just life, since choices shape the soul",["Fate decides everything","Wealth guarantees a good next life","The gods choose for us"],"Philosophy prepares the soul to choose well."]],
D:[["m","Which soul in the myth chooses a quiet, private life?","Odysseus",["Achilles","Er","Thrasymachus"],"Having suffered ambition, he wants peace."]]}]]
]}));
MORE.push(MK({id:"speck",t:"Walkable City",a:"Jeff Speck",y:2012,
q:"how do you make a downtown a place people choose to walk?",
ans:"Speck's answer: walkability is the measure that drives a city's wealth, health and sustainability. A walk has to be useful, safe, comfortable and interesting, and he gives ten concrete steps to get there: put cars in their place, mix the uses, get the parking right, let transit work, protect the pedestrian, welcome bikes, shape the spaces, plant trees, make friendly and unique faces, and pick your winners.",
cov:"Fourteen lessons follow the book: the general theory and three opening chapters, then each of the ten steps. Cross-checked against several reviews and summaries; the book has no illustrations and the 10th anniversary edition adds material not covered here.",
u:[
["Why walkability","Part I",[
LS("compass","A general theory of walkability","Prologue and theory","A walk must be useful, safe, comfortable and interesting.",
"People walk only when the walk is useful, safe, comfortable and interesting, and all four must be present together.",
"Speck argues that local government, not the planning profession, drives most urban decline. Through the Mayors' Institute on City Design he saw traffic engineers widening streets, removing trees and reshaping downtowns around traffic flow with little oversight. His response is the general theory of walkability: a walk succeeds only if it is useful, meaning daily needs are within reach; safe, meaning it feels and is protected from cars; comfortable, meaning streets feel like outdoor rooms; and interesting, meaning there are friendly and unique things to see. Each condition is necessary and none is enough alone. A downtown with great shops but fast traffic will not be walked, and a pretty promenade with no destinations will not be either.",
["Local governments and engineers drive most urban decline","Mayors' Institute: engineers widening streets and removing trees","General theory: a walk must be useful, safe, comfortable and interesting","Useful: daily life within walking distance","Safe: protected from cars, with felt safety too","Comfortable: spaces with a sense of enclosure","Interesting: friendly, unique, stimulating edges","All four are required together"],
"The four tests: a walk happens only if it is useful, safe, comfortable and interesting, and a street that fails any one will be empty.",
[["The theory","Speck says that to make walking happen you need all of four things. It must be useful, with the things you need nearby; safe, with traffic tamed; comfortable, with places that feel enclosed; and interesting, with lively building faces."],
["Why it matters","The theory organizes the ten steps: the first four make the walk useful, the next two make it safe, then comfortable and then interesting. Because all four are needed, fixing only one, like a plaza with no destinations, will fail."]],
[X([["Useful","Daily needs within reach"],["Safe","Protected from cars"],["Comfortable","Outdoor rooms with enclosure"],["Interesting","Friendly, varied building faces"]],"The general theory."),
M("What does the theory say about the four conditions?","All are necessary and none is enough alone",["Only safety matters","Any one is enough","Interest is optional"],"They work as a set.")],
T("Speck blames the planning profession more than local governments for urban decline.",false,"He blames local government and traffic engineering.")),
LS("coin","Walking: the urban advantage","Chapter 1","The economic, health and environmental case for walkable cities.",
"Walkable places earn a real estate premium, attract talent and make people healthier and the planet cleaner.",
"The opening chapter makes the case for walkability. Walkable places draw demand: the premium on walkable urbanism over drivable suburbs shows up in property values, and city centers and walkable cities fared better after the Great Recession than suburbs and drivable cities. Christopher Leinberger's term walkable urbanism describes growing demand for walkable places, particularly among the creative class. There are health benefits: in one study cited in a review, 60 percent of residents in a low-walkable neighborhood were overweight compared with 35 percent in a high-walkable one. And walking is greener, since places built around cars generate far more driving and emissions. The EPA is cited to show that states with more driving per person tend to do worse economically.",
["Walkable urbanism commands a real estate premium","City centers and walkable cities weathered the Great Recession better","Leinberger's walkable urbanism: rising demand, especially from the creative class","Health: far fewer overweight residents in highly walkable neighborhoods in one study","Environmental benefits: less driving, fewer emissions","EPA data: states with more driving per person fare worse economically","Places built around cars crash cars into each other"],
"The walkability dividend: places you can walk are worth more, healthier and greener than places you can only drive.",
[["The money","Speck points to property values and recovery data to show that walkable places do better. Developers and the creative class increasingly want walkable neighborhoods, which Leinberger calls walkable urbanism."],
["Health and planet","In a cited study, 60 percent of residents in a low-walkable neighborhood were overweight versus 35 percent in a high-walkable one. Driving also produces emissions, and states where residents drive more tend to perform worse economically."]],
[M("What did one cited study find about overweight residents?","60 percent in low-walkable versus 35 percent in high-walkable neighborhoods",["No difference","More overweight in walkable ones","90 percent versus 10 percent"],"Health benefit."),
M("What does Leinberger's walkable urbanism describe?","Growing demand for walkable places",["A building style","A transit agency","A type of road"],"Market demand.")],
T("Walkable cities fared worse than drivable ones after the Great Recession.",false,"They fared better.")),
LS("shield","Safety, health and the wrong green","Part I, later chapters","Safety and health costs of car-built places, and why green gadgets miss the point. Drawn from reviews, so the book itself has more detail.",
"Car-built places are unhealthy and dangerous, and real sustainability depends on location and driving, not on shiny green technology.",
"The second chapter examines what car-oriented places do to people: the risk of dying in a traffic crash is higher than many risks people fear, such as being murdered by a stranger, and car-dependent lifestyles contribute to inactivity and obesity. The third chapter argues that the wrong shade of green dominates the debate: eco-friendly buildings and hybrid cars matter less than where people live and how much they must drive. A green building in a sprawling location still leads to many car trips. Speck argues that the most meaningful environmental step is to live in places where driving is optional. Thus walkability is the green answer too.",
["Traffic crashes are a bigger risk to most people than crime by strangers","Car-dependent lifestyles reduce physical activity","Places built for cars are best at crashing cars into each other","The wrong green: gadgets and certified buildings matter less than location","A green building in sprawl still creates car trips","The most effective environmental move is to make driving optional","Walkability is a sustainability strategy"],
"The wrong color green: a certified green building in a car-dependent location is still a driving machine.",
[["Dangerous convenience","Cars kill many more people than the crimes that people fear most. Car-oriented places also make exercise something you have to schedule instead of something that happens."],
["Green by location","Speck says that environmentalists often focus on gadgets, like hybrid cars and energy-efficient buildings, while ignoring that location drives behavior. A building in a walkable neighborhood does far more than a green building in a sprawl."]],
[M("What does Speck say is most important for a green lifestyle?","Living where driving is optional",["Owning a hybrid","A green roof","Recycling only"],"Location dominates."),
M("Which risk does the book say is greater than murder by strangers?","Dying in a traffic crash",["Falling","Lightning","Flu"],"Perceived versus real risk.")],
T("Speck argues a green-certified building in sprawl solves the car problem.",false,"It still generates driving.")),
]],
["The useful walk","Steps 1 to 4",[
LS("route","Put cars in their place","Step 1","Traffic studies, induced demand and congestion pricing.",
"Cities must stop designing for traffic flow alone: roads induce demand, so wider streets fill with more cars.",
"The automobile, Speck says, is a servant that has become our master. Traffic studies are flawed because they ignore induced demand: adding road capacity quickly fills with new driving, so congestion rarely falls. Decisions made by state transportation departments, especially on state highways that serve as a town's main street, often damage downtowns. Cars have made us travel farther, not faster, because commute times stay about the same. Speck opposes pedestrian-only zones, noting that more than 150 American Main Streets were pedestrianized in the 1960s and 1970s and many failed almost immediately, showing safe, pleasant space alone does not create walking. He supports congestion pricing as a way to charge drivers for the cost they impose.",
["Cars shifted from serving people to governing how cities are built","Traffic studies miss induced demand","New road capacity fills with new driving","State DOTs often damage main streets that are state highways","Cars let us travel farther, not faster","More than 150 pedestrian-only Main Streets were created in the 1960s and 1970s; many failed","Supports congestion pricing","Do not expect safe space alone to attract walkers"],
"Step 1: widen the road and it fills up again, so stop building for traffic and start pricing it.",
[["Induced demand","When a city adds lanes, more people choose to drive until congestion returns. So traffic studies that propose widening are self-defeating. Speck also faults state highway departments for treating town main streets as highways."],
["Pedestrian malls and pricing","Pedestrianized streets in the 1960s and 1970s often failed because cars weren't the only thing missing; so were people with reasons to go. Congestion pricing, charging drivers to enter the busiest areas, is a better tool."]],
[M("What is induced demand?","New road capacity quickly fills with more driving",["Fewer cars after widening","Higher fares","A transit program"],"Widening does not cure traffic."),
M("What happened to many pedestrian-only streets of the 1960s and 70s?","Many failed almost immediately",["They thrived","They became highways","They were widened"],"Safe space alone did not create walking.")],
T("Speck supports pedestrian-only zones as a primary solution.",false,"He is cautious and notes that many failed.")),
LS("blocks","Mix the uses","Step 2","Bring work, housing, shops and services together.",
"Downtowns need an even balance of uses within walking distance, and most are short on housing.",
"Cities were created to bring things together. Residents should be able to work, shop, eat, learn, worship, get care, play and sleep downtown. Speck traces Euclidean zoning to its historical origins and argues that it now weakens cities by separating daily activities. Neighborhoods with a variety of destinations see significantly more walking. Most American downtowns have too little housing, the place people walk from, so adding housing is the main fix. In booming downtowns at risk of gentrification, he recommends inclusionary zoning and accessory dwelling units, sometimes called granny flats, to keep housing affordable. In still-disinvested downtowns, affordability is less of a concern.",
["Cities exist to bring things together","Residents should be able to do daily activities within walking distance","Euclidean zoning separates uses and weakens cities","Diverse destinations produce more walking","Most downtowns lack housing: the places people walk from","Inclusionary zoning and accessory dwelling units help with affordability","Booming downtowns need affordability tools; struggling ones less so"],
"Step 2: a downtown that is all offices empties at 6 p.m., so add the housing that gives people somewhere to walk from.",
[["Balance","Many downtowns have offices and shops but few homes. Without residents, streets are empty after work. Mixing uses means the right balance of work, housing, retail, culture and services."],
["Affordability","Speck suggests inclusionary zoning, which requires some affordable units, and accessory dwelling units so existing neighborhoods add homes. These are especially needed in booming cities where prices rise."]],
[M("What do most American downtowns lack, according to Step 2?","Housing",["Offices","Banks","Parking"],"People to walk from."),
M("Which tool does Speck recommend against gentrification?","Inclusionary zoning and accessory dwelling units",["Banning growth","Rent subsidies only","Fewer homes"],"Add affordable homes.")],
T("Euclidean zoning helps cities by separating daily activities.",false,"Speck says it harms them.")),
LS("wallet","Get the parking right","Step 3","Parking's hidden costs, minimums and Donald Shoup's ideas.",
"Cities have too much underpriced parking; fewer spaces at the right price, shared and priced by demand, makes places more walkable.",
"Ample, cheap parking encourages driving that would not otherwise occur. Speck draws on UCLA professor Donald Shoup, author of The High Cost of Free Parking, to show that parking's costs are spread across the economy and paid by everyone, including people who do not drive. Minimum parking requirements for buildings raise costs and can block adaptive reuse of historic buildings. Employer-subsidized parking encourages commuting by car. He recommends in-lieu fees that fund shared municipal garages, parking cash-out programs so employees can take cash instead of a space, and pricing on-street parking by demand. He contrasts Chicago's parking meter lease, where the private operator profits regardless of use, with San Francisco's variable pricing aiming for roughly 80 percent occupancy, with rates ranging from 25 cents to 6 dollars an hour across eight neighborhoods.",
["Ample parking encourages driving","Parking costs are hidden and shared by everyone","Minimum parking requirements raise costs and block reuse","Employer-subsidized parking favors drivers","In-lieu fees fund shared municipal parking","Parking cash-out gives employees the choice","Chicago's meter lease versus San Francisco's variable pricing","SF targets about 80 percent occupancy; rates from 25 cents to 6 dollars an hour"],
"Step 3: price curb parking so about one in five spaces is open, and stop forcing every building to build its own lot.",
[["Hidden costs","Free parking is not free: its cost is built into rents, prices and taxes. Required minimums push buildings to provide more parking than they need, which spreads everything out and encourages driving."],
["Pricing by demand","Following Shoup, Speck recommends setting curb prices so that about 80 percent of spaces are full. San Francisco adjusts prices by neighborhood and time, between 25 cents and 6 dollars an hour, while Chicago's lease with a private operator rewards revenue regardless of demand."]],
[M("What occupancy does San Francisco aim for on its parking?","About 80 percent",["20 percent","100 percent","50 percent"],"Leave some spaces open."),
M("What is a parking cash-out program?","Employees can take cash instead of a parking space",["Parking is free","Fines are doubled","Cars are sold"],"Gives non-drivers a benefit.")],
T("Minimum parking requirements make cities cheaper and more walkable.",false,"They raise costs and spread things out.")),
LS("bolt","Let transit work","Step 4","Transit and walkability depend on each other.",
"Every transit trip begins and ends with a walk, so transit works only in walkable places, and walkable cities need good transit.",
"With rare exceptions, every transit trip begins and ends with a walk, so while walkability benefits from good transit, good transit relies on walkability. Walkable neighborhoods can exist without transit, but walkable cities depend on it. Speck cites Dallas's light rail as a cautionary example: low residential density, too much cheap downtown parking, routes away from the busiest areas, infrequent service and no walkable neighborhoods near stops. He recommends improving corridors that can reach ten-minute headways, along with the surrounding urban fabric. He supports well-planned modern streetcars as pedestrian accelerators serving vacant land just beyond walking distance of downtown, ideally with private funding, and is skeptical of bus rapid transit, whose more permanent infrastructure can look unattractive and feel less comfortable.",
["Every transit trip begins and ends with a walk","Walkable neighborhoods can exist without transit; walkable cities need it","Dallas light rail: low density, cheap parking, poor routes, infrequent service","Focus on corridors that can reach ten-minute headways","Transit as a mobile public space deserves pleasant design","Streetcars as pedestrian accelerators, ideally privately funded","Skepticism of bus rapid transit's look and comfort"],
"Step 4: transit and walking feed each other, so improve both on a few corridors with frequent service.",
[["Dallas as a warning","Dallas built light rail but surrounded it with low density, cheap parking and little walkability, so few people used it. Transit cannot succeed alone."],
["Make it work","Pick corridors where service can come every ten minutes, and improve the street environment around them. Speck likes modern streetcars that connect downtown to nearby underused land, and warns that buses must be frequent, clear and comfortable to compete."]],
[M("Which city is the cautionary transit example?","Dallas",["Portland","Venice","Amsterdam"],"Light rail without walkability."),
M("How often should service run on the corridors Speck recommends?","Every ten minutes",["Hourly","Daily","Weekly"],"Ten-minute headways.")],
T("Good transit can succeed in car-dependent, low-density areas.",false,"It relies on walkability.")),
]],
["The safe and comfortable walk","Steps 5 to 8",[
LS("alert","Protect the pedestrian","Step 5","Block size, lane width, speed and the feeling of safety.",
"Streets that feel the least safe are the safest: narrow lanes, short blocks and two-way streets slow cars and protect walkers.",
"Block size, lane width, signals and road geometry determine vehicle speed and crash risk, and Speck says most American streets get at least half of these wrong. He favors short blocks, which provide route options and shorter walks, and 10-foot lanes over 12-foot lanes designed for highway speeds. Pedestrians are far more likely to survive being hit at 20 mph than at 45 mph. Road diets, which reduce the number of lanes, work well when they include left-turn lanes. He explains risk homeostasis: drivers slow down where a place feels dangerous, so removing signs and markings in naked streets and shared spaces can improve safety. He opposes one-way streets in downtown retail areas. On sidewalks, a buffer of parked cars matters more than width.",
["Most American streets get at least half the design variables wrong","Short blocks create route choices and shorter walks","Prefer 10-foot lanes to 12-foot lanes","Survival odds are far better at 20 mph than 45 mph","Road diets work with left-turn lanes","Risk homeostasis: drivers slow where it feels risky","Naked streets and shared spaces","Oppose one-way streets in downtown retail areas","Parked cars buffer sidewalks"],
"Step 5: the safest roads are those that feel the least safe, because uncertain drivers slow down.",
[["Speed is the killer","Wide lanes and one-way streets encourage speed. A pedestrian hit at 20 mph is far likelier to live than one hit at 45. Narrower lanes, shorter blocks and two-way streets reduce speed."],
["Feeling and buffers","Drivers adjust to perceived risk. Removing extras like signs and markings on naked streets can slow them. On-street parking acts as a buffer between walkers and moving traffic."]],
[M("Which lane width does Speck prefer?","10 feet",["12 feet","15 feet","8 feet"],"Wider lanes invite speed."),
M("What is risk homeostasis?","Drivers slow down where a place feels dangerous",["Fewer crashes with more lanes","Walkers take more risk","Roads self-repair"],"Perceived risk controls behavior.")],
T("One-way streets help downtown retail by speeding traffic.",false,"Speck opposes them downtown.")),
LS("route","Welcome bikes","Step 6","Bike lanes as a walkability tool.",
"Streets with bikes make drivers more careful, and well-designed bike lanes barely inconvenience drivers.",
"Speck says that a street with bikes, once drivers get used to them, is a place where cars proceed more cautiously. He credits urbanism and infrastructure as the main factors in building a bicycle city: Amsterdam, with about 783,000 residents, has roughly 400,000 people riding on a given day. Portland raised the share of commuters biking from 1 percent to 8 percent over 15 years, spending about 50 million dollars, or roughly 1 percent of its transportation funding. He acknowledges cycling's dangers and prefers dedicated lanes on busy downtown streets over vehicular cycling, and says bike lanes can be part of road diets but should not replace curbside parking or obstruct retail areas.",
["Streets with bikes make drivers more cautious","Infrastructure and urbanism build a bike city","Amsterdam: about 400,000 riders a day among 783,000 residents","Portland: from 1 to 8 percent bike commuters in 15 years for about 1 percent of transportation funds","Prefers dedicated lanes on busy streets","Bike lanes can be part of road diets","Do not replace curb parking or block retail"],
"Step 6: bike lanes slow cars, protect everyone and cost little: Portland went from 1 to 8 percent of commuters on bikes for about 1 percent of its transport budget.",
[["Bikes calm streets","When drivers expect bicycles they drive more carefully. Amsterdam shows what a bike city looks like, with about 400,000 daily riders."],
["Portland and design","Portland increased bike commuting from 1 to 8 percent in 15 years for around 50 million dollars. Speck prefers separate lanes on busy streets but says they should not eliminate curb parking in retail areas."]],
[M("How much did Portland raise its bike commuting share?","From 1 percent to 8 percent",["From 10 to 20 percent","From 0 to 1 percent","No change"],"Over about 15 years."),
M("Why do bikes help pedestrians, according to Speck?","They make drivers more cautious",["They block roads","They block sidewalks","They reduce parking"],"Calmer traffic.")],
T("Speck says bike lanes should always replace curbside parking.",false,"They should not obstruct retail or replace parking.")),
LS("building","Shape the spaces","Step 7","Enclosure, edges and the problem of too much open space.",
"Pedestrians need a sense of enclosure; surface parking and showy buildings destroy it, and tall buildings are not needed.",
