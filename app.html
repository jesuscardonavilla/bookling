["Narrow framing: each decision evaluated alone","Samuelson's colleague refused one bet but accepted 100","Broad framing: aggregate many decisions together","Risk policy: a rule for a whole category of choices","Frequent checking of results increases loss pain","Professional traders and insurers think in aggregate","Reduces the emotional effect of single losses","Applies to investing, insurance and project portfolios"],
"Risk policies: treat repeated gambles as a portfolio, not as one scary bet, and you will accept good odds you would otherwise turn down.",
[["One bet or a hundred","Samuelson's colleague refused a coin flip that could lose 100 or win 200, yet would happily take 100 of them. One flip feels like a risk of loss; a hundred flips are almost certain to profit. The same bet looks different depending on the frame."],
["Policies","Kahneman suggests deciding on a rule in advance, such as always taking favorable small risks or buying reasonable insurance with high deductibles. Looking at results less often also reduces the pain of fluctuations."]],
[M("What is narrow framing?","Evaluating each decision in isolation",["Reading small print","Choosing narrow roads","Using narrow definitions"],"The frame changes the answer."),
M("What is a risk policy?","A rule applied across a category of decisions",["A kind of insurance","A fine","A single bet"],"A broad frame.")],
T("A broad frame increases loss aversion.",false,"It decreases it.")),
LS("wallet","Keeping score","Chapter 32","Mental accounts, sunk costs and regret.",
"We keep mental accounts and avoid closing them at a loss, which leads to the sunk cost fallacy and the disposition effect.",
"People group money and outcomes into mental accounts. The disposition effect is the tendency to sell winning investments and hold losing ones, because selling a loser closes the account at a loss, though in terms of money the choice should depend only on future prospects. The sunk cost fallacy is continuing a failing project because of past investment: a business keeps pouring money into a bad idea, a person stays in a bad game. Regret also shapes choices: we feel more regret when we act than when we do nothing, and when we deviate from the default. Responsibility is felt more for actions than omissions. These accounting habits are costly.",
["Mental accounts: separate buckets for money and outcomes","Disposition effect: selling winners and holding losers","Sunk cost fallacy: continuing because of past investment","Decisions should look forward, not backward","Regret is larger for actions than omissions and for deviating from defaults","Responsibility is felt more strongly for acts than for failures to act","Taxes favor realizing losses but investors resist","Organizations also escalate commitment to failing projects"],
"Keeping score: we protect our mental ledgers by holding losers and finishing bad projects, even though past costs should not matter.",
[["The disposition effect","Investors tend to sell stocks that have gone up and hold those that have gone down, to avoid realizing a loss. Financially this is backward, especially for taxes. It comes from keeping score of each stock as its own account."],
["Sunk costs","A company that has spent heavily on a failing project may spend more to avoid admitting the loss. Individual and organizational choices are shaped by the pain of closing a losing account, and by regret over actions more than over inaction."]],
[M("What is the disposition effect?","Selling winners and holding losers",["Selling everything","Buying lottery tickets","Holding cash"],"Closing an account at a loss hurts."),
M("What is the sunk cost fallacy?","Continuing because of past investment",["Spending savings","Sinking boats","Over-saving"],"Only future costs and benefits should matter.")],
T("Regret is usually stronger after inaction than after action.",false,"It is usually stronger after action.")),
LS("shuffle","Reversals","Chapter 33","When separate and joint evaluation disagree.",
"Preferences reverse depending on whether options are judged together or one at a time, exposing the role of context and emotion.",
"Kahneman describes preference reversals: when two options are judged in isolation, an emotionally vivid feature dominates; when compared side by side, a more rational feature wins. Examples include dictionaries: judged alone, a like-new dictionary with 10,000 entries is valued above a torn-cover one with 20,000, but side by side the bigger one wins. People also give bigger penalties to a company for harming a single child than for a large financial loss when judged separately, but reverse the ranking when compared. Single evaluation is driven by System 1 and emotion; joint evaluation engages System 2. Courts and policy often use single evaluation and so give inconsistent outcomes.",
["Single evaluation relies on emotion and System 1","Joint evaluation allows comparison and System 2","Preference reversals: the ranking flips between modes","Dictionary example: like-new with 10,000 entries versus torn cover with 20,000","Punitive damage awards: separate cases inconsistent with each other","Evaluability: some attributes only matter in comparison","Policy and law often judge cases separately","Joint comparison tends to be more consistent"],
"Reversals: how you rank two things depends on whether you see them together, so context quietly decides.",
[["Same options, different answers","A like-new dictionary with 10,000 entries and a torn-cover one with 20,000 are valued differently depending on whether you see each alone or both together. In a single view the cover stands out; side by side, the number of entries wins."],
["Why it matters","Courts that decide each case separately can award damages that are inconsistent when compared. Joint evaluation forces a comparison and engages System 2. For consistent decisions, set up comparisons across cases."]],
[M("What drives single evaluation?","Emotion and System 1",["Careful comparison","Statistics","Experts"],"Vividness dominates alone."),
M("What is a preference reversal?","Ranking flips depending on joint versus single judgment",["Changing your mind randomly","Switching careers","Stock reversals"],"Context changes preference.")],
T("Joint evaluation tends to be more emotional than single evaluation.",false,"It tends to be more rational.")),
LS("frame","Frames and reality","Chapter 34","How wording changes choices even when facts are equal.",
"Equivalent descriptions can lead to opposite choices, showing that we respond to frames, not to reality.",
"In the Asian disease problem, a disease threatens 600 people. In one frame, Program A saves 200 and Program B has a one third chance of saving all and two thirds of saving none; most choose A. In the other frame, Program A means 400 die and Program B has a one third chance nobody dies and a two thirds chance 600 die; most choose B. The outcomes are identical, but gain framing produces risk aversion and loss framing produces risk seeking. Doctors respond differently to 90 percent survival than 10 percent mortality. A cash discount feels better than a credit surcharge. Organ donation rates differ widely between countries depending on whether the default is opt in or opt out.",
["Asian disease problem: saved versus die framing reverses choices","Gain frames cause risk aversion; loss frames cause risk seeking","The same facts, different descriptions, different answers","Doctors respond differently to survival versus mortality statistics","Cash discount versus credit surcharge framing","Organ donation: opt-out default countries have far higher consent","Frames are rarely noticed and rarely corrected","Rationality requires choices that do not depend on framing"],
"Framing: change the wording from gains to losses and people reverse their choice, even though nothing in the world has changed.",
[["The Asian disease","Program A saves 200 of 600 for certain; Program B gives a one third chance of saving all. Most people take the sure thing. Reword it as 400 die for certain versus a two thirds chance that all 600 die, and most take the gamble. The facts are the same; the frame changed."],
["Defaults and wording","Calling the same price a discount for cash or a surcharge for credit changes how people feel. Countries with opt-out organ donation have far higher donor rates than those with opt-in, showing that defaults matter. Most people do not notice how the frame shapes them."]],
[M("What does the Asian disease problem show?","Framing as gains or losses reverses choices",["People are consistent","Experts avoid framing","People ignore numbers"],"Same facts, opposite choices."),
M("Why do opt-out organ donation countries have higher donor rates?","Defaults are powerful",["People are more generous","Hospitals pay","Laws forbid refusal"],"Default effect.")],
T("Equivalent descriptions of a choice always produce the same decision.",false,"They often produce opposite ones.")),
]],
["Two selves","Part 5: chapters 35 to 38 and conclusions",[
LS("heart","Two selves","Chapter 35","The experiencing self and the remembering self.",
"We have an experiencing self that lives moments and a remembering self that keeps score, and the remembering self makes the decisions.",
"Kahneman distinguishes the experiencing self, which feels moment by moment, from the remembering self, which records and evaluates. The cold hand experiment: participants held a hand in painfully cold water for 60 seconds, and in another trial for 60 seconds followed by 30 seconds in slightly warmer water. Most chose to repeat the longer trial, because the ending was less bad. This reflects the peak-end rule, where memory depends on the most intense moment and the end, and duration neglect, where length matters little. In a colonoscopy study, patients with longer procedures ending gently remembered them as less unpleasant.",
["Experiencing self: lives each moment","Remembering self: keeps score and makes decisions","Cold hand experiment: 60 seconds versus 90 seconds with a milder end","Most chose to repeat the longer, better-ending trial","Peak-end rule: memory is the peak plus the ending","Duration neglect: length hardly matters in memory","Colonoscopy patients remembered gentle endings more positively","We choose for our memories, not our experiences"],
"Two selves: you remember an experience by its peak and its end, not its length, and your memory makes the choices.",
[["The cold hand","People endured 60 seconds of cold water, then 90 seconds where the final 30 were a bit warmer. Asked which to repeat, most chose the longer one, though it meant 30 more seconds of pain. The ending improved the memory."],
["Peak and end","The remembering self ignores duration and uses an average of the peak and the end. Patients in a medical procedure who had a slightly easier ending remembered it as milder, and were more willing to return. The experiencing self gets no vote."]],
[M("What is the peak-end rule?","Memory is shaped by the most intense moment and the ending",["Memory averages all moments","Only the start matters","Peaks are forgotten"],"Duration is neglected."),
M("In the cold hand experiment, which did most choose to repeat?","The longer trial with a milder end",["The shorter one","Neither","Whichever came first"],"The memory was better.")],
T("The remembering self weighs duration heavily.",false,"It neglects duration.")),
LS("film","Life as a story","Chapter 36","Why we care about narratives and endings.",
"We evaluate lives and experiences as stories shaped by significant moments and endings, not as sums of moments.",
"Because we think in stories, we care about how they end. People are moved by an opera's death scene as if its length mattered, though a longer life is not necessarily a better one. Kahneman gives an example of a long life with an added unhappy stretch: people judge it as worse than a shorter life with only happy years, the reverse of what summing moments would say. Duration neglect leads us to choose vacations for memorable photos and peak moments. Taking photos or telling stories may be for the remembering self, not for the experiencing one.",
["We judge lives as stories, not sums","Endings dominate evaluation: Violetta's death in La Traviata","Adding mildly pleasant years to a happy life may be judged worse","Duration neglect appears across settings","Vacation choices serve memories more than moments","Photos and stories serve the remembering self","Conflict between experience and memory raises the question of whose interest counts"],
"Life as a story: we treat a life like a plot and care most about the peak and the ending, not the total time of happiness.",
[["Stories and endings","Kahneman recalls how an opera death scene shapes our feeling for a whole story. In studies, adding years of moderate happiness to a very happy life lowered people's rating of it. Story logic beats arithmetic."],
["For memories or for moments","We pick vacations with photogenic highlights and endings, not necessarily with the most pleasant hours. The tension is that the experiencing self lives the moments while the remembering self decides, leaving open whose welfare matters."]],
[M("How do people judge lives and experiences according to this chapter?","As stories with peaks and endings",["As sums of moments","By cost","By length"],"Narratives dominate."),
M("Whom does a vacation photo mostly serve?","The remembering self",["The experiencing self","Neither","The travel agent"],"Memory keeper.")],
T("Adding mildly pleasant years to a happy life always raises people's rating of it.",false,"It can lower it.")),
LS("sun","Experienced well-being","Chapter 37","Measuring happiness as it is lived.",
"Measuring moment-to-moment feelings gives different answers than asking people to rate their lives.",
"Kahneman and colleagues developed the Day Reconstruction Method, asking people to recall episodes of a day and rate feelings. The U-index is the share of time spent in an unpleasant state. Findings: commuting, work and some chores rank low, while socializing ranks high. Higher income reduces misery from poverty and illness but, in the study he describes, life evaluation kept rising with income while day-to-day happiness stopped rising beyond about 75,000 dollars a year, a threshold that later research challenged and refined. Environment and attention, not temperament alone, shape daily mood.",
["Experienced well-being: feelings in the moment","Day Reconstruction Method: rate episodes of yesterday","U-index: proportion of time in unpleasant states","Commuting and some work rank low; socializing ranks high","Income lessens the pain of misfortune","In the original study, day-to-day happiness plateaued near 75,000 dollars","Later research challenged and refined the plateau claim","Life evaluation and daily mood are different"],
"Experienced well-being: how you feel hour by hour and how you rate your life are different measures with different causes.",
[["Measuring a day","The Day Reconstruction Method asks people to recount episodes of yesterday and how they felt in each. The U-index summarizes the proportion of time spent in unpleasant states. Time spent commuting and in some work rates low; time with friends rates high."],
["Money and mood","Income related differently to life satisfaction and daily emotion in the study described. Poverty makes misfortune worse; above a level, day-to-day mood stopped improving in that data. Kahneman notes caution; later analyses disputed and refined the finding."]],
[M("What does the U-index measure?","The share of time spent in unpleasant states",["Unemployment","University rank","Utility of income"],"A measure of misery in time."),
M("How do experienced well-being and life evaluation differ?","One is momentary feeling and one is a reflective rating",["They are identical","One is about money","One is about health"],"Different measures.")],
T("Later research fully confirmed the 75,000 dollar plateau.",false,"It was challenged and refined.")),
LS("lightbulb","Thinking about life","Chapter 38 and conclusions","The focusing illusion, and what to do with it all.",
"Nothing in life is as important as you think when you are thinking about it; we misjudge what affects happiness because attention exaggerates.",
"The focusing illusion says that when we think about something, we exaggerate its effect on well-being. People in the Midwest imagine Californians are happier, though they are not, because climate is a small part of daily life. Paraplegics are happy more often than outsiders expect because they do not think about their condition all the time. Buying a car or getting a bigger house is overrated for the same reason. In his conclusions Kahneman contrasts Econs, the rational agents of economics, with Humans, who are influenced by System 1. He advises organizations to act as decision factories with checklists, and individuals to learn the vocabulary of errors so they can recognize them in others, since it is easier to spot others' mistakes than your own.",
["Focusing illusion: attention exaggerates a factor's effect on happiness","California climate: not much happier despite beliefs","People adapt to many conditions, including paraplegia","Purchases and status are overrated","Econs versus Humans: rational agents versus real people","Organizations can reduce noise with procedures and checklists","Learn the language of biases to catch them in others","Awareness is limited: System 1 cannot be turned off"],
"The focusing illusion: whatever you are thinking about right now seems more important to your happiness than it really is.",
[["Climate and cars","People believed California must make residents happier because of its weather, but they were no happier than others. Weather is only a small part of daily life, and we adapt to it. The same bias leads people to overvalue a new car, a pay rise or a house."],
["What to do","Kahneman's conclusion is realistic: you cannot turn off System 1, but you can learn to recognize situations where mistakes are likely and slow down. Organizations do better at it than individuals, using procedures, checklists and a shared vocabulary of biases."]],
[M("What is the focusing illusion?","Exaggerating the effect of whatever you are thinking about on happiness",["Focusing too narrowly on work","An optical trick","A rule for photography"],"Attention inflates importance."),
M("What do Econs differ from Humans in?","Econs are perfectly rational; Humans are influenced by System 1",["Econs are richer","Humans are experts","Econs are unemotional"],"A contrast in economics.")],
T("Kahneman believes individuals can fully switch off System 1 bias with effort.",false,"He says awareness helps but is limited; organizations can do better.")),
]],
]}));
MORE.push(MK({id:"laozi",t:"Tao Te Ching",a:"Lao Tzu",y:-400,
q:"how should a person, and a ruler, live in harmony with the way things are?",
ans:"The Tao Te Ching, 81 short poems attributed to Laozi, says the Tao, the way of all things, cannot be named or grasped. The wise person follows it by acting without forcing, staying humble and soft like water, wanting little, knowing when enough is enough, and leading so lightly that people feel they did it themselves. The first 37 chapters mostly concern the Tao and the last 44 its power or virtue, De.",
cov:"Seventeen lessons cover all 81 chapters in their traditional order, four or five chapters at a time, with each chapter's teaching in the details. Cross-checked against a full translation; translations differ a lot, so wording here is paraphrased.",
u:[
["The Way (Dao)","Chapters 1 to 37",[
LS("route","The nameless Way","Chapters 1 to 4","The Tao cannot be put into words, and opposites define each other.",
"The Tao that can be spoken is not the constant Tao, opposites create each other, and the Tao is empty yet never used up.",
"Chapter 1 opens by saying that a Way that can be described is not the constant Way: the nameless is the origin of heaven and earth, while the named is the mother of the ten thousand things. Chapter 2 says recognizing beauty creates ugliness and goodness creates badness, so the sage acts without forcing and does not claim credit. Chapter 3 says not prizing rare goods or status stops people from competing and stealing, so ruling by non-action keeps order. Chapter 4 describes the Tao as empty but inexhaustible, blunting sharpness, untangling knots and seeming older than the gods.",
["Ch 1: words cannot capture the constant Tao; the nameless is the origin","Ch 2: opposites arise together; the sage acts without forcing and without claiming credit","Ch 3: do not prize status or rare goods and people stop competing and stealing","Ch 3: govern by emptying minds and filling bellies, ruling through non-action","Ch 4: the Tao is empty yet inexhaustible","Ch 4: it blunts sharpness, untangles conflict and seems to precede the gods"],
"The Tao Te Ching starts by admitting that the deepest thing cannot be said, and that every label creates its opposite.",
[["The unspeakable","The first chapter says that a Way that can be told is not the constant Way, and that a name that can be named is not the constant name. The nameless gives rise to heaven and earth; naming divides things into the ten thousand. Reading the book means holding both views, with and without desire."],
["Opposites and simplicity","When everyone knows beauty, ugliness appears; when everyone knows good, so does bad. Long and short, high and low define each other. The sage works without forcing and does not own results. Chapter 3 adds that glorifying status and rare goods breeds rivalry and theft, so rule quietly."]],
[M("What does Chapter 1 say about the constant Tao?","It cannot be fully captured in words",["It is a law of the state","It is a god with a name","It is a number"],"Words fall short."),
M("Why does Chapter 3 say not to prize rare goods?","Prizing them makes people compete and steal",["They are too expensive","They are fake","They cause weather"],"Desire stirs conflict.")],
T("Chapter 2 says beauty and ugliness are independent of each other.",false,"They arise together.")),
LS("sun","Empty and impartial","Chapters 5 to 8","Heaven's impartiality, the valley spirit, selflessness and water.",
"Heaven and earth are impartial; the Tao is a never-dying valley; the sage lasts by putting himself last, and the highest good is like water.",
"Chapter 5 says heaven and earth do not play favorites, treating creatures like straw dogs, and the sage is likewise impartial; too many words wear us out, so keep to the center. Chapter 6 calls the valley spirit deathless, the dark mother and gateway of heaven and earth, drawn on without effort. Chapter 7 says heaven and earth endure because they do not live for themselves, so the sage puts himself last and ends first. Chapter 8 says the highest good is like water: it benefits all things without competing and settles in low places, so it avoids blame.",
["Ch 5: heaven and earth are impartial, treating all things alike","Ch 5: too much speech exhausts; hold to the center","Ch 6: the valley spirit never dies; it is the root of heaven and earth","Ch 7: heaven and earth last because they do not live for themselves","Ch 7: the sage puts himself last and finds himself first","Ch 8: the highest goodness is like water","Ch 8: it benefits all without contending, so it is blameless"],
"Water is the book's central image: it helps everything, fights nothing, and goes to the places others avoid.",
[["Impartial and hollow","Heaven and earth do not favor anyone, and the sage acts the same way. The space between them is like a bellows, empty and yet it never runs dry. The valley spirit never dies and is described as the mysterious female, the root of heaven and earth."],
["Selfless and water-like","Heaven and earth are long-lasting because they do not live for themselves. The sage puts himself behind and so comes first, and gives up self-interest and so gains it. Water helps ten thousand things without competing and rests in low places, so it comes close to the Tao."]],
[M("What does Chapter 8 compare the highest good to?","Water",["Fire","A mountain","A sword"],"It benefits without contending."),
M("Why do heaven and earth last, according to Chapter 7?","They do not live for themselves",["They are old","They are huge","They are hard"],"Selflessness lasts.")],
T("Chapter 5 says heaven and earth favor the good and punish the bad.",false,"They are impartial.")),
LS("blocks","Enough, emptiness and unclinging","Chapters 9 to 13","Do not overfill, use the empty space, and stop clinging to favor.",
"Stopping at enough keeps things safe; usefulness lives in emptiness; and anxiety about praise or disgrace comes from clinging to the self.",
"Chapter 9 warns that overfilled vessels spill and over-sharpened blades dull, that wealth with arrogance invites ruin, and that withdrawing when the work is done is the way of heaven. Chapter 10 praises holding to unity, becoming soft like an infant, and nurturing without possessing. Chapter 11 shows that usefulness comes from emptiness: the hub of a wheel, the hollow of a pot and the space in a room. Chapter 12 says the senses can be overwhelmed by colors, sounds and flavors, so the sage attends to the belly rather than the eye. Chapter 13 says both favor and disgrace cause fear, and that only someone who does not cling to the self can be trusted with the world.",
["Ch 9: overfilling and oversharpening cannot last","Ch 9: withdraw once your work is done","Ch 10: embrace unity, stay soft like an infant, nurture without owning","Ch 11: the hollow of the wheel hub, the pot and the room make them useful","Ch 12: sensory excess blinds and dulls; choose inner nourishment","Ch 13: favor and disgrace both cause anxiety","Ch 13: one who values the world as himself can be trusted with it"],
"Chapter 11's lesson: what makes a cup useful is the empty space inside it.",
[["Know when to stop","A bowl filled to the brim spills; a blade honed too sharp loses its edge. Wealth and honor joined with pride lead to a fall. When you have done your task, step back. This is how heaven works."],
["Emptiness and the self","The wheel works because of its empty hub, the pot because of its hollow, the room because of its space. Likewise, we are caught in fear of praise and shame because we cling to a self. If you can value the world as yourself, you can be trusted with it."]],
[M("What does Chapter 11 say makes a pot useful?","Its emptiness",["Its clay","Its color","Its price"],"Use comes from hollow space."),
M("According to Chapter 9, what is the way of heaven after the work is done?","Withdraw",["Boast","Expand","Collect rewards"],"Do not linger on success.")],
T("Chapter 13 says favor and disgrace both cause anxiety.",true,"Both are tied to the self.")),
LS("compass","The formless and the humble","Chapters 14 to 18","The Tao cannot be grasped, the ancient masters, return to the root, the best ruler and the cost of virtue talk.",
"The Tao is formless yet knowable by its pattern; the ancients were careful and humble; the best ruler is barely noticed; and moral labels arise only after the Way is lost.",
"Chapter 14 says the Tao cannot be seen, heard or grasped, yet knowing the ancient way helps us understand the present. Chapter 15 describes the old masters as subtle and deep, cautious like crossing a winter stream and yielding like melting ice. Chapter 16 urges reaching complete emptiness and calm: all things return to their root, and knowing this constancy brings insight. Chapter 17 ranks rulers: the best is hardly known, then those loved, feared and despised; when his work is done the people say they did it themselves. Chapter 18 says that kindness and morality appear when the great Way is lost, along with hypocrisy and family strife.",
["Ch 14: the Tao cannot be seen, heard or grasped","Ch 14: knowing the ancient way lets you grasp the present","Ch 15: the ancient masters were subtle, cautious, humble and open","Ch 16: reach emptiness and stillness; all things return to their root","Ch 16: knowing the constant brings insight and safety","Ch 17: the best ruler is barely noticed; people say they did it themselves","Ch 17: worse rulers are loved, feared and despised","Ch 18: moral labels arise when the Way is lost"],
"Chapter 17 ranks leaders: the best are barely noticed, and when the work is done everyone says they did it themselves.",
[["Subtle and still","The Tao is beyond sight, hearing and touch, an indistinct whole. The ancient masters were cautious, humble, simple and open. Chapter 16 advises returning to stillness: everything grows and then returns to its root, and knowing this constancy brings clarity and peace."],
["Leaders and virtue","The best ruler is hardly known to his people. Next come rulers who are loved, then feared, then despised. A good leader speaks little and when the work is done, people say they did it themselves. Chapter 18 notes that talk of kindness and duty arises only after the Way has been lost."]],
[M("Who is the best ruler in Chapter 17?","The one the people barely notice",["The one most feared","The one most praised","The richest"],"People say they did it themselves."),
M("What does Chapter 16 say all things do?","Return to their root",["Rise forever","Fight","Multiply"],"Cycle and stillness.")],
T("Chapter 18 says moral rules appear when the Way is followed.",false,"They appear when it is lost.")),
LS("book","Simplicity and yielding","Chapters 19 to 22","Return to the uncarved block and keep whole by bending.",
"Cut cleverness and desire to return to simplicity; the Tao is elusive but real; and yielding keeps things whole.",
"Chapter 19 suggests dropping sageliness, cleverness, benevolence and profit, and instead showing plainness, embracing the uncarved block and reducing selfishness and desire. Chapter 20 voices the sage as a person out of step with the busy world, appearing dull and unsettled, but valuing the nourishment of the mother, the Tao. Chapter 21 says the highest virtue follows the Tao alone; the Tao is dim and elusive yet contains images, things and essence that are true. Chapter 22 says what bends is kept whole, the crooked becomes straight, the empty is filled; the sage embraces the one and does not show off, so no one can compete with him.",
["Ch 19: give up cleverness and profit; show plainness and hold the uncarved block","Ch 19: reduce selfishness and desires","Ch 20: the sage feels out of step with the busy crowd","Ch 20: he values being nourished by the mother, the Tao","Ch 21: the Tao is elusive but holds image, thing and essence","Ch 22: yield and you stay whole; bend and you become straight","Ch 22: the sage does not show off, so no one can compete with him"],
"The uncarved block: simplicity before cleverness, and strength from bending rather than breaking.",
[["Return to plain","The text suggests cutting back on cleverness, rules and the chase for profit. Hold on to the plain, the uncarved block, with fewer wishes. The sage can look slow and out of step beside people absorbed in their business, but he draws his nourishment from the Tao."],
["Bend to stay whole","Chapter 22 collects paradoxes: the crooked becomes straight, the hollow is filled, the worn out is renewed. The sage embraces the one, does not display himself and therefore shines. Because he does not compete, nobody can compete with him."]],
[M("What does the uncarved block stand for?","Simplicity before it is shaped by cleverness",["A stone monument","A building plan","A tool"],"Plainness."),
M("What does Chapter 22 say about bending?","What bends is kept whole",["Bending is weakness","Only the stiff survive","Bending is dishonest"],"Yielding preserves.")],
T("Chapter 19 praises sharpening cleverness and profit.",false,"It recommends giving them up.")),
LS("scale","Natural speech and the four greats","Chapters 23 to 26","Little talk, no showing off, the great Tao and the heavy root.",
"Natural things do not last when forced; do not show off; the Tao is the formless mother that others follow; and stillness is the master of restlessness.",
"Chapter 23 says nature speaks little: a gale does not last all morning. Whoever joins with the Tao, with virtue or with loss is welcomed by it, and lack of trust invites distrust. Chapter 24 says someone standing on tiptoe cannot stand firm, and showing off, boasting and self-righteousness do not last. Chapter 25 describes something formless and complete that existed before heaven and earth, named the Tao for convenience; it is great, and the four great things are the Tao, heaven, earth and the human, each following what is naturally so. Chapter 26 says heaviness is the root of lightness and stillness the ruler of restlessness, so the wise stay grounded even amid luxury.",
["Ch 23: nature speaks little; gales and storms do not last","Ch 24: tiptoeing, striding and showing off do not endure","Ch 24: boasting and self-righteousness are excess baggage","Ch 25: something formless existed before heaven and earth","Ch 25: four great: Tao, heaven, earth and the human","Ch 25: the Tao follows what is naturally so","Ch 26: heaviness is the root of lightness; stillness governs restlessness"],
"Chapter 25: the Tao follows nature, the human follows the earth, and so everything follows what is naturally so.",
[["Do not force","A storm does not last all morning, and a person on tiptoe cannot stand long. Showing off, boasting and striding ahead exhaust themselves. Natural speech is sparing."],
["Four greats and stillness","Before heaven and earth there was something complete and silent, which we call the Tao. There are four great things: the Tao, heaven, earth and the human. Humans follow earth, earth follows heaven, heaven follows the Tao, and the Tao follows its own nature. Chapter 26 adds that stillness governs restlessness and a steady person stays rooted."]],
[M("Which are the four great things in Chapter 25?","The Tao, heaven, earth and the human",["Fire, water, earth and air","King, army, law and land","Birth, life, death and rebirth"],"The chain of following."),
M("What does Chapter 26 say governs restlessness?","Stillness",["Speed","Wealth","Learning"],"Heavy root, light branch.")],
T("Chapter 24 says showing off helps a person stand firm.",false,"It does not last.")),
LS("shield","Leaving no trace","Chapters 27 to 31","Skillful action, balance, the sacred vessel and the reluctance for war.",
"The skilled leave no trace; know the strong but keep the soft; do not try to seize the world; and weapons are tools of mourning.",
"Chapter 27 says a good traveler leaves no tracks and the sage helps everyone without discarding anyone; teacher and student need each other. Chapter 28 advises knowing the masculine yet keeping to the feminine, knowing the bright yet keeping to the dark, so you return to the uncarved block. Chapter 29 says the world is a sacred vessel that cannot be controlled; those who try to hold it lose it, so the sage avoids extremes, excess and arrogance. Chapter 30 says advising a ruler by the Tao means avoiding force, as war brings thorns and bad harvests, and what flourishes too strongly then ages. Chapter 31 says weapons are ill-omened tools, to be used only when unavoidable and with calm; a victory should be mourned.",
["Ch 27: skillful action leaves no trace; the sage abandons no one","Ch 27: teacher and student depend on each other","Ch 28: know the masculine but keep the feminine; return to the uncarved block","Ch 29: the world is a sacred vessel; trying to seize it ruins it","Ch 29: the sage avoids extremes, excess and arrogance","Ch 30: avoid force; war brings hardship","Ch 30: what grows strong soon ages","Ch 31: weapons are ill-omened; mourn even victory"],
"Chapter 29: the world is like a sacred vessel; grip it too hard and you lose it.",
[["Soft and balanced","A skilled walker leaves no tracks; the sage helps everyone and wastes no one. Know the strong but guard the soft, know the bright but stay with the dark. This keeps you close to the uncarved block."],
["Do not seize or fight","Trying to control the world ruins it, so avoid extremes. A leader who follows the Tao does not rely on force, because force invites rebound and war brings famine. Weapons are tools of ill omen; use them reluctantly, and mourn even after winning."]],
[M("What does Chapter 29 compare the world to?","A sacred vessel",["A battlefield","A market","A garden"],"It cannot be seized."),
M("How does Chapter 31 say to treat victory in war?","With mourning",["With celebration","With pride","With plunder"],"Weapons are ill-omened.")],
T("Chapter 28 advises discarding the soft side entirely.",false,"It advises keeping it.")),
LS("lightbulb","Knowing self, contentment and the soft overcoming the hard","Chapters 32 to 37","The nameless Tao, mastering yourself, how things turn into opposites and non-action.",
"The unnamed Tao settles things when rulers hold to it; mastering yourself is true strength; opposites turn into one another; and the Tao acts by not acting.",
"Chapter 32 says the unnamed Tao is small but nothing can master it, and if rulers hold to it all things will fall into order. Chapter 33 says knowing others is clever but knowing yourself is wise, and overcoming yourself is real strength; one who knows contentment is rich. Chapter 34 shows the Tao nourishing everything without claiming it. Chapter 35 says people flock to one who holds the great image, and that the Tao seems bland though inexhaustible. Chapter 36 explains how things get shrunk after being expanded and weakened after being strengthened, so the soft overcomes the hard and the state's sharp weapons stay hidden. Chapter 37 says the Tao does nothing yet leaves nothing undone; if rulers hold to it, all things transform on their own.",
["Ch 32: the nameless Tao cannot be mastered; rulers who hold it find order arises","Ch 33: knowing others is intelligence; knowing yourself is wisdom","Ch 33: mastering yourself is true strength; contentment is wealth","Ch 34: the Tao nourishes all things without claiming them","Ch 35: the Tao is plain and bland yet its use is endless","Ch 36: what is to be shrunk is first expanded; the soft overcomes the hard","Ch 36: keep sharp tools out of sight","Ch 37: the Tao does nothing yet nothing is left undone"],
"Chapter 33: knowing others is wisdom of a sort, but knowing yourself is real clarity and mastering yourself is real strength.",
[["Self-knowledge","The nameless Tao is simple and small, yet nothing can dominate it. Chapter 33 says those who understand others are clever, but those who understand themselves are wise; those who conquer others have force, but those who conquer themselves are strong. A person who knows contentment is rich."],
["Reversals and non-action","What shrinks is first stretched; what weakens is first strengthened. The soft overcomes the hard. The Tao seems to do nothing, yet nothing is left undone, and if rulers hold to it, things transform of themselves. Chapter 37 ends the first half."]],
[M("What does Chapter 33 call true strength?","Mastering yourself",["Conquering others","Wealth","Fame"],"Self-mastery."),
M("What does Chapter 37 say about the Tao?","It does nothing, yet nothing is left undone",["It does everything by force","It does nothing at all","It needs rulers"],"Non-action.")],
T("Chapter 36 says the hard always overcomes the soft.",false,"The soft overcomes the hard.")),
]],
["Power and virtue (De)","Chapters 38 to 81",[
LS("flame","Virtue and ritual","Chapters 38 to 42","Real virtue versus show, oneness, returning and the three responses of scholars.",
"True virtue does not display itself; ritual signals decay; everything draws strength from oneness; and Tao moves by returning.",
"Chapter 38 begins the second half: superior virtue does not try to be virtuous and so has virtue, while inferior virtue tries to show it; when the Tao is lost, there is virtue, then benevolence, then righteousness, then ritual, the thin shell of loyalty and honesty. Chapter 39 says heaven, earth, spirits, valleys and rulers draw strength from oneness, and rulers stay secure by calling themselves lowly. Chapter 40 says the Tao moves by returning and works through weakness; things arise from being and being from non-being. Chapter 41 says three kinds of scholars hear of the Tao: the best practice it, the middling waver and the lowest laugh; if they did not laugh, it would not be the Tao. Chapter 42 says the Tao gave birth to one, two, three and then all things, which carry yin and yang and blend by qi.",
["Ch 38: real virtue is unselfconscious; ritual is the husk of decay","Ch 38: choose substance over show","Ch 39: all things are strong when they hold to oneness","Ch 39: rulers call themselves lowly to stay secure","Ch 40: the Tao returns; weakness is its function","Ch 40: being comes from non-being","Ch 41: three scholars: the best practice it, the middling waver, the lowest laugh","Ch 42: one, two, three, then the ten thousand things carry yin and yang"],
"Chapter 41: when the foolish laugh at the Way, that is part of how you know it is the Way.",
[["De and ritual","The highest virtue does not seek to be virtuous. After the Way is lost come virtue, benevolence, righteousness and finally ritual, which is the thin edge of faith and loyalty and the beginning of confusion. Choose the substance and not the flower."],
["Oneness and the three scholars","Everything that is whole is so by holding oneness, and rulers call themselves orphaned and humble. The Tao returns and yields. When the best scholar hears of it he practices it, the average one wavers and the lowest laughs. Out of the Tao come one, two, three and everything else."]],
[M("What does Chapter 38 call ritual?","The thin shell of loyalty and trust, a sign of disorder",["The root of the Tao","The highest virtue","A kind of art"],"Substance over show."),
M("How does the lowest type of scholar respond to the Tao in Chapter 41?","He laughs at it",["He studies it","He teaches it","He fears it"],"If he did not laugh it would not be the Tao.")],
T("Chapter 40 says the Tao acts by force.",false,"It works through weakness and returning.")),
LS("sun","Soft overcomes hard","Chapters 43 to 47","The softest things win, know when enough is enough, and see without traveling.",
"The softest overcomes the hardest, fame and wealth cost more than they give, and knowing enough protects you.",
"Chapter 43 says the softest thing in the world gallops through the hardest, and that wordless teaching and non-action are rarely understood. Chapter 44 asks whether fame or the self is dearer, and says that great love means great cost, and that knowing when you have enough and when to stop avoids disgrace and danger. Chapter 45 says great perfection seems incomplete, great fullness seems empty and quiet governs the world. Chapter 46 says when the Way prevails, horses plow fields; when it does not, war horses are bred, and the greatest fault is desire and not knowing contentment. Chapter 47 says one can know the world without leaving home and the sage knows without going, sees without looking and succeeds without acting.",
["Ch 43: the softest overcomes the hardest","Ch 43: few understand wordless teaching and non-action","Ch 44: fame, wealth and clinging all cost something","Ch 44: knowing enough and when to stop avoids danger","Ch 45: great completion looks flawed; great fullness looks empty","Ch 45: calm and stillness set things right","Ch 46: peace sends horses to farming; war breeds them for battle","Ch 46: the worst fault is wanting more and never knowing enough","Ch 47: understand the world without leaving home"],
"Chapter 46: the worst misfortune is never knowing when you have enough.",
[["Gentle power","The softest things, like water, move through the hardest. The most effective teaching has no words and the best action involves no struggle, though few grasp this."],
["Enough and insight","Chasing fame and possessions has high costs. Knowing when enough is enough protects you. Peace puts horses in the field; war breeds them at the border. Chapter 47 says wisdom does not come from traveling far, but from looking inward."]],
[M("What does Chapter 44 say protects you from disgrace and danger?","Knowing when to stop and being content",["Gaining more","Fame","Travel"],"Contentment."),
M("What is the greatest fault in Chapter 46?","Wanting more and never knowing enough",["Laziness","Silence","Poverty"],"Desire is the root of strife.")],
T("Chapter 47 says you must travel far to understand the world.",false,"You can know it without leaving home.")),
LS("layers","Subtracting and caring","Chapters 48 to 52","Learning adds and the Tao subtracts; the open mind of the sage; the Tao and its offspring.",
"Learning adds each day while the Tao subtracts; the sage has no fixed mind and treats everyone with care; and the Tao and its virtue nourish all things unbidden.",
"Chapter 48 says that studying adds something daily while following the Tao subtracts something daily until you reach non-action. Chapter 49 says the sage has no fixed mind and takes the people's mind as his own, treating the good and the not-good with goodness and the faithful and the unfaithful with trust, caring for all like children. Chapter 50 says of ten people three live long, three die young and three throw their lives away by overdoing, while one who truly guards life meets no danger because there is no place for death in him. Chapter 51 says the Tao gives birth, virtue nourishes, and all things honor them without being commanded. Chapter 52 says that the world has a source, and by returning to it and guarding the light inside, a person avoids trouble.",
["Ch 48: study adds daily; the Way subtracts daily","Ch 48: reduce until you reach non-action and nothing is undone","Ch 49: the sage has no fixed mind and takes on the people's concerns","Ch 49: treat the good and the not-good alike with goodness","Ch 50: some live, some die, and some hasten death through excess","Ch 50: one who guards life well has no place for death","Ch 51: the Tao produces and virtue nurtures without commanding","Ch 52: return to the mother; keep the inner light"],
"Chapter 48: learning adds one thing a day; practicing the Tao drops one thing a day.",
[["Less each day","Knowledge accumulates by adding and the Way is practiced by subtracting. You keep letting go until you act without forcing, and then nothing remains undone."],
["The open sage","The sage does not hold a fixed opinion; he uses the people's. He is kind to the good and also to the not-good, and honest with the faithful and the unfaithful, and treats all as children. The Tao gives birth, virtue raises, and nothing commands this respect."]],
[M("How does Chapter 48 contrast learning and the Tao?","Learning adds each day; the Tao subtracts each day",["Both add","Both subtract","Neither changes"],"Unlearning."),
M("How does the sage treat the not-good in Chapter 49?","With goodness",["With contempt","With punishment","With silence"],"Virtue is goodness.")],
T("Chapter 51 says the Tao commands the ten thousand things to honor it.",false,"They honor it spontaneously.")),
LS("user","Rooted, newborn and silent","Chapters 53 to 57","The big road, strong roots, the infant, not speaking, and ruling by non-interference.",
"Stay on the plain Way, cultivate yourself first, be like an infant, those who know do not talk, and the world is won by non-interference.",
"Chapter 53 says the great Way is smooth, but people like byways, and a court of luxury while the fields are weedy is robbery. Chapter 54 says what is well planted is not uprooted, so cultivate the Tao in yourself, your family, village, state and world and each will show its virtue. Chapter 55 compares one with deep virtue to a newborn infant, who is unharmed by stinging creatures, has a strong grip and is whole though not knowing union; forcing life shortens it. Chapter 56 says those who know do not speak, and a person who dulls sharpness, unties knots and mixes with dust is beyond favor and harm. Chapter 57 says to govern with straightness, fight with cunning, but win the world by not meddling: more laws and weapons create more disorder, and when the sage does not act, people transform themselves.",
["Ch 53: the great Way is plain but people prefer byways","Ch 53: luxury at court while fields are empty is robbery","Ch 54: what is well rooted cannot be pulled up","Ch 54: cultivate the Tao in self, family, village, state and world","Ch 55: the person of deep virtue is like an infant","Ch 55: forcing life causes early decline","Ch 56: those who know do not speak; dull the sharp, untie the knots","Ch 57: more laws and weapons create more disorder","Ch 57: when the sage does not interfere, people become good on their own"],
"Chapter 57: the more laws and sharp tools a ruler piles up, the more thieves and trouble appear; when the sage does not meddle, people settle themselves.",
[["Plain road, deep roots","The great Way is straight, yet people love shortcuts. A state with luxury and neglected farms has strayed. Chapter 54 asks us to begin with ourselves and expand outward, since what is rooted will not be uprooted."],
["Infant and non-interference","Deep virtue is like a baby: soft, strong-gripped and unharmed. Those who know do not talk. Chapter 57's political point: governing by rules and tricks multiplies problems, while leaving people alone lets them reform themselves."]],
[M("What does Chapter 55 compare the person of deep virtue to?","An infant",["A warrior","A mountain","A king"],"Soft yet whole."),
M("What does Chapter 57 say increases with more laws?","Disorder and thieves",["Order","Honesty","Wealth"],"Meddling backfires.")],
T("Chapter 56 says those who know speak the most.",false,"Those who know do not speak.")),
LS("balance","Light touch","Chapters 58 to 62","Lenient rule, restraint, cooking a small fish, the low position and the Tao as treasure.",
"Rule lightly: lenient government gets sincere people; govern a large state like cooking a small fish; the great should take the low position; the Tao is a treasure for all.",
"Chapter 58 says a dull-seeming government produces simple, honest people, while a sharp, prying one produces cunning ones; fortune and misfortune lean on each other, so the sage is upright without cutting and bright without dazzling. Chapter 59 recommends restraint in managing people and serving heaven; early restraint builds up virtue and lasting roots. Chapter 60 says governing a big state is like cooking a small fish: too much handling ruins it. Chapter 61 says a great state is like low ground where streams gather, and by lowering itself it wins others; the great and small both get what they want when the great is humble. Chapter 62 says the Tao is the hidden storehouse of all things, treasure to the good and refuge to the bad, more valuable than jade or horses.",
["Ch 58: lenient rule yields sincere people; strict rule yields cunning","Ch 58: fortune and misfortune depend on each other","Ch 59: restraint builds up virtue and long life","Ch 60: govern a large state as you cook a small fish","Ch 61: a great state should lie low like the sea","Ch 62: the Tao is a refuge for the good and the bad alike","Ch 62: it is worth more than gifts of jade and horses"],
"Chapter 60: ruling a big country is like cooking a small fish: don't keep poking it.",
[["Handle gently","A government that pries into everything breeds deceit; a gentle one lets people be sincere. Misfortune and fortune lean on each other, so nothing is simply good or bad. Restraint saves strength."],
["Low ground and treasure","Large countries should act like the sea, humbly receiving rivers, and so win trust. The Tao is a storehouse where good people find treasure and others find shelter; it is better than grand gifts."]],
[M("What is ruling a great state like in Chapter 60?","Cooking a small fish",["Building a wall","Plowing a field","Steering a ship"],"Do not over-handle."),
M("What should the great do toward the small in Chapter 61?","Take the lower position",["Dominate","Ignore","Attack"],"Humility attracts.")],
T("Chapter 58 says strict, prying rule produces sincere people.",false,"It produces cunning ones.")),
LS("star","Small beginnings","Chapters 63 to 66","Act without acting, begin before things form, simplicity in rule and the lowly sea.",
"Deal with things while they are small, a thousand-mile journey begins with one step, and leaders lead from below.",
"Chapter 63 says to act without acting, taste the flavorless and repay resentment with kindness; take on the hard while it is easy and the great while it is small. Chapter 64 says what is stable is easy to hold, what has not yet begun is easy to plan for, and a journey of a thousand miles starts with one step; one who acts spoils and one who grasps loses, so the sage does not force and does not lose. Chapter 65 says ancient rulers did not make people clever but kept them simple, because ruling by cleverness harms a state, and ruling without it blesses it. Chapter 66 says rivers and seas rule the hundred valleys by lying lower, so the sage who puts himself below leads without being a burden.",
["Ch 63: act without acting; handle difficulties while they are small","Ch 63: repay resentment with virtue","Ch 64: plan before things begin; a thousand miles starts with a step","Ch 64: forcing spoils; grasping loses","Ch 64: learn to unlearn","Ch 65: the ancients kept people simple rather than clever","Ch 65: ruling by cleverness harms the state","Ch 66: the sea rules the valleys by being lower"],
"Chapter 64: the journey of a thousand miles begins with a single step, and trouble is easiest to fix before it takes shape.",
[["Start small","Difficult tasks are easiest when they are still easy, and great ones when they are still small. A big tree grows from a tiny shoot, and a long road from a single step. Rushing or grabbing ruins them."],
["Simple rule, low leader","A ruler who keeps people simple benefits the state; one who feeds on cleverness harms it. Like the sea that sits below the rivers, a leader who lowers himself rules without anyone feeling pressed."]],
[M("How does a journey of a thousand miles begin?","With a single step",["With a map","With an army","With a feast"],"Start small."),
M("Why does the sea rule the valleys in Chapter 66?","It lies lower than them",["It is deep","It is big","It is salty"],"Humility leads.")],
T("Chapter 63 recommends tackling hard matters after they become large.",false,"Handle them while still small.")),
LS("heart","Three treasures","Chapters 67 to 70","Compassion, frugality and humility; fighting without aggression; yielding in war; teachings that are simple but hard.",
"The three treasures are compassion, frugality and not leading the world; the best leaders do not rage, and the easiest teachings are the hardest to follow.",
"Chapter 67 says everyone calls the Tao great but unlike anything else; the speaker holds three treasures: compassion, frugality and not daring to be first, and from compassion comes courage, from frugality generosity and from humility leadership. Chapter 68 says a good soldier is not warlike, a good fighter does not get angry, a good winner does not compete, and a good employer serves others. Chapter 69 quotes military sayings: be the guest rather than the host, retreat a foot rather than advance an inch, and nothing is worse than underestimating the enemy; when evenly matched, the side that grieves wins. Chapter 70 says the teachings are easy to understand and practice but no one does; the sage wears coarse clothes with jade inside.",
["Ch 67: three treasures: compassion, frugality, not putting oneself first","Ch 67: compassion brings courage; frugality brings generosity; humility brings leadership","Ch 68: the best fighter is not angry; the best leader serves others","Ch 69: yield rather than advance; do not underestimate the enemy","Ch 69: in equal forces, the side that grieves wins","Ch 70: the teachings are easy to understand and hard to practice","Ch 70: the sage wears plain clothes and hides the jade"],
"The three treasures: compassion, frugality and humility, from which courage, generosity and leadership come.",
[["Three treasures","Compassion makes courage possible; frugality makes generosity possible; refusing to put oneself ahead of others makes one fit to lead. Those who reject all three and rush ahead meet ruin."],
["Fighting and teaching","The best soldier is not aggressive and the best fighter is not angry. When fighting cannot be avoided, yield and never think lightly of an enemy. The text ends the section noting that its words are easy to follow but few can do it, like a sage who dresses simply with jade in his heart."]],
[M("Which is NOT among the three treasures?","Wealth",["Compassion","Frugality","Humility"],"The three are compassion, frugality and not leading."),
M("What does Chapter 69 call the greatest danger in war?","Underestimating the enemy",["Fatigue","Weather","Cost"],"Do not look down on opponents.")],
T("Chapter 70 says the teachings are hard to understand but easy to practice.",false,"The reverse: easy to understand, hard to do.")),
LS("search","Limits and fear","Chapters 71 to 75","Admitting what you do not know, not oppressing, restraint, fear of death and heavy taxes.",
"Knowing what you do not know is health; rulers who oppress breed upheaval; boldness leads to death and restraint to life; heavy taxes and meddling cause unrest.",
"Chapter 71 says to know that you do not know is best and to pretend to know is a flaw; the sage sees this flaw as a flaw and so is free of it. Chapter 72 says when people no longer fear authority, a great upheaval comes, so do not crowd their homes or burden their lives. Chapter 73 says bold daring leads to death while bold restraint leads to life; heaven's way wins without contending and its net is wide, with nothing slipping through. Chapter 74 says if people do not fear death, threats of death cannot control them, and killing in the ruler's place is like a clumsy carpenter replacing a master. Chapter 75 says people starve because of excessive taxes, rebel because of meddling rulers and take death lightly because of the demands of life.",
["Ch 71: to know that you do not know is best","Ch 71: pretending to know is a flaw","Ch 72: when people no longer fear authority, great trouble follows","Ch 72: do not crowd people's homes or burden their lives","Ch 73: boldness in daring kills; boldness in restraint preserves","Ch 73: heaven's net is wide yet nothing escapes","Ch 74: threats of death do not deter those who do not fear death","Ch 75: excess taxes and meddling cause hunger and unrest"],
"Chapter 71: knowing you do not know is the highest knowledge; pretending to know is the disease.",
[["Honest limits","The best kind of knowing is knowing what you do not know. The sage recognizes the disease of pretending and so is free of it. Rulers should not press people so hard that they stop fearing authority."],
["Restraint and heavy rule","Daring to be bold kills; daring to hold back preserves. Heaven's net is vast and loosely woven, yet misses nothing. When rulers tax heavily and interfere, hunger and desperation follow, and punishment stops working."]],
[M("What is the best kind of knowing in Chapter 71?","Knowing that you do not know",["Knowing everything","Knowing the law","Knowing the ruler"],"Intellectual humility."),
M("What does Chapter 75 blame for hunger and unrest?","Heavy taxes and meddling rulers",["Bad weather","Foreign armies","Idle people"],"Rulers cause it.")],
T("Chapter 72 advises rulers to crowd and burden the people's lives.",false,"It warns against it.")),
LS("scale","Flexibility, balance and water","Chapters 76 to 81","The living are soft; heaven's way is like a bow; water again; small countries; and plain honest words.",
"Soft and flexible things are alive; heaven evens out excess; water wins; a simple small country is contented; and true words are not pretty.",
"Chapter 76 says people are soft and supple when alive and stiff when dead, so the hard and strong are followers of death and the soft and weak followers of life. Chapter 77 compares heaven's way to bending a bow: it lowers the high, raises the low, takes from excess and gives to want, while human ways do the opposite; only one with the Tao gives from his surplus without credit. Chapter 78 says nothing is softer than water yet nothing beats it against the hard; everyone knows this but few practice it. Chapter 79 says settling a great grievance leaves a leftover grudge, so the sage holds the tally without demanding payment. Chapter 80 describes a small country with few people, where tools go unused, people value their lives, and neighbors within earshot never visit. Chapter 81 ends: true words are not beautiful, and beautiful words are not true; the good do not argue and the sage gives all he has and has more.",
["Ch 76: living things are soft; the dead are stiff","Ch 76: the hard and strong lose to the soft","Ch 77: heaven's way is like a bow: it levels excess and shortage","Ch 77: humans often do the opposite","Ch 78: nothing is softer than water yet nothing beats it","Ch 78: few put the knowledge into practice","Ch 79: heaven favors no one but stays with the good","Ch 80: a small, simple country where people are content at home","Ch 81: true words are not fancy; the good do not argue","Ch 81: the sage gives to others and has more"],
"The last chapter: honest words are plain, the wise do not argue, and the sage who gives everything away ends up with more.",
[["Soft is alive","Babies are soft and supple while the dead are rigid. A tree that cannot bend breaks. Water is the softest thing and yet it wears away stone. Everyone knows it, almost nobody lives by it."],
["Evening out and a plain ending","Heaven's way is like stringing a bow: lowering the high, raising the low. Humans often take from the poor to give to the rich. Chapter 80 imagines a simple small country where people are content, and Chapter 81 closes: sincere words are plain, the wise do not argue, and the sage gives and so has more."]],
[M("What does Chapter 76 say about the living and the dead?","The living are soft; the dead are stiff",["The living are stiff","Both are hard","Both are soft"],"Flexibility is life."),
M("How does the last chapter describe true words?","They are not beautiful",["They are eloquent","They are long","They are secret"],"Plain honesty.")],
T("Chapter 77 says human ways follow heaven's way of evening out.",false,"Humans often do the opposite.")),
]],
]}));
MORE.push(MK({id:"marx",t:"The Communist Manifesto",a:"Karl Marx",y:1848,
q:"why will capitalism give way to a society without classes?",
ans:"Marx and Engels argue that all history is the history of class struggle. The bourgeoisie revolutionized the world but created a working class, the proletariat, that it exploits and that will overthrow it. Communists aim to abolish bourgeois private property and build a classless society. Workers of all countries should unite.",
cov:"Five lessons follow the preamble and the four sections of the pamphlet.",
u:[
["Classes","Preamble and Section I",[
{i:"route",t:"History is class struggle",c:"Preamble and Section I",d:"The specter and the engine of history.",
n:["All history so far is the history of class struggles, now simplified into bourgeoisie versus proletariat.",
"Written by Karl Marx and Friedrich Engels for the Communist League in 1848, the pamphlet opens by saying a specter is haunting Europe, the specter of communism. Section I claims every society has been divided into oppressors and oppressed: free man and slave, lord and serf, guild master and journeyman. Modern society simplifies this into two great camps: the bourgeoisie, who own the means of production, and the proletariat, who must sell their labor.",
["Written by Marx and Engels for the Communist League, 1848","Opening image: a specter haunting Europe","History is the history of class struggles","Past examples: slave and free, serf and lord","Modern society splits into bourgeoisie and proletariat"],
"The Manifesto's core idea: history is driven by class struggle, and capitalism has boiled it down to two classes, owners and workers."],
s:[["l","A specter","Marx and Engels wrote the Manifesto as a short program for a small workers' organization. It begins by saying that all the powers of old Europe have joined to hunt the specter of communism, so it is time communists stated their views openly."],
["m","Who wrote the Manifesto?","Karl Marx and Friedrich Engels",["Karl Marx alone","Lenin and Trotsky","Hegel and Marx"],"Engels co-wrote it."],
["l","Two great camps","The history of all hitherto existing society is the history of class struggles. Each era had its oppressors and oppressed. Under capitalism, society splits more and more into bourgeoisie, the owners of factories and capital, and proletarians, who own nothing but their ability to work."],
["x","Match each pair from history",[["Ancient","Free man and slave"],["Feudal","Lord and serf"],["Guilds","Master and journeyman"],["Modern","Bourgeoisie and proletariat"]],"Class conflict takes new forms."],
["t","The Manifesto claims class struggle is a minor feature of history.",false,"It calls it the driving force of history."]],
D:[["m","What defines the bourgeoisie in the Manifesto?","Ownership of the means of production",["Being born noble","Working with their hands","Living in cities"],"Class is about relation to production."]]},
{i:"bolt",t:"The revolutionary bourgeoisie",c:"Section I",d:"What capitalism built, and what it destroyed.",
n:["The bourgeoisie revolutionized production and the world, and in doing so created its own gravediggers.",
"Surprisingly, the Manifesto praises the bourgeoisie's achievements. It tore apart feudal ties, leaving only naked self-interest and cash payment. It created world markets, giant cities and productive forces greater than all previous generations combined. All that is solid melts into air. But it also brings crises of overproduction, and it gathers workers into factories where they organize. It produces its own gravediggers.",
["Capitalism destroyed feudal and religious bonds","Relations reduced to cash payment and self-interest","Constant revolution of production: all that is solid melts into air","Global markets and cities","Periodic crises of overproduction","Workers concentrated in factories become a class that can organize"],
"Marx and Engels admire capitalism's power even as they predict its end: it transformed the world, but it also gathered the workers who will overthrow it."],
s:[["l","All that is solid melts","The bourgeoisie cannot exist without constantly revolutionizing production. It drowned old loyalties in the icy water of calculation and made relations between people a matter of payment. It built railways, cities and world markets, drawing even distant nations into its system."],
["m","How do Marx and Engels describe the bourgeoisie's historical role?","Revolutionary, transforming production and society",["Lazy and stagnant","Purely religious","Unimportant"],"They credit its huge achievements."],
["l","Crises and gravediggers","Capitalism produces more than markets can absorb, leading to crises that destroy wealth. Meanwhile it draws workers into factories, where they become mere appendages of machines, wages fall, and they begin to unite in unions. The bourgeoisie produces, above all, its own gravediggers."],
["t","The Manifesto says capitalism suffers recurring crises of overproduction.",true,"Too much is produced for markets to absorb."],
["m","What do Marx and Engels mean by the bourgeoisie's gravediggers?","The working class it creates and concentrates",["Rival nations","Old aristocrats","Machines that replace it"],"Capitalism organizes its own opponents."]],
D:[["m","Why does gathering workers in factories matter for the argument?","It makes it possible for scattered workers to become an organized class",["It raises wages automatically","It ends competition","It removes machines"],"Concentration enables solidarity."]]}]],
["The program","Sections II to IV",[
{i:"scale",t:"Abolishing bourgeois property",c:"Section II",d:"What communists want, and answers to objections.",
n:["Communists aim to abolish bourgeois private property, the ownership of the means of production, not personal possessions.",
"Section II says communists are not a separate party apart from workers; they represent the whole movement. Their theory sums up in one phrase: abolition of private property, meaning bourgeois property in the means of production, which already exists only for a few. They answer objections that they would destroy freedom, family, nation and culture, arguing that these are already hollowed out for the workers.",
["Communists represent the interests of the whole working class","Abolition of private property means property in capital, not personal belongings","For most people, property has already been abolished by capitalism","Replies to objections on family, nation, culture","The working man has no country","Ten measures, including progressive income tax and free public education"],
"The key point of Section II: communists want to abolish bourgeois property, the ownership of factories and capital, not your personal belongings."],
s:[["l","Which property?","The aim is to abolish bourgeois private property: capital, the means of production. Personal property earned by labor is not the target, Marx and Engels argue; capitalism has already denied property to nine tenths of society."],
["m","What kind of property does the Manifesto aim to abolish?","Bourgeois property in the means of production",["All personal belongings","Only land","Only money in banks"],"Capital, not toothbrushes."],
["l","Ten measures","Answering critics, they say the bourgeois family rests on capital, and that workers have no country. Then they list measures for advanced countries, including a heavy progressive income tax, abolition of inheritance, centralized credit, state control of transport, and free education for all children in public schools, with an end to child factory labor."],
["t","One of the ten measures is free education for all children in public schools.",true,"Along with ending child factory labor."],
["m","What do the authors say about nationality?","The working men have no country",["Nations are sacred","Workers should fight for empires","Borders must be expanded"],"Class matters more than nation."]],
D:[["m","Why do the authors say communism will not take property from most people?","Capitalism has already left most people without property in capital",["They plan to print more money","Most people own factories","Property will be shared by kings"],"They turn the objection around."]]},
{i:"star",t:"Other socialisms, and unite",c:"Sections III and IV",d:"Rival socialisms and the closing call.",
n:["They dismiss rival socialisms as reactionary, bourgeois or utopian, and end: workers of all countries, unite.",
"Section III criticizes other socialisms: reactionary feudal socialism that longs for the past, petty-bourgeois socialism, German true socialism, conservative or bourgeois socialism that wants reform without revolution, and critical-utopian socialism of thinkers like Saint-Simon, Fourier and Owen, who saw the problems but dreamed up ideal communities instead of class struggle. Section IV says communists support every revolutionary movement against the existing order and closes with the famous call.",
["Reactionary socialism looks back to the old order","Bourgeois socialism wants to fix capitalism without ending it","Utopian socialists: Saint-Simon, Fourier, Owen","Utopians saw the problem but ignored class struggle","Communists support revolutionary movements everywhere","The proletarians have nothing to lose but their chains"],
"It ends with the most famous line: the workers have nothing to lose but their chains. Workers of all countries, unite."],
s:[["l","Rival socialisms","The authors sort other socialists into camps. Some aristocrats used socialist language to attack the bourgeoisie while longing for feudalism. Some reformers wanted to fix capitalism's worst features to preserve it. Utopians like Saint-Simon, Fourier and Owen imagined perfect communities but did not see the working class as the force of change."],
["x","Match each socialism to its flaw",[["Reactionary","Longs for the feudal past"],["Bourgeois","Reform without revolution"],["Utopian","Ideal plans, no class struggle"],["Communist","Their own position"]],"Section III clears the field."],
["l","The closing call","Section IV states that communists everywhere support revolutionary movements against the existing social and political order. They disdain to hide their aims. The ruling classes may tremble; the proletarians have nothing to lose but their chains and a world to win. Workers of all countries, unite."],
["m","Which thinkers are called critical-utopian socialists?","Saint-Simon, Fourier and Owen",["Hegel and Kant","Smith and Ricardo","Lenin and Mao"],"They designed ideal communities."],
["t","The Manifesto asks communists to hide their aims to avoid persecution.",false,"It says they disdain to conceal their views."]],
D:[["m","Why do Marx and Engels reject utopian socialism despite some sympathy?","It relies on ideal plans and appeals to the rich instead of working-class struggle",["It is too violent","It supports the monarchy","It ignores religion"],"Change must come from class conflict, in their view."]]}]],
["Legacy","Reading it today",[
{i:"eye",t:"How to talk about it now",c:"Context",d:"What it got right, what it got wrong, and why it lasts.",
n:["The Manifesto foresaw globalization and capitalism's restlessness, but its predictions of revolution and the regimes built in its name are fiercely debated.",
"Many readers, including critics of communism, note how well the Manifesto describes globalization, constant innovation and the spread of market relations. Its predictions fared worse: revolutions did not come first in advanced industrial countries, and workers' living standards rose in many places. Twentieth-century states that claimed Marx's legacy were authoritarian, and their record is central to any discussion. The pamphlet remains one of the most influential political texts ever written.",
["Strong on describing globalization and constant economic change","Predicted increasing poverty of workers; living standards often rose instead","Revolutions came mainly in agrarian countries, not industrial ones","Regimes claiming Marx's legacy were authoritarian","Still central to debates on inequality, labor and capitalism"],
"A fair way to put it: the Manifesto describes capitalism's restless, global power remarkably well, while its predictions of revolution and the states built in its name are where most of the debate lies."],
s:[["l","Prescient and wrong","Readers across the spectrum point out that the Manifesto described a globalizing, constantly innovating economy long before it fully existed. But its expectation that workers would grow ever poorer, and that revolution would first break out in the most advanced industrial nations, did not match what happened."],
["m","Which part of the Manifesto is often called prescient?","Its description of globalization and constant economic change",["Its prediction of rising worker poverty everywhere","Its timeline for revolution","Its account of feudal religion"],"Even critics credit this."],
["t","The first major communist revolutions happened in the most industrialized countries, as predicted.",false,"They came in largely agrarian countries such as Russia and China."],
["m","Why is the Manifesto still widely read?","It shaped modern politics and frames debates on capitalism and inequality",["It is required by law","It is a novel","It is a history of France"],"Its influence is enormous on all sides."]],
D:[["m","Why do discussions of the Manifesto often bring up twentieth-century states?","Authoritarian regimes claimed to act in its name, and their record is part of its legacy",["They wrote the Manifesto","They banned capitalism peacefully everywhere","They followed the ten measures exactly"],"Theory and practice are judged together."]]}]]
]}));
MORE.push(MK({id:"montgomery",t:"Happy City",a:"Charles Montgomery",y:2013,
q:"if cities are built by people, why not build them to make people happy?",
ans:"Montgomery argues that the way we build cities changes how we feel, think and behave. Using happiness science, history and his own street experiments, he shows that the sprawling, car-built city costs us time, money, health and friendships; that closeness, lively street edges, walking, cycling and fair access make us happier; and that the happy city, the green city and the low-carbon city are the same place, which ordinary citizens can help build.",
cov:"Thirteen lessons follow the book's thirteen chapters in order, from the Bogota opening to the closing call to act. Content is built from chapter-level summaries and sources about the book, so use the real book for the full stories.",
u:[
["The idea","Chapters 1 to 3",[
{i:"sun",t:"The Mayor of Happy",c:"Chapter 1",d:"Enrique Penalosa and the claim that cities are for people.",
n:["Penalosa, mayor of Bogota, treated the city as a happiness project and put people before cars.",
"The book opens with Enrique Penalosa, who as mayor of Bogota chose to ride a bicycle instead of traveling in an armored vehicle. Montgomery uses him to make the central claim: happiness in a city is not mainly about wealth, and a city should serve its people instead of its cars. Rising incomes in rich countries have not produced rising happiness, so the question becomes what actually does.",
["Enrique Penalosa, former mayor of Bogota, is the book's opening figure","He rode a bicycle rather than an armored vehicle","Happiness is not tied directly to wealth","Cities should serve people rather than cars","Montgomery asks what urban design does to how we feel"],
"The book's big claim in one line: a city should be judged by whether it makes its people happy, not by how fast cars move or how rich it is."],
s:[["l","A mayor on a bicycle","Montgomery starts in Bogota with its former mayor, Enrique Penalosa. In a city shaped by fear and traffic, Penalosa rode a bicycle instead of traveling in an armored vehicle. For Montgomery, that choice signals a different idea of what a city is for."],
["m","Who is the opening figure of the book?","Enrique Penalosa, former mayor of Bogota",["Jane Jacobs","Le Corbusier","Jan Gehl"],"The first chapter is called The Mayor of Happy."],
["l","Wealth is not the answer","Wealthy nations have grown richer without becoming proportionally happier. If money does not explain happiness, Montgomery asks, what does? His answer will be social ties, time, health, trust and the daily experience of moving through places, all of which are shaped by urban design."],
["t","Montgomery says a city's happiness is mainly determined by how rich its people are.",false,"He argues happiness is not tied directly to wealth."],
["m","What is the guiding principle of this chapter?","Cities should serve people rather than cars",["Cities should be as dense as possible","Cities should maximize economic growth","Cities should copy suburbs"],"People first."]],
D:[["m","Why does Montgomery begin with a mayor rather than a scientist?","To show that urban design is a political choice that can be steered toward wellbeing",["Because mayors know the most psychology","Because Bogota is the happiest city","Because scientists disagree"],"Cities are built expressions of choices."]]},
{i:"building",t:"The city has always been a happiness project",c:"Chapter 2",d:"From the Athenian agora to the modern city.",
