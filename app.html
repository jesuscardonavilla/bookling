{i:"target",t:"Anchors, availability, representativeness",c:"Part 2",d:"Shortcuts that bias judgment.",
n:["We are swayed by arbitrary numbers, by what comes easily to mind, and by stereotypes over base rates.",
"Kahneman, with Amos Tversky, documented heuristics. Anchoring: an arbitrary number influences estimates. Availability: we judge frequency by how easily examples come to mind, so dramatic news distorts risk. Representativeness: we judge by resemblance and ignore base rates. In the Linda problem, people say Linda is more likely a feminist bank teller than a bank teller, which is logically impossible: the conjunction fallacy.",
["Work with Amos Tversky","Anchoring: random numbers affect estimates","Availability: vivid, recent events seem more common","Representativeness: stereotypes over statistics","Base rates are neglected","Linda problem: conjunction fallacy","Law of small numbers: small samples give extreme results"],
"The Linda problem shows how stereotypes beat logic: people judge feminist bank teller as more likely than bank teller, which cannot be true."],
s:[["l","Anchors and availability","People who spin a wheel landing on 10 or 65 give very different estimates of the percentage of African nations in the UN. The random number anchors them. Similarly, after a plane crash in the news, people overestimate flying risk, because examples are easy to recall."],
["m","What is anchoring?","An initial number, even random, biases later estimates",["Refusing to change your mind","Saving money","Fear of the sea"],"The wheel experiment."],
["l","Linda","Linda is described as outspoken and concerned with social justice. Asked whether she is more likely a bank teller, or a bank teller active in the feminist movement, most people choose the second. But a combination can never be more likely than one of its parts. Resemblance to a stereotype overrides logic."],
["t","In the Linda problem, being a feminist bank teller is more probable than being a bank teller.",false,"A conjunction cannot be more probable than either part."],
["x","Match each bias to its example",[["Anchoring","Wheel number shifts estimates"],["Availability","Plane crash news raises fear of flying"],["Representativeness","Judging Linda by stereotype"],["Small numbers","Small schools show extreme results"]],"Part 2's shortcuts."]],
D:[["m","What is regression to the mean, from Kahneman's flight instructor story?","Extreme performances tend to be followed by more average ones, regardless of praise or criticism",["Praise always hurts","Criticism always helps","Pilots get worse with age"],"Instructors misread chance as cause."]]}]],
["Overconfidence","Part 3",[
{i:"x",t:"The illusion of understanding",c:"Part 3",d:"Hindsight, experts, formulas and the planning fallacy.",
n:["We think we understand the past and can predict the future far better than we can.",
"After the fact, events seem inevitable: hindsight bias and the narrative fallacy. Kahneman shows that stock pickers' skill is often an illusion and that simple formulas beat expert judgment in many fields, as Paul Meehl found. Expert intuition can be trusted only in regular environments with quick feedback, like chess or firefighting. The planning fallacy makes us underestimate costs and time; the cure is the outside view, using the record of similar projects, and the premortem.",
["Narrative fallacy: simple stories make the past seem predictable","Hindsight bias: I knew it all along","Illusion of validity: confidence without accuracy","Formulas often beat experts (Meehl)","Trust intuition only in regular environments with feedback","Planning fallacy and the outside view","Premortem: imagine the project failed and explain why"],
"Kahneman's cure for overconfident planning: take the outside view. Ask how long projects like yours usually take, not how long yours feels like it will."],
s:[["l","Stories and hindsight","We explain the past with neat stories in which skill and intent drive everything, ignoring luck. Once we know an outcome, we believe we saw it coming. This makes us overconfident about predicting the future."],
["m","What is hindsight bias?","Believing after the fact that you knew what would happen",["Forgetting the past","Planning too carefully","Distrusting experts"],"I knew it all along."],
["l","Experts and plans","Simple statistical rules often outperform expert judgment, a finding Kahneman credits to Paul Meehl. Intuition works only where the environment is regular and feedback is fast. In planning, people use the inside view and underestimate time and cost. The outside view looks at how similar projects went. A premortem asks a team to imagine failure and explain it."],
["x","Match each idea to its meaning",[["Outside view","Base rates from similar projects"],["Premortem","Imagine failure in advance"],["Planning fallacy","Underestimating time and cost"],["Meehl","Formulas often beat experts"]],"Tools against overconfidence."],
["t","Kahneman says expert intuition is reliable in every field.",false,"Only in regular environments with fast feedback."]],
D:[["m","Why can a firefighter's intuition be trusted but a stock picker's often cannot?","Firefighting offers regular patterns and fast feedback; markets are noisy and unpredictable",["Firefighters are smarter","Markets are illegal","Stocks are random every day by law"],"Valid intuition needs a learnable environment."]]}]],
["Choices","Part 4",[
{i:"scale",t:"Prospect theory and loss aversion",c:"Part 4",d:"How we really weigh gains and losses.",
n:["We judge outcomes relative to a reference point, and losses hurt more than equal gains please.",
"Kahneman and Tversky's prospect theory, which earned Kahneman the Nobel Prize in economics, replaced the idea that people evaluate total wealth. We judge changes from a reference point. Losses loom about twice as large as gains. Sensitivity diminishes as amounts grow. This explains the endowment effect, risk seeking to avoid sure losses, the fourfold pattern, and why framing, like lives saved versus lives lost, changes choices.",
["Reference point: we judge gains and losses, not total wealth","Loss aversion: losses weigh about twice as much","Diminishing sensitivity","Endowment effect: we value what we own more","Risk seeking when facing sure losses","Framing: same facts, different choice","Overweighting small probabilities: lotteries and insurance"],
"Prospect theory in one line: we judge changes, not totals, and losing 100 dollars hurts about twice as much as winning 100 feels good."],
s:[["l","Reference points","Two people have the same wealth today, but one used to have more and one used to have less. They feel very differently. Prospect theory says we evaluate gains and losses from a reference point, not absolute wealth. Losses loom larger: most people refuse a coin flip that loses 100 dollars unless the win is around 200."],
["m","What is loss aversion?","Losses feel stronger than equal gains",["Avoiding all gambles","Liking losses","Treating gains and losses equally"],"About two to one."],
["l","Framing","When a program for a disease is described as saving 200 of 600 people, most choose it. When the same program is described as letting 400 die, most choose the risky alternative. The facts are identical; the frame changes the choice."],
["t","In the disease problem, describing outcomes as lives lost makes people more willing to take risks.",true,"People gamble to avoid sure losses."],
["m","What is the endowment effect?","Valuing something more because you own it",["Donating to charity","Inheriting money","Overpaying taxes"],"Owning shifts the reference point."]],
D:[["m","Why do people buy both lottery tickets and insurance?","They overweight small probabilities of large gains and large losses",["They are irrational in every way","They want to lose money","Insurance is mandatory"],"Part of the fourfold pattern."]]}]],
["Two selves","Part 5",[
{i:"heart",t:"Experiencing self and remembering self",c:"Part 5",d:"Peak-end rule and what makes us happy.",
n:["We remember experiences by their peak and their end, not their length, and the remembering self makes our decisions.",
"Kahneman distinguishes the experiencing self, which lives moment to moment, from the remembering self, which keeps score and makes choices. In colonoscopy studies and the cold-water experiment, people remembered experiences by the peak and the end, ignoring duration, so they preferred a longer painful episode with a milder end. The focusing illusion: nothing in life is as important as you think it is while you are thinking about it.",
["Experiencing self: moment to moment","Remembering self: tells the story and makes decisions","Peak-end rule: memory is shaped by peak and end","Duration neglect: length barely matters in memory","Cold-hand experiment: people chose a longer trial ending less painfully","Focusing illusion: what you focus on seems more important than it is"],
"The peak-end rule: we remember an experience by its most intense moment and how it ended, not by how long it lasted. That's why the remembering self often chooses badly for the experiencing self."],
s:[["l","Two selves","In one study, people held a hand in painfully cold water for 60 seconds, and in another trial for 90 seconds, where the last 30 seconds were slightly less cold. Asked which to repeat, most chose the longer one: more total pain but a better ending. Memory ignored duration."],
["m","Why did people choose the 90-second cold water trial?","It ended less painfully, and memory weights the end",["It was shorter","It was warmer throughout","They misread the instructions"],"Peak-end rule."],
["l","The focusing illusion","People think Californians are happier because of the weather, but they are not much happier. When you think about one factor, it seems more important than it is. Kahneman concludes that the remembering self makes our choices, while the experiencing self lives our lives, and the two often disagree."],
["x","Match each idea to its meaning",[["Peak-end rule","Memory shaped by peak and ending"],["Duration neglect","Length barely counts"],["Remembering self","Keeps score and decides"],["Focusing illusion","What we focus on seems bigger"]],"Part 5 in four ideas."],
["t","Kahneman found that the length of an experience strongly shapes how it is remembered.",false,"Duration is largely neglected."]],
D:[["m","Why does the two selves idea complicate measuring happiness?","Momentary experience and remembered satisfaction can point in different directions",["Happiness cannot be studied","Everyone has the same happiness","Only income matters"],"Which self should count?"]]}]]
]}));
MORE.push(MK({id:"laozi",t:"Tao Te Ching",a:"Lao Tzu",y:-400,
q:"how should a person, and a ruler, live in harmony with the way things are?",
ans:"The Tao Te Ching, 81 short poems attributed to Laozi, says the Tao, the way of all things, cannot be named or grasped. The wise person follows it by acting without forcing, staying humble and soft like water, wanting little, and leading so lightly that people feel they did it themselves.",
cov:"The 81 chapters are short and not in a strict order, so these lessons group them by theme. Chapter numbers refer to the traditional order.",
u:[
["The Way","The nature of Tao",[
{i:"route",t:"The Tao that cannot be named",c:"Chapters 1 and 25",d:"What the Tao is, and why words fail.",
n:["The Tao is the nameless source of everything, and any name for it falls short.",
"The book opens by saying the Tao that can be spoken is not the eternal Tao. It is the source of heaven and earth, prior to names and forms. Laozi calls it the mother of all things and the way the universe moves. Because it can only be pointed to, the text speaks in paradox and image rather than definition.",
["Tao means way or path","The eternal Tao cannot be named or described","Named things arise from the nameless","The Tao is called the mother of all things","Paradox and image are used because definitions fail"],
"The Tao Te Ching opens by warning that any Tao you can put into words is not the real Tao. It is the nameless source behind everything."],
s:[["l","A way beyond words","Tao is usually translated as way. The first chapter says the Tao that can be told is not the constant Tao, and the name that can be named is not the constant name. The nameless is the origin of heaven and earth. Names come later, as we divide the world into things."],
["m","What does the first chapter say about the Tao?","The Tao that can be spoken is not the eternal Tao",["The Tao is the emperor's law","The Tao can be learned from a list of rules","The Tao is a god who judges people"],"Words point at it but cannot capture it."],
["l","Mother of all things","Laozi describes something formless that existed before heaven and earth, silent and complete, moving everywhere without tiring. Not knowing its name, he calls it Tao. People follow earth, earth follows heaven, heaven follows the Tao, and the Tao follows its own nature."],
["t","Laozi gives a precise definition of the Tao early in the text.",false,"He insists it cannot be defined."],
["m","Why does the text rely on paradox and imagery?","Because the Tao cannot be grasped by definitions",["To hide secrets from rulers","Because it was written for children","To entertain the court"],"Images point where definitions fail."]],
D:[["m","What does Te, in the title, roughly mean?","Virtue or power that comes from following the Tao",["War","Writing","Wealth"],"Tao is the way; Te is its expression in a person."]]},
{i:"scale",t:"Opposites need each other",c:"Chapters 2 and 11",d:"Complementary pairs and the usefulness of emptiness.",
n:["Opposites define each other, and emptiness is what makes things useful.",
"Laozi says beauty exists only because of ugliness, and good because of not-good. Long and short, high and low, before and after arise together. So the sage does not cling to one side. In chapter 11 he notes that a wheel's hub, a bowl and a room are useful because of their empty space. What is not there matters as much as what is.",
["Opposites arise together and define each other","Praising one side creates its opposite","The sage does not cling to either extreme","A hub, a bowl and a room are useful through emptiness","Being gives form; non-being gives use"],
"Laozi points out that a bowl is useful because of its empty space. What is absent matters as much as what is present."],
s:[["l","Pairs","When everyone knows beauty as beauty, ugliness appears. Difficult and easy, long and short, high and low complete each other. The sage, seeing this, acts without taking sides and teaches without words."],
["m","According to chapter 2, how do opposites relate?","They arise together and depend on each other",["One always defeats the other","They are unrelated","Only the good side is real"],"Each needs the other to be defined."],
["l","Useful emptiness","Thirty spokes share one hub, and the empty center makes the wheel work. Clay is shaped into a pot, but its usefulness is the hollow. Doors and windows are cut into a room, and the openings make it livable. Something gives form, nothing gives use."],
["x","Match each image to its empty space",[["Wheel","The hole in the hub"],["Bowl","The hollow inside"],["Room","Doors and windows"],["Lesson","Emptiness makes things useful"]],"Chapter 11 in four images."],
["t","Laozi values only what is solid and present.",false,"He shows that emptiness gives things their use."]],
D:[["m","Why does the sage avoid clinging to one side of a pair?","Clinging to one side brings its opposite into being",["It is rude","The emperor forbids it","It wastes time"],"Holding tight creates the reverse."]]}]],
["Living it","The sage's way",[
{i:"sun",t:"Wu wei: doing without forcing",c:"Chapters 37, 48 and 63",d:"Action that does not strain.",
n:["Wu wei means acting in harmony with things instead of forcing them.",
"Wu wei is often translated as non-action, but it means effortless action that does not force or strain. The Tao does nothing, yet nothing is left undone. Laozi advises handling hard things while they are easy and big things while they are small. Pursuing learning adds daily; pursuing the Tao subtracts daily, until you reach doing without forcing.",
["Wu wei: not-forcing, effortless action","The Tao does nothing, yet nothing is left undone","Handle difficulty while it is still easy","Big things begin as small things","Learning adds, the Tao subtracts"],
"Wu wei does not mean doing nothing. It means doing things the way water flows: no forcing, starting small, and letting things take their natural course."],
s:[["l","Doing by not forcing","Laozi says the Tao never acts, yet everything gets done. A person following it acts without straining, like a cook cutting along the natural joints. Forcing creates resistance; flowing with things lets them happen."],
["m","What does wu wei best mean?","Acting without forcing, in harmony with things",["Never doing anything at all","Working as hard as possible","Ordering others to work"],"It is effortless action, not idleness."],
["l","Start small","Chapter 63 advises planning the difficult while it is easy and doing the great while it is small. A tree that fills your arms grows from a tiny shoot; a journey of a thousand miles begins beneath your feet. Chapter 48: in pursuit of learning, something is added each day; in pursuit of the Tao, something is dropped each day."],
["t","In the Tao Te Ching, following the Tao means adding more knowledge every day.",false,"Following the Tao means letting go, day by day."],
["m","What advice does chapter 63 give?","Handle hard things while they are still easy",["Wait until problems are large","Avoid all problems","Let others solve problems"],"Small and early is easier."]],
D:[["m","Why does the text say nothing is left undone through non-action?","When you work with the nature of things, results come without strain",["Servants do the work","Nothing important needs doing","The emperor finishes everything"],"Alignment replaces effort."]]},
{i:"heart",t:"Be like water",c:"Chapters 8, 76 and 78",d:"Softness, humility and the low place.",
n:["Water is soft and humble, yet it overcomes the hard. The sage imitates it.",
"Laozi's favorite image is water. It benefits all things without competing and settles in low places others scorn. Nothing is softer, yet nothing is better at wearing away the hard. Living things are soft and supple; dead things are stiff and hard. So the rigid breaks and the flexible survives.",
["Water benefits everything without contending","It takes the low place, like a humble person","Soft and weak overcome hard and strong","Living things are supple, dead things are stiff","The rigid tree breaks; the bending grass survives"],
"Laozi's model is water: it is soft and stays low, yet nothing wears down stone better. Flexibility outlasts force."],
s:[["l","The highest good is like water","Water nourishes all things and does not compete. It flows to low places people avoid, which is why it is close to the Tao. A good person, like water, chooses a humble position and is content."],
["m","Why does Laozi praise water?","It benefits everything, stays low and does not compete",["It is the strongest force in war","It can be stored easily","It is rare and valuable"],"Humility and service without contention."],
["l","Soft overcomes hard","Nothing under heaven is softer than water, yet nothing beats it for attacking the hard and strong. When born, people are soft and supple; at death, hard and stiff. A stiff army is defeated, a hard tree is cut down. The soft and yielding belong to life."],
["t","Laozi says hardness and rigidity belong to life.",false,"He links them to death."],
["m","What does the image of supple living things teach?","Flexibility endures where rigidity breaks",["Strength always wins","Youth is better than age","Plants are wiser than people"],"Bending keeps you alive."]],
D:[["m","Why does the low place matter in Laozi's thought?","Humility attracts and sustains, as rivers flow down to the sea",["Low ground is safer in war","It is cheaper to live there","It hides people from rulers"],"The sea leads rivers by being lower."]]},
{i:"check",t:"Knowing enough",c:"Chapters 9, 33 and 44",d:"Contentment, self-knowledge and stopping in time.",
n:["Those who know when they have enough are rich; those who know themselves are wise.",
"Laozi warns against excess. Filling a cup to the brim makes it spill; sharpening a blade too much makes it dull. Fame and wealth cost the self. Knowing others is intelligence, knowing yourself is wisdom; mastering others is strength, mastering yourself is true power. Knowing when to stop keeps you from danger.",
["Overfilling spills; oversharpening blunts","Retire when your work is done","Knowing others is cleverness; knowing yourself is wisdom","Mastering yourself is true strength","Contentment is real wealth","Knowing when to stop prevents ruin"],
"Laozi's version of enough: whoever knows they have enough is rich. Stop before the cup spills."],
s:[["l","Stop before the brim","Holding a cup and filling it to the top is not as good as stopping in time. A house full of gold and jade cannot be guarded. Pride in wealth brings its own downfall. Do the work, then step back: that is the way of heaven."],
["m","What lesson does the overfilled cup teach?","Know when to stop",["Always aim for more","Buy bigger cups","Share your drink"],"Excess turns gain into loss."],
["l","Self-knowledge","Chapter 33: knowing others is intelligence; knowing yourself is true wisdom. Overcoming others takes force; overcoming yourself takes real strength. Whoever knows they have enough is rich."],
["x","Match each line to its point",[["Knowing others","Intelligence"],["Knowing yourself","Wisdom"],["Mastering yourself","True strength"],["Knowing you have enough","Real wealth"]],"Chapter 33 in four pairs."],
["t","The text advises staying in a position of power as long as possible after success.",false,"It advises stepping back when the work is done."]],
D:[["m","Why does Laozi say fame and wealth endanger the self?","Chasing them costs health and peace, and great hoards bring great loss",["They are illegal","They make others jealous of the gods","They are impossible to get"],"Attachment brings suffering."]]}]],
["Ruling","Government and peace",[
{i:"user",t:"The ruler who barely appears",c:"Chapters 3, 17 and 57",d:"Light-handed leadership.",
n:["The best leader is barely noticed; people say they did it themselves.",
"Laozi's ideal ruler governs lightly. The best rulers are those people hardly know exist. Next are those they love and praise, then those they fear, and worst those they despise. More laws and prohibitions breed more thieves and poverty. Governing a large state is like cooking a small fish: do not poke it too much.",
["Best ruler: barely known; when the work is done people say we did it ourselves","Then loved, then feared, then despised","More rules make more lawbreakers","Do not exalt the clever, so people will not compete","Govern a great state like cooking a small fish"],
"Laozi's best leader is one people barely notice. When the job is done, they say: we did it ourselves."],
s:[["l","Ranking rulers","Chapter 17 ranks leaders. The best is one the people barely know is there. Next is one they love and praise. Then one they fear. Worst is one they despise. When the best leader's work is done, the people say it happened naturally, by their own doing."],
["m","Who is the best ruler in chapter 17?","One the people barely know exists",["One the people fear","One the people praise loudly","One who passes many laws"],"Invisible leadership lets people own the result."],
["l","Fewer rules","The more prohibitions, the poorer the people. The more sharp weapons, the more chaos. The more laws, the more thieves. So the sage says: I do nothing and people transform themselves. Ruling a large country is like frying a small fish; stir too much and it falls apart."],
["t","Laozi believes more laws lead to more order.",false,"He says more laws create more thieves."],
["m","What does the small fish image warn against?","Interfering too much",["Feeding people too little","Ignoring the economy","Trading with other states"],"Constant meddling breaks things."]],
D:[["m","Why should rulers not exalt the clever, in chapter 3?","Praising cleverness and rare goods stirs competition and theft",["Clever people are always lazy","Cleverness is illegal","Rulers should be the cleverest"],"Desire grows from what is displayed and praised."]]},
{i:"x",t:"Against war, and the small country",c:"Chapters 30, 31 and 80",d:"Weapons, victory and the simple village.",
n:["Weapons are ill-omened tools; even victory should be mourned. The ideal is a small, content community.",
"Laozi says one who helps a ruler with the Tao does not force the world with arms, because force rebounds. Weapons are instruments of misfortune, used only when unavoidable, and a victory should be treated like a funeral. Chapter 80 imagines a small state with few people who have tools but do not use them, love their homes, and are so content they never visit the next village.",
["Force rebounds on those who use it","Weapons are tools of ill omen","Use them only when there is no choice","Celebrate victory with funeral rites","Chapter 80: a small state, content people, simple life"],
"Laozi says weapons are tools of misfortune and that even a victory in war should be mourned like a funeral."],
s:[["l","Ill-omened tools","Where armies camp, thorns grow. After great wars come bad years. A good general achieves his aim and stops, without boasting. Weapons are instruments of misfortune; a gentleman uses them only when he must, and calmly. Whoever delights in killing cannot win the world. Victory is met with mourning."],
["m","How should a victory in war be treated, according to Laozi?","Like a funeral, with mourning",["With a great feast","With new conquests","With higher taxes"],"Killing is never cause for joy."],
["l","The small country","Chapter 80 pictures a little state with few people. They have boats and carriages but no need to use them, weapons but no need to show them. They enjoy their food, their clothes and their customs. Neighbors live close enough to hear each other's roosters, yet people grow old without visiting."],
["t","Chapter 80's ideal society is a large, expanding empire.",false,"It is a small, content community."],
["m","What is the spirit of the small-country chapter?","Contentment with a simple, local life",["Isolation out of fear","Constant trade and travel","Preparing for war"],"Wanting little brings peace."]],
D:[["m","Why does Laozi say force rebounds?","Violence provokes resistance and brings disorder back on its user",["Weapons break easily","Soldiers rebel against pay","Armies get lost"],"What you push, pushes back."]]}]]
]}));
MORE.push(MK({id:"marx",t:"The Communist Manifesto",a:"Karl Marx",y:1848,
q:"why will capitalism give way to a society without classes?",
ans:"Marx and Engels argue that all history is the history of class struggle. The bourgeoisie revolutionized the world but created a working class, the proletariat, that it exploits and that will overthrow it. Communists aim to abolish bourgeois private property and build a classless society. Workers of all countries should unite.",
cov:"Five lessons follow the preamble and the four sections of the pamphlet.",
u:[
["Classes","Preamble and Section I",[
{i:"route",t:"History is class struggle",c:"Preamble and Section I",d:"The specter and the engine of history.",
n:["All history so far is the history of class struggles, now simplified into bourgeoisie versus proletariat.",
"Written by Karl Marx and Friedrich Engels for the Communist League in 1848, the pamphlet opens by saying a specter is haunting Europe, the specter of communism. Section I claims every society has been divided into oppressors and oppressed: free man and slave, lord and serf, guild master and journeyman. Modern society simplifies this into two great camps: the bourgeoisie, who own the means of production, and the proletariat, who must sell their labor.",
["Written by Marx and Engels for the Communist League, 1848","Opening image: a specter haunting Europe","History is the history of class struggles","Past examples: slave and free, serf and lord","Modern society splits into bourgeoisie and proletariat"],
"The Manifesto's core idea: history is driven by class struggle, and capitalism has boiled it down to two classes, owners and workers."],
s:[["l","A specter","Marx and Engels wrote the Manifesto as a short program for a small workers' organization. It begins by saying that all the powers of old Europe have joined to hunt the specter of communism, so it is time communists stated their views openly."],
["m","Who wrote the Manifesto?","Karl Marx and Friedrich Engels",["Karl Marx alone","Lenin and Trotsky","Hegel and Marx"],"Engels co-wrote it."],
["l","Two great camps","The history of all hitherto existing society is the history of class struggles. Each era had its oppressors and oppressed. Under capitalism, society splits more and more into bourgeoisie, the owners of factories and capital, and proletarians, who own nothing but their ability to work."],
["x","Match each pair from history",[["Ancient","Free man and slave"],["Feudal","Lord and serf"],["Guilds","Master and journeyman"],["Modern","Bourgeoisie and proletariat"]],"Class conflict takes new forms."],
["t","The Manifesto claims class struggle is a minor feature of history.",false,"It calls it the driving force of history."]],
D:[["m","What defines the bourgeoisie in the Manifesto?","Ownership of the means of production",["Being born noble","Working with their hands","Living in cities"],"Class is about relation to production."]]},
{i:"bolt",t:"The revolutionary bourgeoisie",c:"Section I",d:"What capitalism built, and what it destroyed.",
n:["The bourgeoisie revolutionized production and the world, and in doing so created its own gravediggers.",
"Surprisingly, the Manifesto praises the bourgeoisie's achievements. It tore apart feudal ties, leaving only naked self-interest and cash payment. It created world markets, giant cities and productive forces greater than all previous generations combined. All that is solid melts into air. But it also brings crises of overproduction, and it gathers workers into factories where they organize. It produces its own gravediggers.",
["Capitalism destroyed feudal and religious bonds","Relations reduced to cash payment and self-interest","Constant revolution of production: all that is solid melts into air","Global markets and cities","Periodic crises of overproduction","Workers concentrated in factories become a class that can organize"],
"Marx and Engels admire capitalism's power even as they predict its end: it transformed the world, but it also gathered the workers who will overthrow it."],
s:[["l","All that is solid melts","The bourgeoisie cannot exist without constantly revolutionizing production. It drowned old loyalties in the icy water of calculation and made relations between people a matter of payment. It built railways, cities and world markets, drawing even distant nations into its system."],
["m","How do Marx and Engels describe the bourgeoisie's historical role?","Revolutionary, transforming production and society",["Lazy and stagnant","Purely religious","Unimportant"],"They credit its huge achievements."],
["l","Crises and gravediggers","Capitalism produces more than markets can absorb, leading to crises that destroy wealth. Meanwhile it draws workers into factories, where they become mere appendages of machines, wages fall, and they begin to unite in unions. The bourgeoisie produces, above all, its own gravediggers."],
["t","The Manifesto says capitalism suffers recurring crises of overproduction.",true,"Too much is produced for markets to absorb."],
["m","What do Marx and Engels mean by the bourgeoisie's gravediggers?","The working class it creates and concentrates",["Rival nations","Old aristocrats","Machines that replace it"],"Capitalism organizes its own opponents."]],
D:[["m","Why does gathering workers in factories matter for the argument?","It makes it possible for scattered workers to become an organized class",["It raises wages automatically","It ends competition","It removes machines"],"Concentration enables solidarity."]]}]],
["The program","Sections II to IV",[
{i:"scale",t:"Abolishing bourgeois property",c:"Section II",d:"What communists want, and answers to objections.",
n:["Communists aim to abolish bourgeois private property, the ownership of the means of production, not personal possessions.",
"Section II says communists are not a separate party apart from workers; they represent the whole movement. Their theory sums up in one phrase: abolition of private property, meaning bourgeois property in the means of production, which already exists only for a few. They answer objections that they would destroy freedom, family, nation and culture, arguing that these are already hollowed out for the workers.",
["Communists represent the interests of the whole working class","Abolition of private property means property in capital, not personal belongings","For most people, property has already been abolished by capitalism","Replies to objections on family, nation, culture","The working man has no country","Ten measures, including progressive income tax and free public education"],
"The key point of Section II: communists want to abolish bourgeois property, the ownership of factories and capital, not your personal belongings."],
s:[["l","Which property?","The aim is to abolish bourgeois private property: capital, the means of production. Personal property earned by labor is not the target, Marx and Engels argue; capitalism has already denied property to nine tenths of society."],
["m","What kind of property does the Manifesto aim to abolish?","Bourgeois property in the means of production",["All personal belongings","Only land","Only money in banks"],"Capital, not toothbrushes."],
["l","Ten measures","Answering critics, they say the bourgeois family rests on capital, and that workers have no country. Then they list measures for advanced countries, including a heavy progressive income tax, abolition of inheritance, centralized credit, state control of transport, and free education for all children in public schools, with an end to child factory labor."],
["t","One of the ten measures is free education for all children in public schools.",true,"Along with ending child factory labor."],
["m","What do the authors say about nationality?","The working men have no country",["Nations are sacred","Workers should fight for empires","Borders must be expanded"],"Class matters more than nation."]],
D:[["m","Why do the authors say communism will not take property from most people?","Capitalism has already left most people without property in capital",["They plan to print more money","Most people own factories","Property will be shared by kings"],"They turn the objection around."]]},
{i:"star",t:"Other socialisms, and unite",c:"Sections III and IV",d:"Rival socialisms and the closing call.",
n:["They dismiss rival socialisms as reactionary, bourgeois or utopian, and end: workers of all countries, unite.",
"Section III criticizes other socialisms: reactionary feudal socialism that longs for the past, petty-bourgeois socialism, German true socialism, conservative or bourgeois socialism that wants reform without revolution, and critical-utopian socialism of thinkers like Saint-Simon, Fourier and Owen, who saw the problems but dreamed up ideal communities instead of class struggle. Section IV says communists support every revolutionary movement against the existing order and closes with the famous call.",
["Reactionary socialism looks back to the old order","Bourgeois socialism wants to fix capitalism without ending it","Utopian socialists: Saint-Simon, Fourier, Owen","Utopians saw the problem but ignored class struggle","Communists support revolutionary movements everywhere","The proletarians have nothing to lose but their chains"],
"It ends with the most famous line: the workers have nothing to lose but their chains. Workers of all countries, unite."],
s:[["l","Rival socialisms","The authors sort other socialists into camps. Some aristocrats used socialist language to attack the bourgeoisie while longing for feudalism. Some reformers wanted to fix capitalism's worst features to preserve it. Utopians like Saint-Simon, Fourier and Owen imagined perfect communities but did not see the working class as the force of change."],
["x","Match each socialism to its flaw",[["Reactionary","Longs for the feudal past"],["Bourgeois","Reform without revolution"],["Utopian","Ideal plans, no class struggle"],["Communist","Their own position"]],"Section III clears the field."],
["l","The closing call","Section IV states that communists everywhere support revolutionary movements against the existing social and political order. They disdain to hide their aims. The ruling classes may tremble; the proletarians have nothing to lose but their chains and a world to win. Workers of all countries, unite."],
["m","Which thinkers are called critical-utopian socialists?","Saint-Simon, Fourier and Owen",["Hegel and Kant","Smith and Ricardo","Lenin and Mao"],"They designed ideal communities."],
["t","The Manifesto asks communists to hide their aims to avoid persecution.",false,"It says they disdain to conceal their views."]],
D:[["m","Why do Marx and Engels reject utopian socialism despite some sympathy?","It relies on ideal plans and appeals to the rich instead of working-class struggle",["It is too violent","It supports the monarchy","It ignores religion"],"Change must come from class conflict, in their view."]]}]],
["Legacy","Reading it today",[
{i:"eye",t:"How to talk about it now",c:"Context",d:"What it got right, what it got wrong, and why it lasts.",
n:["The Manifesto foresaw globalization and capitalism's restlessness, but its predictions of revolution and the regimes built in its name are fiercely debated.",
"Many readers, including critics of communism, note how well the Manifesto describes globalization, constant innovation and the spread of market relations. Its predictions fared worse: revolutions did not come first in advanced industrial countries, and workers' living standards rose in many places. Twentieth-century states that claimed Marx's legacy were authoritarian, and their record is central to any discussion. The pamphlet remains one of the most influential political texts ever written.",
["Strong on describing globalization and constant economic change","Predicted increasing poverty of workers; living standards often rose instead","Revolutions came mainly in agrarian countries, not industrial ones","Regimes claiming Marx's legacy were authoritarian","Still central to debates on inequality, labor and capitalism"],
"A fair way to put it: the Manifesto describes capitalism's restless, global power remarkably well, while its predictions of revolution and the states built in its name are where most of the debate lies."],
s:[["l","Prescient and wrong","Readers across the spectrum point out that the Manifesto described a globalizing, constantly innovating economy long before it fully existed. But its expectation that workers would grow ever poorer, and that revolution would first break out in the most advanced industrial nations, did not match what happened."],
["m","Which part of the Manifesto is often called prescient?","Its description of globalization and constant economic change",["Its prediction of rising worker poverty everywhere","Its timeline for revolution","Its account of feudal religion"],"Even critics credit this."],
["t","The first major communist revolutions happened in the most industrialized countries, as predicted.",false,"They came in largely agrarian countries such as Russia and China."],
["m","Why is the Manifesto still widely read?","It shaped modern politics and frames debates on capitalism and inequality",["It is required by law","It is a novel","It is a history of France"],"Its influence is enormous on all sides."]],
D:[["m","Why do discussions of the Manifesto often bring up twentieth-century states?","Authoritarian regimes claimed to act in its name, and their record is part of its legacy",["They wrote the Manifesto","They banned capitalism peacefully everywhere","They followed the ten measures exactly"],"Theory and practice are judged together."]]}]]
]}));
MORE.push(MK({id:"montgomery",t:"Happy City",a:"Charles Montgomery",y:2013,
q:"if cities are built by people, why not build them to make people happy?",
ans:"Montgomery argues that the way we build cities changes how we feel, think and behave. Using happiness science, history and his own street experiments, he shows that the sprawling, car-built city costs us time, money, health and friendships; that closeness, lively street edges, walking, cycling and fair access make us happier; and that the happy city, the green city and the low-carbon city are the same place, which ordinary citizens can help build.",
cov:"Thirteen lessons follow the book's thirteen chapters in order, from the Bogota opening to the closing call to act. Content is built from chapter-level summaries and sources about the book, so use the real book for the full stories.",
u:[
["The idea","Chapters 1 to 3",[
{i:"sun",t:"The Mayor of Happy",c:"Chapter 1",d:"Enrique Penalosa and the claim that cities are for people.",
n:["Penalosa, mayor of Bogota, treated the city as a happiness project and put people before cars.",
"The book opens with Enrique Penalosa, who as mayor of Bogota chose to ride a bicycle instead of traveling in an armored vehicle. Montgomery uses him to make the central claim: happiness in a city is not mainly about wealth, and a city should serve its people instead of its cars. Rising incomes in rich countries have not produced rising happiness, so the question becomes what actually does.",
["Enrique Penalosa, former mayor of Bogota, is the book's opening figure","He rode a bicycle rather than an armored vehicle","Happiness is not tied directly to wealth","Cities should serve people rather than cars","Montgomery asks what urban design does to how we feel"],
"The book's big claim in one line: a city should be judged by whether it makes its people happy, not by how fast cars move or how rich it is."],
s:[["l","A mayor on a bicycle","Montgomery starts in Bogota with its former mayor, Enrique Penalosa. In a city shaped by fear and traffic, Penalosa rode a bicycle instead of traveling in an armored vehicle. For Montgomery, that choice signals a different idea of what a city is for."],
["m","Who is the opening figure of the book?","Enrique Penalosa, former mayor of Bogota",["Jane Jacobs","Le Corbusier","Jan Gehl"],"The first chapter is called The Mayor of Happy."],
["l","Wealth is not the answer","Wealthy nations have grown richer without becoming proportionally happier. If money does not explain happiness, Montgomery asks, what does? His answer will be social ties, time, health, trust and the daily experience of moving through places, all of which are shaped by urban design."],
["t","Montgomery says a city's happiness is mainly determined by how rich its people are.",false,"He argues happiness is not tied directly to wealth."],
["m","What is the guiding principle of this chapter?","Cities should serve people rather than cars",["Cities should be as dense as possible","Cities should maximize economic growth","Cities should copy suburbs"],"People first."]],
D:[["m","Why does Montgomery begin with a mayor rather than a scientist?","To show that urban design is a political choice that can be steered toward wellbeing",["Because mayors know the most psychology","Because Bogota is the happiest city","Because scientists disagree"],"Cities are built expressions of choices."]]},
{i:"building",t:"The city has always been a happiness project",c:"Chapter 2",d:"From the Athenian agora to the modern city.",
n:["Cities have always been built around ideas of the good life, and over time the idea drifted from shared civic life to private wealth and safety.",
"Montgomery traces the link between happiness and urban design through history. In ancient Athens, the agora was the place where citizens met, and the Greek idea of eudaimonia, flourishing, was tied to civic life. Rome had its public squares too. Over the centuries the goal shifted toward personal glory, security and material wealth. Yet research keeps finding that social trust and connection matter more to happiness than income.",
["Athens: the agora as the center of civic life","Eudaimonia: a flourishing life, tied to public participation","Rome and Enlightenment cities also expressed ideas of the good life","The goal drifted to personal glory, security and wealth","Social trust and connection matter more than income","Aristotle, Socrates and later Freud appear as thinkers on the good life"],
"The city has always been a happiness project: the agora and eudaimonia were about a good shared life, while our modern cities drifted toward private wealth and safety."],
s:[["l","The agora and eudaimonia","In ancient Athens, the agora was the public heart of the city, where people met, traded and argued. Greek thinkers like Socrates and Aristotle tied a good life, eudaimonia, to taking part in civic life. Rome and later European cities also built public spaces around ideas of how people should live."],
["m","What was the agora?","The public gathering place at the heart of Athens",["A Roman road","A military camp","A royal palace"],"It stood for shared civic life."],
["l","The drift","Over time, Montgomery says, the idea of a good life moved from civic participation toward personal glory, then security, then material wealth. Our modern city reflects those later priorities: private homes, private cars and walls against strangers. Yet happiness research keeps pointing back to trust and connection."],
["x","Match each term to its meaning",[["Agora","Public meeting place of Athens"],["Eudaimonia","Flourishing, a good life"],["Civic life","Taking part in shared city life"],["Drift","From shared life to private wealth and safety"]],"The old ideal versus the modern one."],
["t","Montgomery argues social trust and connection matter more to happiness than income does.",true,"This is the thread of the book."]],
D:[["m","What does the historical chapter suggest about modern cities?","They embody choices about what a good life is, and those choices can change",["They are natural and unchangeable","They were always about cars","They copy ancient Rome exactly"],"Design reflects values."]]},
{i:"user",t:"The (Broken) Social Scene",c:"Chapter 3",d:"The dispersed city and what it does to time, money and relationships.",
n:["The dispersed city spreads homes, work and shops apart, which means long commutes, high costs and thinner relationships.",
"Montgomery calls the sprawling city the dispersed city. In places like Stockton, California, hit hard by the foreclosure crisis, and in the exurbs where people like Randy Strausser make extreme commutes, he finds the costs: time, money and friendship. Studies he cites say a person with a one-hour commute needs about 40 percent more income to be as satisfied as someone who walks to work, and Swedish research linked commutes over 45 minutes to a 40 percent higher chance of divorce.",
["Dispersed city: homes, shops and work separated","Stockton, California, and the foreclosure crisis; Cesar Dias","Randy Strausser, an extreme long-distance exurban commuter","A one-hour commute needs about 40 percent more income to match a walker's life satisfaction (Stutzer and Frey)","Swedish study: commutes over 45 minutes linked to 40 percent higher divorce risk","Peak-hour commuters showed stress worse than fighter pilots or riot police","The poorest fifth of US families spend over 40 percent of income on cars","Social networks shrink and distrust among neighbors grows"],
"The commuting math: a one-hour commute needs about 40 percent more pay to be as satisfied as someone who walks to work."],
s:[["l","The dispersed city","Postwar development separated homes, shops, schools and jobs, forcing people to drive for everything. Montgomery visits Stockton, California, where foreclosures emptied neighborhoods, and meets Randy Strausser, who endures a punishing long-distance commute so his family can have the house they wanted."],
["m","What is the dispersed city?","A city where homes, shops and jobs are spread far apart",["A city built around one tower","A city with no cars","A city of villages"],"Separation forces driving."],
["l","The numbers","Economists Bruno Frey and Alois Stutzer found that a person with a one-hour commute needs about 40 percent more income to be as satisfied with life as someone who walks to work. A Swedish study linked commutes over 45 minutes to a 40 percent higher chance of divorce. Researchers who fitted commuters with electrode caps found rush-hour travelers more stressed than fighter pilots or riot police."],
["m","How much extra income does a one-hour commuter need to match a walker's satisfaction?","About 40 percent more",["About 5 percent more","About double","No extra"],"Stutzer and Frey's finding."],
["t","The poorest fifth of American families spend over 40 percent of income on cars.",true,"Car dependence is a heavy cost for the poor."],
["x","Match each study or place to its point",[["Stutzer and Frey","Long commutes need 40 percent more pay"],["Swedish study","Over 45 minutes: more divorce"],["Electrode study","Commuters stressed like fighter pilots"],["Stockton","Foreclosure crisis in a sprawling city"]],"Chapter 3's evidence."]],
D:[["m","Why does Montgomery call a long commute a social cost, not just a private inconvenience?","It cuts into relationships and community life, with effects like higher divorce risk",["It raises taxes","It only affects drivers' pay","It is always chosen freely"],"Distance takes more than time."]]}]],
["How we got here","Chapters 4 and 5",[
{i:"route",t:"How we got here",c:"Chapter 4",d:"Policy, zoning, speed and the car.",
n:["The dispersed city was built by reformers, zoning and policy aiming at separation and speed, not by accident.",
"Modern cities were shaped by policy, incentives and regulation, not natural growth. Reformers reacting to filthy, crowded slums, like those exposed in Andrew Mearns's report on London, proposed two cures: separation and speed. Garden cities and Le Corbusier's Radiant City imagined people living apart from work. Zoning laws made separation legal, and General Motors' Futurama exhibit at the 1939 World's Fair sold a future of highways. Once built around cars, cities forced more car use.",
["Cities were shaped by policy, incentives and regulation","Andrew Mearns exposed London's slums","Reform idea one: separation, through zoning and garden cities","Reform idea two: speed, through cars and highways","Le Corbusier's Radiant City: towers in parks","GM's Futurama at the 1939 World's Fair sold a car future","Car-centered planning reinforced itself"],
"Sprawl was designed: reformers fled slum conditions by separating functions and speeding up movement, and zoning plus highways locked it in."],
s:[["l","Reaction to the slum","Industrial slums, such as those exposed in a famous report on London by Andrew Mearns, were crowded, filthy and deadly. Reformers wanted to escape them. Garden cities offered small, green, separate towns. Le Corbusier imagined towers set in parks. The common idea was to pull homes away from workplaces."],
["m","What problem did early reformers react against?","Crowded, unhealthy industrial slums",["Too many parks","Low population","Too much green space"],"Their concerns were real."],
["l","Separation and speed","Two ideas took hold: separation, written into zoning laws, and speed, delivered by cars and highways. At the 1939 World's Fair, General Motors' Futurama showed visitors a future of vast highways. Once cities were rebuilt around cars, driving became necessary, which justified more road building."],
["t","The book presents sprawl as the natural result of free consumer choice.",false,"It shows policy, zoning and incentives shaped it."],
["m","What was GM's Futurama?","A 1939 World's Fair exhibit selling a future of highways",["A zoning law","A garden city","A slum report"],"It promoted car-based planning."],
["x","Match each idea to its source",[["Garden cities","Separation of homes and work"],["Radiant City","Le Corbusier's towers in parks"],["Zoning","Legal separation of uses"],["Futurama","Selling the highway future"]],"Chapter 4 in four items."]],
D:[["m","Why does Montgomery stress that sprawl was built by policy?","Because what was designed can be redesigned",["To blame individuals","To argue against all zoning","To praise highways"],"Change is possible."]]},
{i:"eye",t:"Getting it wrong",c:"Chapter 5",d:"We misjudge what will make us happy.",
n:["We are bad at predicting what will make us happy: we overvalue space and things and undervalue time and community.",
"People repeatedly choose badly. Expectations rise as we acquire more, so gains fade, and long commutes keep hurting. Montgomery cites Daniel Kahneman's work and the Harvard dormitory study, where students overestimated how much their housing would matter and underestimated community. Mark Twain, Gary Becker and the author's own purchase of a Vancouver fixer-upper illustrate the pull of bigger homes, while wide roads invite speeding and sedentary suburban life brings hidden risks.",
["People misjudge what will make them happy","Expectations rise with each acquisition","Long commutes keep eroding satisfaction","Harvard dormitory study: students overvalued the architecture and undervalued community","Daniel Kahneman and the idea that attention distorts judgments","California versus the Midwest: people assume the weather matters more than it does","Wide roads encourage speeding","Sedentary suburban life has hidden health costs"],
"Montgomery's repeated point: we trade away the things that make us happy, like time and friends, for things we wrongly expect to, like space and status."],
s:[["l","Bad forecasts","Behavioral research shows we are poor at predicting our own happiness. We expect a bigger house or a nicer car to lift us, but we adapt quickly and keep wanting more. Meanwhile we underestimate the pain of a long commute, which does not fade with time."],
["m","Why do gains from bigger houses and new things fade?","Expectations rise as we acquire more",["Houses lose value","Neighbors move away","Taxes increase"],"Adaptation."],
["l","The Harvard dormitories","In a study of Harvard students assigned to dormitories, students overestimated how much the quality of their housing would affect their happiness and underestimated how much community would. Montgomery admits he made the same kind of error when buying a fixer-upper in Vancouver."],
["t","In the Harvard dormitory study, students correctly predicted the importance of architecture.",false,"They overvalued architecture and undervalued community."],
["m","What does the book say about wide roads?","They encourage speeding",["They reduce crashes","They calm traffic","They make walking pleasant"],"Design sets speed."]],
D:[["m","Why does getting it wrong matter for city design?","Individual choices based on bad forecasts add up to places that make many people less happy",["People always choose correctly","Experts must decide everything","Preferences never change"],"Collective mistakes are built into the landscape."]]}]],
["Closeness","Chapters 6 and 7",[
{i:"heart",t:"How to be closer",c:"Chapter 6",d:"Density, privacy and nature.",
n:["Cities need density with privacy and nature, because we want both connection and retreat.",
"Montgomery explores how cities can bring people closer without crowding them. We need connection and also time alone. Greenery supports wellbeing, social cohesion and lower crime. People prefer open, savanna-like views, but richer, more complex natural environments offer greater benefits, an idea tied to biophilia. A New York City study tested how different landscapes affected mood and stress. Residential towers, he notes, can leave people less trusting than almost any other kind of neighborhood.",
["We want both connection and privacy","Greenery supports wellbeing, social cohesion and lower crime","Biophilia: a human affinity for nature","People prefer open, savanna-like landscapes","More complex ecosystems provide greater benefits","A New York City study measured how landscapes changed mood and stress","Residential towers can be among the least trusting places to live","Vancouver's mixed-use neighborhoods offered a middle path"],
"Density alone is not the goal. People report the least trust in residential towers, even less than in the far exurbs, so closeness needs design."],
s:[["l","Closer, but not crowded","Humans need both company and solitude. Montgomery shows that crowding stresses us while isolation harms us. Good design offers choice: private homes, shared spaces and ways to meet gradually, often with trees and greenery nearby."],
["m","What does greenery contribute, according to the chapter?","Wellbeing, social cohesion and lower crime",["Higher rents only","More traffic","Fewer neighbors"],"Nature has social effects too."],
["l","Towers and trust","Not all density works. Montgomery cites research showing the lowest levels of trust in residential towers, even lower than in the exurban edge. Vancouver's mid-rise, mixed-use neighborhoods show an alternative, where people live close together with shops, parks and street life at their feet."],
["t","The book says residential towers produce the highest levels of neighborly trust.",false,"They can produce among the lowest."],
["x","Match each idea to its meaning",[["Biophilia","Our affinity for nature"],["Savanna preference","Liking open, park-like views"],["Tower trust problem","Low trust in residential towers"],["Mixed-use","Homes, shops and parks together"]],"Chapter 6 in four terms."]],
D:[["m","What is the practical lesson of the towers finding?","How density is designed matters, not only how much of it there is",["Density is always bad","Towers should be taller","Suburbs are better"],"Closeness needs shared life."]]},
{i:"chat",t:"Convivialities",c:"Chapter 7",d:"Streets that make strangers into neighbors.",
n:["Lively, human-scale streets build trust; sterile ones isolate. Reclaiming streets for people is cheap and effective.",
"Drawing on Richard Sennett and the Danish architect Jan Gehl, Montgomery shows that sociable cities are designed for lingering. He studies Italian towns like Siena's Piazza del Campo, post-war Copenhagen, Melbourne and New York. In the East Houston Street experiment with psychologist Colin Ellard, walkers wearing skin-sensors reported being less happy outside the long glass frontage of a supermarket than on the livelier block next door. Bogota's Ciclovia and New York's Summer Streets show how cheaply streets can be given back to people.",
["Jan Gehl studies life between buildings","Richard Sennett on public life","Siena's Piazza del Campo as a model of sociable space","Copenhagen, Melbourne and New York adopt people-first streets","Ellard and Montgomery's East Houston Street experiment with skin conductance sensors","Participants were less happy outside a long, blank, glass supermarket front","Varied, active frontages slow people down and make them more social","Melbourne rules require shop fronts to be mostly doors or display windows","Ciclovia and Summer Streets: temporary car-free streets"],
"Montgomery's experiment: people felt markedly worse outside a blank glass supermarket front than a block away on a lively, varied street. Active edges make cities kinder."],
s:[["l","Streets for lingering","Jan Gehl found that places with small, varied frontages, doors and windows keep people there longer and make them more social. Uniform, blank facades make people hurry past. Montgomery visits Siena's Piazza del Campo and post-war Copenhagen to see public space that works."],
["m","Whose work on life between buildings does Montgomery draw on in this chapter?","Jan Gehl",["Robert Moses","Le Corbusier","Ebenezer Howard"],"The Danish architect studied how people use streets."],
["l","The East Houston Street experiment","With cognitive psychologist Colin Ellard, Montgomery led a walking tour on Manhattan's East Houston Street. Participants wore skin-conductance sensors and rated their happiness at each stop. They reported feeling markedly less happy outside a Whole Foods with a block-long smoked-glass front than on the livelier block to the east, and calmer when protected from traffic."],
["m","What did the East Houston Street experiment find?","People felt less happy outside the blank glass front than on the livelier block",["People preferred the blank facade","Nothing differed","People were happiest near traffic"],"Complexity and activity matter."],
["l","Giving streets back","Bogota's Ciclovia closes streets to cars on Sundays for walkers and cyclists, and New York's Summer Streets does something similar. These cost little, Montgomery notes, and show that cities can be changed quickly. Melbourne requires street-level frontages to be mostly doors or display windows."],
["x","Match each program or place to its idea",[["Ciclovia","Sunday car-free streets in Bogota"],["Summer Streets","New York's car-free streets"],["Piazza del Campo","Siena's famous public square"],["Melbourne rule","Shop fronts mostly doors or windows"]],"Chapter 7 examples."]],
D:[["m","Why do varied facades make streets more social?","They slow walkers down and give them things to look at and stop for",["They are cheaper to build","They block sound","They raise rents"],"Pace shapes social life."]]}]],
["Moving","Chapters 8 and 9",[
{i:"route",t:"Mobilicities I",c:"Chapter 8",d:"How we move shapes how we feel.",
n:["Driving brings stress and entrapment, while walking and cycling bring happiness and health.",
"Montgomery says how we move changes how we feel. Driving in sprawl is stressful and traps people in cars, while those who propel themselves report greater happiness and health. Atlanta shows how sprawl discourages walking and cycling, while cyclists like Robert Tudge, who rides even in frigid weather, show what people gain. Poor transit pushes people into cars.",
["Mobilities: the ways people move shape their feelings","Driving brings stress, entrapment and sedentary risk","Walking and cycling bring happiness and health","Self-propelled commuters report greater happiness","Atlanta as a sprawl example that discourages active travel","Robert Tudge, a year-round cyclist","Poor transit pushes people into cars"],
"The way you travel changes your mood: self-propelled commuters, those who walk or cycle, report more happiness than drivers."],
s:[["l","Trapped in the car","Montgomery argues commuting by car is one of the most stressful parts of the day, since you are trapped, can't control traffic and are physically inactive. Atlanta's sprawl makes the car almost required, and punishes anyone who tries to walk or bike."],
["m","Which city does the chapter use as an example of sprawl discouraging active travel?","Atlanta",["Copenhagen","Bogota","Paris"],"Sprawl makes cars necessary."],
["l","The self-propelled","Commuters who walk or cycle report greater happiness and health. Robert Tudge, who cycles to work even in frigid weather, is among Montgomery's examples. Cities that offer safe, pleasant ways to move under your own power give people this gain."],
["t","Self-propelled commuters report lower happiness than drivers.",false,"They report greater happiness."],
["m","Who is the winter cyclist Montgomery meets?","Robert Tudge",["Randy Strausser","Cesar Dias","Enrique Penalosa"],"He rides in cold weather."]],
D:[["m","Why does poor transit matter for happiness in this chapter?","It pushes people into stressful, sedentary car travel",["It makes cities greener","It reduces commutes","It raises trust"],"Choices matter."]]},
{i:"bolt",t:"Mobilicities II",c:"Chapter 9",d:"Freedom through varied, shared, flexible mobility.",
n:["Freedom is having many ways to move, not owning a car. Real-time information and frequent service make transit work.",
"Montgomery argues freedom comes from varied, shared and flexible mobility. Real-time arrival information reduces perceived waits, and frequent service, around every fifteen minutes, matters. Paris offers Velib' bikes and Autolib' cars with real-time signage, Houten in the Netherlands and Copenhagen build around bikes, London and Stockholm use congestion pricing, New York reassigns street space, and car sharing like car2go adds flexibility. Mid-century visions from Norman Bel Geddes and Buckminster Fuller, and economist Eric Britton, offer context.",
["Freedom comes from variety, sharing and flexibility","Real-time information reduces the felt length of waits","Service about every 15 minutes is a practical threshold","Paris: Velib' bikes, Autolib' cars, real-time signage","Houten (Netherlands) and Copenhagen: bicycle cities","London and Stockholm: congestion pricing","New York reallocates street space","Car sharing such as car2go","Infrastructure must be safe for children and seniors"],
"Real freedom of movement is having many good options, like bikes, trains, car sharing and walking, not owning one car."],
s:[["l","Real-time and frequent","Montgomery notes that knowing when the bus arrives makes the wait feel shorter, and that frequent service, around every 15 minutes, makes transit useful without schedules. Paris signs show real-time arrivals, and its Velib' bikes and Autolib' cars add flexibility."],
["m","What helps reduce the perceived length of waits for transit?","Real-time arrival information",["Longer routes","Fewer vehicles","Higher fares"],"Uncertainty makes waits feel longer."],
["l","Pricing and sharing","London and Stockholm charge drivers to enter central areas, congestion pricing. New York has reassigned street space to people. Houten in the Netherlands and Copenhagen show whole cities built around cycling. Montgomery says infrastructure must be safe enough for children and seniors, not only brave adults."],
["x","Match each city to its example",[["Paris","Velib' and Autolib'"],["Houten","Bicycle-first Dutch town"],["Stockholm","Congestion pricing"],["New York","Street space reallocated to people"]],"Chapter 9's examples."],
["t","The chapter says freedom of movement comes mainly from owning a car.",false,"It comes from having varied, shared, flexible options."]],
D:[["m","Why does Montgomery insist infrastructure serve children and seniors?","A city is only truly mobile if the least confident travelers can also move safely",["They pay more taxes","They own more cars","It saves money"],"A test of design."]]}]],
["Fairness and connection","Chapters 10 and 11",[
{i:"scale",t:"Who is the city for?",c:"Chapter 10",d:"The right to the city and equity.",
n:["A happy city has to be fair: the right to the city means sharing transit, safety and green space, and guarding against displacement.",
"Montgomery asks who the city is for. The right to the city requires redistributing power, not just reviving old designs. Equity means fair access to transit, safety and green space. Bogota, once marked by deep socioeconomic divides, shows an approach under mayors Antanas Mockus and Enrique Penalosa, whose TransMilenio bus rapid transit gave fast service to the poor majority. But improvements can trigger gentrification that pushes poorer residents out.",
["The right to the city: all residents should shape and share it","Equity: fair access to transit, safety and green space","Redistributing power, not only restoring old designs","Bogota's history of deep inequality","Mayors Antanas Mockus and Enrique Penalosa","TransMilenio bus rapid transit served the majority","Improvements can lead to gentrification and displacement"],
"A city that makes only some people happy is not a happy city. Good changes still need protection against pushing poorer residents out."],
s:[["l","The right to the city","Montgomery argues cities must serve everyone, not only those who own cars or can afford nice neighborhoods. In Bogota, mayors Antanas Mockus and Enrique Penalosa built a bus rapid transit system, TransMilenio, to give ordinary people fast, dignified travel."],
["m","What is TransMilenio?","Bogota's bus rapid transit system",["A subway in Paris","A bike-share program","A highway"],"Fast transit for the majority."],
["l","The gentrification risk","Making a place better can raise prices and displace those who lived there. Montgomery stresses that fairness means planning to keep housing and access affordable, so that happier streets do not become exclusive ones."],
["t","Montgomery warns that improvements can cause gentrification.",true,"Equity requires care."],
["m","What does equity mean in this chapter?","Fair access to transit, safety and green space",["Identical homes for everyone","Equal salaries","Banning cars"],"Fairness of access, not sameness."]],
D:[["m","Why is returning to older designs not enough, according to the chapter?","Equity requires changing who has power over the city, not only its appearance",["Old designs are too expensive","Old designs were perfect","Power is irrelevant"],"Design plus fairness."]]},
{i:"x",t:"Everything is connected to everything else",c:"Chapter 11",d:"Hedonistic sustainability and the cost of sprawl.",
n:["The happy city, the green city and the low-carbon city are the same place.",
"Montgomery argues sustainability does not have to mean sacrifice. Hedonistic sustainability, an idea from the architects Bjarke Ingels Group, says eco-friendly design can improve life, as in Copenhagen's waste-to-energy power plant topped with a ski slope. Cities hold about half of humanity but use roughly three quarters of energy and emit most greenhouse gases, and the dispersed city is the most wasteful form. Sprawl also strains municipal budgets, while dense, mixed-use development brings resilience. Portland's urban growth boundary and Asheville, North Carolina, show alternatives.",
["Hedonistic sustainability: green design that improves quality of life","Copenhagen waste-to-energy plant with a ski slope (Bjarke Ingels Group)","The happy city, green city and low-carbon city are the same place","Cities use a large share of energy and produce most emissions","The dispersed city is the most wasteful pattern","Sprawl strains municipal budgets","Dense, mixed-use development brings economic and environmental resilience","Portland urban growth boundary; Asheville"],
"Montgomery's linking idea: what makes a city happier, like walking, closeness and fewer cars, also makes it greener and cheaper to run."],
s:[["l","Ski slope on a power plant","In Copenhagen, the architects Bjarke Ingels Group designed a waste-to-energy plant with a ski slope on its roof. Montgomery uses it to illustrate hedonistic sustainability: environmental design that people enjoy, not something they endure."],
["m","What is hedonistic sustainability?","Eco-friendly design that also improves quality of life",["Spending as much as possible","Banning pleasure","Moving to the suburbs"],"Green and joyful together."],
["l","Sprawl costs everyone","Cities hold about half of humanity yet use around three quarters of energy and produce about 80 percent of greenhouse gas emissions, and dispersed cities are the most wasteful. Sprawl also strains municipal budgets, since long roads and pipes serve few people, while dense mixed-use areas are cheaper and more resilient."],
["t","Montgomery says the happy city and the low-carbon city are largely the same place.",true,"The book's central linkage."],
["m","Which city's urban growth boundary does Montgomery discuss?","Portland, Oregon",["Atlanta","Stockton","Vancouver"],"A tool to limit sprawl."]],
D:[["m","Why does Montgomery want sustainability to promise more happiness?","People are more likely to choose changes that improve their lives than ones that only demand sacrifice",["Happiness is cheaper","Governments forbid sacrifice","Nobody cares about the climate"],"The sustainable city has to be attractive."]]}]],
["Fixing it","Chapters 12 and 13",[
{i:"blocks",t:"Retrofitting sprawl",c:"Chapter 12",d:"Urban surgery on the suburbs.",
n:["Sprawl can be repaired by adding mixed uses and centers, but outdated zoning and financial incentives block it.",
"Montgomery argues suburbs need urban surgery: adding shops, homes, offices and public spaces to places that have only houses. Examples include Lakewood, where a failed mall became a walkable town center, Seaside in Florida, and Smyrna's Market Village, along with residents like Robin Meyer in Mableton pushing for a community center and advocates like Galina Tachieva. The Congress for the New Urbanism backs sprawl repair. Old zoning codes and financial incentives are the main obstacles, and form must not overshadow function.",
["Urban surgery: adding mixed uses to sprawl","A dead mall transformed into a walkable town center (Lakewood)","Seaside, Florida, and Smyrna's Market Village as examples","Robin Meyer in Mableton, Georgia, pushing for a community center","Galina Tachieva advocates sprawl repair","Congress for the New Urbanism","Zoning codes and financial incentives block retrofits","Form must not overshadow function"],
"To fix sprawl, add the missing pieces: shops, homes and public places in the right mix, and rewrite the zoning codes that forbid them."],
s:[["l","Adding what is missing","Suburbs built for cars lack centers. Retrofitting adds shops, apartments, offices, parks and connected streets so people can walk to things. Montgomery cites Lakewood, where a failed mall was reborn as a walkable town center, and Smyrna's Market Village."],
["m","What is a retrofit of sprawl?","Adding mixed uses and public places to car-built suburbs",["Demolishing the suburbs","Building more highways","Banning shops"],"Surgery, not demolition."],
["l","Obstacles","The main barriers are old zoning codes that outlaw mixed use and financial rules that favor conventional development. Montgomery also warns that fancy design alone cannot fix places if they do not work for daily life: form must not overshadow function."],
["t","Montgomery says zoning codes and financial incentives are obstacles to retrofitting.",true,"They need to change."],
["x","Match each person or group to its role",[["Robin Meyer","Mableton resident pushing for a center"],["Galina Tachieva","Advocate of sprawl repair"],["Congress for the New Urbanism","Group promoting walkable planning"],["Lakewood","Dead mall turned town center"]],"Chapter 12's cast."]],
D:[["m","Why does Montgomery caution that form must not overshadow function?","A beautiful place that does not support daily life will not make people happier",["Beauty is irrelevant","Function is illegal","Form costs more"],"Design must work."]]},
{i:"star",t:"Save your city, save yourself",c:"Chapter 13",d:"Citizens, anger and experiments.",
n:["Ordinary residents can reshape their cities, turning anger into action and reclaiming shared space.",
"The closing chapter calls on residents, whom Montgomery names citadins, to act. He tells of a boy and his mother who challenged a school ban on biking in 2009, Aaron Naparstek's traffic advocacy in Brooklyn, and Mark Lakeman's Sellwood neighborhood in Portland, where neighbors transformed an intersection into the Share-It-Square piazza with City Repair. Such projects raise wellbeing and build community. Montgomery's own urban experiments, from inviting strangers into homes during the Vancouver Olympics to the Happy Streets tests, show the same spirit.",
["Citadins: residents who shape their city","A school biking ban challenged in 2009 by a boy and his mother","Aaron Naparstek, traffic advocate in Brooklyn","Mark Lakeman and City Repair in Sellwood, Portland","The Share-It-Square piazza at an intersection","Channel anger into constructive advocacy","Reclaiming shared space builds community and wellbeing","Montgomery's own experiments: Home for the Games, Happy Streets"],
"Montgomery's last message: you do not have to wait for planners. Neighbors can reclaim a street, and doing it makes everyone happier."],
s:[["l","Citadins","Montgomery ends by saying cities belong to the people who live in them. He tells of Adam and his mother, who in 2009 fought a ban on biking to school, and of Aaron Naparstek in Brooklyn, who turned frustration with dangerous traffic into a campaign."],
["m","What does Montgomery call residents who shape their city?","Citadins",["Bureaucrats","Developers","Tourists"],"Citizens as city-makers."],
["l","Share-It-Square","In Sellwood, Portland, Mark Lakeman and neighbors working with City Repair painted and rebuilt an intersection into a shared piazza, the Share-It-Square. Montgomery says such projects raise wellbeing and build community. His own experiments, such as getting Vancouverites to host strangers during the Olympics, follow the same urban-experimentalist idea."],
["t","Montgomery says citizens must wait for planners before changing their streets.",false,"He urges residents to act."],
["x","Match each person or project to its place",[["Mark Lakeman","Sellwood, Portland"],["Aaron Naparstek","Brooklyn traffic advocacy"],["Share-It-Square","Neighbors' intersection piazza"],["Home for the Games","Opening homes to strangers in Vancouver"]],"Chapter 13 and Montgomery's own work."]],
D:[["m","What is the book's overall message about change?","Cities are built by people and can be rebuilt, with each person able to help",["Only governments can change cities","Change is impossible","Only architects matter"],"Agency, from the mayor to the neighbor."]]}]]
]}));
MORE.push(MK({id:"plato",t:"The Republic",a:"Plato",y:-375,
q:"what is justice, and is a just person happier than an unjust one?",
ans:"Through Socrates, Plato answers by building an ideal city in words. Justice is each part doing its own job: in the city, rulers, guardians and producers; in the soul, reason, spirit and appetite. Philosophers who have seen the Good should rule, and the just life, ruled by reason, is the happiest one.",
cov:"Ten lessons follow the ten books of the dialogue in order.",
u:[
["What is justice?","Books I and II",[
{i:"scale",t:"Thrasymachus: might makes right",c:"Book I",d:"Three failed definitions of justice.",
n:["Book I tests popular ideas of justice and ends with the claim that justice is just the advantage of the stronger.",
"At Cephalus's house, Socrates questions three definitions. Cephalus says justice is telling the truth and paying debts. Polemarchus says it is helping friends and harming enemies. Thrasymachus angrily claims justice is whatever benefits the stronger, and that the unjust person lives better. Socrates refutes them, but admits he still does not know what justice is.",
["Cephalus: justice is honesty and paying what you owe","Counterexample: you should not return a weapon to a friend who has gone mad","Polemarchus: help friends, harm enemies","Thrasymachus: justice is the advantage of the stronger","Socrates argues rulers, like doctors, should serve those in their care"],
"Book I is a warm-up: Socrates knocks down common definitions of justice, ending with Thrasymachus's cynical view that justice just serves the powerful."],
