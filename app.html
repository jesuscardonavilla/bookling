s:[["l","A conversation in Piraeus","The Republic is a dialogue narrated by Socrates. At the home of the old merchant Cephalus, talk turns to what makes a life good. Cephalus says justice is telling the truth and returning what you owe. Socrates asks: should you return a borrowed weapon to a friend who has gone mad? Clearly not, so the definition fails."],
["m","Why does Cephalus's definition fail?","Returning a weapon to a friend who has gone mad would not be just",["He forgot to define debt","Socrates says honesty is wrong","Cephalus changes his mind for no reason"],"A rule-based definition breaks on hard cases."],
["l","Thrasymachus","Polemarchus suggests justice is helping friends and harming enemies, and Socrates argues a just person harms no one. Then Thrasymachus bursts in: justice is the advantage of the stronger. Rulers make laws to suit themselves, and the unjust person who gets away with it lives best. Socrates replies that a true ruler, like a doctor, works for those in his care."],
["x","Match each speaker to his definition",[["Cephalus","Tell the truth and pay debts"],["Polemarchus","Help friends, harm enemies"],["Thrasymachus","The advantage of the stronger"],["Socrates","Still searching at the end of Book I"]],"Each definition is tested and found wanting."],
["t","At the end of Book I, Socrates says he now knows what justice is.",false,"He admits he has not found the answer yet."]],
D:[["m","What does Socrates's doctor analogy suggest?","A true ruler, like a doctor, serves the good of those in his care",["Rulers should study medicine","Health matters more than justice","Doctors should rule the city"],"Every craft aims at the good of its object."]]},
{i:"eye",t:"The Ring of Gyges",c:"Book II",d:"Glaucon's challenge and the city in words.",
n:["Glaucon asks whether anyone would stay just if they could act unseen.",
"Glaucon tells the story of Gyges, a shepherd who finds a ring that makes him invisible, then seduces the queen, kills the king and takes the throne. Would anyone stay just with such a ring? Glaucon and Adeimantus ask Socrates to prove justice is good in itself, not just for its reputation. Socrates proposes to look at justice in a city first, where it is larger and easier to see.",
["Glaucon: people value justice only out of fear of punishment","The Ring of Gyges: invisibility removes consequences","The challenge: show justice is good in itself and for its effects","Socrates studies justice in the city as a larger picture of the soul","The first healthy city grows into a luxurious, feverish one that needs guardians"],
"The big question of the book is the Ring of Gyges: if you could never be caught, would you still be just? Plato says yes, and the rest of the book is his argument why."],
s:[["l","Invisible and unpunished","Glaucon argues that people practice justice unwillingly, only because they fear being caught. To prove it he tells of Gyges, who finds a ring of invisibility and uses it to seize power. Anyone with such a ring, Glaucon says, would do the same."],
["m","What is the point of the Ring of Gyges story?","To ask whether people would stay just if they could never be caught",["To show rings are dangerous","To praise Gyges as a king","To explain Greek religion"],"It removes the consequences of injustice."],
["l","Reading the larger letters","Socrates says justice in one soul is hard to see, so they will look at justice in a city, like reading large letters before small ones. A simple city of farmers and builders grows into a luxurious city, which needs more land, which means war, which means a class of guardians."],
["t","Socrates studies justice in a city because a city is a larger version of the soul.",true,"The city-soul analogy runs through the whole book."],
["m","What do Glaucon and Adeimantus ask Socrates to prove?","That justice is good in itself, not just for its rewards",["That the gods exist","That democracy is best","That Gyges was right"],"They want justice valued even without reputation."]],
D:[["m","Why does the luxurious city need guardians?","Its appetites require more land, which leads to war",["Its people are lazy","The gods demand soldiers","Farmers refuse to work"],"Luxury creates conflict over resources."]]}]],
["Building the city","Books II to V",[
{i:"chat",t:"Educating the guardians",c:"Books II and III",d:"Censorship, music, gymnastics and the noble lie.",
n:["Guardians must be raised on true stories, balanced training and a founding myth.",
"Socrates says guardians must be gentle to friends and fierce to enemies, like good watchdogs. Their education begins with stories, so poets must be censored: no tales of gods lying, fighting or behaving badly. Music and gymnastics balance the soul. Rulers are chosen from the best guardians, and everyone is taught a noble lie, the myth of the metals.",
["Guardians need a philosophical, spirited nature, like a watchdog","Stories shape the young, so Homer and the poets are censored","Music softens, gymnastics hardens; both are needed","Rulers are the best of the guardians","The myth of the metals: gold rulers, silver auxiliaries, bronze and iron producers"],
"Plato wants the city to tell its citizens a founding myth, the noble lie, that people are born gold, silver or bronze, so everyone accepts their role."],
s:[["l","Stories shape souls","Children absorb stories before they can judge them. So Socrates proposes to censor poets like Homer when they show gods as deceitful or heroes as cowardly. Education should balance music, which shapes the mind and character, with gymnastics, which trains the body and spirit."],
["m","Why does Socrates want to censor poets?","Stories shape the character of the young",["Poems are too long","Poets are too poor","He dislikes rhyme"],"Education begins with the tales children hear."],
["l","The noble lie","To hold the city together, citizens are told that the earth made them, and that the god mixed gold into rulers, silver into soldiers, and bronze and iron into farmers and workers. Children can rise or fall by their real metal, not by birth."],
["x","Match each metal to its class",[["Gold","Rulers"],["Silver","Auxiliaries, the soldiers"],["Bronze and iron","Farmers and workers"],["The myth itself","The noble lie"]],"The myth justifies the three-class city."],
["t","In the myth of the metals, a child always stays in the class of its parents.",false,"A child can move according to its own metal."]],
D:[["m","Why does the noble lie trouble modern readers?","It uses a deliberate falsehood to make people accept their place",["It praises democracy","It rejects all education","It gives power to poets"],"It raises the question of when rulers may deceive."]]},
{i:"scale",t:"Justice in the city and the soul",c:"Book IV",d:"The four virtues and the three parts of the soul.",
n:["Justice is each part doing its own job, in the city and in the soul.",
"With the city built, Socrates finds four virtues. Wisdom lives in the rulers, courage in the auxiliaries, moderation in agreement about who rules, and justice in each class doing its own work without meddling. The soul has the same three parts: reason, spirit and appetite. A just person is one whose reason rules, with spirit as its ally and appetite kept in check.",
["Wisdom belongs to the rulers","Courage belongs to the auxiliaries","Moderation is agreement about who should rule","Justice is each part doing its own work","The soul has reason, spirit and appetite, matching the three classes"],
"Plato's answer to what justice is: harmony. In a city, each class does its own job; in a person, reason rules, spirit backs it up, and appetite follows."],
s:[["l","Four virtues","Socrates locates wisdom in the rulers who decide for the whole city, courage in the auxiliaries who hold right beliefs about what to fear, and moderation in the agreement of all classes about who should rule. What remains is justice: each class doing its own work and not interfering with the others."],
["m","Where does Socrates locate justice in the city?","In each class doing its own work",["In the rulers alone","In the laws written down","In the wealth of farmers"],"Justice is a principle of order across the whole."],
["l","Three parts of the soul","Socrates argues the soul has three parts. Reason calculates and seeks truth. Spirit feels anger, pride and honor. Appetite wants food, drink, sex and money. A person who is thirsty but refuses to drink shows reason overruling appetite. Justice in the soul is reason ruling with spirit as its ally."],
["x","Match each part of the soul",[["Reason","Seeks truth, should rule"],["Spirit","Anger, honor, courage"],["Appetite","Food, drink, money"],["Justice","Each part doing its job"]],"The soul mirrors the city's three classes."],
["t","For Plato, justice is mainly about following external rules.",false,"It is an inner harmony of the soul."]],
D:[["m","Which example shows reason overruling appetite?","A thirsty person refusing to drink",["A soldier feeling angry","A ruler giving orders","A farmer selling grain"],"Conflict inside one person shows the soul has parts."]]},
{i:"user",t:"Three waves: women, family, philosopher kings",c:"Book V",d:"Plato's most radical proposals.",
n:["Women can be guardians, guardians share families, and philosophers must rule.",
"Socrates faces three waves of objection. First, women with the right nature should be guardians and receive the same education as men. Second, guardians will have no private families: mates and children are held in common so loyalty goes to the city. Third, the biggest wave: cities will never be free of trouble until philosophers become kings or kings become philosophers.",
["First wave: women and men guardians share education and duties","Second wave: no private families or property among guardians","Mating is arranged by rulers, children raised in common","Third wave: philosophers must rule","Philosophers love the forms, not just appearances"],
"Plato's boldest claim is in Book V: until philosophers rule, or rulers become philosophers, cities will never be free of evils."],
s:[["l","Women and families","Socrates argues that the difference between men and women is no reason to exclude women from guarding the city. Guardians should also live without private homes, property or families. Children are raised in common so that everyone calls the whole city family."],
["m","What does Socrates say about women in the guardian class?","Women with the right nature should be guardians with the same education",["Women should only raise children","Women cannot study philosophy","Women should rule alone"],"The first wave is about equal roles."],
["l","Philosopher kings","The third wave is the paradox at the heart of the book: philosophers must rule. A philosopher loves wisdom and knows the forms, the unchanging realities behind appearances. Others only have opinions about shifting things."],
["t","Socrates admits the philosopher king idea will sound ridiculous to many.",true,"He calls it the biggest wave."],
["m","What separates the philosopher from others, in Book V?","Knowledge of the forms rather than opinion about appearances",["Wealth","Military skill","Noble birth"],"Knowledge versus opinion grounds the claim to rule."]],
D:[["m","Why abolish private families for guardians?","So loyalty goes to the whole city, not to private households",["To lower the birth rate","To punish the guardians","To make farming easier"],"Private interest is the seed of faction."]]}]],
["The Good","Books VI and VII",[
{i:"sun",t:"Ship, sun and line",c:"Book VI",d:"Why philosophers should steer, and what the Good is.",
n:["The Good is like the sun: it makes things knowable and gives them being.",
"Adeimantus says philosophers seem useless. Socrates answers with the ship of state: sailors fight over the helm and ignore the real navigator who studies the stars. Then he describes the Good, the highest form, through the sun analogy: as the sun gives light and growth, the Good gives truth and being. The divided line maps levels of cognition from images to pure understanding.",
["Ship of state: the true navigator is mocked by those who want power","The Good is the highest object of knowledge","Sun analogy: the sun lets us see; the Good lets us know","Divided line: imagination, belief, thought, understanding","Mathematics is a bridge toward the forms"],
"Plato compares the Good to the sun: just as sunlight lets you see things, the Good makes things understandable."],
s:[["l","The ship of state","Imagine a ship whose owner is strong but half deaf. The crew fights over who should steer, though none has studied navigation. The real navigator, who watches the stars and winds, is called a useless stargazer. That, Socrates says, is how democracies treat philosophers."],
["m","In the ship of state, who stands for the philosopher?","The navigator who studies the stars",["The deaf owner","The crew fighting for the wheel","The passengers"],"Expertise is mocked by those seeking power."],
["l","Sun and line","The sun makes things visible and helps them grow. The Good does the same for the mind, making the forms knowable and real. The divided line ranks ways of knowing: images, beliefs about physical things, mathematical thought, and finally understanding of the forms through reason alone."],
["x","Match the analogy to its point",[["Sun","The Good makes things knowable"],["Ship","Experts are ignored by power seekers"],["Divided line","Levels of knowing"],["Mathematics","A step toward the forms"]],"Book VI prepares the cave."],
["t","For Plato, the Good is one virtue among many, no higher than courage.",false,"It is the highest object of knowledge."]],
D:[["m","Which is the highest level on the divided line?","Understanding of forms through pure reason",["Images and shadows","Beliefs about objects","Mathematical diagrams"],"Each level grasps something more real."]]},
{i:"eye",t:"The allegory of the cave",c:"Book VII",d:"Prisoners, shadows and the education of rulers.",
n:["Most people mistake shadows for reality; education turns the soul toward the light.",
"Prisoners chained in a cave see only shadows cast on a wall and think they are real. One is freed, struggles up into sunlight, and finally sees the sun itself. Returning, he is blinded by the dark and mocked, and the prisoners might kill him. Education, Socrates says, is not putting knowledge in but turning the soul around. Philosophers must go back down to rule.",
["Prisoners see shadows and take them for reality","The freed prisoner climbs out, painfully, and sees the sun","The sun stands for the Good","Returning, he is mocked and threatened","Education is turning the soul, not filling it","Rulers study arithmetic, geometry, astronomy, harmony, then dialectic"],
"The cave is Plato's picture of education: we mistake shadows for reality until someone turns us toward the light, and people often attack the one who returns to tell them."],
s:[["l","Shadows on the wall","People are chained in a cave from birth, facing a wall. Behind them, objects are carried past a fire, casting shadows. The prisoners name the shadows and think they are the whole of reality. One is freed and forced up into daylight. At first he is dazzled, then sees reflections, objects, and finally the sun."],
["m","In the allegory, what does the sun represent?","The Good",["The king","Fire in the cave","The prisoners' leader"],"It links back to the sun analogy."],
["l","The return","The freed man pities the prisoners and goes back. His eyes, used to light, fail in the dark, and the prisoners laugh and say the climb ruined him. If they could, they might kill him, an echo of Socrates's own death. Socrates says education turns the soul toward what is real, and the philosophers must return to govern."],
["t","Socrates says education means putting knowledge into empty minds.",false,"It means turning the soul toward the light."],
["m","Why must the philosopher go back into the cave?","To rule, for the good of the whole city",["To find more shadows","To escape punishment","To become a prisoner again"],"Those who know the Good have a duty to govern."]],
D:[["m","What real event does the prisoners' hostility echo?","The trial and execution of Socrates",["The Persian wars","The founding of Athens","Plato's exile"],"Athens put the philosopher to death."]]}]],
["Decline and the just life","Books VIII to X",[
{i:"route",t:"How cities decay",c:"Books VIII and IX",d:"Four bad regimes and the tyrant's misery.",
n:["The ideal city decays through timocracy, oligarchy and democracy into tyranny, and the tyrant is the most miserable man.",
"Socrates describes a decline. Aristocracy becomes timocracy, ruled by honor. That becomes oligarchy, ruled by wealth. The poor revolt and create democracy, which prizes freedom so much it falls into anarchy. Out of that disorder a tyrant arises. Each regime matches a type of soul, and the tyrant, ruled by his worst appetites, is the least happy person of all.",
["Aristocracy: rule of the best","Timocracy: love of honor","Oligarchy: love of wealth","Democracy: love of freedom, every desire treated as equal","Tyranny: one person ruled by lawless appetite","The just person is many times happier than the tyrant"],
"Plato's arc of decline: honor, then money, then freedom, then a tyrant who rises from democratic chaos and is himself a slave to his desires."],
s:[["l","Down the ladder","The perfect city slips when rulers make mistakes. Honor-lovers take over, then money-lovers. When the rich grow few and the poor many, democracy follows. Everyone does as they like and all desires seem equal, until a popular champion turns into a tyrant."],
["m","Which regime does Plato say gives rise to tyranny?","Democracy",["Oligarchy","Timocracy","Aristocracy"],"Excess freedom invites a strongman."],
["x","Match each regime to what it loves",[["Timocracy","Honor"],["Oligarchy","Wealth"],["Democracy","Freedom"],["Tyranny","Lawless appetite"]],"Each regime matches a type of soul."],
["l","The miserable tyrant","Book IX answers Glaucon's challenge. The tyrant seems to have everything but is ruled by his own appetites, surrounded by enemies, and never free. The just person, ruled by reason, enjoys truer pleasures. So justice pays."],
["t","Plato argues the tyrant is the happiest of men because he can do anything.",false,"He argues the tyrant is the most miserable."]],
D:[["m","How does Book IX answer the Ring of Gyges challenge?","The unjust soul is disordered and miserable, so justice is better even unseen",["It proves invisibility is impossible","It says the gods punish tyrants","It drops the question"],"Happiness depends on inner order."]]},
{i:"star",t:"Poets and the myth of Er",c:"Book X",d:"Why imitation misleads, and what happens after death.",
n:["Art copies copies, and the soul's choices echo beyond death.",
"Socrates returns to the poets. A painting of a bed copies a physical bed, which copies the form of a bed, so art is twice removed from truth and stirs emotions over reason. Then he ends with the myth of Er, a soldier who returns from death to describe souls being judged and choosing their next lives. The lesson: choose wisely, guided by philosophy.",
["Art imitates appearances, three steps from the form","Poetry feeds emotions and weakens reason","Poets are banished unless someone can defend them","The soul is immortal","Myth of Er: souls choose their next lives, often badly"],
"Plato ends with a myth: souls choose their next lives, and those who chose well were the ones who had learned philosophy."],
s:[["l","Three beds","There is the form of a bed, the bed a carpenter makes, and a painting of that bed. The painter copies a copy, far from the truth. Poets do the same with human life, and their work stirs grief and laughter that weaken reason. So imitative poetry is banished from the city, unless it can be defended."],
["m","Why is art twice removed from truth for Plato?","It copies physical things, which already copy the forms",["It uses too many colors","Artists are not paid","It is always about gods"],"Form, object, image: the image is lowest."],
["l","The myth of Er","Er, a soldier killed in battle, wakes on his funeral pyre and reports what he saw: souls judged, rewarded or punished, then choosing new lives from a spread of lots. One man rushes to choose a tyrant's life and regrets it. Odysseus, cured of ambition, picks a quiet private life."],
["t","In the myth of Er, souls choose their next lives.",true,"Responsibility lies with the chooser."],
["m","What lesson does the myth of Er teach?","Learn to choose a just life, since choices shape the soul",["Fate decides everything","Wealth guarantees a good next life","The gods choose for us"],"Philosophy prepares the soul to choose well."]],
D:[["m","Which soul in the myth chooses a quiet, private life?","Odysseus",["Achilles","Er","Thrasymachus"],"Having suffered ambition, he wants peace."]]}]]
]}));
MORE.push(MK({id:"speck",t:"Walkable City",a:"Jeff Speck",y:2012,
q:"how do you make a downtown a place people choose to walk?",
ans:"Speck's answer: walkability is the measure that drives a city's wealth, health and sustainability. A walk has to be useful, safe, comfortable and interesting, and he gives ten concrete steps to get there, from taming cars and fixing parking to planting trees and focusing on a few streets first.",
u:[
["Why walk","Part One",[
{i:"bolt",t:"Walkability pays",c:"Part One",d:"The economic case for walkable downtowns.",
n:["Walkable places are where talent, value and money are moving.",
"Speck opens with money, not virtue. Young professionals and retiring boomers increasingly want to live where they can walk. Homes and offices in walkable areas are worth more, and a city that drives everywhere sends much of its income out to car, fuel and insurance companies instead of spending it locally.",
["Millennials and empty-nesters both prefer walkable, urban places","Walkability raises property values and rents","Car dependence drains household budgets and sends money out of the local economy","A walkable downtown is a tool to attract and keep a creative workforce"],
"Speck says walkability is not a luxury, it is economic strategy: talent and money are moving to places where you do not need a car."],
s:[["l","The planner who stopped drawing","Jeff Speck is a city planner who spent years with the New Urbanism movement and later ran design at the National Endowment for the Arts. He wrote this book for mayors and citizens, not experts. His claim: most American cities were redesigned for cars, and the single most useful thing a city can do now is make its center walkable again."],
["m","Which argument does Speck lead with?","Walkability makes cities richer",["Walking is morally better than driving","Cars should be banned downtown","Suburbs should be demolished"],"He starts with economics because that is what persuades mayors."],
["l","Where demand is going","Speck points to a shift in demand. Many young, educated workers want city life without a car, and companies follow them. Many older people want to age where they can walk to things. Meanwhile, a family that must drive everywhere spends a large share of income on cars, money that leaves town instead of circulating in local shops."],
["m","Why does car dependence hurt a local economy, in Speck's view?","Money spent on cars, fuel and insurance mostly leaves the city",["Cars make roads too wide to tax","Drivers never shop downtown","Gas taxes are too low"],"Household transport spending flows to distant companies."],
["t","Speck argues walkable neighborhoods tend to command higher property values.",true,"Demand for walkable places is high and supply is short."]],
D:[["m","What makes Speck's case unusual for a book about walking?","He argues from economics and health data rather than mainly from charm or ethics",["He argues only from history","He relies on personal stories alone","He rejects all data"],"He wants to convince people who do not care about urbanism."],
["t","Speck treats walkability as a problem for experts only, not for citizens.",false,"He wrote it for mayors and ordinary residents."]]},
{i:"heart",t:"Health and the planet",c:"Part One",d:"How car-built places harm bodies and the climate.",
n:["Driving everywhere makes us less healthy and less green, even in leafy suburbs.",
"Speck argues the suburban, car-based pattern contributes to obesity, asthma and traffic deaths. He also flips the usual picture of green living: a dense city dweller who walks and takes transit often has a far smaller carbon footprint than a suburban household with solar panels and a hybrid car. Location matters more than gadgets.",
["Car-dependent design reduces daily physical activity","Car crashes are a leading cause of death, especially for young people","Dense urban living cuts energy use and emissions per person","Green gadgets matter less than where and how compactly you live"],
"The greenest thing you can do is live somewhere you can walk. A New Yorker in an apartment usually beats a suburbanite with a hybrid."],
s:[["l","Built for sitting","When every errand needs a car, daily movement disappears from life. Speck links car-built places to rising obesity and related disease. He also stresses crashes: driving is one of the most dangerous things people do daily, and wide, fast roads make it worse for drivers and walkers alike."],
["m","Which health risk does Speck tie directly to car-oriented design?","Low physical activity and higher obesity",["Too much sun exposure","Noise from trains","Overcrowded parks"],"Errands by car remove walking from daily life."],
["l","Green is urban","Speck argues that the most sustainable place to live is a dense, walkable city. People in compact places drive less, live in smaller homes that share walls, and use far less energy. A hybrid in a cul-de-sac still means long drives for everything. Where you live matters more than what you buy."],
["m","According to Speck, what matters most for a household's carbon footprint?","Where and how densely it lives",["Which brand of car it drives","Whether it recycles","Whether it has solar panels"],"Location drives how much people drive and heat."],
["t","Speck says a suburban home with green gadgets is usually greener than a city apartment.",false,"He argues the opposite: compact urban living wins."]],
D:[["m","Why does Speck call efficiency gadgets a distraction?","They hide the bigger effect of land use and driving distance",["They are too expensive to buy","They do not work at all","They are illegal in cities"],"Form of settlement outweighs device efficiency."]]}]],
["The theory","Part Two",[
{i:"target",t:"Useful, safe, comfortable, interesting",c:"General theory",d:"The four conditions a walk must meet.",
n:["People walk when a walk is useful, safe, comfortable and interesting, all four at once.",
"Speck's general theory of walkability says a walk must serve a purpose, feel safe from cars, feel comfortable as an outdoor room, and offer something to look at. Missing any one kills walking. His ten steps are organized under these four headings.",
["Useful: daily needs are close and arranged well","Safe: people are protected from cars, not just crime","Comfortable: streets feel like outdoor rooms with edges","Interesting: friendly building fronts and signs of life","All four are needed; one failure is enough to stop people walking"],
"A walk has to be useful, safe, comfortable and interesting. Fix only one or two and people still drive."],
s:[["l","Four conditions","Speck builds the book on one framework. A walk must be useful, meaning there is a reason to go and daily needs are nearby. It must be safe, which for him mostly means safe from cars. It must be comfortable, with streets shaped like rooms. And it must be interesting, lined with active, human-scale fronts."],
["x","Match each condition to its meaning",[["Useful","There is somewhere worth going nearby"],["Safe","Protected from fast traffic"],["Comfortable","The street feels like an outdoor room"],["Interesting","Lively, varied building fronts"]],"These four headings organize the ten steps."],
["l","All or nothing","The key insight is that the conditions work together. A safe but boring street stays empty. An interesting street with speeding traffic stays empty too. That is why cities that fix one thing, like adding a nice sidewalk, are often disappointed."],
["t","According to Speck, meeting two of the four conditions is usually enough to get people walking.",false,"All four are needed."],
["m","In Speck's theory, what does safe mainly refer to?","Safety from cars",["Safety from crime only","Safety from weather","Safety from noise"],"Traffic danger is his main concern."]],
D:[["m","Why do sidewalk-only improvements often fail?","They fix one condition while others, like usefulness or traffic danger, remain broken",["Sidewalks are too expensive","People prefer grass","Sidewalks reduce property values"],"Walkability needs every condition met."]]},
{i:"road",t:"Put cars in their place",c:"Steps 1 and 2",d:"Induced demand and mixing uses.",
n:["Wider roads create more traffic, and separated uses make walking pointless.",
"Step one tackles cars. Speck explains induced demand: adding lanes invites more driving until congestion returns. Engineers who design for traffic projections create the traffic. Step two, mix the uses, says homes, jobs, shops and schools need to be near each other, and that downtowns especially need more housing.",
["Induced demand: new road capacity fills with new driving","Traffic models often become self-fulfilling","Congestion pricing and road diets can reduce car dominance","Mix the uses: put daily needs within walking distance","Downtowns usually need more housing above all"],
"Building more lanes to fix traffic is like loosening your belt to fix obesity. The new space just fills up."],
s:[["l","Induced demand","When a city widens a road to cure congestion, travel gets easier, so people drive more, take longer trips and move farther out. Within a few years the road is jammed again. Speck calls this induced demand and says it is one of the best-proven findings in transportation. The cure is to manage cars, not to keep accommodating them."],
["m","What is induced demand?","Added road capacity generates new traffic that fills it",["People demand more buses","Shops create demand for parking","Housing creates demand for parks"],"More lanes mean more driving."],
["l","Mix the uses","Step two says walking only happens when there is somewhere to walk to. Zoning that separates housing from shops and offices kills it. Speck stresses housing above all: many downtowns have offices and stores but few residents, so they go dead at night."],
["t","Speck argues that widening highways is a reliable long-term cure for congestion.",false,"New lanes fill with induced traffic."],
["m","What does Speck say most downtowns need more of?","Housing",["Office towers","Highway exits","Parking garages"],"Residents give a center life at all hours."]],
D:[["t","Speck believes traffic projections can become self-fulfilling when roads are built to match them.",true,"Designing for predicted traffic invites that traffic."]]},
{i:"blocks",t:"Parking and transit",c:"Steps 3 and 4",d:"Why free parking is costly, and what makes transit work.",
n:["Free parking is not free, and transit only works when it serves walkable places.",
"Speck draws heavily on the economist Donald Shoup. Parking minimums force builders to provide far more parking than needed, raising costs and spreading buildings apart. Free curb parking causes drivers to circle. The fix is to remove minimums and price curb parking so a few spaces stay open, spending the money on the street itself. On transit, he says good transit and walkability need each other.",
["Parking minimums raise building costs and kill density","Underpriced curb parking causes cruising and congestion","Price curb spaces so about one in seven stays open","Spend parking revenue on the neighborhood","Transit needs walkable stops, frequency, and clear routes"],
"Free parking is paid for by everyone, in higher rents and prices. Price it right and spend the money on the street."],
s:[["l","The high cost of free parking","Cities often require each new building to provide a minimum number of spaces. Speck, following Donald Shoup, says this makes housing more expensive, wastes land and spreads buildings apart. Meanwhile, free or cheap curb parking leads drivers to circle looking for a spot, adding traffic. Shoup's fix is to charge market prices so some spaces are always available."],
["m","Which thinker does Speck lean on for parking policy?","Donald Shoup",["Robert Moses","Le Corbusier","Ebenezer Howard"],"Shoup wrote The High Cost of Free Parking."],
["m","What problem do parking minimums cause, according to the book?","They raise costs and spread buildings apart",["They make cars cheaper","They create too much housing","They lower land values downtown"],"Required parking eats land and money."],
["l","Let transit work","Transit and walking depend on each other. Every transit trip begins and ends on foot, so stations must sit in walkable places. Speck favors frequent, simple routes and warns against shiny projects placed where no one walks."],
["t","Speck suggests spending curb parking revenue on improvements in the same neighborhood.",true,"It builds local support for pricing."]],
D:[["m","Why does pricing curb parking reduce traffic?","Drivers stop circling for free spots because some spaces stay open",["It bans cars entirely","It forces people to buy garages","It makes roads wider"],"Cruising for parking is a hidden share of downtown traffic."]]},
{i:"route",t:"Protect walkers, welcome bikes",c:"Steps 5 and 6",d:"Street design that keeps people safe.",
n:["Speed kills, and street design, not signs, controls speed.",
"Speck says drivers go as fast as a road feels safe. Wide lanes, one-way streets and missing parked cars invite speeding. He recommends narrower lanes, converting one-ways back to two-way, on-street parking as a buffer, and fewer, slower turn lanes. For bikes, he argues that protected networks bring many new riders and make streets calmer for everyone.",
["Drivers set speed by how the road feels, not posted limits","Narrow lanes, around ten feet, slow cars","Two-way streets are slower and better for shops than one-ways","On-street parking shields people on the sidewalk","Protected bike lanes attract far more riders"],
"Drivers go as fast as the street feels safe. Narrow it, make it two-way, and add parked cars, and they slow down."],
s:[["l","Speed is the enemy","A person hit by a car at low speed usually survives, while at high speed most do not. Engineers often widen lanes in the name of safety, but wider lanes make drivers faster. Speck argues narrower lanes, around ten feet, are safer for everyone."],
["m","What controls how fast drivers go, in Speck's view?","How wide and open the street feels",["The posted speed limit","The number of police","The color of the road"],"Design sets speed."],
["l","Two-way and parked cars","One-way downtown streets were built to move cars fast. Speck says turning them back to two-way slows traffic and helps businesses, since drivers see more storefronts. Parked cars along the curb act as a barrier between moving traffic and people on the sidewalk."],
["t","Speck recommends converting many one-way downtown streets back to two-way.",true,"Two-way streets slow traffic and help retail."],
["m","What does Speck say about protected bike lanes?","They attract many new riders and calm streets",["They only serve athletes","They always increase crashes","They should be on highways"],"Feeling safe is what brings people onto bikes."]],
D:[["m","Why does Speck value on-street parking for pedestrians?","Parked cars form a buffer between traffic and the sidewalk",["It slows walkers down","It removes trees","It replaces bike lanes"],"The buffer makes walkers feel safer."]]},
{i:"building",t:"Rooms, trees, faces, winners",c:"Steps 7 to 10",d:"Making streets comfortable and interesting, and choosing where to start.",
n:["Shape streets like rooms, plant trees, keep building fronts friendly, and fix a few streets first.",
"The last four steps cover comfort and interest. People like enclosed spaces, so buildings should line the street. Trees shade, slow cars and raise property values. Building fronts should be active and varied, not blank walls or parking lots. Finally, since no city can fix everything, pick the streets with the best chance and concentrate effort there.",
["Shape the spaces: buildings should frame streets like walls of a room","Plant trees: shade, slower traffic, higher values","Make friendly and unique faces: active ground floors, no blank walls","Pick your winners: concentrate on a few streets that can succeed","Urban triage: focus resources where they create a walkable core"],
"Do not try to fix every street. Pick the few with the best bones, make them great, and let walkability spread from there."],
s:[["l","Outdoor rooms and trees","People feel comfortable in spaces with edges. Gaps like parking lots break the room. Speck calls street trees one of the best investments a city can make: they cool, slow drivers, and make places more valuable."],
["m","Why does Speck want buildings to line the street?","They create an enclosed outdoor room that feels comfortable",["They block the sun","They reduce traffic noise only","They make parking easier"],"Enclosure makes walking feel pleasant."],
["l","Faces and winners","Ground floors with doors and windows keep a walk interesting. Blank walls and garages make it boring. Last, Speck urges triage: pick a small network of streets with good bones and concentrate improvements there."],
["t","Speck advises cities to improve all streets equally at the same time.",false,"He calls for picking winners."],
["x","Match each step to its idea",[["Shape the spaces","Buildings frame the street"],["Plant trees","Shade and slower traffic"],["Friendly faces","Active ground floors"],["Pick your winners","Focus on a few streets"]],"These four steps make walks comfortable and interesting."]],
D:[["m","What is the logic behind picking winners?","Limited money spent on a connected core creates a walkable area that can then spread",["Winners get all taxes","Losing streets should be demolished","It avoids public input"],"Concentration creates results people can see."]]}]]
]}));
MORE.push(MK({id:"suntzu",t:"The Art of War",a:"Sun Tzu",y:-500,
q:"how do you win a conflict at the lowest possible cost?",
ans:"Sun Tzu answers that the best victory is won without fighting. Win by preparation, knowledge and position before battle: know the enemy and yourself, make yourself unbeatable, use deception, avoid the enemy's strength and strike where they are weak, move fast, and use spies.",
cov:"Seven lessons cover all 13 chapters, grouped in the book's order.",
u:[
["Before battle","Chapters 1 to 3",[
{i:"target",t:"Laying plans",c:"Chapter 1",d:"The five factors, and warfare as deception.",
n:["Calculate before fighting: compare the five factors, and remember that all warfare is based on deception.",
"War is a matter of life and death for the state, so it must be studied. Sun Tzu lists five factors to compare: the Way, meaning the people's unity with their ruler; heaven, the weather and seasons; earth, the terrain; the commander; and method and discipline. The side that calculates more wins. And all warfare is deception: appear weak when strong, far when near.",
["War is vital to the state and must be studied","Five factors: the Way, heaven, earth, commander, method","The commander needs wisdom, sincerity, benevolence, courage and strictness","Victory goes to the side that calculates more beforehand","All warfare is based on deception"],
"Sun Tzu says battles are won in the planning room: compare five factors before fighting, and remember that all war is deception."],
s:[["l","Five factors","Before any campaign, compare both sides on five factors. The Way: do the people share the ruler's purpose? Heaven: night and day, cold and heat, seasons. Earth: distances, terrain, safety. The commander: wise, sincere, humane, brave, strict. Method: organization, ranks, supply."],
["x","Match each factor to its meaning",[["The Way","The people's unity with the ruler"],["Heaven","Weather and seasons"],["Earth","Terrain and distance"],["Method","Organization and discipline"]],"The commander is the fifth factor."],
["l","Deception","All warfare is based on deception. When able to attack, seem unable. When near, seem far. Lure the enemy with bait, feign disorder, attack where they are unprepared. Whoever makes more calculations in the temple before battle wins."],
["m","What does Sun Tzu say all warfare is based on?","Deception",["Courage","Numbers","Luck"],"Appear what you are not."],
["t","Sun Tzu thinks victory is mostly decided during the battle itself.",false,"It is decided by calculations beforehand."]],
D:[["m","Why does the Way, the people's unity with their ruler, come first?","Soldiers who share the ruler's purpose will follow him even into danger",["It decides the weather","It is the cheapest factor","It concerns only religion"],"Moral unity underlies everything else."]]},
{i:"bolt",t:"The cost of war",c:"Chapter 2",d:"Speed, supply and the danger of long wars.",
n:["War is ruinously expensive; aim for quick victory and live off the enemy.",
"A large army costs a fortune each day. Long campaigns drain the treasury, exhaust troops and invite other states to strike. Sun Tzu says there has never been a country that benefited from prolonged war. Win quickly. Feed the army from the enemy's supplies, and treat captured soldiers well so they join you.",
["War drains money, people and morale","No state has ever profited from prolonged war","Speed matters more than cleverness that drags on","Forage on the enemy: one cartload of theirs equals twenty of yours","Treat captives well and use captured resources"],
"Sun Tzu's rule on cost: no country has ever benefited from a long war. Win fast or not at all."],
s:[["l","Thousands of ounces a day","An army of a hundred thousand needs chariots, armor, food carried hundreds of miles, and silver each day. If the war drags on, weapons blunt, morale sinks, strength is spent, and neighbors take advantage. Better a clumsy quick win than a clever slow one."],
["m","What does Sun Tzu say about long wars?","No state has ever benefited from a prolonged war",["They are the surest path to glory","They make soldiers stronger","They are cheaper than short wars"],"Time is the enemy's ally."],
["l","Use the enemy's supplies","Carrying food over long distances impoverishes your people. So a wise general feeds his army from the enemy. Captured chariots are mixed into your own, and captured soldiers are treated kindly, so that defeating the enemy makes you stronger."],
["t","Sun Tzu advises treating captured soldiers harshly to scare the enemy.",false,"He advises treating them well so they join you."],
["m","Why forage on the enemy?","Shipping supplies from home drains your own people",["Enemy food is better","It is required by law","It keeps soldiers busy"],"One cartload taken equals many sent."]],
D:[["m","Why can a quick but imperfect victory beat a clever slow one?","Delay drains resources and invites third parties to attack",["Clever plans never work","Soldiers prefer speed","Slow wins are illegal"],"Cost compounds with time."]]},
{i:"star",t:"Win without fighting",c:"Chapter 3",d:"Attack strategy first, and know yourself and the enemy.",
n:["The supreme skill is to subdue the enemy without fighting. Know the enemy and yourself.",
"Sun Tzu ranks the targets of attack. Best is to attack the enemy's strategy; next, their alliances; next, their army; worst, their walled cities. Taking a state whole is better than destroying it. A ruler must not meddle with a capable general. And: know the enemy and know yourself, and you need not fear a hundred battles.",
["Supreme excellence: break resistance without fighting","Attack strategy, then alliances, then armies, cities last","Keep the enemy's state whole if possible","Five essentials for victory, including a capable general free from royal meddling","Know the enemy and yourself: no danger in a hundred battles"],
"His most famous lines: winning a hundred battles is not the peak of skill; winning without fighting is. And if you know the enemy and yourself, you need not fear the result."],
s:[["l","The best victory","Fighting and winning every battle is not supreme excellence. Supreme excellence is breaking the enemy's resistance without fighting. So the best strategy attacks the enemy's plans, the next breaks their alliances, the next attacks their army, and the worst besieges walled cities."],
["m","What does Sun Tzu call supreme excellence?","Breaking the enemy's resistance without fighting",["Winning every battle","Killing the enemy general","Capturing the most cities"],"Fighting is a cost, not a goal."],
["x","Rank the targets, best to worst",[["First","The enemy's strategy"],["Second","Their alliances"],["Third","Their army"],["Last","Their walled cities"]],"Sieges are the most costly option."],
["l","Know yourself","If you know the enemy and yourself, you need not fear a hundred battles. If you know yourself but not the enemy, for every victory you will suffer a defeat. If you know neither, you will lose every battle."],
["t","Sun Tzu says knowing yourself alone is enough to win every time.",false,"You also need to know the enemy."]],
D:[["m","Why should a ruler not interfere with a capable general?","Orders from afar ignore conditions on the ground and confuse the army",["Generals outrank rulers","Rulers know nothing of war","It saves money"],"Command must follow the field."]]}]],
["Shape and force","Chapters 4 to 6",[
{i:"blocks",t:"Positions, energy, weak and strong",c:"Chapters 4 to 6",d:"Be unbeatable first, use momentum, and strike the void.",
n:["First make yourself unbeatable, build momentum, and attack where the enemy is not ready, flowing like water.",
"Chapter 4: good fighters first make themselves invincible, then wait for the enemy to become vulnerable. Victorious armies win first and then seek battle. Chapter 5: energy, or momentum, comes from combining direct and surprise forces, like a rolling log or boulder downhill. Chapter 6: attack where the enemy is weak, be formless, and adapt like water, which has no constant shape.",
["Invincibility depends on you; the enemy's weakness depends on them","Winning armies win first, then fight","Direct and indirect forces combine in endless variations","Momentum: a round stone rolling down a steep mountain","Attack the void, avoid the strong","Be formless; water shapes itself to the ground"],
"Sun Tzu says winning armies win first and then go to battle, while losing armies fight first and hope to win."],
s:[["l","Win first, then fight","Being unbeatable is in your own hands. Whether the enemy can be beaten is in theirs. So the skilled fighter secures himself first and waits. A victorious army wins before it fights; a defeated one fights first and looks for victory during the battle."],
["m","What does the victorious army do, in chapter 4?","Wins first through preparation, then seeks battle",["Fights first and hopes to win","Avoids all preparation","Waits for orders from the king"],"Victory is set up in advance."],
["l","Momentum and the void","There are only a few notes and colors, yet endless combinations. So too with direct and surprise forces. Good commanders create momentum, like a round stone rolling down a high mountain. And like water flowing from high to low, an army avoids strength and strikes weakness, changing shape with the enemy."],
["x","Match the image to the idea",[["Rolling stone","Momentum from position"],["Water","Adapting to conditions"],["Notes and colors","Endless combinations of tactics"],["The void","Where the enemy is weak"]],"Chapters 5 and 6 in images."],
["t","Sun Tzu advises attacking where the enemy is strongest to break morale.",false,"He advises avoiding strength and hitting weakness."]],
D:[["m","What does formlessness achieve, in chapter 6?","The enemy cannot plan against you because they cannot see your shape",["Soldiers do not need uniforms","It reduces costs","It makes retreat impossible"],"Hidden dispositions defeat planning."]]}]],
["In the field","Chapters 7 to 13",[
{i:"route",t:"Maneuver and the commander",c:"Chapters 7 and 8",d:"The indirect route and a general's fatal faults.",
n:["Make the long way the short way, and beware the five dangerous faults of a general.",
"Chapter 7 covers maneuvering, the hardest part of war: turning the devious route into the direct one. Move fast as the wind, still as the forest, raid like fire, firm as the mountain. Chapter 8 lists variations of tactics and warns of five faults in a general: recklessness, cowardice, a hot temper, an easily wounded sense of honor, and too much concern for his men.",
["Turn the indirect path into the direct one","Swift as wind, quiet as forest, fierce as fire, steady as mountain","Do not press a desperate enemy too hard; leave an outlet","There are roads not to follow and orders not to obey","Five faults: recklessness, cowardice, hot temper, touchy honor, oversolicitude"],
"Sun Tzu warns that a general can be ruined by five faults, including a quick temper and too much pride in his honor."],
s:[["l","Wind, forest, fire, mountain","Maneuvering means turning a winding path into the direct one, setting off after the enemy and arriving first. Let your speed be the wind, your discipline the forest, your attack fire, your firmness a mountain. Do not block an army returning home, and leave a surrounded enemy a way out."],
["m","Why leave a surrounded enemy a way out?","Desperate troops fight to the death",["It is polite","To trap them later","It saves arrows"],"Cornered enemies are dangerous."],
["l","Five dangerous faults","A general who is reckless can be killed. One who is cowardly can be captured. A hot temper can be provoked. A delicate sense of honor can be shamed into error. Too much concern for his men can be exploited by attacks that harass them. These five ruin armies."],
["x","Match each fault to how it is exploited",[["Recklessness","He can be killed"],["Cowardice","He can be captured"],["Hot temper","He can be provoked"],["Touchy honor","He can be shamed into error"]],"The fifth is excess concern for his men."],
["t","Sun Tzu says a general must obey every order from the ruler.",false,"Some orders should not be obeyed."]],
D:[["m","What does turning the indirect into the direct mean?","Using a roundabout route that ends up giving you the advantage of arriving first",["Always marching straight","Avoiding roads entirely","Only moving at night"],"The longer path can be faster."]]},
{i:"building",t:"Terrain and the nine situations",c:"Chapters 9 to 11",d:"Reading ground, reading the enemy, and death ground.",
n:["Read the ground and the enemy's signs, and know that troops on death ground fight hardest.",
"Chapter 9 teaches reading signs: birds rising mean an ambush, dust rising high means chariots, soldiers leaning on spears are hungry. Chapter 10 classifies terrain and the general's responsibility for disaster. Chapter 11 lists nine situations, ending with death ground, where the army must fight or die. Placed there, soldiers fight with all they have. Treat soldiers like your children, and they will follow you into deep valleys.",
["Read signs: birds, dust, behavior of enemy troops","Kinds of terrain: accessible, entangling, narrow, precipitous and more","Defeats from flight, insubordination, collapse, ruin, disorganization, rout are the general's fault","Nine situations, from dispersive to death ground","On death ground, fight","Treat soldiers like children, but with discipline"],
"Sun Tzu says put soldiers where there is no escape, on death ground, and they will fight with everything they have."],
s:[["l","Reading signs","When the enemy speaks humbly but keeps preparing, he is about to advance. When soldiers lean on their spears, they are faint with hunger. Birds flying up mean an ambush. Dust rising high and narrow means chariots."],
["m","What does Sun Tzu say birds suddenly rising indicate?","An ambush",["Rain is coming","Peace talks","The enemy has left"],"Small signs reveal hidden movements."],
["l","Death ground","Of the nine situations, the last is death ground: ground where you can survive only by fighting hard. Throw soldiers into positions with no escape and they will not flee. Treat them as your beloved sons and they will stand by you even unto death, but kindness without authority spoils them."],
["t","Sun Tzu says soldiers fight hardest when retreat is impossible.",true,"Death ground focuses the army."],
["m","How should a general treat his soldiers?","Like his children, but with firm discipline",["With pure kindness","With constant punishment","As strangers"],"Care and authority together."]],
D:[["m","Who does chapter 10 blame for defeats like routs and collapse?","The general, not heaven",["The weather","The soldiers alone","Bad luck"],"Six kinds of defeat are the commander's fault."]]},
{i:"eye",t:"Fire and spies",c:"Chapters 12 and 13",d:"Fire attacks, anger, and foreknowledge.",
n:["Do not act from anger, and get foreknowledge from people: spies.",
"Chapter 12 covers attacking with fire and ends with a warning: a ruler should never go to war out of anger. Anger can turn to joy, but a destroyed state cannot be restored and the dead cannot be revived. Chapter 13 says foreknowledge cannot come from spirits or calculation, only from people. There are five types of spies, and converted spies are the most important.",
["Five kinds of fire attack, and when to use them","Never fight out of anger or resentment","A destroyed state cannot be revived","Foreknowledge comes from people, not omens","Five spies: local, inside, converted, doomed, surviving","Converted spies are the key; reward spies generously"],
"Sun Tzu closes on spies: knowing the enemy cannot come from omens or guesses, only from people who know. That is why spending on spies is the cheapest thing in war."],
s:[["l","Not out of anger","After explaining fire attacks, Sun Tzu adds a moral warning. A ruler should not raise an army out of rage, nor a general fight out of resentment. Anger may change to gladness, but a kingdom destroyed can never come back, and the dead can never be brought back to life."],
["m","Why should a ruler never go to war out of anger?","Anger passes, but destruction and death cannot be undone",["Angry soldiers fight poorly","Anger is bad luck","The gods forbid it"],"Irreversible costs demand calm judgment."],
["l","Five spies","Foreknowledge cannot be drawn from spirits or by analogy; it must come from people who know the enemy. Spies come in five kinds: local spies, inside spies among enemy officials, converted spies who were the enemy's, doomed spies fed false information, and surviving spies who return with reports. Converted spies are the most valuable."],
["x","Match each spy to its role",[["Local","Uses people from the area"],["Inside","Officials of the enemy"],["Converted","Enemy spies turned to your side"],["Doomed","Carry false information to the enemy"]],"Surviving spies return with news."],
["t","Sun Tzu says foreknowledge can come from omens and calculations.",false,"Only from people."]],
D:[["m","Why does Sun Tzu call it foolish to save money on spies?","A small cost in intelligence prevents the huge cost of a long war",["Spies work for free","Spies win battles alone","Money has no value in war"],"Information is the cheapest weapon."]]}]]
]}));
MORE.push(MK({id:"tanizaki",t:"In Praise of Shadows",a:"Jun'ichiro Tanizaki",y:1933,
q:"what is lost when a culture floods everything with bright light?",
ans:"Tanizaki argues that traditional Japanese beauty lives in shadow: dim rooms, lacquer glowing by candlelight, paper screens, patina and age. The West chases brightness and polish, and modern Japan imported it, losing a sensibility that found beauty in darkness and subtlety.",
cov:"This is a short essay with no chapters. Four lessons follow its order of topics.",
u:[
["Shadow","The whole essay",[
{i:"building",t:"A house against modern light",c:"Opening",d:"Building a traditional house with modern fixtures.",
n:["Modern conveniences clash with a traditional house, and Tanizaki resents the compromise.",
"Tanizaki opens with a practical problem: anyone building a traditional Japanese house struggles to fit in electric lights, heaters, wiring and plumbing without ruining it. He describes the traditional toilet, set apart and dim, as a place for quiet contemplation, and regrets gleaming white tiles. He wonders how Japan would look if it had developed its own technology to suit its own taste.",
["Wires, lamps, heaters and plumbing disturb a traditional house","He hides fixtures, but each choice is a compromise","The old toilet: dim, quiet, near nature, a place to think","Gleaming white tile ruins its calm","If the East had invented its own science, its tools would suit its taste"],
"Tanizaki starts with plumbing: he could not fit electric lights and a white tiled bathroom into a Japanese house without ruining its spirit."],
s:[["l","Fitting the fixtures","Tanizaki writes as a man trying to build a house in the Japanese style. Electric wires, lamps, gas heaters and a modern bath all jar with paper doors and wood. He hides wires and searches for lamps that do not glare, but every solution is a compromise between comfort and beauty."],
["m","What problem opens the essay?","Fitting modern fixtures into a traditional house",["Finding a wife","Writing a novel","Traveling to Europe"],"The essay grows from a practical frustration."],
["l","The quiet toilet","He praises the old Japanese toilet, set apart from the house, dim and clean, where you can listen to rain or insects. Sparkling white tile and bright light destroy that mood. He imagines that if Japan had developed its own science, its pens, radios and lights would have matched its own taste."],
["t","Tanizaki praises bright white tiles as perfect for a Japanese bathroom.",false,"He feels they destroy its calm."],
["m","What does Tanizaki imagine about technology?","That an Eastern-born technology would have suited Eastern taste",["That technology should be banned","That the West invented everything well","That Japan should not use electricity"],"Tools carry the culture that made them."]],
D:[["m","Why is the essay's opening about plumbing significant?","It shows how cultural values live in ordinary objects and spaces",["It is a joke with no point","It is a technical manual","It praises Western engineering"],"Taste lives in everyday things."]]},
{i:"eye",t:"Lacquer, paper and patina",c:"Middle",d:"Objects that need dimness and age.",
n:["Japanese objects were made to be seen in dim light, and their beauty grows with age and handling.",
"Tanizaki says Westerners love things that shine and are newly polished, while Japanese taste prefers a soft sheen and the patina of use. Lacquerware looks garish in electric light but glows in candlelight, its gold catching the flame. Paper absorbs light softly. Even food, like miso soup or yokan sweets in a dark lacquer bowl, is meant to be seen in shadow.",
["The West prefers shine and newness; Japan prefers soft sheen and patina","Lacquer was made for candlelight and darkness","In bright light lacquer looks cheap; in dim light it glows","Paper softly takes in light rather than reflecting it","Yokan and miso soup are beautiful in a dark bowl"],
"Tanizaki says Japanese lacquerware was made to be seen by candlelight: in an electric room it looks gaudy, in shadow it glows."],
s:[["l","The glow of use","Tanizaki notes that Westerners polish silver until it gleams, while Japanese people value the dull luster that comes with age and many hands. That dimmed, slightly grimy sheen is something to love, not clean away."],
["m","What surface quality does Tanizaki prefer?","A soft, aged sheen from long use",["Bright, polished shine","Perfectly matte plastic","Glossy new paint"],"Patina carries time and care."],
["l","Lacquer in candlelight","Lacquer looks crude under electric light. But in the flicker of a candle, the dark surfaces and gold designs come alive, as if the darkness itself were part of the object. Paper screens take light in gently, like soft snow. Even yokan, a bean jelly, seems to hold darkness inside it."],
["t","Tanizaki says lacquer was designed to be admired in bright electric light.",false,"It was meant for candlelight."],

var shTab='read',shQ='';
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function covEl(c,t,sz){
  var w=sz==='M'?64:38,h=sz==='M'?96:56,ini=String(t||'?').replace(/^(the|a|an)\s+/i,'').charAt(0).toUpperCase();
  return '<div class="cvw" style="width:'+w+'px;height:'+h+'px"><span>'+esc(ini)+'</span>'+(c?'<img src="https://covers.openlibrary.org/b/id/'+c+'-'+(sz||'S')+'.jpg" alt="" loading="lazy" onerror="this.remove()">':'')+'</div>';
}
function coverOfBook(b){var n=norm(b.title),x=S.shelf.filter(function(i){return norm(i.t).indexOf(n)===0&&i.c;})[0];return x?x.c:0;}
var covBusy=false;
function ensureCovers(){
  if(covBusy||typeof fetch!=='function')return;
  var x=S.shelf.filter(function(i){return !i.c&&!i.cx;})[0];if(!x)return;
  covBusy=true;
  var q='https://openlibrary.org/search.json?title='+encodeURIComponent(x.t.split(':')[0].replace(/\(.*?\)/g,'').trim())+'&author='+encodeURIComponent(x.a.replace(/[*]/g,'').split(',')[0])+'&fields=cover_i&limit=5';
  fetch(q).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
    var d=(j.docs||[]).filter(function(z){return z.cover_i;})[0];
    if(d)x.c=d.cover_i;else x.cx=1;
    save();covBusy=false;
    var m=document.getElementById('shrows');if(m&&tab==='shelf')m.innerHTML=shRows();
    setTimeout(ensureCovers,350);
  }).catch(function(){covBusy=false;});
}
function stoopOf(it){
  var n=norm(it.t);
  for(var i=0;i<BOOKS.length;i++){if(n.indexOf(norm(BOOKS[i].title))===0)return BOOKS[i];}
  return null;
}
function shelfOfBook(b){var n=norm(b.title),x=S.shelf.filter(function(i){return norm(i.t).indexOf(n)===0;})[0];return x?x.s:null;}
function shItem(k){return S.shelf.filter(function(x){return x.k===k;})[0];}
function shRows(){
  var q=norm(shQ);

  if(!rows.length)return findBtn()+'<div class="empty">'+(q?'Not on your shelves yet. Tap the button above to find it.':'Nothing here yet. Search for a book above.')+'</div>';
  return findBtn()+(q?'<p class="cap" style="margin-top:12px">On your shelves</p>':'')+rows.map(function(x){
    var b=stoopOf(x),ini=x.t.replace(/^(the|a|an)\s+/i,'').charAt(0).toUpperCase();
    return '<button class="srow" data-act="shitem" data-k="'+esc(x.k)+'">'+covEl(x.c,x.t)+'<div style="flex:1;min-width:0"><b>'+esc(x.t.split(':')[0])+'</b><span>'+esc(x.a)+'</span></div>'+(q&&!b?'<em class="tag w" style="color:var(--muted);border-color:var(--line-2)">'+(x.s==='read'?'Read':'To read')+'</em>':b?'<em class="tag">Lessons</em>':x.w?'<em class="tag w">Requested</em>':'')+'</button>';
  }).join('');
}

function openFind(){

    FR=(j.docs||[]).map(function(d){return {t:d.title||'',a:(d.author_name||[]).slice(0,2).join(', '),y:d.first_publish_year||'',c:d.cover_i||0};}).filter(function(r){return r.t;});
