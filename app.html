s:[["l","Theater and the body","Noh actors in dim halls, with costumes of deep color, show the old beauty best. Tanizaki also writes about women seen in dim rooms and about skin color in ways that read today as dated and racially loaded. It is worth noticing these passages critically rather than skipping them."],
["m","Which art forms does Tanizaki say preserve the aesthetic of shadow?","Noh and Bunraku theater",["Western opera","Modern cinema","Kabuki only"],"Dim stages keep the old mood."],
["l","Too much light","He describes modern hotels and streets ablaze with electricity, complaining that the excess wastes energy and destroys mood. Knowing the past cannot return, he ends with a modest wish: to call back, in literature at least, the world of shadows Japan is losing."],
["t","Tanizaki believes Japan can easily return to its traditional way of life.",false,"He accepts the change and wants to keep the sensibility alive in writing."],
["m","How does the essay end?","With a wish to restore the world of shadows, at least in literature",["With a plan to ban electricity","With praise for modern hotels","With a call for war"],"A personal, modest protest."]],
D:[["m","Why do modern readers approach some of the essay with care?","Its comments on skin color reflect dated racial ideas",["It has no historical value","It is a fake text","It was banned in Japan"],"Read it in context, critically."]]}]]
]}));
MORE.push(MK({id:"thaler",t:"Nudge",a:"Richard H. Thaler",y:2008,
q:"how can we help people make better choices without taking away their freedom?",
ans:"Thaler and Sunstein argue that every choice is presented in some way, so someone is always a choice architect. Because people are Humans, not perfectly rational Econs, small design details like defaults and framing change decisions. They propose libertarian paternalism: steer people toward choices that make their lives better while keeping every option open.",
cov:"Lessons cover the main ideas and the best-known applications. The book has many more policy examples.",
u:[
["Humans","Part I",[
{i:"user",t:"Choice architecture",c:"Introduction",d:"The cafeteria, defaults and libertarian paternalism.",
n:["There is no neutral way to present choices, so we should design them to help people while keeping them free.",
"The book opens with Carolyn, who runs school cafeterias and finds that simply rearranging food changes what children eat. Whoever arranges choices is a choice architect, and there is no neutral design. A nudge is any part of that design that changes behavior predictably without forbidding options or changing incentives much. Libertarian paternalism: steer people toward what they would choose for themselves, but let them opt out easily.",
["Cafeteria example: placement changes what people eat","Everyone who designs choices is a choice architect","There is no neutral design","A nudge alters behavior without banning options","Libertarian paternalism: steer, but keep freedom","Nudges must be cheap and easy to avoid"],
"The core idea: someone always designs how choices are presented, so design them to help people, while leaving everyone free to choose otherwise."],
s:[["l","The cafeteria","Imagine a woman in charge of school cafeterias. By moving fruit to eye level and desserts out of reach, she can change what children eat without banning anything. Whatever she does, some arrangement will influence choices; there is no neutral option. She is a choice architect."],
["m","What does the cafeteria example show?","The way choices are arranged influences decisions, and no arrangement is neutral",["Children always choose dessert","Bans are the best tool","Prices are all that matter"],"Design shapes behavior."],
["l","Libertarian paternalism","A nudge changes behavior predictably without forbidding options or significantly changing economic incentives. Putting fruit at eye level counts; banning junk food does not. The authors call their approach libertarian paternalism: paternalistic because it steers people toward better outcomes as they themselves judge them, libertarian because people stay free to choose."],
["t","According to the authors, banning junk food counts as a nudge.",false,"A nudge keeps all options available."],
["m","What makes libertarian paternalism libertarian?","People remain free to opt out",["The government makes choices for people","Markets decide everything","It forbids bad options"],"Freedom of choice is preserved."]],
D:[["m","Why do the authors say a choice architect cannot avoid influencing people?","Every arrangement, even a random one, affects what people choose",["Architects are always biased","People never notice design","Choices are always made by law"],"Neutrality is impossible."]]},
{i:"eye",t:"Humans, not Econs",c:"Chapter 1",d:"Two systems and the rules of thumb we use.",
n:["Real people use quick rules of thumb that create predictable errors: anchoring, availability, representativeness.",
"Economics often assumes Econs, perfectly rational calculators. Real people are Humans. We have an automatic system, fast and intuitive, and a reflective system, slow and deliberate. We rely on heuristics. Anchoring: we adjust from a starting number too little. Availability: we judge risk by how easily examples come to mind. Representativeness: we judge by similarity to a stereotype.",
["Econs: perfectly rational beings of textbook economics","Humans: real people who make predictable mistakes","Automatic system (fast) and reflective system (slow)","Anchoring: starting numbers bias estimates","Availability: vivid examples skew risk judgments","Representativeness: similarity misleads us"],
"Thaler's point is that we are Humans, not Econs: we take mental shortcuts, and those shortcuts lead to predictable errors that choice design can account for."],
s:[["l","Two systems","The automatic system is quick and instinctive, like ducking from a thrown ball. The reflective system is slow and careful, like doing a tax form. Most of the time we run on automatic, which is efficient but error-prone."],
["x","Match each heuristic to its effect",[["Anchoring","Starting number skews the estimate"],["Availability","Vivid examples seem more likely"],["Representativeness","Judging by stereotype"],["Automatic system","Fast, intuitive thinking"]],"Shortcuts with predictable errors."],
["l","Optimism and loss aversion","People are overconfident: most drivers think they are above average. Losses hurt about twice as much as equal gains feel good. We stick with the status quo, partly from inertia. All of these make the design of choices powerful."],
["m","What does loss aversion mean?","Losses hurt roughly twice as much as equal gains please",["People avoid all risk","People enjoy losing","Losses and gains feel the same"],"Losing weighs more."],
["t","The book argues people behave like Econs most of the time.",false,"It argues we are Humans who err predictably."]],
D:[["m","Why does status quo bias make defaults so powerful?","People tend to stick with whatever option is already set",["Defaults are always best","People read every option carefully","Defaults are illegal to change"],"Inertia favors the default."]]},
{i:"chat",t:"Following the herd",c:"Chapters 2 to 4",d:"Temptation, mindless choosing and social influence.",
n:["We struggle with self-control, choose mindlessly, and follow what others do, so social cues are strong nudges.",
"People face temptation and use tricks like mental accounting to control themselves. Many choices are mindless: bigger plates and bowls lead people to eat more. And we are strongly influenced by others. Telling people that most of their neighbors pay taxes on time, or use less energy, changes behavior. Social norms are among the most effective nudges.",
["Self-control problems: planner versus doer","Mental accounting: treating money differently by its label","Mindless choosing: bigger portions mean more eating","Social influence: people conform to what others do","Telling people the norm changes behavior","Energy bills comparing you with neighbors reduce use"],
"One of the strongest nudges is simply telling people what others do: for example, that most of your neighbors pay their taxes on time."],
s:[["l","Planner and doer","Inside each of us is a far-sighted planner and an impulsive doer. We set alarms across the room and keep money in separate jars to manage the doer. Much eating and spending is mindless: people eat more from larger containers without noticing."],
["m","What does mindless choosing show?","Small cues like portion size change behavior without awareness",["People always count calories","Big plates make people eat less","Choices are always deliberate"],"Context steers us silently."],
["l","Social nudges","Humans conform. Letters telling taxpayers that most people in their state pay on time improved compliance. Energy bills showing how you compare with neighbors reduced use, especially when a smiley face rewarded low users so they did not drift up."],
["t","Telling people what most others do has little effect on behavior.",false,"Social norms are powerful nudges."],
["m","Why did the energy bills add a smiley face for low users?","So low users would not increase use to match the average",["To decorate the bill","To shame high users","To advertise the company"],"Norms can pull both ways."]],
D:[["m","Why can stating a norm backfire?","Those already doing better than average may slide toward the average",["People ignore all norms","It is illegal","It costs too much"],"Hence the smiley face fix."]]}]],
["Tools and cases","Parts II to V",[
{i:"blocks",t:"The architect's toolkit",c:"Chapter 5",d:"Defaults, error, feedback, mappings, structure, incentives.",
n:["Good choice architecture uses smart defaults, expects error, gives feedback and simplifies complex choices.",
"The authors list principles. Set defaults wisely, since many people never change them. Expect error and design forgiving systems, like cars that beep if you leave the lights on. Give feedback. Help people map choices to outcomes, for example by showing costs in clear terms. Structure complex choices so they are manageable. And make incentives visible. The famous example: a fly etched in airport urinals in Amsterdam reduced spillage.",
["Defaults: the most powerful nudge","Expect error: design forgiving systems","Give feedback","Understand mappings: link choices to outcomes","Structure complex choices","Make incentives salient","Amsterdam airport urinal fly"],
"The most powerful tool is the default: whatever happens if you do nothing. Most people never change it."],
s:[["l","Defaults","Whatever happens if a person does nothing is the default, and it carries enormous weight because of inertia and the sense that it is recommended. Good architects choose defaults carefully. The authors summarize their principles with the word NUDGES: iNcentives, Understand mappings, Defaults, Give feedback, Expect error, Structure complex choices."],
["m","Which nudge do the authors call especially powerful?","Defaults",["Advertising","Fines","Lectures"],"Most people stick with them."],
["l","Expect error","Humans make mistakes, so good design forgives them: cars warn when you forget a seat belt, and gas pump nozzles do not fit the wrong tank. At Amsterdam's Schiphol airport, an image of a fly in the urinals gave men something to aim at and cut spillage."],
["x","Match each principle to an example",[["Expect error","Seatbelt warning chime"],["Defaults","Automatic enrollment in savings"],["Feedback","Showing energy use in real time"],["Structure","Narrowing choices to a few clear options"]],"The toolkit in action."],
["t","The urinal fly is an example of a fine.",false,"It is a nudge."]],

function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function dayNum(s){var p=s.split('-');return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/864e5);}

function stateOf(id){
  if(id==='boss'){if(bossDone())return 'done';return unlocked('boss')?'current':'locked';}
  if(S.done[id])return 'done';

}
function currentId(){for(var i=0;i<LESSONS.length;i++){if(!S.done[LESSONS[i].id])return LESSONS[i].id;}return bossDone()?null:'boss';}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function srsUpdate(q,ok){var e=S.srs[q]||{b:0,d:0};e.b=ok?Math.min(5,e.b+1):0;e.d=Date.now()+DAYS[e.b]*864e5;S.srs[q]=e;}
function isRead(n){return !!(S.read[B.id]&&S.read[B.id][n]);}
function lessonRead(L){return L.chs.some(isRead);}
function qsOf(L,withDeep){var a=L.steps.filter(function(s){return s.t!=='learn';});if(L.deep&&(withDeep||lessonRead(L)))a=a.concat(L.deep);return a;}
function allQs(){var a=[];LESSONS.forEach(function(L){a=a.concat(qsOf(L));});return a;}
function dueQs(){var now=Date.now();return allQs().filter(function(q){var e=S.srs[q.qid];return e&&e.d<=now;});}
function mastered(qs){return qs.filter(function(q){var e=S.srs[q.qid];return e&&e.b>=3;}).length;}
function reviewPool(){
  var now=Date.now(),qs=allQs();
  var due=qs.filter(function(q){var e=S.srs[q.qid];return e&&e.d<=now;}).sort(function(a,b){return S.srs[a.qid].d-S.srs[b.qid].d;});
  var fresh=qs.filter(function(q){return !S.srs[q.qid];});
  var rf=shuffle(fresh.filter(function(q){return lessonRead(BYID[q.lid]);})),of=shuffle(fresh.filter(function(q){return !lessonRead(BYID[q.lid]);}));
  var seen=shuffle(qs.filter(function(q){var e=S.srs[q.qid];return e&&e.d>now;}));
  return due.concat(rf,of,seen).slice(0,8);
}

function addToShelf(t,au,s){
  t=t.trim();au=au.trim();if(!t)return false;
  var n=norm(t+' '+au),dup=S.shelf.filter(function(x){return norm(x.t+' '+x.a)===n;})[0];
  if(dup){dup.s=s;return dup;}
  S.shelf.unshift({k:'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:t,a:au,s:s});return S.shelf[0];
}
function csvRows(txt){
  var rows=[],r=[],f='',q=false,i,c;
  for(i=0;i<txt.length;i++){c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','){r.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;r.push(f);f='';if(r.length>1||r[0]!=='')rows.push(r);r=[];}
    else f+=c;
  }
  if(f!==''||r.length){r.push(f);rows.push(r);}
  return rows;
}
function importCsv(txt){
  var rows=csvRows(txt);if(rows.length<2)return 'No rows found.';
  var h=rows[0].map(function(x){return x.trim().toLowerCase();}),ti=h.indexOf('title'),ai=h.indexOf('author'),si=h.indexOf('exclusive shelf');
  if(ti<0||si<0)return 'This does not look like a Goodreads export (needs Title and Exclusive Shelf columns).';
  var added=0,skip=0;
  rows.slice(1).forEach(function(r){
    var s=(r[si]||'').trim();
    if(s!=='read'&&s!=='to-read'){skip++;return;}
    var before=S.shelf.length;addToShelf(r[ti]||'',ai>=0?r[ai]||'':'',s);if(S.shelf.length>before)added++;
  });
  save();return 'Added '+added+' books. Skipped '+skip+' that were on other shelves.';
}

/* ---------- lesson engine ---------- */
function prep(it){
  if(it.t==='mcq'){it.opts=shuffle([{x:it.c,ok:true}].concat(it.w.map(function(w){return {x:w,ok:false};})));}
  if(it.t==='match'){it.left=shuffle(it.pairs.map(function(_,i){return i;}));it.right=shuffle(it.pairs.map(function(_,i){return i;}));it.matched={};it.nm=0;}
  it.missed=false;return it;
}
function copy(it,first){var c=Object.assign({},it);c.first=first;return prep(c);}
function cur(){return run.queue[run.i];}
function startLesson(id){
  closeOverlay();
  var isBoss=id==='boss',isReview=id==='review',reinforce=S.mode==='reinforce',src;
  if(isReview){src=reviewPool();}
  else if(isBoss){
    var pool=[];
    if(reinforce)pool=allQs();else LESSONS.forEach(function(L){pool=pool.concat(L.steps.filter(function(s){return s.t!=='learn';}));});
    src=shuffle(pool).slice(0,8);
  }else if(reinforce)src=qsOf(BYID[id]);
  else src=BYID[id].steps;
  var q=src.map(function(s){return copy(s,true);});
  run={id:id,isBoss:isBoss,review:isReview,reinforce:reinforce,queue:q,i:0,hearts:5,done:0,total:q.length,firstTry:0,qCount:q.filter(function(s){return s.t!=='learn';}).length,sel:null,checked:false,result:null,dead:false,ml:null,mr:null,flash:null};
  document.getElementById('lesson').className='on';
  renderLesson();
}
function exitLesson(){run=null;var l=document.getElementById('lesson');l.className='';l.innerHTML='';closeOverlay();renderMain(true);}

}
function fbHTML(ok,it){
  var msg=ok?tr(['Nice!','Exactly.','You got it.','Correct.'][Math.floor(Math.random()*4)]):tr('Not quite.');
  var ans='';
  if(!ok&&it.t==='mcq')ans='<p class="fa"><b>'+tr('Answer:')+'</b> '+esc(it.c)+'</p>';
  if(!ok&&it.t==='tf')ans='<p class="fa"><b>'+tr('Answer:')+'</b> '+tr(it.a?'True':'False')+'</p>';
  return '<div class="fb '+(ok?'right':'wrong')+'"><div class="fh">'+ic(ok?'check':'x',26)+'<h3>'+msg+'</h3></div>'+ans+'<p>'+esc(it.why)+'</p><button class="btn '+(ok?'good':'bad')+'" data-act="next">'+tr('Continue')+'</button></div>';
}
function renderLesson(){
  if(!run)return;
  var it=cur(),body='',foot='',fcls='';
  if(it.t==='learn'){
    var L=run.isBoss?null:BYID[run.id];
    body='<div class="learn"><div class="badge">'+ic(L?L.icon:'book',32)+'</div><span class="eyebrow">'+tr('New idea, ')+esc(it.tag)+'</span><h2>'+esc(it.h)+'</h2><p>'+esc(it.p)+'</p></div>';
    foot='<button class="btn" data-act="next">'+tr('Continue')+'</button>';
  }else if(it.t==='mcq'||it.t==='tf'){
    var opts=it.t==='mcq'?it.opts.map(function(o){return o.x;}):[tr('True'),tr('False')];
    body='<h2 class="q">'+esc(it.q)+'</h2><div class="opts">'+opts.map(function(x,i){
      var c='opt';
      if(run.checked){
        var good=it.t==='mcq'?it.opts[i].ok:((i===0)===it.a);
        c+=' lock'+(good?' right':(i===run.sel?' wrong':''));
      }else if(run.sel===i)c+=' sel';
      return '<button class="'+c+'" data-act="opt" data-i="'+i+'"><span class="k">'+(i+1)+'</span><span>'+esc(x)+'</span></button>';
    }).join('')+'</div>';
    if(run.checked){fcls=run.result;foot=fbHTML(run.result==='right',it);}
    else foot='<button class="btn" data-act="check"'+(run.sel==null?' disabled':'')+'>'+tr('Check')+'</button>';
  }else if(it.t==='match'){
    var side=function(order,key,selIdx){return '<div class="col">'+order.map(function(pi){
      var txt=it.pairs[pi][key==='l'?0:1],c='opt';
      if(it.matched[pi])c+=' gone';else if(selIdx===pi)c+=' sel';
      if(run.flash&&run.flash[key==='l'?0:1]===pi)c=' opt wrong shake';
      return '<button class="'+c+'" data-act="m'+key+'" data-p="'+pi+'">'+esc(txt)+'</button>';
    }).join('')+'</div>';};
    body='<h2 class="q">'+esc(it.q)+'</h2><div class="mt">'+side(it.left,'l',run.ml)+side(it.right,'r',run.mr)+'</div>';
    if(run.checked){fcls='right';foot=fbHTML(true,it);}
    else foot='<div class="hint">'+tr('Tap a term, then its match')+'</div>';
  }
  document.getElementById('lesson').innerHTML='<div class="lw">'+topBar()+'<div class="lb">'+body+'</div><div class="lf '+fcls+'">'+foot+'</div></div>';
}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(30);}catch(e){}}
function check(){
  var it=cur();if(run.checked||run.sel==null)return;
  var ok=it.t==='mcq'?it.opts[run.sel].ok:((run.sel===0)===it.a);
  S.att++;run.checked=true;
  if(it.qid&&it.first)srsUpdate(it.qid,ok);
  if(ok){S.ok++;run.result='right';run.done++;if(it.first&&!it.missed)run.firstTry++;}
  else{run.result='wrong';it.missed=true;if(!run.reinforce&&!run.review)run.hearts--;buzz();run.queue.push(copy(it,false));if(run.hearts<=0)run.dead=true;}
  save();renderLesson();
}
function pickMatch(side,p){
  var it=cur();if(run.checked)return;
  if(side==='l')run.ml=(run.ml===p)?null:p;else run.mr=(run.mr===p)?null:p;
  if(run.ml!=null&&run.mr!=null){
    S.att++;
    if(run.ml===run.mr){
      S.ok++;it.matched[run.ml]=true;it.nm++;run.ml=run.mr=null;
      if(it.nm===it.pairs.length){run.checked=true;run.result='right';run.done++;if(it.qid&&it.first)srsUpdate(it.qid,!it.missed);if(it.first&&!it.missed)run.firstTry++;}
    }else{
      it.missed=true;if(!run.reinforce&&!run.review)run.hearts--;buzz();run.flash=[run.ml,run.mr];run.ml=run.mr=null;
      if(run.hearts<=0)run.dead=true;
      var token=run;setTimeout(function(){if(run!==token)return;run.flash=null;if(run.dead){showOut();}else renderLesson();},500);
    }
  }
  save();renderLesson();
}
function next(){
  var it=cur();
  if(it.t==='learn')run.done++;
  if(run.dead){showOut();return;}
  run.i++;run.sel=null;run.checked=false;run.result=null;run.ml=run.mr=null;
  if(run.i>=run.queue.length){complete();return;}
  renderLesson();
}
function showOut(){
  document.getElementById('lesson').innerHTML='<div class="lw"><div class="center"><div class="bigb bad">'+ic('heart',52,true)+'</div><h1>'+tr('Out of hearts')+'</h1><p>'+tr('Missed questions are how the ideas stick. Go again with a fresh set of hearts.')+'</p><div style="width:100%;display:flex;flex-direction:column;gap:10px;margin-top:8px"><button class="btn" data-act="retry">'+tr('Refill and retry')+'</button><button class="btn ghost" data-act="leave">'+tr('Quit')+'</button></div></div></div>';
}
function complete(){
  var qn=run.qCount,acc=Math.round(run.firstTry/Math.max(1,qn)*100);
  var xp=6+run.firstTry*3+(run.firstTry===qn?5:0);if(run.isBoss)xp*=2;
  S.xp+=xp;bumpStreak();
  var pass=true,sub='';
  if(run.review){sub='Questions you missed will come back sooner.';}
  else if(run.isBoss){S.boss[B.id]=true;sub=B.bossMsg;}
  else if(run.reinforce){pass=acc>=80;if(pass)S.done[run.id]=true;sub=pass?'Marked as known in your path.':'Score 80% or more to mark this lesson as known. Try again.';}
  else S.done[run.id]=true;
  if(acc===100)S.perfect++;
  save();
  var title=run.review?'Review complete':run.isBoss?tr('You know this book'):tr('Lesson complete');
  var say=(!run.isBoss&&!run.review&&pass&&BYID[run.id]&&BYID[run.id].note.say)||'';
  document.getElementById('lesson').innerHTML='<div class="lw"><div class="center"><div class="bigb">'+ic(run.isBoss?'star':'check',56,run.isBoss)+'</div><h1>'+title+'</h1>'+(sub?'<p>'+esc(sub)+'</p>':'')+
   '<div class="res"><div><span>'+tr('XP')+'</span><b>+'+xp+'</b></div><div><span>'+tr('Accuracy')+'</span><b>'+acc+'%</b></div><div><span>'+tr('Streak')+'</span><b>'+S.streak+'</b></div></div>'+
   (say?'<div class="say"><span class="eyebrow">Say it like this</span><p>'+esc(say)+'</p></div>':'')+'</div>'+
   '<div class="lf"><button class="btn" data-act="leave">'+tr('Continue')+'</button>'+(run.review?'':'<button class="btn ghost" style="margin-top:10px" data-act="readfrom">Read this in the real book</button>')+'</div></div>';
  confetti();
}
function confetti(){
  var c=document.createElement('div');c.className='confetti';c.setAttribute('aria-hidden','true');
  var cols=['#6f98ff','#a5bcff','#38d9a0','#ffd166','#ff9f43','#ff6b7d'],h='';
  for(var i=0;i<46;i++){h+='<i style="left:'+Math.random()*100+'%;background:'+cols[i%cols.length]+';animation-delay:'+(Math.random()*.6).toFixed(2)+'s;animation-duration:'+(1.8+Math.random()*1.4).toFixed(2)+'s"></i>';}
  c.innerHTML=h;document.body.appendChild(c);setTimeout(function(){c.remove();},3600);
}

/* ---------- events ---------- */
document.addEventListener('keydown',function(e){if(e.target&&e.target.id==='shq'&&e.key==='Enter'){e.preventDefault();e.target.blur();if(shQ.trim().length>1)openFind();}});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='shq'){shQ=e.target.value;document.getElementById('shrows').innerHTML=shRows();}});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act;
  if(a==='scrim'){if(e.target===el)closeOverlay();return;}
  switch(a){
    case 'tab':tab=el.dataset.tab;resetArmed=false;renderMain(false);break;
    case 'open':openLesson(el.dataset.id);break;
    case 'notes':tab='book';renderMain(false);break;
    case 'retell':openRetell();break;
    case 'rtcheck':rtCheck();break;
    case 'rttick':rtSel[+el.dataset.i]=!rtSel[+el.dataset.i];rtCheck();break;
    case 'rtdone':rtDone();break;
    case 'tour':tourI=0;openTour();break;
    case 'tournext':if(tourI<TOUR.length-1){tourI++;openTour();}else{S.seen=1;save();closeOverlay();tab='learn';renderMain(false);}break;
    case 'tourend':S.seen=1;save();closeOverlay();break;
    case 'shtab':shTab=el.dataset.s;renderMain(false);ensureCovers();break;
    case 'shitem':openShItem(el.dataset.k);break;
    case 'shadd':openShAdd();var at=document.getElementById('addt');if(at&&shQ)at.value=shQ.trim();break;
    case 'find':openFind();break;
    case 'fadd':var fr=FR[+el.dataset.i];if(fr){var it=addToShelf(fr.t,fr.a,el.dataset.s);if(it&&fr.c)it.c=fr.c;save();renderFind();shTab=el.dataset.s;var mm=document.getElementById('shrows');if(mm&&tab==='shelf')mm.innerHTML=shRows();}break;
    case 'shimp':openShImp();break;
    case 'shbak':openShBak();break;
    case 'shdo':if(addToShelf(document.getElementById('addt').value,document.getElementById('adda').value,el.dataset.s)){save();shTab=el.dataset.s;shQ='';closeOverlay();renderMain(false);}break;
    case 'shgo':var gx=shItem(el.dataset.k),gb=gx&&stoopOf(gx);if(gb){setBook(gb.id);save();closeOverlay();tab='learn';renderMain(false);}break;
    case 'shwant':var wx=shItem(el.dataset.k);if(wx){wx.w=!wx.w;save();openShItem(wx.k);renderMain(true);}break;
    case 'shmove':var mx=shItem(el.dataset.k);if(mx){mx.s=mx.s==='read'?'to-read':'read';setBook(B.id);save();closeOverlay();renderMain(true);}break;
    case 'shdel':S.shelf=S.shelf.filter(function(x){return x.k!==el.dataset.k;});save();closeOverlay();renderMain(true);break;
    case 'shcopy':var bt=document.getElementById('bakt');bt.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}openShBak(ok?'Copied.':'Select the text and copy it by hand.');break;
    case 'shrest':try{var arr=JSON.parse(document.getElementById('bakt').value);if(Array.isArray(arr)&&arr.every(function(x){return x&&x.k&&x.t&&(x.s==='read'||x.s==='to-read');})){S.shelf=arr;save();openShBak('Restored '+arr.length+' books.');renderMain(true);}else openShBak('That text is not a valid backup.');}catch(e){openShBak('That text is not a valid backup.');}break;
    case 'books':openBooks();break;
    case 'readsheet':openRead();break;
    case 'readfrom':exitLesson();openRead();break;
    case 'readch':var cn=+el.dataset.ch;S.read[B.id]=S.read[B.id]||{};S.read[B.id][cn]=!S.read[B.id][cn];save();renderMain(true);break;
    case 'pick':setBook(el.dataset.id);save();closeOverlay();tab='learn';renderMain(false);break;
    case 'close':closeOverlay();break;
    case 'start':startLesson(el.dataset.id);break;
    case 'zoom':zoom=+el.dataset.z;renderMain(true);break;
    case 'opt':if(run&&!run.checked){run.sel=+el.dataset.i;renderLesson();}break;
    case 'check':check();break;
    case 'next':next();break;
    case 'ml':pickMatch('l',+el.dataset.p);break;
    case 'mr':pickMatch('r',+el.dataset.p);break;
    case 'quit':openOverlay('<h2>'+tr('Quit this lesson?')+'</h2><p>'+tr('You will lose the progress you made in it.')+'</p><button class="btn" data-act="close">'+tr('Keep learning')+'</button><button class="btn ghost" data-act="leave">'+tr('End session')+'</button>');break;
    case 'leave':exitLesson();var n=document.querySelector('.node.current');if(n&&tab==='learn')n.scrollIntoView({block:'center'});break;
    case 'retry':startLesson(run.id);break;
    case 'reset':
      if(!resetArmed){resetArmed=true;renderMain(true);}
      else{var bid=B.id,shf=S.shelf;S=fresh();S.shelf=shf;S.seen=1;setBook(bid);resetArmed=false;save();renderMain(false);}
      break;
  }
});


setBook(S.book);renderMain(false);setTimeout(ensureCovers,1200);
if(doneCount()>0){var n0=document.querySelector('.node.current');if(n0)n0.scrollIntoView({block:'center'});}
})();
</script>
