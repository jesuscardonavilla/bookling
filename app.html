["t","After his arrest, Josef K. is taken to prison.",false,"He stays free and keeps working."],
["m","How old does Josef K. turn on the day of his arrest?","Thirty",["Forty","Twenty-one","Fifty"],"The story spans one year, ending on the eve of his 31st birthday."]],
D:[["m","What does the first sentence suggest about K.'s guilt?","That someone slandered him, since he did nothing wrong",["That he confessed","That he is a murderer","That the court is fair"],"The novel opens on presumed innocence."]]},
{i:"user",t:"The court in the attic",c:"Chapters 2 and 3",d:"The first hearing and the hidden court.",
n:["The court sits in shabby attics of tenements, and its law books turn out to be dirty pictures.",
"K. is summoned to a hearing on Sunday but given no time or room. He finds the court in a crowded attic of a poor tenement. He gives a defiant speech attacking the system, which the audience seems to ignore. On a return visit, he finds the court empty and its law books full of indecent drawings. The court's offices sprawl through attics all over the city, stuffy and airless.",
["The hearing is held in a tenement attic","K. arrives late; no time had been given","He makes a speech denouncing the court","The audience seems to be part of the court","The law books contain obscene drawings","The court's offices are everywhere, in attics"],
"Kafka's court is not a grand building but cramped attics in poor tenements, all over the city, and its law books are filled with dirty drawings."],
s:[["l","An attic court","K. searches a poor district for the court, inventing an excuse to knock on doors. He finds it in a packed attic room. He lectures the examining magistrate about the absurdity of his arrest and the corruption of the system. The crowd reacts oddly, and he realizes they all wear badges of the court."],
["m","Where does K. find the court?","In the attic of a poor tenement",["In a grand palace of justice","In the bank","At the police station"],"The court is shabby and everywhere."],
["l","Empty court","Returning the next Sunday, K. finds no session. He opens the magistrate's books and finds crude erotic drawings and a cheap novel. He is shown the court offices: long, stuffy corridors full of waiting accused, where the air is so bad that K. nearly faints."],
["t","K.'s defiant speech brings his case to a quick end.",false,"It changes nothing."],
["m","What does K. find in the magistrate's law books?","Indecent drawings and a cheap novel",["The text of his charge","Blank pages","His bank records"],"The law's authority looks absurd up close."]],
D:[["m","Why does it matter that the court is in attics everywhere?","It suggests the system is hidden in ordinary life and inescapable",["It shows the court is poor and harmless","It proves the court is fake","It makes the court easy to find"],"The court pervades the world."]]}]],
["The struggle","Middle chapters",[
{i:"x",t:"The flogger and the lawyer",c:"Chapters 5 to 7",d:"Punished warders, a sick advocate and Leni.",
n:["K.'s complaints get the warders flogged, his uncle hires a sickly lawyer, and the case grows heavier.",
"In a junk room at his own bank, K. finds the two warders being whipped because he complained about them. He cannot stop it. His uncle, alarmed, takes him to the lawyer Huld, who is bedridden and talks endlessly about connections and petitions without doing anything visible. K. is distracted by Huld's nurse Leni. The trial begins to consume his work and his mind.",
["The warders are flogged in a lumber room at the bank because of K.'s complaint","Uncle Karl arrives and pushes K. to hire a lawyer","Huld is ill, vague and slow","Leni, the nurse, seduces K.","The lawyer's first petition is never filed","K.'s work at the bank suffers"],
"K.'s complaint about the warders gets them flogged in a closet at his own bank. His attempts to fight the court only seem to make things worse."],
s:[["l","The flogging","Opening a storeroom door at the bank, K. finds the two warders being whipped by a man in leather. His complaint at the hearing caused it. He offers a bribe to stop it, fails, and shuts the door. The next day the scene is exactly the same."],
["m","Why are the warders being flogged?","Because K. complained about them at his hearing",["For stealing from the bank","For missing work","For helping K. escape"],"K.'s actions have unexpected victims."],
["l","The lawyer Huld","K.'s uncle insists he hire Huld, a well-connected lawyer who receives him in bed. Huld speaks of influence with officials and the importance of petitions but never gets anywhere. Meanwhile his nurse Leni draws K. away. K. grows exhausted and distracted at the bank."],
["t","Huld, the lawyer, makes rapid progress on K.'s case.",false,"He seems to achieve nothing."],
["m","Who pushes K. to hire a lawyer?","His uncle",["Fräulein Bürstner","The priest","The bank director"],"Family worry pulls him deeper in."]],
D:[["m","What does the repeated flogging scene suggest?","The system's cruelty is unchanging and K. cannot fix it by protest",["The bank is secretly the court","The warders deserved it","K. enjoys their suffering"],"Time does not move the machine."]]},
{i:"eye",t:"Titorelli and three kinds of acquittal",c:"Chapters 7 and 8",d:"The court painter explains there is no real escape.",
n:["The court painter explains that real acquittal never happens; only apparent acquittal or endless postponement.",
"A client sends K. to Titorelli, a painter who paints portraits of judges and knows the court's ways. In his tiny, stuffy room, he lays out three options: actual acquittal, which he has never seen; apparent acquittal, which can be overturned and the arrest renewed at any time; and protraction, keeping the case at its lowest stage forever. K. also meets Block, a merchant who has been crushed by his own years-long case, and decides to dismiss Huld.",
["Titorelli paints judges and knows how the court works","Actual acquittal: never seen it","Apparent acquittal: temporary, can be reversed","Protraction: endlessly delaying the case","Block the merchant, utterly submissive after five years","K. decides to fire his lawyer"],
"The painter Titorelli tells K. there are three outcomes: real acquittal, which never happens; apparent acquittal, which can be reversed; and endless postponement."],
s:[["l","Three outcomes","Titorelli explains that the court cannot be persuaded of innocence. Actual acquittal exists in legends but he has never seen one. Apparent acquittal means the charge is lifted for now but can return at any moment. Protraction means keeping the case going at its lowest stage indefinitely, with constant attention."],
["x","Match each outcome to Titorelli's description",[["Actual acquittal","Never actually happens"],["Apparent acquittal","Can be reversed at any time"],["Protraction","Case is delayed forever"],["Titorelli","Painter of judges' portraits"]],"No real exit is offered."],
["l","Block","At Huld's house K. meets Block, a merchant whose case has dragged on for years. He has hired secret lawyers, spent his fortune, and now groveling before Huld. Seeing him, K. dismisses his own lawyer, determined to take charge of his defense."],
["t","Titorelli says actual acquittals are common if you have the right connections.",false,"He has never seen one."],
["m","What does Block show K.?","How the case can grind a person into total submission",["How to win a case","That lawyers are useful","That the court is kind"],"Block is K.'s possible future."]],
D:[["m","Why is apparent acquittal no real freedom?","The arrest can be renewed at any time, so the threat never ends",["It costs too much","It requires leaving the country","It needs the king's signature"],"Guilt is never removed, only suspended."]]}]],
["The end","Final chapters",[
{i:"building",t:"Before the Law",c:"Chapter 9",d:"The parable in the cathedral.",
n:["A man waits all his life at the door of the Law, which was meant only for him, and is never let in.",
"Sent to show a visitor the cathedral, K. is called by name by a priest, the prison chaplain, who tells him a parable. A man from the country asks a doorkeeper to enter the Law. He is told not now. He waits for years, bribes the doorkeeper, grows old. Dying, he asks why no one else came. The doorkeeper says this door was meant only for you, and now I am going to shut it. K. and the priest argue about what it means.",
["K. is summoned by name in an empty cathedral","The priest is the prison chaplain, part of the court","Parable: a man waits all his life at the door of the Law","The doorkeeper says not now, never no","At death: this entrance was meant only for you","K. and the priest debate interpretations endlessly"],
"In the cathedral a priest tells K. the parable Before the Law: a man waits his whole life at a door, and is told at the end that it was meant only for him."],
s:[["l","A door meant for you","A man comes to the door of the Law and asks to enter. The doorkeeper says he cannot let him in now. The man waits, year after year, giving the doorkeeper everything he has. The doorkeeper accepts, saying it is only so the man will not think he failed to try. Dying, the man asks why no one else came. The answer: this door was made only for you, and now I will close it."],
["m","What does the doorkeeper say at the end of the parable?","The door was meant only for the man, and now it will be shut",["The Law was closed long ago","The man had the wrong door","Anyone can enter tomorrow"],"A private door, never used."],
["l","Endless interpretation","K. thinks the doorkeeper deceived the man. The priest offers counter-readings: maybe the doorkeeper is the deceived one, or bound by duty. He says one does not have to accept everything as true, only as necessary. K. calls that a dismal idea, turning lies into world order."],
["t","The priest gives K. a single, clear meaning of the parable.",false,"He offers many conflicting interpretations."],
["m","Who is the priest who tells the parable?","The prison chaplain, part of the court",["K.'s uncle","Titorelli","The bank director"],"Even the church belongs to the court."]],
D:[["m","Why is Before the Law often read as the key to the novel?","Like K., the man seeks access to a law that is personal yet unreachable and waits until death",["It reveals K.'s crime","It shows the court is kind","It explains the bank's role"],"It mirrors K.'s whole situation."]]},
{i:"x",t:"The quarry",c:"Chapter 10",d:"The execution, and what the novel means.",
n:["On the eve of his thirty-first birthday, two men lead K. to a quarry and kill him; he dies feeling shame.",
"Exactly a year after his arrest, two pale men in frock coats collect K. He goes along almost willingly. In a quarry outside town they lay him down and pass a knife between them, as if expecting him to do it himself. He will not. One stabs him in the heart. He dies saying it is like a dog, as if the shame would outlive him. Readers see the novel as about bureaucracy, guilt, totalitarian power, or the human condition itself.",
["The night before his 31st birthday","Two men in frock coats take him away","He does not resist","At a quarry they hand the knife back and forth","He is stabbed in the heart","His last thought is of shame","Read as about bureaucracy, guilt, faith, or totalitarianism"],
"K. dies a year after his arrest, killed in a quarry, never knowing his crime. Like a dog, he says, and the shame outlives him."],
s:[["l","Like a dog","Two men arrive the evening before K.'s thirty-first birthday. K. had half expected them. He walks with them through the city and does not cry for help. In a quarry, they lay him on a stone. A window opens nearby and a figure leans out, but no help comes. One man drives a knife into his heart."],
["m","When is K. executed?","The night before his thirty-first birthday",["The day after his arrest","Ten years later","On his fortieth birthday"],"Exactly one year passes."],
["l","What it means","Kafka asked his friend Max Brod to burn his manuscripts. Brod published them instead. The Trial has been read as a prophecy of totalitarian states, a satire of bureaucracy, a religious parable about guilt and grace, and a portrait of anxiety. The word Kafkaesque comes largely from it."],
["t","Kafka wanted The Trial published after his death.",false,"He asked Max Brod to destroy it."],
["m","What word did this novel help add to the language?","Kafkaesque",["Orwellian","Byzantine","Quixotic"],"It names absurd, oppressive bureaucracy."]],
D:[["m","Why do the executioners pass the knife back and forth over K.?","They seem to expect him to kill himself, completing his submission",["They are confused about orders","They want him to escape","They are afraid of him"],"Even death is half asked of him."]]}]]
]}));
MORE.push(MK({id:"kahneman",t:"Thinking, Fast and Slow",a:"Daniel Kahneman",y:2011,
q:"how do our two modes of thinking lead us to predictable errors?",
ans:"Kahneman describes two systems: System 1, fast, automatic and intuitive, and System 2, slow, effortful and lazy. Most errors come from System 1's shortcuts going unchecked. Across five parts he covers heuristics and biases (anchoring, availability, representativeness), overconfidence and the illusion of understanding, prospect theory and loss aversion, framing, and the gap between our experiencing self and our remembering self.",
cov:"Twenty-seven lessons follow the book's five parts and nearly every one of its 38 chapters in order, so you can talk about the whole argument. Built from the book's structure and well-known studies; use the real book for its stories and exact numbers.",
u:[
["Two systems","Part 1: chapters 1 to 9",[
LS("bolt","The characters of the story","Chapters 1 and 2","System 1 and System 2 and why attention is a budget.",
"System 1 is fast and automatic; System 2 is slow, effortful and lazy, so System 1 usually runs the show.",
"Kahneman introduces two characters. System 1 works quickly with no sense of effort: recognizing anger in a face, answering 2 plus 2, driving on an empty road. System 2 does the effortful work: multiplying 17 by 24, filling in a tax form, holding back an impulse. System 2 believes it is in charge, but it is lazy and mostly endorses System 1's suggestions. Mental effort is costly and attention is limited, which is why you cannot do two demanding things at once. Self-control and deliberate thinking draw on the same tired supply.",
["System 1: fast, automatic, always on, no sense of voluntary control","System 2: slow, deliberate, effortful, associated with choice and concentration","Attention is a limited budget; effort is costly, so people take the easy route","The invisible gorilla: focused attention makes us blind to the obvious","Self-control and hard thinking draw on the same limited effort","The two systems are fictions, useful shorthand for how the mind works"],
"The two systems in one line: a fast intuitive System 1 does most of the thinking, and a lazy System 2 rarely checks it.",
[["Two characters","Look at an angry face and you know the person is angry without trying: that is System 1. Multiply 17 by 24 and you must slow down and concentrate, and your pupils dilate and your heart rate rises: that is System 2. System 1 constantly generates impressions and feelings; System 2 is called when System 1 is stumped."],
["Attention is a budget","Effortful thinking is costly. While your mind is busy holding digits in memory you are more likely to give in to a tempting dessert or a snappy remark. People in a task that demands full concentration can miss something shocking, like a person in a gorilla suit crossing a basketball game."]],
[X([["Recognizing an angry face","System 1"],["Multiplying 17 by 24","System 2"],["Answering 2 plus 2","System 1"],["Checking a logical argument","System 2"]],"Fast versus slow."),
M("Why can tired or busy people more easily give in to temptation?","Self-control and effortful thinking draw on the same limited resource",["System 1 stops working","Temptations get stronger","System 2 is only for math"],"Effort is limited.")],
M("Why does Kahneman call System 2 lazy?","It tends to accept System 1's answers instead of checking them",["It only works at night","It cannot do math","It is always wrong"],"Laziness is the core of the book's errors.")),
LS("question","The lazy controller","Chapter 3","Why we accept easy answers.",
"The bat and ball puzzle shows System 2 failing to check System 1's tempting but wrong answer.",
"A bat and a ball cost 1.10 dollars together; the bat costs one dollar more than the ball. Most people say the ball costs 10 cents, which is wrong: it costs 5 cents. System 1 offers a quick, plausible answer, and System 2, which could catch it, does not bother. Many students at top universities miss it. Kahneman links this to a general pattern: a mind that is under load, in a good mood or simply comfortable defers to intuition. Cognitive flow, the state of effortless concentration, is the pleasant exception.",
["Bat and ball: the right answer is 5 cents, not 10","Most people, even at elite universities, give the intuitive wrong answer","System 2 monitors System 1 only weakly","Intelligence is related to being less lazy, but not immune","Flow: absorbed effort that feels effortless","Ego depletion was discussed as a cost of effortful control"],
"The 5 cent lesson: the first answer that comes to mind feels right even when it is wrong, and checking it takes effort most people skip.",
[["The puzzle","The bat costs a dollar more than the ball, and together they cost 1.10. The ball is not 10 cents, because then the bat would be 1.10 and the total 1.20. The ball is 5 cents. The point is not the arithmetic but that most people never double-check the tempting answer."],
["Why checking is rare","Because System 2 is lazy, we act as if our first impression were a fact. Cognitive reflection tests find that those who check do better on many judgment tasks. Even smart people skip the check when they are rushed, tired or confident."]],
[M("What is the correct answer to the bat and ball puzzle?","The ball costs 5 cents",["The ball costs 10 cents","The ball costs 1 dollar","The bat costs 5 cents"],"The bat costs 1.05 and the ball 0.05."),
T("Kahneman says smart people are immune to this kind of intuitive error.",false,"Even many university students get it wrong.")],
M("What explains the common wrong answer of 10 cents?","System 1 gives a fast plausible answer and System 2 does not check",["A trick in the wording only","A lack of schooling","Random guessing"],"Check the intuition.")),
LS("link","The associative machine","Chapter 4","Priming and how ideas trigger other ideas.",
"Ideas link up automatically in System 1, and recent words or images can shift thoughts, feelings and behavior without our noticing.",
"System 1 works by association: a word calls up related ideas, emotions and even small physical reactions, a process called priming. Kahneman describes studies where words connected to old age made people walk more slowly, and notes that this famous finding later ran into replication trouble, which he acknowledged. A better-supported idea is that we feel and act in a consistent pattern: smiling makes things seem funnier, and an honesty box with a picture of eyes above it drew more payments than one with flowers. The upshot is that we are far less in control of our thoughts than we feel.",
["Associative activation: ideas trigger linked ideas, emotions and reactions","Priming: recent exposure shifts later thoughts and behavior","The ideomotor effect: ideas can influence movements","Reciprocal links: smiling can make us feel amused","The honesty box study: eyes above it increased payments","Money primes were reported to make people more individualistic, with debated replication","Kahneman later acknowledged weak replication of some priming results"],
"Priming in one line: your mind is a web of linked ideas, and what you saw a moment ago quietly tilts what you think and do next.",
[["How ideas spread","Think of the words banana and vomit together and you feel a faint wince. Your body reacts, memories stir, and related ideas become easier to think of, all in a fraction of a second and without choice. This is associative coherence: System 1 builds a consistent story out of whatever has been activated."],
["Priming and its limits","Priming says that exposure can nudge behavior. In one office study, a coffee-room honesty box took more money in weeks when a picture of eyes hung above it. Kahneman also admits that some celebrated priming results, like the slow walking after old age words, did not replicate well, and urges humility about small samples."]],
[M("What is priming?","Exposure to an idea that shifts later thoughts and behavior",["A kind of memory test","Choosing the cheapest option","Planning a decision"],"Recent ideas bias what follows."),
M("What did the honesty box experiment suggest?","Pictures of eyes increased payments",["Flowers increased payments","Signs had no effect","Larger boxes got more money"],"Feeling watched changes behavior.")],
T("Kahneman says all priming studies have been solidly confirmed.",false,"He acknowledges replication problems.")),
LS("sparkle","Cognitive ease","Chapter 5","How feeling easy changes what we believe.",
"When something is easy to process we feel comfortable and are more likely to believe it; strain makes us alert and analytical.",
"Cognitive ease is a gauge in System 1 that tells us whether things are going well. Easy signals come from repeated words, clear print, a primed idea or a good mood, and they make us feel that something is familiar, true and good. Repetition makes statements seem true even when they are false, which is why slogans and repeated claims work, and why Zajonc found we like what is familiar, the mere exposure effect. Cognitive strain does the opposite: it mobilizes System 2 and makes us more careful, so hard-to-read print can actually improve performance on trick questions. Writers who want to be believed should make their message easy to process.",
["Cognitive ease signals that things are going well and nothing needs attention","Sources of ease: repetition, clear display, primed ideas, good mood","Ease makes statements feel true and familiar","The illusion of truth: repeated falsehoods feel more true","Mere exposure effect: we like what we have seen before","Strain makes us vigilant and more analytical","Poor print quality can reduce intuitive errors","Persuasion tips: use simple language, rhyme and clear fonts"],
"Cognitive ease in one line: what is easy to read feels true, and what is hard to read makes us think harder.",
[["Ease feels like truth","Repeated statements and clearly printed ones feel more familiar, and familiarity is easily mistaken for truth. This is why a false claim that is repeated often can feel more true than a correct one heard once. A good mood increases ease, so happy people are more trusting and intuitive."],
["Strain wakes up System 2","When something is hard to read or understand, System 2 gets involved. In one study, a puzzle printed in a hard-to-read font produced more correct answers, because strain triggered careful thinking. The practical rule: if you want to be believed, make your message clear, simple and memorable."]],
[M("What does cognitive ease tend to make us feel about something?","That it is familiar, true and good",["That it is dangerous","That it is wrong","That we must analyze it"],"Ease feels like truth."),
X([["Repetition","Makes statements feel true"],["Clear print","Raises cognitive ease"],["Strain","Mobilizes System 2"],["Mere exposure","We like what is familiar"]],"Four ideas of the chapter.")],
M("Why can hard-to-read print sometimes improve answers to tricky questions?","Strain triggers careful System 2 thinking",["It makes people guess","It lowers mood","It hides the question"],"Difficulty creates vigilance.")),
LS("compass","Norms, causes and the machine for jumping to conclusions","Chapters 6 and 7","How System 1 builds coherent stories from little evidence.",
"System 1 expects normality, builds causal stories and jumps to conclusions on the evidence it has, ignoring what it does not.",
"System 1 keeps a model of what is normal and is surprised by violations. It looks for causes and intentions even where there are none, as when we see a moving shape as chasing another. It also jumps to conclusions: it quickly creates the most coherent story from available information and does not signal that evidence is missing. Kahneman's shorthand is WYSIATI, what you see is all there is. Because we judge by the story's coherence rather than the amount of evidence, confidence comes from consistency, not from knowing much. This feeds confirmation bias, overconfidence and neglect of ambiguity.",
["System 1 maintains a model of what is normal and is surprised by exceptions","Norm theory: one surprising event makes others seem normal","We seek causes and intentions even in random events","The Moses illusion: we miss the false premise in a question","Jumping to conclusions is efficient but risky","WYSIATI: what you see is all there is","Confidence reflects the coherence of the story, not the quality of evidence","Confirmation bias: we tend to seek and accept what fits","Ambiguity is resolved without our noticing"],
"WYSIATI: your mind builds the best story from what it has and forgets that it is missing anything.",
[["Looking for causes","We cannot help seeing causes. Shown two shapes moving on a screen, we see one chasing another. Ask how many animals of each kind Moses took on the ark and most people answer two without noticing the question is about Noah. The mind fits the question into a pattern of normality and moves on."],
["WYSIATI","System 1 operates like a machine for jumping to conclusions. It takes the information it has, makes a coherent story and ignores the information it does not have. A coherent story feels like strong evidence, so people are often confident on thin evidence. This is the root of overconfidence, framing effects and base-rate neglect."]],
[M("What does WYSIATI stand for?","What you see is all there is",["Why you should always think it over","What you say is a test","Whether you study is a thing"],"The mind ignores missing information."),
T("Confidence in a judgment is mostly determined by how much evidence you have.",false,"It is determined by how coherent the story is.")],
M("Why is jumping to conclusions both useful and risky?","It is efficient when right but ignores missing information",["It is always accurate","It only affects experts","It requires effort"],"Speed costs accuracy.")),
LS("star","Halo effects and how judgments happen","Chapters 7 and 8","The halo effect, decorrelating errors, and mental shotgun.",
"The halo effect makes one trait color all others; System 1 evaluates constantly and answers more than we ask.",
"The halo effect is the tendency to like or dislike everything about a person, including things you have not observed. Solomon Asch showed that describing someone as intelligent, then envious gives a different impression than the same words reversed, because first impressions dominate. To limit it, decorrelate errors: have people form independent judgments before sharing them, as in judging essays question by question or collecting opinions before a meeting. Kahneman also describes basic assessments that System 1 always makes, like threat and familiarity, intensity matching across different scales, and the mental shotgun, which computes more than needed.",
["The halo effect: one trait colors the others","Asch: order of traits changes impressions","Decorrelate errors: gather independent judgments before group discussion","Grade each essay question across all students instead of one student at a time","Basic assessments: threat, familiarity, similarity, cause","Intensity matching: mapping a feeling across scales, like loudness to crime severity","The mental shotgun: System 1 computes more than needed"],
"The halo in one line: one good impression leaks across everything else, so judge pieces separately and gather opinions independently.",
[["Halo and order","Asch's two descriptions of the same person, intelligent then envious versus envious then intelligent, produce different impressions because the first trait colors the rest. The same happens when we like a leader's looks or a teacher's first answer. First impressions often decide how later evidence is read."],
["Fix it by design","Kahneman suggests grading each essay question across all papers rather than one paper at a time, and having committee members write down their view before discussion. This decorrelates the errors so they average out instead of piling in one direction. It is also the logic behind the wisdom of crowds."]],
[M("What is the halo effect?","One trait of a person colors your view of everything else about them",["Judging on all facts equally","A religious symbol","An illusion about heights"],"Likable people seem better at everything."),
M("How can a group reduce correlated errors?","Have members form independent opinions before discussing",["Let the leader speak first","Vote after a long debate","Avoid recording views"],"Independence preserves information.")],
T("Grading one student's whole exam before moving to the next prevents halo effects.",false,"Grading one question at a time across students does.")),
LS("shuffle","Substituting an easier question","Chapter 9","How heuristics swap hard questions for easy ones.",
"When a question is hard, System 1 answers an easier one without telling you; this is substitution, and it underlies most heuristics.",
"Kahneman's central mechanism is substitution. Faced with a difficult target question, like how happy are you with your life or how successful will this candidate be, System 1 finds a related heuristic question that is easier, like what is my mood right now or does this person look like a leader, and answers that. We do not notice the swap; the answer feels like it fits the original question. The affect heuristic is a prominent example: our feelings about something shape our beliefs about its risks and benefits. Recognizing that a question is hard is the first step to resisting.",
["Target question: the hard one you are meant to answer","Heuristic question: the easier one System 1 answers instead","How happy are you with your life? is answered by mood right now","Judging a candidate by looks substitutes for judging competence","The affect heuristic: feelings determine beliefs about risks and benefits","Substitution is unconscious and feels natural","Slow down when a question is genuinely hard"],
"Substitution in one line: when the real question is hard, your mind quietly answers an easier one and tells you it is the real answer.",
[["Swapping questions","Asked how happy you are with your life these days, you may answer based on how you feel right now. Asked how a political candidate will fare, you may judge whether he looks like a winner. System 1 answers the easier question and the answer arrives so quickly that it feels like an answer to the original."],
["Feelings as facts","The affect heuristic means we often decide what we believe by what we feel. If you like a technology, you tend to see its benefits as large and risks as small; if you dislike it, the reverse. Kahneman notes this lets emotion run through judgments that look like analysis."]],
[M("What is substitution?","Answering an easier question in place of the hard one",["Choosing a cheaper product","Replacing a colleague","Changing a diet"],"The central mechanism of heuristics."),
M("According to the affect heuristic, what shapes our beliefs about risk and benefit?","Our feelings about the thing",["Statistics only","The news cycle only","Expert consensus only"],"Emotion drives estimates.")],
M("What should you do when a question is hard?","Notice the temptation to substitute and slow down",["Answer quickly","Ask a friend","Ignore it"],"Awareness is the first defense.")),
]],
["Heuristics and biases","Part 2: chapters 10 to 18",[
LS("grid","The law of small numbers","Chapter 10","Why small samples mislead us.",
"Small samples produce extreme results more often than large ones, but we treat them as if they were reliable.",
"A famous example: counties with the lowest kidney cancer rates are mostly rural and sparsely populated, but so are the counties with the highest rates. The reason is not rural life; small populations vary more. The same pattern led the Gates Foundation to fund small schools after seeing that top-performing schools were small, ignoring that the worst were small too. People expect small samples to look like the population and see patterns in randomness, like streaks and clusters. System 1 prefers a causal story over the mere statistical fact that chance varies more in small samples. Researchers also underestimate the need for large samples.",
["Small samples vary more than large ones","Kidney cancer example: rural counties show both the highest and lowest rates","Small schools appear among both the best and the worst performers","People expect random sequences to look evenly mixed and see streaks as meaningful","We prefer causal stories to statistical explanations","Researchers often use samples too small to detect real effects","Be suspicious of dramatic results from small samples"],
"The law of small numbers: extreme results are more common in small samples, so dramatic findings from few cases usually mean luck.",
[["Kidney cancer and counties","Counties with the lowest rates of kidney cancer are mostly rural, Republican and in the Midwest, South or West. Counties with the highest rates are also mostly rural. The lesson: sparsely populated places have small samples, and small samples produce extremes at both ends, so no special cause is needed."],
["Seeing patterns in noise","Because we expect randomness to look mixed, a streak feels meaningful. Kahneman also points out that even trained researchers choose samples too small, because they trust intuition. The rule is to ask how many cases a claim rests on before explaining it."]],
[M("Why do rural counties have both the highest and the lowest kidney cancer rates?","Small populations produce more extreme results by chance",["Rural life causes cancer","Doctors differ","The data is false"],"Small samples vary more."),
T("Large samples are more likely than small samples to give extreme results.",false,"Small samples are.")],

LS("anchor","Anchors","Chapter 11","How a number we have just seen pulls our estimate toward it.",
"Estimates are pulled toward any number you have just considered, even a random one.",
"Anchoring happens when we consider a particular value before estimating an unknown quantity. In a classic study, people spun a rigged wheel of fortune that stopped at 10 or 65, then estimated the percentage of African countries in the United Nations: those who saw 10 guessed much lower than those who saw 65. Kahneman explains two mechanisms: adjustment, where System 2 starts from the anchor and stops too soon, and priming, where System 1 makes anchor-consistent information easier to retrieve. Anchors affect real estate agents, negotiations and charity donations. A defense is to deliberately argue against the anchor and think of reasons the opposite could be right.",
["Anchoring: an initial number pulls later estimates toward it","Wheel of fortune stopping at 10 or 65 changed UN estimates","Two mechanisms: insufficient adjustment (System 2) and priming (System 1)","Real estate agents were swayed by the listing price despite denying it","Negotiators can set the first anchor","Even absurd anchors work","Defense: think of reasons the anchor is wrong"],
"Anchoring in one line: the first number you hear drags your estimate toward it, even when you know it is meaningless.",
[["The rigged wheel","People watched a wheel stop on a number and were asked whether the percentage of African nations in the UN was higher or lower than that number, and then for their best guess. Those who saw 10 guessed about 25; those who saw 65 guessed about 45. The number was obviously random, yet it moved judgments."],
["Why it works and how to resist","System 2 adjusts from the anchor and stops once it feels plausible, so the answer stays near it. System 1 also makes anchor-consistent thoughts easier to find. To resist, actively search for reasons the opposite could be true, and make your own first offer in negotiation."]],
[M("What happened in the wheel of fortune study?","A random number shifted people's estimates toward it",["Nothing, people ignored it","People guessed the right answer","People refused to estimate"],"Anchors bias even when obviously random."),
X([["Adjustment","System 2 stops too soon"],["Priming","System 1 recalls anchor-consistent facts"],["Anchor","A number you consider first"],["Defense","Argue for the opposite"]],"Anchoring terms.")],
M("What is a useful defense against anchoring?","Think of arguments for why the anchor is wrong",["Accept it","Average it with another","Ignore all numbers"],"Mobilize System 2 against it.")),
LS("megaphone","Availability","Chapters 12 and 13","Judging frequency by ease of recall, and availability cascades.",
"We judge how common something is by how easily examples come to mind, which distorts risk perception.",
"The availability heuristic replaces how frequent is this with how easily can I think of examples. Dramatic, recent and personally experienced events come to mind easily, so we overestimate plane crashes, tornadoes and shark attacks and underestimate common risks. In one study people asked to recall six examples of assertive behavior rated themselves more assertive than those asked for twelve, because the twelve felt harder. Kahneman and Slovic describe the affect heuristic too. An availability cascade is a self-reinforcing loop: a minor event gets media coverage, public worry grows, officials respond and more coverage follows. Love Canal and the Alar apple scare are examples, with Kuran and Sunstein naming the process and Slovic stressing the legitimacy of public fear.",
["Availability: ease of recall stands in for frequency","Vivid, recent and dramatic events are overweighted","Fluency matters: listing twelve examples is harder than six and reduces self-ratings","Accidents get more attention than diseases that kill more people","Availability cascade: media attention and public concern amplify each other","Examples: Love Canal and the Alar scare","Kuran and Sunstein coined the cascade idea; Slovic stressed public risk perception","Experts and the public weigh risk differently"],
"Availability in one line: what comes to mind easily seems common, so vivid news makes rare risks feel big.",
[["Ease of recall","People overestimate causes of death that are dramatic and publicized, like accidents, tornadoes and homicide, and underestimate quieter ones, like diabetes or stroke. The ease with which examples come to mind stands in for their real frequency. The same fluency effect shows up in self-judgments: being asked for twelve examples of assertive behavior makes the task feel hard and lowers self-rated assertiveness."],
["Cascades","An availability cascade begins when a small incident draws coverage, which raises concern, which draws more coverage and political action. The Love Canal toxic waste story and the Alar apple scare are examples cited. The danger is that fear can run on its own momentum, and officials respond to public concern even when the actual risk is small."]],
[M("What does the availability heuristic do?","Uses ease of recall as a stand-in for frequency",["Counts statistics carefully","Ignores vivid events","Follows expert opinion"],"What comes to mind seems common."),
M("What is an availability cascade?","A self-reinforcing loop of media attention and public concern",["A waterfall of statistics","A risk assessment model","A stock market crash"],"Attention breeds more attention.")],
T("Kahneman says rare, vivid events tend to be underestimated.",false,"They tend to be overestimated.")),
LS("user","Representativeness: Tom W and Linda","Chapters 14 and 15","Judging by resemblance instead of base rates, and the conjunction fallacy.",
"We judge probability by how much something resembles a stereotype and ignore base rates; adding details makes a story more plausible but less probable.",
"Given a description of Tom W, a shy tidy man who loves detail, people say he is probably a librarian or engineer, ignoring that farmers and salespeople vastly outnumber librarians. This is the representativeness heuristic: judging likelihood by similarity to a stereotype while neglecting base rates. In the Linda problem, a woman who is single, outspoken and concerned with social justice is judged more likely to be a feminist bank teller than a bank teller, which is logically impossible because the narrower group is a subset. This conjunction fallacy shows that plausibility beats probability. Even statistically trained students fall for it. The remedy is to anchor on base rates and remember that adding conditions lowers probability.",
["Representativeness: judging by resemblance to a stereotype","Base rate neglect: ignoring how common each category is","Tom W: librarian versus the far more numerous farmers and salespeople","Linda problem: feminist bank teller seems more likely than bank teller","Conjunction fallacy: a combination cannot be more likely than one part","Plausible stories feel more probable even when they are less","Remedy: start from base rates and adjust modestly","Less is more: sets with an added weak item can be judged worse"],
"The Linda lesson: a vivid detailed story feels more likely than a plain one, but each added detail makes it less likely.",
[["Tom W","Describe a shy, orderly man who likes detail and people guess librarian, though there are many more farmers. The description fits the stereotype and System 1 substitutes similarity for probability. The correct approach starts with how common each profession is and then adjusts for the evidence, which is weak."],
["Linda","Linda is described as bright and passionate about social justice. Which is more probable: she is a bank teller, or a bank teller active in the feminist movement? About 85 percent of people, including trained students, chose the second. But it is a subset of the first, so it cannot be more probable. Plausibility beats logic."]],
[M("What error does the Linda problem demonstrate?","The conjunction fallacy",["The anchoring effect","The halo effect","The sunk cost fallacy"],"A part cannot be less probable than the whole."),
M("What does base rate neglect mean?","Ignoring how common a category is",["Ignoring costs","Ignoring emotions","Ignoring authority"],"Count the population first.")],
T("A conjunction of two events can be more probable than one of them alone.",false,"It can never be.")),
LS("scale","Causes trump statistics, and regression to the mean","Chapters 16 and 17","Stereotypes from causal stories, and why extremes drift back.",
"We use causal stories and ignore statistics, and we miss regression to the mean, inventing causes for what is just chance.",
"In the cab problem, a witness says a cab in a hit and run was blue; 85 percent of cabs are green and the witness is 80 percent reliable. People focus on the witness and ignore the base rate; the true probability the cab was blue is about 41 percent. If the base rate is given as a causal story, such as green cabs cause most accidents, people use it. Stereotypes are causal shortcuts. Regression to the mean is the statistical fact that extreme performance tends to be followed by performance closer to average, because luck partly explains the extreme. Flight instructors who scolded cadets after bad landings and saw improvement wrongly concluded that criticism works.",
["Cab problem: ignoring the base rate gives 80 percent; the right answer is about 41 percent","Causal base rates are used; statistical base rates are ignored","Stereotypes are causal beliefs about groups, with costs and benefits","People are reluctant to apply general statistics to specific cases","Regression to the mean: extreme results tend to be followed by more average ones","Flight instructors: criticism seemed to work and praise to backfire","The Sports Illustrated jinx and golf rounds are regression examples","We invent causes for regression that need none"],
"Regression in one line: extremes drift back toward average on their own, so do not credit punishment or praise for what luck did.",
[["Statistics versus stories","In the cab problem most people say the cab was blue with about 80 percent confidence, ignoring that most cabs are green. The correct figure is about 41 percent. If the base rate is framed causally, for instance green cab drivers cause more accidents, people suddenly use it. Statistical facts rarely change minds; causal stories do."],
["Regression","Kahneman told flight instructors that praise works better than punishment. They disagreed: cadets praised after a good landing did worse next time and scolded ones improved. He explained it was regression: a very good or very bad landing is partly luck, so the next one tends to be more average whatever the instructor says."]],
[M("What is regression to the mean?","Extreme outcomes tend to be followed by more average ones",["Prices always fall","Skill always improves","Averages are unreliable"],"Luck partly explains extremes."),
M("Why did instructors wrongly believe criticism works?","Bad landings were followed by regression toward average",["Cadets feared them","Criticism taught technique","Weather improved"],"They saw a cause in randomness.")],
T("People readily use purely statistical base rates in their judgments.",false,"They use causal ones and ignore statistical ones.")),
LS("search","Taming intuitive predictions","Chapter 18","Correcting predictions for how much evidence really tells you.",
"Intuitive predictions are too extreme; correct them by starting at the average and moving partway toward your intuition.",
"System 1 matches predictions to evidence: a child who read fluently at four seems destined for a top GPA. But evidence is rarely perfectly correlated with outcomes, so predictions should be moderated. Kahneman recommends a four step method: start with the baseline average, form your intuitive estimate, estimate how strongly the evidence correlates with the outcome, and move from the baseline toward the intuition by that fraction. This produces predictions that are less extreme and unbiased, though it feels timid. Unbiased predictions will rarely include extreme values, which is the cost of accuracy.",
["Intuition predicts as if the evidence were perfectly diagnostic","Correlation between evidence and outcome is usually modest","Step 1: start with the baseline average","Step 2: form your intuitive prediction","Step 3: estimate the correlation between evidence and outcome","Step 4: move from the baseline toward intuition by that proportion","Unbiased predictions are less extreme and sometimes feel timid","Venture capitalists and admissions staff face this tradeoff"],
"Taming predictions: begin at the average, then move toward your gut only as far as the evidence really predicts.",
[["The overconfident gut","A child who read well early is predicted a top GPA, as extreme as the reading was. But reading age and later GPA are only modestly correlated, so the right prediction is closer to average. System 1 treats the evidence as nearly perfect."],
["A correction recipe","Take the average outcome as a starting point, then move toward the intuitive guess by the strength of the correlation. If the correlation is 0.3, move 30 percent of the way. The result is less extreme but more accurate, and it avoids both over and under prediction."]],
[M("Where should a corrected prediction start?","At the baseline average",["At your intuition","At the extreme","At zero"],"Then move toward intuition by the correlation."),
M("What does a weak correlation tell you to do?","Move only a little from the average",["Move all the way to your guess","Ignore the average","Double your estimate"],"Proportional adjustment.")],
T("Unbiased predictions will often include extreme values.",false,"They will rarely include extremes.")),
]],
["Overconfidence","Part 3: chapters 19 to 24",[
LS("book","The illusion of understanding","Chapter 19","Narrative fallacy and hindsight bias.",
"We build tidy stories about the past in which skill and intent matter and luck does not, which makes the world look more predictable than it is.",
"Kahneman draws on Nassim Taleb's narrative fallacy: we explain events with simple causal stories that leave out luck and everything we did not see. The story of Google's rise feels inevitable, but it contains many lucky breaks. The halo effect makes us credit a company's CEO when profits are high and blame him when they fall. Hindsight bias, shown by Baruch Fischhoff, is the tendency to believe after the fact that we knew an outcome would happen: people asked to predict events like Nixon's China trip later misremembered their probabilities. Outcome bias leads us to judge decisions by results, punishing sound choices that failed. Business books that credit leadership for success are largely retelling stories.",
["Narrative fallacy: coherent stories hide the role of luck","Google's success is told as inevitable; luck mattered","Hindsight bias: after the fact, people think they knew","Fischhoff's Nixon predictions: remembered probabilities were distorted","Outcome bias: judging decisions by results rather than by the process","Halo effect shapes how we rate firms and CEOs","Business bestsellers often explain success after the fact","Hindsight makes us overconfident about forecasting"],
"Hindsight in one line: once you know how it ended, the story feels obvious, so we overrate our foresight and underrate luck.",
[["Stories without luck","We prefer stories with clear causes and heroes. Successful companies are praised for strategy; the same strategies at failing companies are condemned. Taleb's narrative fallacy says we tell stories to make sense of the past and forget that luck did much of the work."],
["I knew it all along","Fischhoff asked people to estimate the chances of events during Nixon's 1972 trip to China, then asked later what they had predicted. They remembered being more accurate than they were. Hindsight bias leads to outcome bias: doctors, managers and generals are judged by results even when their decisions were sound given what they knew."]],
[M("What is hindsight bias?","Believing after the fact that you knew the outcome",["Predicting accurately","Ignoring past events","Planning ahead"],"The past looks predictable."),
M("What is outcome bias?","Judging a decision by its result rather than its quality",["Choosing outcomes at random","Ignoring results","Always trusting experts"],"Luck can make bad decisions look good.")],
T("Business success stories usually give luck a big role.",false,"They mostly credit skill and leadership.")),
LS("flag","The illusion of validity","Chapter 20","Why confidence does not mean accuracy.",
"Confidence reflects the coherence of a story, not its accuracy, so professionals can stay confident while being barely better than chance.",
"Kahneman recounts evaluating Israeli army officer candidates with group obstacle exercises: the team felt sure of predictions about future leadership, but later results showed their predictions were barely better than guesses, and the confidence persisted. He calls this the illusion of validity. Studies of stock pickers find that skill is small; Terrance Odean showed active traders earn less than those who trade little. Philip Tetlock found expert political forecasters were only slightly better than chance and that famous pundits were worse, with hedgehogs, who know one big thing, doing worse than foxes. The environment may be unpredictable, but professionals still feel expertise.",
["Illusion of validity: subjective confidence unrelated to accuracy","Army leaderless group exercises predicted future performance poorly","Stock picking shows weak persistence of skill","Odean: heavy traders earn less than light traders","Tetlock: experts barely beat chance, pundits worse","Hedgehogs versus foxes: foxes forecast better","Confidence comes from the story, not the evidence","The financial and pundit industries rely on this illusion"],
"The illusion of validity: feeling sure is not the same as being right, and professionals can feel sure while barely beating chance.",
[["The army test","Kahneman evaluated candidates by watching them solve a problem as a group, then predicted who would make a good officer. The team felt confident, but follow-up showed little predictive power. Yet the next batch felt just as convincing, which showed that confidence survives even evidence of failure."],
["Traders and pundits","Odean found that investors who traded most earned lower returns than those who traded rarely. Tetlock's long study of expert forecasts showed they did little better than chance, and the most famous commentators did worst. Experts are rewarded for confident stories, not for accuracy."]],
[M("What is the illusion of validity?","Confidence unrelated to the accuracy of predictions",["A fake document","A legal term","A statistical test"],"Feeling right is not being right."),
M("What did Tetlock find about expert forecasters?","They did little better than chance",["They were nearly perfect","They were always wrong","They did best when famous"],"Confident stories are not accuracy.")],
T("Active stock traders earn more than those who trade little.",false,"Odean found they earn less.")),
LS("calc","Intuitions versus formulas","Chapter 21","Why simple algorithms often beat expert judgment.",
"In low-validity environments simple formulas match or beat experts, because experts add noise and inconsistency.",
"Paul Meehl showed in the 1950s that simple statistical rules predicted outcomes like parole success and academic performance at least as well as clinicians. Experts are inconsistent, swayed by irrelevant factors and overconfident in complex rules. Orley Ashenfelter's wine formula, using weather data, predicted vintage prices better than experts. The Apgar score for newborns is a successful formula. Kahneman used the idea to redesign army interviews: interviewers scored six separate traits and then gave an overall intuitive impression, which added value on top of the formula. The advice is to use a formula where possible and let intuition play a secondary role.",
["Meehl: simple formulas rival or beat clinical judgment","Experts are inconsistent and influenced by noise","Ashenfelter's wine price formula based on weather","The Apgar score: a formula that improved newborn care","Complex rules are not better than simple ones","Kahneman's army interview: score separate traits first, then add intuition","Algorithms are resisted because they feel cold","Use intuition after the formula, not instead of it"],
"Formulas in one line: where outcomes are noisy, a simple consistent rule usually beats an expert, because the expert adds inconsistency.",
[["Meehl's challenge","Paul Meehl reviewed studies comparing statistical predictions with expert clinical judgment and found that formulas did equal or better in most. Experts try to be clever and consider complex combinations of cues; they end up inconsistent. Even the same expert can give different judgments of the same case at different times."],
["Wine and newborns","Ashenfelter predicted the quality of Bordeaux vintages from a few weather variables, outperforming leading critics. The Apgar score gave doctors a fast checklist for newborns that saved lives. Kahneman applied this in the army by having interviewers rate separate traits, which made their later gut judgments more accurate."]],
[M("What did Meehl find?","Simple formulas often equal or beat expert judgment",["Experts always win","Formulas are always wrong","Experience is useless"],"Consistency beats cleverness."),
M("What is the Apgar score?","A simple formula for assessing newborns",["A diet plan","A wine rating","A trading rule"],"A successful example of an algorithm.")],
T("Complex rules for combining cues predict better than simple ones.",false,"Simple rules usually do as well or better.")),
LS("shield","Expert intuition: when can we trust it?","Chapter 22","Kahneman and Klein agree on when intuition is skill.",
"Intuition can be trusted when the environment is regular and the expert had long practice with feedback; otherwise it is an illusion.",
"Kahneman and Gary Klein, who studies expert decision-making, set out to find where they agree. Klein described fire commanders who sensed a floor was about to collapse, using pattern recognition, which he calls recognition-primed decision making. Kahneman agrees that this is real skill, but says skill requires two conditions: a predictable environment with stable regularities and the chance to learn them through prolonged practice with clear feedback. Chess masters, nurses and firefighters meet these tests; stock pickers and political forecasters do not. A person's confidence is not a reliable guide, so evaluate the environment and the practice instead.",
["Gary Klein's recognition-primed decision model","The fire commander who sensed danger before the floor collapsed","Intuition is recognition, nothing more mysterious","Condition one: a regular, predictable environment","Condition two: prolonged practice with fast clear feedback","Chess, nursing and firefighting meet the conditions","Stock picking and political forecasting do not","Subjective confidence does not tell you whether an intuition is valid"],
"Trust expert intuition only when the world is regular and the expert has had long practice with feedback, not simply because the expert feels sure.",
[["Skill is recognition","A fire commander ordered his crew out just before a floor collapsed without knowing why. Later he realized something about the heat and quiet had felt wrong. Klein calls this recognition: the situation matched a pattern from experience. Intuition is not magic."],
["Two tests","Ask whether the environment is regular enough to be predictable and whether the person had enough practice with quick feedback. Where both hold, trust skilled intuition. Where either fails, as in long-term forecasting of politics or markets, treat confidence as a symptom, not evidence."]],
[M("What two conditions make intuition trustworthy?","A regular environment and long practice with feedback",["High confidence and a title","Age and wealth","Speed and luck"],"Valid cues plus learning."),
M("Which expert's intuition is more trustworthy by these tests?","A chess master",["A long-term political pundit","A stock forecaster","A fortune teller"],"Chess is regular with clear feedback.")],
T("Subjective confidence reliably tells you whether an intuition is valid.",false,"It does not.")),
LS("clock","The outside view","Chapter 23","The planning fallacy and the value of base rates for projects.",
"Plans are too optimistic because we use the inside view; the fix is the outside view, starting from how similar projects actually turned out.",
"Kahneman describes a team writing a curriculum who estimated two years. Asked, a colleague, Seymour Fox, said that similar teams took seven to ten years and about 40 percent never finished. The team's actual project took eight years. The inside view focuses on the specifics of the case; the outside view looks at a reference class of similar cases. Optimism and neglect of unknown unknowns create the planning fallacy: budgets and timelines are too low. Examples include the Scottish Parliament building, which came in many times over budget, and home renovations. Reference class forecasting, as championed by Bent Flyvbjerg, starts from the outside view and then adjusts for the case.",
["Inside view: focus on your case's specifics","Outside view: look at the reference class of similar projects","Seymour Fox: similar teams took 7 to 10 years and 40 percent failed","The team's real project took about 8 years","The planning fallacy: unrealistically optimistic plans","Examples: Scottish Parliament building, home renovations","Reference class forecasting begins with the outside view","Unknown unknowns are ignored in plans"],
"The outside view: before trusting your plan, ask how long and how much it took everyone else who tried something similar.",
[["Inside versus outside","The curriculum team estimated two years. Seymour Fox, asked about similar teams, said most took seven to ten years and many never finished. The group had ignored this, and their own project took eight years. We naturally forecast from the details of our plan and ignore the record of similar plans."],
["Fixing the plan","Reference class forecasting means picking a group of comparable projects, finding their typical outcome, and then adjusting for your case. It is dull but corrects the planning fallacy. Planners also need to leave room for the things nobody can foresee."]],
[M("What is the planning fallacy?","Forecasting too optimistically about time and cost",["Planning for too long","Skipping plans","Pessimistic budgets"],"Plans ignore unknowns."),
M("What is the outside view?","Using outcomes of similar past projects as a baseline",["Looking out the window","Asking the boss","Using your intuition"],"The reference class.")],
T("The inside view is the best way to correct the planning fallacy.",false,"The outside view is.")),
LS("rocket","The engine of capitalism","Chapter 24","Optimism, entrepreneurs and the premortem.",
"Optimism helps people try and persist but leads to excessive risk; the premortem imagines failure in advance.",
"Most people are optimistic about their own chances. Entrepreneurs believe their odds of success are far higher than the base rate, though about two thirds of new businesses fail within five years, and many believe even a failed outcome is unlikely for them. Kahneman links this to competition neglect: founders focus on their own plan and forget that competitors react. Studies of CFOs show their market forecasts barely correlate with reality yet they claim narrow confidence intervals. Optimism has benefits: resilience and willingness to try, and optimists tend to be healthier. Kahneman recommends Gary Klein's premortem: before a decision, imagine the project failed a year from now and write why, to uncover risks.",
["Optimism: most people overrate their own chances","About a third of new businesses reach five years; entrepreneurs expect much better","Competition neglect: ignoring rivals' responses","CFO forecasts are barely correlated with market returns, yet confident","Optimism has benefits: resilience, effort, health","Overconfidence also has costs such as risky ventures and wars","The premortem: imagine failure and explain it in advance","It legitimizes doubts in groups that drift toward agreement"],
"The premortem: before committing, imagine the plan has failed spectacularly a year from now and write the history of why.",
[["Optimism and risk","Entrepreneurs rate their chances of success well above the real base rate. They think about their own plan and forget competitors, a pattern called competition neglect. Optimism fuels effort and recovery, but it also produces risky ventures and disappointment."],
["The premortem","Klein's premortem asks a team to suppose that a year from now the plan has been a disaster and to write a short history of the failure. This allows doubters to speak and helps teams spot flaws before commitment. It is a cheap way to make overconfident groups think about what could go wrong."]],
[M("What is a premortem?","Imagining the project has failed and explaining why",["A postmortem after failure","A medical exam","A budget review"],"It surfaces risks beforehand."),
M("What does competition neglect mean?","Ignoring how rivals will respond",["Disliking competition","Competing too hard","Having no rivals"],"Founders focus on their plan.")],
T("Kahneman says optimism is only harmful.",false,"It also brings resilience and effort.")),
]],
["Choices","Part 4: chapters 25 to 34",[
LS("coin","Bernoulli's errors","Chapter 25","Why expected utility theory misses the reference point.",
"Utility theory judges wealth, but people judge changes from a reference point, which explains behavior the old theory could not.",
"Daniel Bernoulli proposed in the 1700s that the value of money declines as wealth grows, so a sure thing is worth more than a gamble of equal average value. Kahneman and Amos Tversky saw a flaw: it ignores the reference point. Jack and Jill each have 5 million today; yesterday Jack had 1 million and Jill had 9 million. Utility theory says they are equally happy, but of course Jack is delighted and Jill is distraught. People evaluate gains and losses relative to a reference point, not total states of wealth. Kahneman calls the continued use of the flawed model theory-induced blindness, because once we accept a theory, it is hard to notice its flaws.",
["Bernoulli: diminishing marginal utility of wealth explains risk aversion","Utility theory values states of wealth, not changes","Jack and Jill: same wealth today, very different feelings","Reference points define gains and losses","Theory-induced blindness: believers overlook a theory's flaws","Prospect theory was built to repair these errors","Context changes how outcomes are experienced"],
"Bernoulli's error: wealth is not what feels good or bad, change from where you were is.",
[["Jack and Jill","Jack and Jill each hold 5 million dollars. Jack was at 1 million yesterday; Jill was at 9 million. Old utility theory says they have equal utility because they have equal wealth, but Jack is thrilled and Jill is crushed. The missing ingredient is the reference point from which we judge."],
["Blind to the flaw","Bernoulli's model was widely taught for centuries. Kahneman and Tversky say that once a theory is accepted, scholars find reasons not to see its failures, calling this theory-induced blindness. They used it to motivate prospect theory."]],
[M("What did utility theory miss?","The reference point from which gains and losses are judged",["Inflation","Taxes","Salary"],"Changes matter more than states."),
M("What does theory-induced blindness mean?","Accepting a theory makes its flaws hard to notice",["Not understanding theories","A visual problem","Rejecting all theory"],"Theories can blind us.")],
T("Jack and Jill feel equally happy because they have the same wealth.",false,"Their reference points differ.")),
LS("balance","Prospect theory","Chapter 26","Reference dependence, diminishing sensitivity and loss aversion.",
"People weigh gains and losses from a reference point, with diminishing sensitivity and a stronger pain for losses than pleasure for equal gains.",
"Prospect theory has three core features. First, evaluation is relative to a reference point, usually the status quo. Second, diminishing sensitivity: the difference between 100 and 200 dollars feels bigger than between 1,100 and 1,200. Third, loss aversion: losses loom larger than gains, typically around twice as much. This gives an S-shaped value function that is steeper for losses. Asked whether to accept a coin flip where tails loses 100 and heads wins 150, most people refuse, though the expected value is positive. Loss aversion helps explain risk aversion in mixed gambles and why people hold on to what they have.",
["Reference dependence: gains and losses relative to a point, often the status quo","Diminishing sensitivity: each additional unit matters less","Loss aversion: a loss hurts about twice as much as an equal gain pleases","The value function is S-shaped and steeper for losses","Typical test: lose 100 or win 150 on a coin flip, most refuse","Prospect theory describes how people actually decide","It explains attachment to the status quo","Kahneman and Tversky developed it in 1979"],
"Prospect theory: we judge by change from where we are, and losing hurts about twice as much as winning feels good.",
[["Three features","Prospect theory says you judge outcomes as gains or losses from a reference point, that each extra dollar matters less, and that losses weigh more than gains. The value curve flattens for both gains and losses, and is steeper on the loss side."],
["Coin flip test","Would you accept a coin toss where tails costs you 100 and heads wins you 150? The average payoff is positive, yet most people say no because the possible loss looms larger than the gain. Many need a win of around twice the loss to say yes."]],
[X([["Reference point","Gains and losses are measured from it"],["Diminishing sensitivity","Each extra unit matters less"],["Loss aversion","Losses weigh about twice gains"],["Value function","S-shaped, steeper for losses"]],"The three pillars."),
M("About how much do losses loom larger than equal gains?","About twice as much",["Half as much","The same","Ten times"],"The usual estimate.")],
T("Most people accept a coin flip that risks 100 to win 150.",false,"Most reject it.")),
LS("home","The endowment effect","Chapter 27","Why we overvalue what we own.",
"Owning something makes us value it more because giving it up feels like a loss.",
"Richard Thaler noted that people demand much more to sell something they own than they would pay to buy it. In a classic mug experiment, students given a mug asked about twice as much to sell as other students were willing to pay. This endowment effect arises because selling is experienced as a loss and buying as a gain, and losses weigh more. It appears for goods held for use, like mugs and wine, but not for items held for exchange, like money or tokens, and not when experienced traders are involved. It explains why trading is less frequent than theory predicts and why people stay with defaults.",
["Endowment effect: owners value goods above buyers","Thaler's mug experiment: selling prices about double buying prices","Rooted in loss aversion: giving up is a loss","Strongest for goods held for use, not for exchange","Experienced traders show it less","Explains reluctance to trade and attachment to the status quo","Reference point is what you already have"],
"The endowment effect: once something is yours, giving it up feels like a loss, so you demand more than you would ever pay.",
[["The mug study","Half of the students were given a mug; the others were not. Sellers asked roughly twice what buyers would pay. Since the mugs were assigned randomly, the gap is not due to tastes but to ownership."],
["When it appears","The effect shows up for goods people intend to use, not for items meant to be traded, like money. A shopkeeper holds goods for exchange and does not feel the loss when selling. Where the reference point is simply a flow, ownership is not felt as a loss."]],
[M("What did the mug experiment show?","Owners demanded about twice what buyers would pay",["No difference","Buyers paid more","Mugs are worthless"],"Ownership raises value."),
M("What underlies the endowment effect?","Loss aversion",["Taxes","Risk neutrality","Mental accounting"],"Giving up feels like a loss.")],
T("The endowment effect is just as strong for money as for mugs.",false,"It is weak for items held for exchange.")),
LS("alert","Bad events","Chapter 28","Negativity dominance and goals as reference points.",
"Bad is stronger than good: threats grab attention, and failing to reach a goal feels like a loss.",
"The brain gives priority to bad news: an angry face in a crowd of happy ones is spotted faster than the reverse. Bad impressions form quicker and are harder to change. Goals act as reference points, so falling short feels like a loss. A study of golfers found they putt better for par, to avoid a bogey, than for a birdie. Negotiations are hard because each side's concessions feel like losses larger than the other side's gains. In fairness research with Thaler, people judged it unfair for a firm to cut wages in a time of profit, and sensed that people have an entitlement to the reference transaction. Loss aversion also shapes laws on property and status.",
["Negativity dominance: threats get priority in attention","Bad impressions and bad events outweigh good ones","Goals are reference points: missing them feels like a loss","Golfers putt more accurately for par than for birdie","Negotiation: concessions feel larger than the gains","Fairness: reference transactions create entitlements","People punish unfair actors even at personal cost","Legal systems protect existing positions more than new gains"],
"Bad events in one line: we feel and notice threats and losses more than equal gains, which shapes goals, bargains and fairness.",
[["Bad is stronger","An angry face stands out in a crowd faster than a happy one. Negative words and events hold attention longer. This asymmetry helps survival but skews judgments toward worry and caution."],
["Goals and fairness","Golfers sink slightly more putts when the putt is for par than for a birdie, because missing par feels like a loss. In negotiations, each side values what it gives up more than what it receives, which stalls deals. People also judge firms harshly for cutting pay or raising prices when no cost forces them to."]],
[M("What did the golfer study find?","Putts for par were made more often than for birdie",["Birdie putts were easier","No difference","Golfers ignore par"],"Avoiding a loss motivates more."),
M("Why are negotiations hard under loss aversion?","Each side feels its concessions more than the other's",["Parties dislike each other","Money is scarce","Time is short"],"Concessions loom larger.")],
T("Good news is processed with higher priority than bad news.",false,"Bad news gets priority.")),
LS("dice","The fourfold pattern","Chapter 29","How we weigh probability and what it does to risk attitudes.",
"We overweight small probabilities and underweight near-certainties, producing four predictable attitudes toward risk.",
"Prospect theory shows that decision weights do not equal probabilities. The certainty effect: going from 95 to 100 percent matters more than 50 to 55. The possibility effect: going from 0 to 5 percent matters more than 5 to 10. Together they produce the fourfold pattern. With high probability gains, people are risk averse and accept a settlement. With high probability losses, they are risk seeking and gamble to avoid a sure loss. With low probability gains, they are risk seeking and buy lottery tickets. With low probability losses, they are risk averse and buy insurance. The Allais paradox shows even experts violate expected utility. In lawsuits, a plaintiff with a strong case tends to settle, while a defendant facing a likely loss tends to gamble on trial; the roles flip for frivolous suits.",
["Certainty effect: 95 to 100 percent feels huge","Possibility effect: 0 to 5 percent feels huge","Allais paradox shows violations of expected utility theory","High probability gains: risk averse, take the sure thing","High probability losses: risk seeking, gamble","Low probability gains: risk seeking, buy lottery tickets","Low probability losses: risk averse, buy insurance","Litigation: strong plaintiffs settle while defendants facing likely losses gamble"],
"The fourfold pattern: we fear certainty-destroying gambles on gains, chase hope on losses, and overpay for tiny chances in both directions.",
[["Weights, not probabilities","The jump from impossible to a tiny chance, and from near sure to sure, feels bigger than equal steps in the middle. So we overweight rare outcomes and underweight probable ones. This reshapes how we treat risk."],
["Four combinations","For likely gains we avoid risk, for likely losses we seek it, for unlikely gains we gamble on lottery tickets, and for unlikely losses we buy insurance. A plaintiff with a 95 percent case settles; a defendant facing a likely loss gambles."]],
[X([["High probability gains","Risk averse"],["High probability losses","Risk seeking"],["Low probability gains","Risk seeking: lottery"],["Low probability losses","Risk averse: insurance"]],"The fourfold pattern."),
M("What is the certainty effect?","Moving from 95 to 100 percent feels bigger than 50 to 55",["Being sure helps","Experts are certain","Rare events are ignored"],"Certainty has a premium.")],
T("A lottery ticket shows risk seeking on a low probability gain.",true,"The possibility effect.")),
LS("zap","Rare events","Chapter 30","Overestimating and overweighting the unlikely.",
"Vivid, easily imagined rare events are overestimated and overweighted, and denominator neglect makes small risks loom large.",
"People overestimate the probability of rare events they have heard about and overweight them even when they know the odds. Vividness matters: a lottery described as 1 in 1,000 chances is easier to imagine than 0.1 percent, and a risk described as 10 in 100,000 feels bigger than 0.01 percent. This is denominator neglect, where the number of victims draws attention but the population does not. After Jerusalem bus bombings, ridership fell although the actual risk was tiny. When choices come from experience instead of description, people tend to underweight rare events they never saw happen. Fear and hope both exaggerate rarities.",
["Rare events are both overestimated and overweighted","Vivid imagery increases weight","Denominator neglect: focusing on victims, not the population","Jerusalem bus bombings reduced ridership beyond the real risk","Descriptions versus experience: rare events are underweighted when experienced","Emotional framing matters more than numbers","Fear and hope exaggerate unlikely outcomes","Protection against the worst cases comes at a cost"],
"Rare events: a vivid, easy-to-picture outcome feels more likely than its true odds, so we overpay to avoid or chase it.",
[["Vividness and denominators","A risk of 10 in 100,000 sounds worse than 0.01 percent because we picture ten people. Denominator neglect makes us focus on the count of victims and ignore how large the population is. The same effect fuels fear of terrorism or rare accidents."],
["Description versus experience","When people are told the odds, they overweight rare events. When they learn the odds by experience and the event does not occur, they underweight it. Which one dominates depends on how the information arrives."]],
[M("What is denominator neglect?","Focusing on the count of cases and ignoring population size",["Ignoring math","A tax rule","Dividing wrongly"],"Ten victims look big regardless of the base."),
M("What happened after the Jerusalem bus bombings?","Ridership fell more than the real risk justified",["Ridership rose","Nothing changed","Buses were banned"],"Vivid fear outweighed odds.")],
T("When rare events are learned by experience they are always overweighted.",false,"They can be underweighted.")),
LS("layers","Risk policies and narrow framing","Chapter 31","Why bundling decisions beats deciding one at a time.",
"Evaluating each gamble alone makes us too cautious; thinking in terms of a broad risk policy yields better outcomes.",
"Narrow framing treats each decision in isolation. A colleague of Paul Samuelson refused a single coin flip with a win of 200 and a loss of 100 but said he would take 100 such flips. Taken one at a time, loss aversion makes each bet unattractive; considered together, they are clearly favorable. Kahneman recommends a risk policy: decide in advance how to treat a category of decisions and apply it consistently. A broad frame reduces the emotional sting of losses and the risk of overly cautious choices. Professional traders and insurers think this way, and people who check their investments less often tend to feel less loss aversion.",
